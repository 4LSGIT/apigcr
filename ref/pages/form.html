<!DOCTYPE html>
<html lang="en" class="mode-fill">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Links carry a case_id bearer credential: keep them out of search engines and
     out of the Referer header sent to the logo host. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Legal Solutions Group</title>
<link rel="icon" href="https://legalsolutions.group/assets/lsg-logo.webp">
<style>
/* ==========================================================================
   YisraCase form host — branded chrome around /f/<form_key>, for ANY public
   form. The key arrives as ?f=<form_key>.
   Self-contained: inline CSS/JS, no CDN, no web fonts (pageManager rule).
   Palette sampled from the LSG mark: navy / cyan / gold / gray.
   Background and card width deliberately match public/css/yc-forms.css so the
   iframe seam is invisible.
   ========================================================================== */
:root{
  --navy:#0F2343;
  --cyan:#01B0EB;
  --gold:#F5C53C;
  --gray:#A7A9AD;
  --bg:#f8f9fa;
  --line:#e4e7eb;
  --muted:#5b6675;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--navy);
  font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
  -webkit-text-size-adjust:100%;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.lp-header{
  position:sticky; top:0; z-index:5;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.lp-header-inner{
  max-width:950px; margin:0 auto;
  padding:12px 16px;
  display:flex; align-items:center; gap:16px;
}
.lp-brand{display:block; line-height:0; flex:0 0 auto}
.lp-brand img{height:46px; width:auto; display:block}
.lp-spacer{flex:1 1 auto}
.lp-phone{
  flex:0 0 auto;
  color:var(--navy); text-decoration:none;
  font-size:15px; font-weight:bold; white-space:nowrap;
}
.lp-phone span{
  display:block; font-size:11px; font-weight:normal;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
}
.lp-phone:hover,.lp-phone:focus-visible{color:var(--cyan)}

/* Signature: a 3px rule echoing the three discs in the mark. */
.lp-rule{height:3px; display:flex}
.lp-rule i{flex:1}
.lp-rule i:nth-child(1){background:var(--cyan)}
.lp-rule i:nth-child(2){background:var(--gold)}
.lp-rule i:nth-child(3){background:var(--gray)}

/* Hidden until a real form title is known — never a placeholder. */
.lp-title{
  max-width:950px; margin:0 auto;
  padding:14px 16px 0;
  font-size:13px; font-weight:bold;
  letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted);
}
.lp-title[hidden]{display:none}

/* ── Frame ──────────────────────────────────────────────────────────────── */
.lp-main{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.lp-wrap{flex:1 1 auto; min-height:0; position:relative}
.lp-wrap[hidden]{display:none}
#lpFrame{
  display:block; width:100%; height:100%; border:0;
  opacity:0; transition:opacity .25s ease;
}

.lp-loader{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:24px; text-align:center;
  background:var(--bg); color:var(--muted); font-size:14px;
}
.lp-spinner{
  width:30px; height:30px; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--cyan);
  animation:lp-spin .8s linear infinite;
}
@keyframes lp-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .lp-spinner{animation-duration:2.4s}
  #lpFrame{transition:none}
}

/* ── No-form state ──────────────────────────────────────────────────────── */
.lp-empty{
  flex:1 1 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:40px 20px; text-align:center;
}
.lp-empty[hidden]{display:none}
.lp-empty h1{margin:0; font-size:20px; line-height:1.35}
.lp-empty p{margin:0; color:var(--muted); font-size:14px; max-width:34em}
.lp-empty a{color:var(--cyan)}

/* ── Footer ─────────────────────────────────────────────────────────────── */
.lp-footer{
  flex:0 0 auto;
  border-top:1px solid var(--line);
  background:#fff;
}
.lp-footer-inner{
  max-width:950px; margin:0 auto; padding:12px 16px;
  display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px;
  font-size:12px; color:var(--muted);
}
.lp-footer a{color:var(--muted); text-decoration:underline}
.lp-footer a[hidden]{display:none}
.lp-footer a:hover,.lp-footer a:focus-visible{color:var(--cyan)}

a:focus-visible,.lp-brand:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}

/* ── Height modes ───────────────────────────────────────────────────────── */
/* fill  — cross-origin (vanity domain): iframe fills the viewport, scrolls itself.
   grow  — same-origin: iframe grows to content, the page scrolls. Set on load. */
html.mode-fill,html.mode-fill body{height:100%; overflow:hidden}
html.mode-grow .lp-wrap{flex:0 0 auto; height:auto}
html.mode-grow #lpFrame{height:600px} /* replaced by JS on every reflow */

@media (max-width:560px){
  .lp-brand img{height:38px}
  .lp-header-inner{padding:10px 12px; gap:10px}
  .lp-phone{font-size:14px}
  .lp-title{padding-top:12px; font-size:12px}
  .lp-empty h1{font-size:18px}
}
</style>
</head>
<body>

<header class="lp-header">
  <div class="lp-header-inner">
    <a class="lp-brand" href="https://legalsolutions.group" target="_blank" rel="noopener">
      <img src="https://legalsolutions.group/assets/lsg-logo.webp"
           alt="Legal Solutions Group" width="400" height="175">
    </a>
    <div class="lp-spacer"></div>
    <a class="lp-phone" href="tel:+12484179800"><span>Questions?</span>(248)&nbsp;417-9800</a>
  </div>
  <div class="lp-rule" aria-hidden="true"><i></i><i></i><i></i></div>
</header>

<p class="lp-title" id="lpTitle" hidden></p>

<main class="lp-main">
  <div class="lp-wrap" id="lpWrap">
    <iframe id="lpFrame" title="Online form"></iframe>
    <div class="lp-loader" id="lpLoader">
      <div class="lp-spinner" aria-hidden="true"></div>
      <div id="lpLoaderText">Loading your form&hellip;</div>
    </div>
  </div>

  <div class="lp-empty" id="lpEmpty" hidden>
    <h1>This link doesn&rsquo;t name a form</h1>
    <p>Ask whoever sent it for a fresh link, or call us at
       <a href="tel:+12484179800">(248) 417-9800</a> and we&rsquo;ll get you the right one.</p>
  </div>

  <noscript>
    <div style="padding:24px 16px; max-width:950px; margin:0 auto;">
      This page needs JavaScript to load the form. Call
      <a href="tel:+12484179800">(248) 417-9800</a> and we&rsquo;ll take your answers over the phone.
    </div>
  </noscript>
</main>

<footer class="lp-footer">
  <div class="lp-footer-inner">
    <span>&copy; Legal Solutions Group</span>
    <a href="https://legalsolutions.group" target="_blank" rel="noopener">legalsolutions.group</a>
    <a id="lpDirect" href="#" target="_blank" rel="noopener" hidden>Form not showing? Open it in a new tab</a>
  </div>
</footer>

<script>
(function () {
  'use strict';

  /* ─────────────────────────────────────────────────────────────────────────
     Generic host for any PUBLIC YisraForm.

       /p/form?f=intake&case_id=ABC12345&src=facebook

     Params owned by THIS page (consumed, never forwarded) — names live in
     P_FORM / P_TITLE below, currently "f" and "t":

       f   required — the form_key to host.
       t   optional — heading override. Needed only on a vanity domain, where
                      the frame's own title can't be read cross-origin.

     These MUST be added to URL_PARAM_RESERVED in services/formTemplateService.js
     (currently form_key/ext/preview/template_id/link_id/case_id/contact_id/
     appt_id). Until they are, a staff-authored field declaring urlParam:"f"
     would publish cleanly and then silently never receive its value on this
     page. Verified 2026-08-12: no template declares either name today —
     `intake`.`src` is the only urlParam in the table.

     Everything else on the querystring is forwarded verbatim to /f/:form_key,
     which drops the four params it owns and passes the rest through to the
     renderer (case_id, src, and any declared urlParam).
     ───────────────────────────────────────────────────────────────────────── */
  var P_FORM      = 'f';                      // → 'form'  if the reserved-list call goes long
  var P_TITLE     = 't';                      // → 'title'      "        "        "
  var FORM_BASE   = 'https://app.4lsg.com/f/';
  var DEFAULT_KEY = '';                       // set e.g. 'intake' to make a bare hit work
  var KEY_RE      = /^[a-z0-9_]{1,50}$/;      // routes/f.js FORM_KEY_RE
  var BRAND       = 'Legal Solutions Group';

  var root    = document.documentElement;
  var frame   = document.getElementById('lpFrame');
  var wrap    = document.getElementById('lpWrap');
  var empty   = document.getElementById('lpEmpty');
  var loader  = document.getElementById('lpLoader');
  var loadTxt = document.getElementById('lpLoaderText');
  var titleEl = document.getElementById('lpTitle');
  var direct  = document.getElementById('lpDirect');

  /* ── 1. Resolve the form key, rebuild the passthrough querystring ──────── */
  var params = new URLSearchParams(window.location.search || '');
  var key    = (params.get(P_FORM) || DEFAULT_KEY || '').trim().toLowerCase();
  var titleOverride = (params.get(P_TITLE) || '').trim();
  params.delete(P_FORM);
  params.delete(P_TITLE);

  if (!KEY_RE.test(key)) {
    // Missing or malformed. Don't iframe a 404 — say what's wrong.
    wrap.hidden = true;
    empty.hidden = false;
    return;
  }

  var qs = params.toString();
  var target = FORM_BASE + encodeURIComponent(key) + (qs ? '?' + qs : '');

  direct.href = target;
  direct.hidden = false;
  frame.src = target;

  /* ── 2. Title ─────────────────────────────────────────────────────────── */
  var lastTitle = '';
  var titleLocked = false;

  function setTitle(t) {
    t = String(t || '').trim().slice(0, 120);
    if (!t || t === lastTitle) return;
    lastTitle = t;
    titleEl.textContent = t;        // textContent, never innerHTML
    titleEl.hidden = false;
    frame.title = t;
    document.title = t + ' \u2014 ' + BRAND;
  }

  if (titleOverride) { setTitle(titleOverride); titleLocked = true; }

  // render.html sets document.title asynchronously, after the /api/ext payload
  // lands — so this is polled rather than read once.
  function syncTitle(d) {
    if (titleLocked) return;
    var t = (d.title || '').trim();
    if (t && t !== 'Form') setTitle(t);
  }

  /* ── 3. Same-origin helpers ───────────────────────────────────────────── */
  // Readable only when this page is served from app.4lsg.com. On a mapped
  // vanity domain this throws and we stay in fill mode — which is correct,
  // not a failure.
  function innerDoc() {
    try {
      var d = frame.contentDocument;
      return (d && d.body) ? d : null;
    } catch (e) { return null; }
  }

  var lastH = 0;
  function fit() {
    var d = innerDoc();
    if (!d) return;
    // body.scrollHeight, NOT documentElement.scrollHeight: <html> stretches to
    // the iframe viewport, so measuring it makes the frame ratchet taller and
    // never shrink back. yc-forms.css leaves body content-height with zero
    // margin, so body is the honest measure. +8 clears the card's box-shadow.
    var h = d.body.scrollHeight;
    if (h > 0 && Math.abs(h - lastH) > 2) {
      lastH = h;
      frame.style.height = (h + 8) + 'px';
    }
  }

  // On submit, render.html hides the form and appends .ycr-post-submit. In grow
  // mode the thank-you can land below the fold, so bring it into view.
  var scrolledToPanel = false;
  function checkPostSubmit(d) {
    var panel = d.querySelector('.ycr-post-submit');
    if (panel && !scrolledToPanel) {
      scrolledToPanel = true;
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
      catch (e) { window.scrollTo(0, 0); }
    } else if (!panel) {
      scrolledToPanel = false;   // "Edit response" restores the form
    }
  }

  /* ── 4. Load ──────────────────────────────────────────────────────────── */
  var stalled = setTimeout(function () {
    loadTxt.textContent = 'Still loading. If nothing appears, open the form in a new tab \u2014 the link is at the bottom of this page.';
  }, 9000);

  frame.addEventListener('load', function () {
    clearTimeout(stalled);
    loader.style.display = 'none';
    frame.style.opacity = '1';

    var d = innerDoc();
    if (!d) return;                      // cross-origin → stay in fill mode

    root.className = 'mode-grow';
    syncTitle(d);
    fit();

    try {
      if (window.ResizeObserver) new ResizeObserver(fit).observe(d.body);
    } catch (e) { /* fall through to the interval */ }

    // Safety net for anything ResizeObserver misses (conditional sections,
    // repeater rows, sweetalert toasts) plus the title/post-submit polls.
    setInterval(function () {
      var doc = innerDoc();
      if (!doc) return;
      fit();
      syncTitle(doc);
      checkPostSubmit(doc);
    }, 500);
  });
})();
</script>
</body>
</html>
