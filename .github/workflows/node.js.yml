# The land gate's test run. local/land.sh pushes the rebased, amended slice
# commit to a land/<slug>-<sha> branch, waits for THIS workflow's run on that
# exact SHA, and fast-forwards main to it only when the run is green. Pushes to
# main run it again (same SHA after a land; the only test a direct push gets).
#
# The runner sees committed files only: no .env, no Cloud SQL proxy, no GCP
# credential — nothing here can reach production. Suites gated on
# YC_TEST_MYSQL_URL / PUPPETEER_EXECUTABLE_PATH / YC_TEST_IMAP_* skip, exactly
# as they do in a local land. The job is named `test` with no matrix, so its
# check name stays `test` — the name branch protection on main will require.
name: Node.js CI

on:
  push:
    branches: [ "main", "land/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Two workers on the 4-vCPU runner, each restarted past 1 GB between test
      # files — the same caps a --local-suite land uses. Jest's default (3) let
      # load-sensitive async suites hit the 5 s test timeout on clean commits:
      # configShellAccess, commsArchiveService, clioTool, three land NO-GOs on
      # 2026-10-27, each passing locally on the same SHA.
      - run: npx jest --ci --maxWorkers=2 --workerIdleMemoryLimit=1G
