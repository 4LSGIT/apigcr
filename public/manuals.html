<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YisraCase Docs</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.10/marked.min.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <script src="/themeSync.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      background: var(--page-bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .sidebar-logo:hover { opacity: 0.8; }

    .sidebar-section-label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 16px 18px 5px;
    }

    .sidebar-section {
      display: block;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
    }

    .sidebar-section:hover { color: var(--text); background: var(--hover); }
    .sidebar-section.active { color: var(--text); border-left-color: var(--accent); }

    .sidebar-file {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      padding: 5px 18px 5px 28px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }

    .sidebar-file:hover { color: var(--text); background: var(--hover); }
    .sidebar-file.active { color: var(--accent-on-soft); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

    /* ── Main ────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Topbar ── */
    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .bc-sep { color: var(--text-muted); }
    .bc-link { color: var(--info); cursor: pointer; }
    .bc-link:hover { text-decoration: underline; }
    .bc-current { color: var(--text); font-weight: 500; }

    /* ── Content area ── */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 36px 52px;
    }

    /* ── Loading / error states ── */
    .state-msg {
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 0;
      text-align: center;
    }

    /* ── Index grid ── */
    .index-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .index-sub {
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border-color: var(--info);
    }

    .card-title { font-size: 14px; font-weight: 650; color: var(--text); margin-bottom: 5px; }
    .card-meta  { font-size: 12px; color: var(--text-muted); }

    /* ── File list ── */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }

    .file-list {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }

    .file-row {
      display: flex;
      align-items: center;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      gap: 14px;
    }

    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: var(--hover); }

    .file-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      /* A numbered index chip — a solid fill, not a code surface. --accent is
         the sheet's only non-status fill, and --accent-text is its label. */
      background: var(--accent);
      color: var(--accent-text);
      font-size: 10px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .file-text  { flex: 1; min-width: 0; }
    .file-label { font-size: 13px; font-weight: 500; }
    .file-arrow { color: var(--text-muted); }

    /* Harvested from the section README's TOC table. */
    .file-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 1px;
    }

    .file-desc code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      background: var(--surface-2);
      padding: 1px 4px;
      border-radius: 3px;
      color: var(--text-2);
    }

    /* ── Section intro / outro (README prose) ── */
    .section-intro { margin-bottom: 22px; }
    .section-outro { margin-top: 26px; }
    .section-intro > *:first-child,
    .section-outro > *:first-child { margin-top: 0; }
    .section-intro > *:last-child,
    .section-outro > *:last-child  { margin-bottom: 0; }

    /* ── Markdown ── */
    .md-body h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .md-body h2 { font-size: 18px; font-weight: 650; margin: 36px 0 12px;
                  padding-bottom: 7px; border-bottom: 1px solid var(--border); }
    .md-body h3 { font-size: 15px; font-weight: 650; margin: 24px 0 8px; }
    .md-body h4 { font-size: 13px; font-weight: 600; margin: 18px 0 6px; color: var(--text-2); }
    .md-body p  { margin-bottom: 13px; }
    .md-body ul, .md-body ol { margin: 0 0 13px 22px; }
    .md-body li { margin-bottom: 3px; }
    .md-body strong { font-weight: 650; }
    .md-body a  { color: var(--info); cursor: pointer; }
    .md-body a[data-inert] {
      color: var(--text-muted);
      cursor: default;
      text-decoration: underline dotted;
    }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    .md-body blockquote {
      border-left: 4px solid var(--info);
      background: var(--accent-soft);
      margin: 14px 0;
      padding: 11px 15px;
      border-radius: 0 6px 6px 0;
      color: var(--accent-on-soft);
      font-size: 13px;
    }

    .md-body code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      background: var(--surface-2);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--danger);
    }

    .md-body pre {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 18px 22px;
      overflow-x: auto;
      margin: 14px 0 18px;
    }

    .md-body pre code {
      background: none; color: var(--code-fg); padding: 0;
      font-size: 12px; line-height: 1.6;
    }

    .md-body table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: 13px; }
    .md-body th { background: var(--surface-2); color: var(--text); font-weight: 600; padding: 9px 13px; text-align: left; }
    .md-body td { padding: 8px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:nth-child(even) td { background: var(--surface-2); }

    /* ── Prev/Next ── */
    .prev-next {
      display: flex;
      justify-content: space-between;
      margin-top: 44px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .prev-next span {
      color: var(--info);
      cursor: pointer;
    }

    .prev-next span:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-logo" onclick="manualsLoad()">YisraCase Docs</div>
  <div id="sidebar-nav"></div>
</div>

<div id="main">
  <div id="topbar"><span class="bc-current">Documentation</span></div>
  <div id="content"><div class="state-msg">Loading…</div></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
const state = {
  sections:        [],   // [{ slug, label }]
  currentSection:  null, // { slug, label }
  currentFiles:    [],   // [{ slug, label }]
  currentFile:     null  // { slug, label }
};

// ─────────────────────────────────────────────────────────────
// API — uses parent's apiSend for auth
// ─────────────────────────────────────────────────────────────
async function api(path) {
  return await window.parent.apiSend(path, 'GET');
}

// fetchMarkdown — apiSend handles auth and returns raw text for non-JSON responses
async function fetchMarkdown(section, file) {
  return await window.parent.apiSend(`/manual/${section}/${file}`, 'GET');
}

// ─────────────────────────────────────────────────────────────
// DOM helpers
// ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setContent(html) { $('content').innerHTML = html; }
function setLoading()     { setContent('<div class="state-msg">Loading…</div>'); }
function setError(msg)    { setContent(`<div class="state-msg">⚠ ${msg}</div>`); }

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Breadcrumb handlers are held here and dispatched by index. They used to be
// stringified into an inline onclick — which silently broke every section
// crumb, because `onclick="(() => loadSection(sectionSlug))()"` evaluates in
// global scope where the closure variable doesn't exist.
let bcParts = [];

function setBreadcrumb(parts) {
  // parts: [{ label, onClick? }]  — last one has no onClick (current)
  bcParts = parts;
  $('topbar').innerHTML = parts.map((p, i) => {
    const isLast = i === parts.length - 1;
    if (isLast) return `<span class="bc-current">${esc(p.label)}</span>`;
    return `<span class="bc-link" data-bc="${i}">${esc(p.label)}</span>`
         + `<span class="bc-sep">›</span>`;
  }).join('');
}

$('topbar').addEventListener('click', e => {
  const el = e.target.closest('[data-bc]');
  if (!el) return;
  const p = bcParts[Number(el.dataset.bc)];
  if (p && typeof p.onClick === 'function') p.onClick();
});

// ─────────────────────────────────────────────────────────────
// Markdown rendering helpers
// ─────────────────────────────────────────────────────────────

function renderMd(md) {
  try { return marked.parse(md); }
  catch { return `<p>${esc(md)}</p>`; }
}

// Descriptions come from README table cells and carry inline markdown
// (`code`, *emphasis*). parseInline exists in every marked 2.1+; fall back to
// escaped text if the CDN ever serves something that lacks it.
function renderMdInline(md) {
  try { return marked.parseInline(md); }
  catch { return esc(md); }
}

/**
 * marked stopped emitting heading ids in v5 (moved to a plugin), so anchor
 * links like `06-reports.md#locking` land nowhere. Slug them here instead —
 * pure DOM, so it survives whatever version the CDN serves.
 */
function addHeadingIds(root) {
  const seen = new Set();
  root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
    if (h.id) { seen.add(h.id); return; }
    const base = h.textContent.toLowerCase().trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-');
    if (!base) return;
    let id = base, n = 2;
    while (seen.has(id)) id = `${base}-${n++}`;
    seen.add(id);
    h.id = id;
  });
}

function scrollToAnchor(hash) {
  if (!hash) { $('content').scrollTop = 0; return; }
  const el = document.getElementById(hash);
  if (el) el.scrollIntoView({ block: 'start' });
  else $('content').scrollTop = 0;
}

/**
 * Markdown links are authored to work on GitHub — relative to the file's own
 * folder. In the viewer they used to navigate the iframe to a path that
 * doesn't exist (`06-data-modes.md` → `/06-data-modes.md` → 404), blowing the
 * whole page away. Map them onto the loader instead.
 *
 * Returns one of:
 *   { kind: 'external' }                     leave to the browser
 *   { kind: 'anchor',  hash }                same page
 *   { kind: 'section', sec }                 ../<section>/
 *   { kind: 'file',    sec, file, hash }     <file>.md | ../<section>/<file>.md
 *   { kind: 'outside' }                      ../../routes/logs.js etc — real
 *                                            targets on GitHub, not servable here
 */
function resolveDocLink(raw, currentSection) {
  if (!raw) return { kind: 'outside' };
  if (/^(?:https?:|mailto:|tel:)/i.test(raw)) return { kind: 'external' };

  const [pathPart, hash] = raw.split('#');
  if (!pathPart) return { kind: 'anchor', hash };

  let m;
  if ((m = pathPart.match(/^(?:\.\/)?\.\.\/([^/]+)\/([^/]+)\.md$/i)))
    return { kind: 'file', sec: m[1], file: m[2], hash };
  if ((m = pathPart.match(/^(?:\.\/)?\.\.\/([^/]+)\/?$/)))
    return { kind: 'section', sec: m[1] };
  if ((m = pathPart.match(/^(?:\.\/)?([^/]+)\.md$/i)) && currentSection)
    return { kind: 'file', sec: currentSection, file: m[1], hash };

  return { kind: 'outside' };
}

/** Flag links the viewer can't follow so they don't look clickable-but-dead. */
function markDeadLinks(root) {
  root.querySelectorAll('a[href]').forEach(a => {
    if (resolveDocLink(a.getAttribute('href'), state.currentSection?.slug).kind !== 'outside') return;
    a.dataset.inert = '1';
    a.title = 'Repo file — not served by the manual viewer';
  });
}

$('content').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a || !$('content').contains(a)) return;

  const raw = a.getAttribute('href') || '';
  if (!raw) return;

  const r = resolveDocLink(raw, state.currentSection?.slug);

  // External — break out of the iframe rather than replacing the viewer.
  if (r.kind === 'external') {
    a.target = '_blank';
    a.rel    = 'noopener noreferrer';
    return;
  }

  e.preventDefault();
  if (r.kind === 'anchor')  scrollToAnchor(r.hash);
  if (r.kind === 'section') loadSection(r.sec);
  if (r.kind === 'file')    loadFile(r.sec, r.file, r.hash);
});

// ─────────────────────────────────────────────────────────────
// Sidebar
// ─────────────────────────────────────────────────────────────
function renderSidebar() {
  const nav = $('sidebar-nav');
  if (!state.sections.length) { nav.innerHTML = ''; return; }

  let html = '<div class="sidebar-section-label">Modules</div>';

  for (const sec of state.sections) {
    const isActive = state.currentSection?.slug === sec.slug;
    html += `<div class="sidebar-section${isActive ? ' active' : ''}"
               onclick="loadSection('${sec.slug}')">${esc(sec.label)}</div>`;

    if (isActive && state.currentFiles.length) {
      for (const file of state.currentFiles) {
        const isFileActive = state.currentFile?.slug === file.slug;
        html += `<div class="sidebar-file${isFileActive ? ' active' : ''}"
                   onclick="loadFile('${sec.slug}','${file.slug}')"
                   title="${esc(file.desc || file.label)}">${esc(file.label)}</div>`;
      }
    }
  }

  nav.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────
// Views
// ─────────────────────────────────────────────────────────────

// Index — grid of section cards
async function showIndex() {
  state.currentSection = null;
  state.currentFile    = null;
  state.currentFiles   = [];

  setBreadcrumb([{ label: 'Documentation' }]);
  setLoading();

  try {
    const data = await api('/manual');
    state.sections = data.sections || [];
    renderSidebar();

    if (!state.sections.length) {
      setContent('<div class="state-msg">No documentation sections found.</div>');
      return;
    }

    const cards = state.sections.map(sec => `
      <div class="card" onclick="loadSection('${sec.slug}')">
        <div class="card-title">${esc(sec.label)}</div>
        <div class="card-meta">Click to browse</div>
      </div>`).join('');

    setContent(`
      <div class="index-title">YisraCase Documentation</div>
      <p class="index-sub">Select a module below.</p>
      <div class="card-grid">${cards}</div>`);

  } catch {
    setError('Could not load documentation index.');
  }
}

// Section — file list
async function loadSection(sectionSlug) {
  state.currentSection = { slug: sectionSlug, label: '' };
  state.currentFile    = null;
  state.currentFiles   = [];

  setBreadcrumb([
    { label: 'Documentation', onClick: manualsLoad },
    { label: '…' }
  ]);
  setLoading();

  try {
    const data = await api(`/manual/${sectionSlug}`);
    state.currentSection = data.section;
    state.currentFiles   = data.files || [];
    renderSidebar();

    setBreadcrumb([
      { label: 'Documentation', onClick: manualsLoad },
      { label: data.section.label }
    ]);

    // intro / outro are the section README's prose, split around its TOC
    // table — see routes/manuals.js. The chapter list between them is
    // generated from the filesystem, so it can't go stale.
    const intro = data.intro
      ? `<div class="md-body section-intro">${renderMd(data.intro)}</div>` : '';
    const outro = data.outro
      ? `<div class="md-body section-outro">${renderMd(data.outro)}</div>` : '';

    if (!state.currentFiles.length) {
      setContent(`
        <div class="section-title">${esc(data.section.label)}</div>
        ${intro}
        <div class="state-msg">No files in this section.</div>
        ${outro}`);
      return;
    }

    const rows = state.currentFiles.map((f, i) => `
      <div class="file-row" onclick="loadFile('${sectionSlug}','${f.slug}')">
        <div class="file-num">${i + 1}</div>
        <div class="file-text">
          <div class="file-label">${esc(f.label)}</div>
          ${f.desc ? `<div class="file-desc">${renderMdInline(f.desc)}</div>` : ''}
        </div>
        <div class="file-arrow">›</div>
      </div>`).join('');

    setContent(`
      <div class="section-title">${esc(data.section.label)}</div>
      ${intro}
      <div class="file-list">${rows}</div>
      ${outro}`);

    $('content').querySelectorAll('.md-body').forEach(el => {
      addHeadingIds(el);
      markDeadLinks(el);
    });
    $('content').scrollTop = 0;

  } catch {
    setError('Could not load section.');
  }
}

// File — rendered markdown. `hash` is an optional heading anchor to land on.
async function loadFile(sectionSlug, fileSlug, hash) {
  state.currentFile = { slug: fileSlug, label: '' };
  setLoading();

  // Find labels from state
  if (!state.currentSection || state.currentSection.slug !== sectionSlug) {
    // Navigate to section first to populate state, then load file
    await loadSection(sectionSlug);
  }

  const secLabel  = state.currentSection?.label || sectionSlug;
  const fileLabel = state.currentFiles.find(f => f.slug === fileSlug)?.label || fileSlug;
  state.currentFile = { slug: fileSlug, label: fileLabel };
  renderSidebar();

  setBreadcrumb([
    { label: 'Documentation', onClick: manualsLoad },
    { label: secLabel, onClick: () => loadSection(sectionSlug) },
    { label: fileLabel }
  ]);

  try {
    const md = await fetchMarkdown(sectionSlug, fileSlug);

    // Prev / next
    const idx  = state.currentFiles.findIndex(f => f.slug === fileSlug);
    const prev = state.currentFiles[idx - 1];
    const next = state.currentFiles[idx + 1];

    const prevNext = (prev || next) ? `
      <div class="prev-next">
        <div>${prev
          ? `<span onclick="loadFile('${sectionSlug}','${prev.slug}')">← ${prev.label}</span>`
          : ''}</div>
        <div>${next
          ? `<span onclick="loadFile('${sectionSlug}','${next.slug}')">${next.label} →</span>`
          : ''}</div>
      </div>` : '';

    setContent(`<div id="md-body" class="md-body">${renderMd(md)}</div>${prevNext}`);
    addHeadingIds($('md-body'));
    markDeadLinks($('md-body'));
    scrollToAnchor(hash);

  } catch {
    setError('Could not load file.');
  }
}

// ─────────────────────────────────────────────────────────────
// Entry point — called by index.html button on first open,
// and by the sidebar logo. Safe to call multiple times.
// ─────────────────────────────────────────────────────────────
async function manualsLoad(sectionSlug, fileSlug, hash) {
  if (fileSlug) {
    await loadFile(sectionSlug, fileSlug, hash);
  } else if (sectionSlug) {
    await loadSection(sectionSlug);
  } else {
    await showIndex();
  }
}

// Auto-load on open
manualsLoad();
</script>
</body>
</html>
