<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YisraCase Docs</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <script src="/themeSync.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ui);
      font-size: var(--fs);
      line-height: 1.7;
      color: var(--text);
      background: var(--page-bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      color: var(--text);
      font-weight: 700;
      font-size: var(--fs-xs);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: block;
      text-decoration: none;
    }

    .sidebar-logo:hover { opacity: 0.8; }

    /* Navigation is real links (hash routes, see the script's Routing): keyboard
       focusable, middle-click / copy-link sane. One visible focus ring for every
       one of them; the inset variant where the box clips (overflow: hidden) or
       touches the next row. */
    a:focus-visible, summary:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }
    .sidebar-logo:focus-visible, .sidebar-section:focus-visible,
    .sidebar-file:focus-visible, .file-row:focus-visible,
    .otp-rail a:focus-visible { outline-offset: -2px; }

    .sidebar-section-label {
      color: var(--text-muted);
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 16px 18px 5px;
    }

    .sidebar-section {
      display: block;
      color: var(--text-2);
      font-size: var(--fs-sm);
      font-weight: 600;
      padding: 8px 18px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
      text-decoration: none;
    }

    .sidebar-section:hover { color: var(--text); background: var(--hover); }
    .sidebar-section.active { color: var(--text); border-left-color: var(--accent); }

    .sidebar-file {
      display: block;
      color: var(--text-muted);
      font-size: var(--fs-sm);
      padding: 5px 18px 5px 28px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      text-decoration: none;
    }

    .sidebar-file:hover { color: var(--text); background: var(--hover); }
    .sidebar-file.active { color: var(--accent-on-soft); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

    /* ── Main ────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Topbar ── */
    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .bc-sep { color: var(--text-muted); }
    .bc-link { color: var(--accent-2); cursor: pointer; text-decoration: none; }
    .bc-link:hover { text-decoration: underline; }
    .bc-current { color: var(--text); font-weight: 500; }

    /* ── Content area ── */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 36px 52px;
      /* Reading measure: ~80 characters of body text at the default 16px,
         stated in --fs so it follows the density choice. A multiple of --fs
         (not em/ch on each element) so headings, prose, lists and the h2 rule
         all share ONE right edge whatever their own font size. Left-aligned
         under the breadcrumbs; tables break out of it (below). */
      --measure: calc(var(--fs) * 40);
      /* An unbreakable run in prose — an API path in a heading, an error
         constant in a list item — breaks at the edge instead of pushing the
         pane sideways. break-word, not anywhere: it leaves min-content alone,
         so tables keep their columns and scroll in their own box. No effect
         inside <pre> (white-space: pre never wraps). */
      overflow-wrap: break-word;
    }

    /* Everything in the pane sits in the measure — index, section view,
       chapter — except .md-body itself, so that a table (wrapped in its own
       scroll box after render, see wrapTables) can run wider than the prose
       when the pane has the room, and scroll inside its box when it hasn't. */
    #content > :not(.md-body):not(.chapter),
    .chapter-main > :not(.md-body),
    .md-body > :not(.table-wrap) { max-width: var(--measure); }

    /* ── Loading / error states ── */
    .state-msg {
      color: var(--text-muted);
      font-size: var(--fs-sm);
      padding: 40px 0;
      text-align: center;
    }

    /* ── Index grid ── */
    .index-title {
      font-size: var(--fs-title);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .index-sub {
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border-color: var(--info);
    }

    .card-title { font-size: var(--fs); font-weight: 650; color: var(--text); margin-bottom: 5px; }
    .card-blurb { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.5; margin-bottom: 8px; }
    .card-meta  { font-size: var(--fs-xs); color: var(--text-muted); }

    /* ── File list ── */
    .section-title {
      font-size: var(--fs-title);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }

    .file-list {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }

    .file-row {
      display: flex;
      align-items: center;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
    }

    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: var(--hover); }

    .file-num {
      width: 2em; height: 2em;
      border-radius: 50%;
      /* A numbered index chip — a solid fill, not a code surface. --accent is
         the sheet's only non-status fill, and --accent-text is its label. */
      background: var(--accent);
      color: var(--accent-text);
      font-size: var(--fs-xs);
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .file-text  { flex: 1; min-width: 0; }
    .file-label { font-size: var(--fs); font-weight: 500; }
    .file-arrow { color: var(--text-muted); }

    /* Harvested from the section README's TOC table. */
    .file-desc {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 1px;
    }

    .file-desc code {
      font-family: var(--mono);
      font-size: 0.9em;
      background: var(--surface-2);
      padding: 1px 4px;
      border-radius: 3px;
      color: var(--text-2);
      overflow-wrap: anywhere;   /* a long identifier must not push the row */
    }

    /* ── Section intro / outro (README prose) ── */
    .section-intro { margin-bottom: 22px; }
    .section-outro { margin-top: 26px; }
    .section-intro > *:first-child,
    .section-outro > *:first-child { margin-top: 0; }
    .section-intro > *:last-child,
    .section-outro > *:last-child  { margin-bottom: 0; }

    /* ── Markdown ── */
    /* h1 > h2 > h3 > h4 > body at every density preset: h1/h3 ride the
       title/lg tokens, h2/h4 are em of the body (--fs) between them. */
    .md-body h1 { font-size: var(--fs-title); font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .md-body h2 { font-size: 1.25em; font-weight: 650; margin: 36px 0 12px;
                  padding-bottom: 7px; border-bottom: 1px solid var(--border); }
    .md-body h3 { font-size: var(--fs-lg); font-weight: 650; margin: 24px 0 8px; }
    .md-body h4 { font-size: 1.0625em; font-weight: 600; margin: 18px 0 6px; color: var(--text-2); }
    .md-body p  { margin-bottom: 13px; }
    .md-body ul, .md-body ol { margin: 0 0 13px 22px; }
    .md-body li { margin-bottom: 3px; }
    .md-body strong { font-weight: 650; }
    .md-body a  { color: var(--accent-2); cursor: pointer; }
    .md-body a[data-inert] {
      color: var(--text-muted);
      cursor: default;
      text-decoration: underline dotted;
    }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    .md-body blockquote {
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      margin: 14px 0;
      padding: 11px 15px;
      border-radius: 0 6px 6px 0;
      color: var(--accent-on-soft);
      font-size: var(--fs-sm);
    }
    .md-body blockquote > :last-child { margin-bottom: 0; }

    .md-body code {
      font-family: var(--mono);
      font-size: 0.875em;
      background: var(--surface-2);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--danger);
    }

    /* Inline code wraps rather than push the pane sideways (a long
       identifier is one unbreakable word). Inside a table it only breaks
       when the cell can't otherwise fit — break-word leaves the table's
       min-content alone, so the column keeps the identifier whole and the
       table scrolls in its own box instead of shredding it. */
    .md-body :not(pre) > code { overflow-wrap: anywhere; }
    .md-body td > code, .md-body th > code { overflow-wrap: break-word; }

    .md-body pre {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 18px 22px;
      overflow-x: auto;
      margin: 14px 0 18px;
    }

    .md-body pre code {
      background: none; color: var(--code-fg); padding: 0;
      font-size: 0.875em; line-height: 1.6;
    }

    /* Tables scroll in their own box (AI_CONTEXT §12 phone rule), at every
       width. The box is as wide as the table wants, never narrower than the
       measure, never wider than the pane. */
    .md-body .table-wrap {
      overflow-x: auto;
      width: fit-content;
      min-width: min(100%, var(--measure));
      max-width: 100%;
      margin: 14px 0 20px;
    }
    .md-body table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    .md-body th { background: var(--surface-2); color: var(--text); font-weight: 600; padding: 9px 13px; text-align: left; }
    .md-body td { padding: 8px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:nth-child(even) td { background: var(--surface-2); }

    /* ── Prev/Next ── */
    .prev-next {
      display: flex;
      justify-content: space-between;
      margin-top: 44px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: var(--fs-sm);
    }

    .prev-next a {
      color: var(--accent-2);
      cursor: pointer;
      text-decoration: none;
    }

    .prev-next a:hover { text-decoration: underline; }

    /* ── Heading permalinks ── a `#` after each h2–h4, shown on hover/focus.
       It sets the hash (so Back returns here) and copies the SHELL deep link
       (/?manual=…), the one URL that works outside this pane. */
    .md-body .hd-link {
      margin-left: 0.4em;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 400;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .md-body :is(h2, h3, h4):hover .hd-link,
    .md-body .hd-link:focus-visible { opacity: 1; }
    .md-body .hd-link:hover { color: var(--accent-2); }
    .md-body .hd-link.copied::after {
      content: ' link copied';
      font-size: var(--fs-xs);
      color: var(--ok);
    }
    @media (hover: none) { .md-body .hd-link { opacity: 0.45; } }

    /* ── On this page ── the chapter's h2 (h3 nested) outline, for chapters
       with 3+ of them. Narrow panes (phones included): a collapsed <details>
       under the h1. Wide panes (≥1200px — the iframe's own width; the shell
       sidebar comes off first, so ~1420px of window): a sticky rail beside the
       reading column, with scroll-spy. Both are rendered; CSS picks one. */
    .otp-title {
      color: var(--text-muted);
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .md-body .otp-list, .otp-rail .otp-list { list-style: none; margin: 0; padding: 0; }
    .md-body .otp-list li, .otp-rail .otp-list li { margin: 0; }
    .otp-list a {
      display: block;
      color: var(--text-2);
      text-decoration: none;
      line-height: 1.4;
      padding: 4px 0 4px 10px;
      border-left: 2px solid transparent;
    }
    .otp-list a:hover { color: var(--text); background: var(--hover); }
    .otp-list .otp-h3 a { padding-left: 22px; color: var(--text-muted); }
    .otp-list a.active { color: var(--text); border-left-color: var(--accent); font-weight: 600; }

    .md-body .otp-inline {
      margin: 6px 0 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: var(--fs-sm);
    }
    .otp-inline > summary {
      cursor: pointer;
      padding: 8px 14px;
      font-weight: 600;
      color: var(--text-2);
    }
    .otp-inline > .otp-list { padding: 0 14px 10px 4px; }

    .otp-rail { display: none; }
    @media (min-width: 1200px) {
      .chapter.has-otp {
        display: grid;
        grid-template-columns: minmax(0, 1fr) calc(var(--fs) * 14);
        column-gap: 40px;
        align-items: start;
      }
      .chapter.has-otp .otp-rail {
        display: block;
        position: sticky;
        top: 0;                                   /* = #content's top padding: sticky honours it */
        max-height: calc(100vh - 48px - 72px);    /* topbar + #content's padding top and bottom */
        overflow-y: auto;
        font-size: var(--fs-sm);
        padding: 2px 0 12px;
      }
      .chapter.has-otp .otp-inline { display: none; }
    }

    /* ── Phones: the contents sidebar becomes a drawer ───────────────────
       At 375px the fixed 220px sidebar left ~150px for the manual itself.
       Below 768px it slides in over the page from a button beside the
       breadcrumbs (NOT inside #topbar — that is re-rendered on every
       navigation). Picking an entry closes it; so does the scrim. */
    .topline { display: flex; flex-shrink: 0; }
    .topline #topbar { flex: 1; min-width: 0; }
    #tocBtn, #tocScrim { display: none; }
    @media (max-width: 768px) {
      #tocBtn {
        display: block; flex: 0 0 auto; width: 44px; border: none;
        border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
        background: var(--surface); color: var(--text); font-size: calc(var(--fs) * 1.25); cursor: pointer;
      }
      #topbar { padding: 0 10px; overflow-x: auto; white-space: nowrap; }
      #content { padding: 18px 14px; }
      #sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
        width: 260px; max-width: 85vw; transform: translateX(-100%);
        transition: transform .2s ease; box-shadow: var(--shadow-drawer);
      }
      body.toc-open #sidebar { transform: none; }
      body.toc-open #tocScrim { display: block; position: fixed; inset: 0; z-index: 19; background: var(--backdrop); }
      /* Finger-sized rows: 44px whatever the density (padding centres one
         line of text; line-height is the body's 1.7). */
      .sidebar-section, .sidebar-file {
        min-height: 44px;
        padding-top: calc((44px - 1.7em) / 2);
        padding-bottom: calc((44px - 1.7em) / 2);
      }
      /* Breadcrumbs, prev/next, the outline's summary and rows: 44px
         targets too. */
      #topbar .bc-link, .prev-next a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
      .otp-inline > summary {
        min-height: 44px;
        padding-top: calc((44px - 1.7em) / 2);
        padding-bottom: calc((44px - 1.7em) / 2);
      }
      .otp-list a { padding-top: calc((44px - 1.4em) / 2); padding-bottom: calc((44px - 1.4em) / 2); }
      /* A table clipped by its scroll box fades out at the clipped edge(s);
         the fade goes when that edge is reached. wrapTables() keeps the
         data-clip attribute current (the cells paint their own backgrounds,
         so a background-attachment shadow would be hidden under them; a mask
         fades whatever is there, in either theme). */
      .md-body .table-wrap[data-clip="right"] {
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
                mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
      }
      .md-body .table-wrap[data-clip="left"] {
        -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent);
                mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent);
      }
      .md-body .table-wrap[data-clip="both"] {
        -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
                mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
      }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <a class="sidebar-logo" href="#/">YisraCase Docs</a>
  <div id="sidebar-nav"></div>
</div>

<div id="tocScrim" onclick="document.body.classList.remove('toc-open')"></div>

<div id="main">
  <div class="topline">
    <button id="tocBtn" type="button" title="Contents" aria-label="Contents"
            onclick="document.body.classList.toggle('toc-open')">&#9776;</button>
    <nav id="topbar" aria-label="Breadcrumb"><span class="bc-current">Documentation</span></nav>
  </div>
  <div id="content"><div class="state-msg">Loading…</div></div>
</div>

<script>
// Phone contents drawer (CSS: "Phones: the contents sidebar becomes a
// drawer"): any pick in the nav closes it. A no-op on desktop, where the
// class has no effect.
document.getElementById('sidebar').addEventListener('click', (e) => {
  if (e.target.closest('.sidebar-file, .sidebar-section, .sidebar-logo')) document.body.classList.remove('toc-open');
});

// ─────────────────────────────────────────────────────────────
// Routing
// ─────────────────────────────────────────────────────────────
// The pane's place lives in its own location.hash:
//   #/                               index
//   #/<section>                      a section's chapter list
//   #/<section>/<file>               a chapter
//   #/<section>/<file>/<anchor>      a heading in a chapter
// Every nav element is an <a href="#/…">: the browser pushes the hash, the
// hashchange listener renders. manualsLoad() pushes with pushState (no
// event) and renders itself, so its promise settles when the view is up.
// Back / forward inside the pane are then plain history traversals. Scroll
// position is mirrored into the anchor with replaceState (scroll-spy), so a
// reload, Back, or the resume below lands where you were — without adding
// entries. Slugs are checked against the loaded lists before anything is
// fetched; an unknown one falls back to the deepest valid level (replace).
//
// The shell deep link is /?manual=<section>/<file>/<anchor> (index.html
// hands it to this pane as the hash). This pane opened on its own — a
// middle-clicked link — has no shell to fetch through, so it redirects there.

const RESUME_KEY = 'yc.manuals.last';

/** '#/a/b/c' → { sec, file, anchor } (each null when absent or malformed). */
function parseHash(h) {
  const raw = String(h || '').replace(/^#/, '');
  if (!raw.startsWith('/')) return { sec: null, file: null, anchor: null };
  const parts = raw.slice(1).split('/').map(p => {
    try { return decodeURIComponent(p); } catch { return ''; }
  });
  return { sec: parts[0] || null, file: parts[1] || null, anchor: parts.slice(2).join('/') || null };
}

/** Route → path 'sec/file/anchor' (no leading '#/'); levels stop at the first gap. */
function routePath(sec, file, anchor) {
  const segs = [];
  if (sec) { segs.push(sec); if (file) { segs.push(file); if (anchor) segs.push(anchor); } }
  return segs.map(encodeURIComponent).join('/');
}
const routeHash = (sec, file, anchor) => '#/' + routePath(sec, file, anchor);

/** The URL that opens the SHELL on this place (index.html's ?manual=). */
function shellUrl(sec, file, anchor) {
  const p = routePath(sec, file, anchor);
  return location.origin + '/' + (p ? '?manual=' + p : '?manual=');
}

function storeGet() {
  try { return localStorage.getItem(RESUME_KEY) || null; } catch { return null; }
}
function storeSet(v) {
  try { localStorage.setItem(RESUME_KEY, v); } catch { /* private window / blocked */ }
}

function replaceHash(h) {
  if (location.hash === h) return;
  // try/catch: Safari throttles replaceState; a stale hash must not break nav.
  try { history.replaceState(null, '', h); } catch { /* keep going */ }
}

/** Navigate: one history entry, then render. Same place = re-render only. */
function go(h) {
  if (location.hash !== h) {
    try { history.pushState(null, '', h); }
    catch { location.hash = h; return Promise.resolve(); }   // hashchange renders
  }
  return render();
}

window.addEventListener('hashchange', () => { render(); });

// A plain click on a link to where we already are re-runs the route (back to
// the top of the chapter / the heading) — the browser does nothing there.
document.addEventListener('click', e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href^="#/"]');
  if (!a || a.getAttribute('href') !== location.hash) return;
  e.preventDefault();
  render();
});

// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
const state = {
  sections:        [],   // [{ slug, label, count, blurb }]
  currentSection:  null, // { slug, label }
  currentFiles:    [],   // [{ slug, label, desc }]
  currentFile:     null  // { slug, label } — the chapter on screen, if any
};

// ─────────────────────────────────────────────────────────────
// API — uses parent's apiSend for auth
// ─────────────────────────────────────────────────────────────
async function api(path) {
  return await window.parent.apiSend(path, 'GET');
}

// fetchMarkdown — apiSend handles auth and returns raw text for non-JSON responses
async function fetchMarkdown(section, file) {
  return await window.parent.apiSend(`/manual/${section}/${file}`, 'GET');
}

// The manual is static per deploy: each list / chapter is fetched once per
// pane load, so Back / forward re-render without a round trip. A failure is
// not cached.
const cache = new Map();
function cached(key, fn) {
  if (!cache.has(key)) cache.set(key, fn().catch(err => { cache.delete(key); throw err; }));
  return cache.get(key);
}
const loadSections = () => cached('sections', async () => (await api('/manual')).sections || []);
const loadSectionData = sec => cached('sec:' + sec, () => api(`/manual/${encodeURIComponent(sec)}`));
const loadChapter = (sec, file) => cached(`md:${sec}/${file}`,
  () => fetchMarkdown(encodeURIComponent(sec), encodeURIComponent(file)));

// ─────────────────────────────────────────────────────────────
// DOM helpers
// ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setContent(html) { $('content').innerHTML = html; }
function setLoading()     { setContent('<div class="state-msg">Loading…</div>'); }
function setError(msg)    { setContent(`<div class="state-msg">⚠ ${msg}</div>`); }

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** parts: [{ label, href? }] — the last one is the current place (no href). */
function setBreadcrumb(parts) {
  $('topbar').innerHTML = parts.map((p, i) => {
    if (i === parts.length - 1) return `<span class="bc-current" aria-current="page">${esc(p.label)}</span>`;
    return `<a class="bc-link" href="${esc(p.href)}">${esc(p.label)}</a><span class="bc-sep">›</span>`;
  }).join('');
}

// ─────────────────────────────────────────────────────────────
// Markdown rendering helpers
// ─────────────────────────────────────────────────────────────

function renderMd(md) {
  try { return marked.parse(md); }
  catch { return `<p>${esc(md)}</p>`; }
}

// Descriptions come from README table cells and carry inline markdown
// (`code`, *emphasis*). parseInline exists in every marked 2.1+; fall back to
// escaped text if the CDN ever serves something that lacks it. They render
// inside a row that is itself a link, so any link of their own is unwrapped.
function renderMdInline(md) {
  try { return marked.parseInline(md).replace(/<\/?a\b[^>]*>/gi, ''); }
  catch { return esc(md); }
}

/**
 * marked stopped emitting heading ids in v5 (moved to a plugin), so anchor
 * links like `06-reports.md#locking` land nowhere. Slug them here instead —
 * pure DOM, so it survives whatever version the CDN serves. GitHub's rule,
 * which is what the manual's authored anchors follow: lowercase, punctuation
 * dropped, EACH space a hyphen ("Parser v2 — the …" → "parser-v2--the-…").
 */
function addHeadingIds(root) {
  const seen = new Set();
  root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
    if (h.id) { seen.add(h.id); return; }
    const base = h.textContent.toLowerCase().trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s/g, '-');
    if (!base) return;
    let id = base, n = 1;
    while (seen.has(id)) id = `${base}-${n++}`;
    seen.add(id);
    h.id = id;
  });
}

// A scroll the code made (landing on an anchor) must not be read back by
// the scroll-spy as the user moving: until this time, the spy highlights but
// never rewrites the hash.
let spyQuietUntil = 0;

// #content only: scrollIntoView() would also scroll every scrollable
// ancestor — the shell's own page included — sliding the pane's breadcrumbs
// under the shell header.
const ANCHOR_GAP = 16;   // px of air above a landed-on heading

function scrollToAnchor(hash) {
  spyQuietUntil = performance.now() + 250;
  const c  = $('content');
  const el = hash && document.getElementById(hash);
  if (el && c.contains(el)) c.scrollTop += el.getBoundingClientRect().top - c.getBoundingClientRect().top - ANCHOR_GAP;
  else c.scrollTop = 0;
  spyUpdate(hash || null);
}

/**
 * Markdown links are authored to work on GitHub — relative to the file's own
 * folder. In the viewer they used to navigate the iframe to a path that
 * doesn't exist (`06-data-modes.md` → `/06-data-modes.md` → 404), blowing the
 * whole page away. Map them onto the router instead (rewriteLinks).
 *
 * Returns one of:
 *   { kind: 'external' }                     leave to the browser
 *   { kind: 'anchor',  hash }                same page
 *   { kind: 'section', sec }                 ../<section>/
 *   { kind: 'file',    sec, file, hash }     <file>.md | ../<section>/<file>.md
 *   { kind: 'outside' }                      ../../routes/logs.js etc — real
 *                                            targets on GitHub, not servable here
 */
function resolveDocLink(raw, currentSection) {
  if (!raw) return { kind: 'outside' };
  if (/^(?:https?:|mailto:|tel:)/i.test(raw)) return { kind: 'external' };

  const [pathPart, hash] = raw.split('#');
  if (!pathPart) return { kind: 'anchor', hash };

  let m;
  if ((m = pathPart.match(/^(?:\.\/)?\.\.\/([^/]+)\/([^/]+)\.md$/i)))
    return { kind: 'file', sec: m[1], file: m[2], hash };
  if ((m = pathPart.match(/^(?:\.\/)?\.\.\/([^/]+)\/?$/)))
    return { kind: 'section', sec: m[1] };
  if ((m = pathPart.match(/^(?:\.\/)?([^/]+)\.md$/i)) && currentSection)
    return { kind: 'file', sec: currentSection, file: m[1], hash };

  return { kind: 'outside' };
}

/**
 * Tables scroll in their own box instead of pushing #content sideways
 * (CSS: .table-wrap). marked emits bare <table>s, so wrap them after render.
 * Each box keeps data-clip = which edge(s) currently hide columns
 * (right / left / both / none); the phone CSS fades that edge as a scroll cue.
 * Idempotent.
 */
function updateClip(w) {
  const max = w.scrollWidth - w.clientWidth;
  const l = w.scrollLeft > 1, r = w.scrollLeft < max - 1;
  w.dataset.clip = l && r ? 'both' : l ? 'left' : r ? 'right' : 'none';
}
const clipObserver = typeof ResizeObserver === 'function'
  ? new ResizeObserver(entries => entries.forEach(en => updateClip(en.target))) : null;

function wrapTables(root) {
  root.querySelectorAll('table').forEach(t => {
    if (t.parentElement.classList.contains('table-wrap')) return;
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
    w.addEventListener('scroll', () => updateClip(w), { passive: true });
    if (clipObserver) clipObserver.observe(w);
    updateClip(w);
  });
}

/**
 * Point every link at its route (so it is a real, copyable, middle-clickable
 * link) and flag the ones the viewer can't follow so they don't look
 * clickable-but-dead. `page` is where the links live: { sec, file } (file
 * null on a section page, whose README prose has no chapter to anchor in).
 */
function rewriteLinks(root, page) {
  root.querySelectorAll('a[href]').forEach(a => {
    if (a.classList.contains('hd-link')) return;
    const r = resolveDocLink(a.getAttribute('href'), page.sec);
    if (r.kind === 'external') {
      a.target = '_blank';                // break out of the iframe
      a.rel    = 'noopener noreferrer';
    } else if (r.kind === 'anchor') {
      if (page.file) a.setAttribute('href', routeHash(page.sec, page.file, r.hash));
      else a.dataset.anchor = r.hash || '';
    } else if (r.kind === 'section') {
      a.setAttribute('href', routeHash(r.sec));
    } else if (r.kind === 'file') {
      a.setAttribute('href', routeHash(r.sec, r.file, r.hash));
    } else {
      a.dataset.inert = '1';
      a.title = 'Repo file — not served by the manual viewer';
    }
  });
}

$('content').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a || !$('content').contains(a)) return;
  if (a.dataset.inert) { e.preventDefault(); return; }
  if (a.dataset.anchor !== undefined) { e.preventDefault(); scrollToAnchor(a.dataset.anchor); }
});

// ─────────────────────────────────────────────────────────────
// Sidebar
// ─────────────────────────────────────────────────────────────
function renderSidebar() {
  const nav = $('sidebar-nav');
  if (!state.sections.length) { nav.innerHTML = ''; return; }

  let html = '<div class="sidebar-section-label">Modules</div>';

  for (const sec of state.sections) {
    const isActive = state.currentSection?.slug === sec.slug;
    html += `<a class="sidebar-section${isActive ? ' active' : ''}" href="${routeHash(sec.slug)}"`
          + `${isActive && !state.currentFile ? ' aria-current="page"' : ''}>${esc(sec.label)}</a>`;

    if (isActive && state.currentFiles.length) {
      for (const file of state.currentFiles) {
        const isFileActive = state.currentFile?.slug === file.slug;
        html += `<a class="sidebar-file${isFileActive ? ' active' : ''}" href="${routeHash(sec.slug, file.slug)}"`
              + `${isFileActive ? ' aria-current="page"' : ''}`
              + ` title="${esc(file.desc || file.label)}">${esc(file.label)}</a>`;
      }
    }
  }

  nav.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────
// On this page — outline, permalinks, scroll-spy
// ─────────────────────────────────────────────────────────────
const OTP_MIN = 3;           // fewer h2/h3 than this: no outline
let spy = null;              // { sec, file, heads: [h2/h3], links: Map id → [a], active }

/**
 * Build the outline (rail + collapsed <details>) and the heading permalinks
 * for the chapter in `body`. Returns the rail's HTML ('' = no outline).
 */
function buildOutline(body, sec, file) {
  const heads = [...body.querySelectorAll('h2[id], h3[id]')];
  // Permalinks: h2–h4. Built after the outline text is read.
  const items = heads.map(h => ({ id: h.id, lvl: h.tagName, text: h.textContent.trim() }));
  body.querySelectorAll('h2[id], h3[id], h4[id]').forEach(h => {
    const a = document.createElement('a');
    a.className = 'hd-link';
    a.href = routeHash(sec, file, h.id);
    a.setAttribute('aria-label', 'Link to this section');
    a.title = 'Link to this section (copies the app link)';
    a.textContent = '#';
    h.appendChild(a);
  });
  spy = { sec, file, heads: items.length >= OTP_MIN ? heads : [], links: new Map(), active: undefined };
  if (items.length < OTP_MIN) return '';

  const list = '<ol class="otp-list">' + items.map(it =>
    `<li class="otp-${it.lvl.toLowerCase()}"><a href="${routeHash(sec, file, it.id)}" data-otp="${esc(it.id)}">${esc(it.text)}</a></li>`
  ).join('') + '</ol>';

  const det = document.createElement('details');
  det.className = 'otp-inline';
  det.innerHTML = `<summary>On this page</summary>${list}`;
  const h1 = body.querySelector('h1');
  if (h1) h1.after(det); else body.prepend(det);

  return `<nav class="otp-rail" aria-label="On this page"><div class="otp-title">On this page</div>${list}</nav>`;
}

function indexSpyLinks() {
  if (!spy) return;
  document.querySelectorAll('#content a[data-otp]').forEach(a => {
    const id = a.dataset.otp;
    if (!spy.links.has(id)) spy.links.set(id, []);
    spy.links.get(id).push(a);
  });
}

/** Which outline heading is the reader in? The last one whose top has passed
 *  a line just under the pane's top edge; at the very bottom, the last one
 *  on screen (short final sections can never reach the line). */
function spyCurrent() {
  const c = $('content');
  const line = c.getBoundingClientRect().top + 80;
  const atEnd = c.scrollTop + c.clientHeight >= c.scrollHeight - 2;
  const bottom = c.getBoundingClientRect().bottom;
  let cur = null;
  for (const h of spy.heads) {
    const top = h.getBoundingClientRect().top;
    if (top <= line || (atEnd && top < bottom)) cur = h.id; else if (!atEnd) break;
  }
  return cur;
}

/** Highlight the current outline entry; on a user scroll, also mirror it into
 *  the hash (replace) and the resume key. `forced` = the anchor just landed on. */
function spyUpdate(forced) {
  if (!spy || !spy.heads.length) return;
  const id = forced !== undefined && (forced === null || spy.links.has(forced)) ? forced : spyCurrent();
  if (id === spy.active) return;
  spy.active = id;
  spy.links.forEach((els, k) => els.forEach(a => a.classList.toggle('active', k === id)));
  const rail = document.querySelector('.otp-rail');
  const act = rail && id && rail.querySelector(`a[data-otp="${CSS.escape(id)}"]`);
  if (act && (act.offsetTop < rail.scrollTop || act.offsetTop > rail.scrollTop + rail.clientHeight - 30)) {
    rail.scrollTop = act.offsetTop - rail.clientHeight / 2;
  }
  if (forced !== undefined || performance.now() < spyQuietUntil) return;
  replaceHash(routeHash(spy.sec, spy.file, id));
  storeSet(routePath(spy.sec, spy.file, id));
}

let spyRaf = 0;
$('content').addEventListener('scroll', () => {
  if (spyRaf) return;
  spyRaf = requestAnimationFrame(() => {
    spyRaf = 0;
    if (performance.now() >= spyQuietUntil) spyUpdate();   // not our own landing scroll
  });
}, { passive: true });

// Permalink: the browser sets the hash (one entry); this also copies the
// shell deep link — the one URL that opens this place from outside the pane.
$('content').addEventListener('click', e => {
  const a = e.target.closest('a.hd-link');
  if (!a) return;
  const r = parseHash(a.getAttribute('href'));
  const url = shellUrl(r.sec, r.file, r.anchor);
  const done = () => { a.classList.add('copied'); setTimeout(() => a.classList.remove('copied'), 1500); };
  try {
    navigator.clipboard.writeText(url).then(done, () => { if (copyFallback(url)) done(); });
  } catch { if (copyFallback(url)) done(); }
});

function copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { /* unsupported */ }
  ta.remove();
  return ok;
}

// ─────────────────────────────────────────────────────────────
// Views
// ─────────────────────────────────────────────────────────────
let navSeq = 0;   // the newest render wins; an older one stops at its next await

async function render() {
  const seq = ++navSeq;
  const stale = () => seq !== navSeq;
  const r = parseHash(location.hash);

  // A chapter already on screen: only the anchor moved (outline, permalink,
  // Back between two headings) — scroll, don't refetch.
  if (r.sec && r.file && state.currentFile && $('md-body') &&
      state.currentSection?.slug === r.sec && state.currentFile.slug === r.file) {
    scrollToAnchor(r.anchor);
    storeSet(routePath(r.sec, r.file, r.anchor));
    return;
  }

  let sections;
  try { sections = await loadSections(); }
  catch {
    if (stale()) return;
    setBreadcrumb([{ label: 'Documentation' }]);
    setError('Could not load documentation index.');
    return;
  }
  if (stale()) return;
  state.sections = sections;

  if (!r.sec || !sections.some(s => s.slug === r.sec)) {
    if (r.sec) replaceHash('#/');           // unknown section → index
    return showIndex();
  }
  if (r.file) { state.currentFile = { slug: r.file, label: '' }; setLoading(); }

  let data;
  try { data = await loadSectionData(r.sec); }
  catch {
    if (stale()) return;
    setError('Could not load section.');
    return;
  }
  if (stale()) return;
  state.currentSection = data.section;
  state.currentFiles   = data.files || [];

  const file = r.file && state.currentFiles.find(f => f.slug === r.file);
  if (!file) {
    if (r.file) replaceHash(routeHash(r.sec));   // unknown chapter → its section
    return showSection(data);
  }
  return showChapter(file, r.anchor, stale);
}

// Index — grid of section cards
function showIndex() {
  state.currentSection = null;
  state.currentFile    = null;
  state.currentFiles   = [];
  spy = null;
  renderSidebar();
  setBreadcrumb([{ label: 'Documentation' }]);

  if (!state.sections.length) {
    setContent('<div class="state-msg">No documentation sections found.</div>');
    return;
  }

  const cards = state.sections.map(sec => `
    <a class="card" href="${routeHash(sec.slug)}">
      <div class="card-title">${esc(sec.label)}</div>
      ${sec.blurb ? `<div class="card-blurb">${esc(sec.blurb)}</div>` : ''}
      ${sec.count != null ? `<div class="card-meta">${sec.count} chapter${sec.count === 1 ? '' : 's'}</div>` : ''}
    </a>`).join('');

  setContent(`
    <div class="index-title">YisraCase Documentation</div>
    <p class="index-sub">Select a module below.</p>
    <div class="card-grid">${cards}</div>`);
  $('content').scrollTop = 0;
}

// Section — file list
function showSection(data) {
  const sec = data.section.slug;
  state.currentFile = null;
  spy = null;
  renderSidebar();
  setBreadcrumb([
    { label: 'Documentation', href: '#/' },
    { label: data.section.label }
  ]);

  // intro / outro are the section README's prose, split around its TOC
  // table — see routes/manuals.js. The chapter list between them is
  // generated from the filesystem, so it can't go stale.
  const intro = data.intro
    ? `<div class="md-body section-intro">${renderMd(data.intro)}</div>` : '';
  const outro = data.outro
    ? `<div class="md-body section-outro">${renderMd(data.outro)}</div>` : '';

  const rows = state.currentFiles.map((f, i) => `
    <a class="file-row" href="${routeHash(sec, f.slug)}">
      <div class="file-num">${i + 1}</div>
      <div class="file-text">
        <div class="file-label">${esc(f.label)}</div>
        ${f.desc ? `<div class="file-desc">${renderMdInline(f.desc)}</div>` : ''}
      </div>
      <div class="file-arrow">›</div>
    </a>`).join('');

  setContent(`
    <div class="section-title">${esc(data.section.label)}</div>
    ${intro}
    ${rows ? `<div class="file-list">${rows}</div>` : '<div class="state-msg">No files in this section.</div>'}
    ${outro}`);

  $('content').querySelectorAll('.md-body').forEach(el => {
    addHeadingIds(el);
    rewriteLinks(el, { sec, file: null });
    wrapTables(el);
  });
  $('content').scrollTop = 0;
}

// Chapter — rendered markdown, landing on `anchor` (a heading id) if given.
async function showChapter(file, anchor, stale) {
  const sec = state.currentSection.slug;
  state.currentFile = { slug: file.slug, label: file.label };
  renderSidebar();
  setBreadcrumb([
    { label: 'Documentation', href: '#/' },
    { label: state.currentSection.label, href: routeHash(sec) },
    { label: file.label }
  ]);

  let md;
  try { md = await loadChapter(sec, file.slug); }
  catch {
    if (stale()) return;
    setError('Could not load file.');
    return;
  }
  if (stale()) return;

  const idx  = state.currentFiles.findIndex(f => f.slug === file.slug);
  const prev = state.currentFiles[idx - 1];
  const next = state.currentFiles[idx + 1];
  const prevNext = (prev || next) ? `
    <nav class="prev-next" aria-label="Chapters">
      <div>${prev ? `<a href="${routeHash(sec, prev.slug)}" rel="prev">← ${esc(prev.label)}</a>` : ''}</div>
      <div>${next ? `<a href="${routeHash(sec, next.slug)}" rel="next">${esc(next.label)} →</a>` : ''}</div>
    </nav>` : '';

  setContent(`<div class="chapter"><div class="chapter-main">`
    + `<div id="md-body" class="md-body">${renderMd(md)}</div>${prevNext}</div></div>`);
  const body = $('md-body');
  addHeadingIds(body);
  rewriteLinks(body, { sec, file: file.slug });
  wrapTables(body);
  const rail = buildOutline(body, sec, file.slug);
  if (rail) {
    const ch = $('content').querySelector('.chapter');
    ch.classList.add('has-otp');
    ch.insertAdjacentHTML('beforeend', rail);
  }
  indexSpyLinks();
  scrollToAnchor(anchor);
  storeSet(routePath(sec, file.slug, anchor));
}

// ─────────────────────────────────────────────────────────────
// Entry point — kept for callers that drive the pane from outside (the
// mobile survey; anything poking the iframe). Same signature as before the
// router: (section?, file?, anchor?). Pushes one history entry and resolves
// once the view is rendered.
// ─────────────────────────────────────────────────────────────
function manualsLoad(sectionSlug, fileSlug, hash) {
  return go(routeHash(sectionSlug || null, sectionSlug ? fileSlug : null, hash));
}

// ─────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────
(function boot() {
  // Opened on its own (a middle-clicked or copied link): there is no shell to
  // fetch through — hand the place to the shell's deep link instead.
  if (window.parent === window) {
    const r = parseHash(location.hash);
    location.replace(shellUrl(r.sec, r.file, r.anchor));
    return;
  }
  // No hash at all = a fresh open of the pane: resume the last chapter read.
  // An explicit '#/' (the logo, the Documentation crumb) is the index.
  if (!location.hash || location.hash === '#') {
    const last = storeGet();
    if (last) replaceHash('#/' + last);
  }
  render();
})();
</script>
</body>
</html>
