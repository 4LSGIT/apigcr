<html lang="en">
<head>

        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/css/yc-forms.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

  <script src="/js/videoInsert.js"></script>
  <script src="/js/assetpicker.js"></script>
  <style>
    .sf-form { max-width: 950px; margin: 0 auto; background: var(--surface); color: var(--text); padding: 20px; border-radius: 8px; box-shadow: var(--shadow); }
    .sf-contact-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
    .sf-contact-card { flex: 1; min-width: 280px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; }
    .sf-contact-card h4 { font-size: 0.95rem; font-weight: 700; color: var(--text); margin: 0 0 8px 0; }
    .sf-contact-card .sf-name { font-weight: 600; font-size: 0.92rem; margin-bottom: 6px; color: var(--text); }
    .sf-contact-card .sf-edit-row { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 0.85rem; }
    .sf-contact-card .sf-edit-row span { width: 20px; text-align: center; flex-shrink: 0; }
    .sf-contact-card .sf-edit-row input { flex: 1; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 4px; font-size: 0.85rem; background: var(--surface); color: var(--text); }
    .sf-send-settings { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: var(--surface-2); border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
    .sf-send-settings label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .sf-send-settings select { padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 4px; font-size: 0.85rem; background: var(--surface); color: var(--text); }
    .sf-section { border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
    .sf-section-title { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .sf-section-title input[type="checkbox"] { width: 1.1em; height: 1.1em; }
    .sf-other-area { margin-top: 8px; padding-left: 28px; }
    .sf-other-area label { font-size: 0.85rem; font-weight: 600; display: block; margin-top: 8px; }
    .sf-other-area textarea { width: 100%; padding: 8px; border: 1px solid var(--border-strong); border-radius: 4px; font-size: 0.88rem; resize: vertical; background: var(--surface); color: var(--text); }
    .sf-other-area input[type="text"] { width: 100%; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 4px; font-size: 0.88rem; margin-bottom: 6px; background: var(--surface); color: var(--text); }
    #otherEmailEditor { height: 120px; }
    /* NOTE: these two selectors match NOTHING and did so before this commit.
       Quill turns #otherEmailEditor itself into .ql-container.ql-snow and
       inserts .ql-toolbar as its PREVIOUS SIBLING, so neither is a descendant.
       Verified in a browser: querySelectorAll length 0 for both. Tokenised
       for consistency, not restructured — the live rules are below, and
       repairing the selectors would restore a border-radius and a min-height,
       which is a metric change (charter §0.1). */
    #otherEmailEditor .ql-toolbar { border: 1px solid var(--border-strong); border-bottom: none; border-radius: 4px 4px 0 0; background: var(--surface-2); }
    #otherEmailEditor .ql-container { border: 1px solid var(--border-strong); border-radius: 0 0 4px 4px; min-height: 150px; font-family: var(--ui); font-size: 14px; }

    /* ── Quill (snow) ────────────────────────────────────────────────────
       The editor sits on .sf-form, which now themes. Quill's stylesheet
       hardcodes #ccc frames and #444 icon strokes: on the dark --surface the
       icons measure ~1.5:1 and the toolbar is unusable. Same shape as the
       SweetAlert override — a third-party widget whose light-only colours
       need a dark counterpart once the surface under them moves. Light mode
       is left alone apart from the frame, where #ccc → --border-strong
       (#cfd4da) is imperceptible. */
    .ql-toolbar.ql-snow, .ql-container.ql-snow { border-color: var(--border-strong); }
    html[data-theme="dark"] .ql-snow .ql-stroke,
    html[data-theme="dark"] .ql-snow .ql-stroke-miter { stroke: var(--text); }
    html[data-theme="dark"] .ql-snow .ql-fill,
    html[data-theme="dark"] .ql-snow .ql-stroke.ql-fill { fill: var(--text); }
    html[data-theme="dark"] .ql-snow .ql-picker { color: var(--text); }
    html[data-theme="dark"] .ql-snow .ql-picker-options {
      background: var(--surface-2); border-color: var(--border);
    }
    html[data-theme="dark"] .ql-snow .ql-editor.ql-blank::before { color: var(--text-muted); }
    html[data-theme="dark"] .ql-snow.ql-toolbar button:hover .ql-stroke,
    html[data-theme="dark"] .ql-snow.ql-toolbar button.ql-active .ql-stroke,
    html[data-theme="dark"] .ql-snow .ql-picker-label:hover,
    html[data-theme="dark"] .ql-snow .ql-picker-label.ql-active { stroke: var(--accent); color: var(--accent); }
    html[data-theme="dark"] .ql-snow.ql-toolbar button:hover .ql-fill,
    html[data-theme="dark"] .ql-snow.ql-toolbar button.ql-active .ql-fill { fill: var(--accent); }
    /* ── Toggle switch ─── */
    .sf-toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .sf-toggle-switch input { opacity: 0; width: 0; height: 0; }
    .sf-toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--accent); transition: .3s; border-radius: 24px; }
    .sf-toggle-slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: var(--fill-text); transition: .3s; border-radius: 50%; }
    .sf-toggle-switch input:checked + .sf-toggle-slider { background-color: var(--ok-fill); }
    .sf-toggle-switch input:checked + .sf-toggle-slider:before { transform: translateX(20px); }
    .sf-preview { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin: 16px 0; white-space: pre-wrap; font-size: 0.88rem; font-family: monospace; max-height: 400px; overflow-y: auto; display: none; }
    .sf-preview h4 { font-family: var(--ui); font-size: 0.95rem; font-weight: 700; margin: 0 0 8px 0; }
    .sf-actions { display: flex; gap: 10px; margin-top: 16px; }
    .sf-actions button { flex: 1; }
    .sf-disabled { opacity: 0.4; pointer-events: none; }
    .sf-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .sf-badge-future { background: var(--surface-2); color: var(--text-muted); }
    @media (max-width: 600px) {
      .sf-send-settings { flex-direction: column; align-items: flex-start; }
      .sf-contact-row { flex-direction: column; }
    }
  </style>
</head>

<script>
const P = window.parent;
const params = new URLSearchParams(location.search);
const caseId = params.get('case_id');

if (!caseId) {
  document.body.innerHTML = '<p style="color:var(--danger);padding:20px;">Missing case_id parameter.</p>';
} else {
  (function waitForParent() {
    if (P.apiSend && P.firmData?.phoneLines) return initSendingForm();
    setTimeout(waitForParent, 100);
  })();
}

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════

let caseData = {};
let primaryContact = null;
let secondaryContact = null;
let phoneLines = [];
let emailAddresses = [];
let currentUser = {};
let quillEditor = null;
let otherMmsAttachmentUrl = null;
let otherEmailAttachmentUrl = null;

const Toast = Swal.mixin({
  toast: true, position: 'top-end', showConfirmButton: false,
  timer: 2500, timerProgressBar: true
});

const PAYMENT_OPTIONS_TEXT =
`Please choose from one of the following convenient payment options:
  - Debit/Credit Card, Google Pay, or eCheck: app.4lsg.com/r/payment
  - Zelle: Send to stuart@metrodetroitlitigation.com
  - Cash App: Send to $stuartsandweiss

Thank You`;

const PAYMENT_OPTIONS_HTML =
`<p>Please choose from one of the following convenient payment options:</p>
<ul>
  <li>Debit/Credit Card, Google Pay, or eCheck: <a href="https://app.4lsg.com/r/payment">app.4lsg.com/r/payment</a></li>
  <li>Zelle: Send to stuart@metrodetroitlitigation.com</li>
  <li>Cash App: Send to $stuartsandweiss</li>
</ul>
<p>Thank You</p>`;


// ═══════════════════════════════════════════════════════════════════════════
// QUILL — EmailImage blot (preserves width/style/alt for email-safe images)
// ═══════════════════════════════════════════════════════════════════════════

const BaseImage = Quill.import('formats/image');
class EmailImage extends BaseImage {
  static create(value) {
    let node;
    if (typeof value === 'string') {
      node = super.create(value);
    } else {
      node = super.create(value.src || value.url || '');
      if (value.width) node.setAttribute('width', value.width);
      if (value.alt) node.setAttribute('alt', value.alt);
      node.setAttribute('style',
        value.style || 'display:block; max-width:100%; height:auto; border:0; outline:none;'
      );
    }
    return node;
  }
  static value(node) {
    return {
      src: node.getAttribute('src'),
      width: node.getAttribute('width'),
      style: node.getAttribute('style'),
      alt: node.getAttribute('alt')
    };
  }
}
EmailImage.blotName = 'image';
EmailImage.tagName = 'IMG';
Quill.register(EmailImage, true);


// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════

async function initSendingForm() {
  try {
    // Case data still needs its own fetch (not in firmData)
    const caseResult = await P.apiSend(`/api/cases/${caseId}`, 'GET', { include: "contacts" });

    caseData = caseResult.case || {};
    const clients = caseResult.clients || [];
    primaryContact = clients.find(c => c.relate_type === 'Primary') || null;
    secondaryContact = clients.find(c => c.relate_type === 'Secondary') || null;

    // Read firm-wide data from parent instead of 3 API calls
    const firmData = P.firmData || {};
    phoneLines = firmData.phoneLines || [];
    emailAddresses = firmData.emailFrom || [];
    currentUser = firmData.currentUser || {};

    renderContactCards();
    renderDropdowns();
    setupToggles();
    setupButtons();
    initQuill();

  } catch (err) {
    console.error('Sending form init error:', err);
    document.getElementById('sendingForm').innerHTML =
      `<p style="color:var(--danger);padding:20px;">Failed to load: ${err.message}</p>`;
  }
}


// ═══════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════

function renderContactCards() {
  const container = document.getElementById('contactCards');
  let html = '';

  if (primaryContact) {
    const pc = primaryContact;
    html += `<div class="sf-contact-card">
      <h4>Primary Contact</h4>
      <div class="sf-name">${pc.contact_name || ''}</div>
      <div class="sf-edit-row"><span>📱</span><input type="text" id="pcPhone" value="${formatPhone(pc.contact_phone) || ''}" data-yc-mask="phone"></div>
      <div class="sf-edit-row"><span>📧</span><input type="email" id="pcEmail" value="${pc.contact_email || ''}"></div>
    </div>`;
  }

  if (secondaryContact) {
    const sc = secondaryContact;
    html += `<div class="sf-contact-card">
      <h4>Secondary Contact (Co-Debtor)</h4>
      <div class="sf-name">${sc.contact_name || ''}</div>
      <div class="sf-edit-row"><span>📱</span><input type="text" id="scPhone" value="${formatPhone(sc.contact_phone) || ''}" data-yc-mask="phone"></div>
      <div class="sf-edit-row"><span>📧</span><input type="email" id="scEmail" value="${sc.contact_email || ''}"></div>
    </div>`;
    document.getElementById('sendToSecondaryLabel').style.display = '';
  }

  container.innerHTML = html;
}

function renderDropdowns() {
  // SMS from — preselect user default
  const smsSelect = document.getElementById('smsFrom');
  phoneLines.forEach(line => {
    const opt = document.createElement('option');
    opt.value = line.phone_number;
    opt.dataset.mmsCapable = String(line.mms_capable);
    const suffix = line.mms_capable ? '' : ' (SMS only)';
    opt.textContent = `${line.display_name} - ${formatPhone(line.phone_number)}${suffix}`;
    if (currentUser.default_phone && line.phone_number === currentUser.default_phone) opt.selected = true;
    smsSelect.appendChild(opt);
  });

  // Email from — placeholder first, then options, then preselect user default.
  //
  // The placeholder is a BUG FIX, not decoration: without it, when no option
  // matches the user's default_email (users with a NULL default, or a default
  // with no email_credentials row) the browser silently auto-selects the FIRST
  // option — which is stuart@4lsg.com (firmData returns ORDER BY id). Mail
  // then goes out under the lead attorney's identity, and once signatures
  // ship, under his signature too. send() refuses to email while the
  // placeholder is still selected.
  const emailSelect = document.getElementById('emailFrom');
  const ph = document.createElement('option');
  ph.value = '';
  ph.disabled = true;
  ph.selected = true;
  ph.textContent = '— Select sender —';
  emailSelect.appendChild(ph);
  emailAddresses.forEach(em => {
    const opt = document.createElement('option');
    opt.value = em.email;
    opt.dataset.hasSignature = em.signature_html ? '1' : '0';
    opt.textContent = em.from_name ? `${em.from_name} <${em.email}>` : em.email;
    if (currentUser.default_email && em.email === currentUser.default_email) opt.selected = true;
    emailSelect.appendChild(opt);
  });

  // Signature checkbox tracks whether the selected sender HAS a signature.
  // No signature → UNCHECK + disable (a checked-but-disabled box reads as
  // "will be included", which would be a lie) with an explanatory tooltip.
  // Re-selecting a signature-capable sender restores the user's last choice.
  const sigChk = document.getElementById('includeSignature');
  const sigLbl = document.getElementById('includeSignatureLabel');
  let sigUserChoice = sigChk.checked;
  sigChk.addEventListener('change', () => { sigUserChoice = sigChk.checked; });
  function syncSigCheckbox() {
    const has = emailSelect.selectedOptions[0]?.dataset.hasSignature === '1';
    sigChk.disabled = !has;
    sigChk.checked = has ? sigUserChoice : false;
    sigLbl.title = has ? '' : 'Selected sender has no signature configured (Connections → Email Senders)';
    sigLbl.style.opacity = has ? '' : '0.5';
  }
  emailSelect.addEventListener('change', syncSigCheckbox);
  syncSigCheckbox();
}

function initQuill() {
  quillEditor = new Quill('#otherEmailEditor', {
    theme: 'snow',
    placeholder: 'Compose email body...',
    modules: {
      toolbar: {
        container: [
          ['bold', 'italic', 'underline'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['link', 'image', 'clean']
        ],
        handlers: { image: otherQuillImageHandler }
      }
    }
  });

  // Click-to-resize images in Quill
  quillEditor.root.addEventListener('click', async (e) => {
    if (e.target.tagName !== 'IMG') return;
    const img = e.target;
    const current = img.getAttribute('width') || '';
    const { value: width, isConfirmed } = await Swal.fire({
      title: 'Resize Image',
      input: 'select',
      inputOptions: {
        '600': 'Full width (600px)',
        '400': 'Medium (400px)',
        '200': 'Small (200px)',
        '': 'Original size'
      },
      inputValue: current,
      showCancelButton: true,
      confirmButtonText: 'Apply'
    });
    if (!isConfirmed) return;
    if (width) { img.setAttribute('width', width); }
    else { img.removeAttribute('width'); }
    img.setAttribute('style', 'display:block; max-width:100%; height:auto; border:0; outline:none; text-decoration:none;');
  });
}


// ═══════════════════════════════════════════════════════════════════════════
// TOGGLES
// ═══════════════════════════════════════════════════════════════════════════

function setupToggles() {
  document.getElementById('chkOther').addEventListener('change', e => {
    document.getElementById('otherSection').style.display = e.target.checked ? '' : 'none';
  });

  // SMS From change → update MMS visibility in Other section
  document.getElementById('smsFrom').addEventListener('change', updateOtherMmsVisibility);
  updateOtherMmsVisibility();
}


// ═══════════════════════════════════════════════════════════════════════════
// COLLECT
// ═══════════════════════════════════════════════════════════════════════════

function getRecipients() {
  const list = [];
  if (document.getElementById('sendToPrimary').checked && primaryContact) {
    list.push({
      name: primaryContact.contact_name,
      fname: primaryContact.contact_fname,
      phone: stripPhone(document.getElementById('pcPhone')?.value || ''),
      email: document.getElementById('pcEmail')?.value || '',
      contact_id: primaryContact.contact_id,
    });
  }
  if (document.getElementById('sendToSecondary')?.checked && secondaryContact) {
    list.push({
      name: secondaryContact.contact_name,
      fname: secondaryContact.contact_fname,
      phone: stripPhone(document.getElementById('scPhone')?.value || ''),
      email: document.getElementById('scEmail')?.value || '',
      contact_id: secondaryContact.contact_id,
    });
  }
  return list;
}

function collectActions() {
  const actions = [];
  if (document.getElementById('chkPaymentOptions').checked) actions.push({ type: 'payment_options' });
  if (document.getElementById('chkOther').checked) {
    const isEmailMode = document.getElementById('otherModeToggle').checked;
    const otherAction = { type: 'other', mode: isEmailMode ? 'email' : 'sms' };
    if (!isEmailMode) {
      otherAction.sms_text = document.getElementById('otherSms').value.trim();
      if (otherMmsAttachmentUrl) otherAction.mms_attachment = otherMmsAttachmentUrl;
    } else {
      otherAction.email_subject = document.getElementById('otherEmailSubject').value.trim();
      otherAction.email_html = quillEditor ? quillEditor.root.innerHTML : '';
      otherAction.email_text = quillEditor ? quillEditor.getText().trim() : '';
      if (otherEmailAttachmentUrl) otherAction.email_attachment = otherEmailAttachmentUrl;
    }
    actions.push(otherAction);
  }
  return actions;
}


// ═══════════════════════════════════════════════════════════════════════════
// PREVIEW & SEND
// ═══════════════════════════════════════════════════════════════════════════

function setupButtons() {
  document.getElementById('previewBtn').addEventListener('click', preview);
  document.getElementById('sendBtn').addEventListener('click', send);
}

function preview() {
  const actions = collectActions();
  const recipients = getRecipients();
  if (actions.length === 0) return Swal.fire({ icon: 'warning', title: 'Nothing selected', timer: 2500 });

  const lines = [];

  for (const action of actions) {
    if (action.type === 'payment_options') {
      lines.push('── PAYMENT OPTIONS ──\n' + PAYMENT_OPTIONS_TEXT);
    }
    if (action.type === 'other') {
      if (action.mode === 'sms') {
        let otherPrev = '── OTHER (SMS) ──\n' + (action.sms_text || '(empty)');
        if (action.mms_attachment) otherPrev += '\n📎 MMS Image: ' + action.mms_attachment.split('/').pop().split('?')[0];
        lines.push(otherPrev);
      } else {
        let otherPrev = '── OTHER (EMAIL) ──\nSubject: ' + (action.email_subject || '(none)') + '\n' + (action.email_text || '(empty)');
        if (action.email_attachment) otherPrev += '\n📎 Attachment: ' + action.email_attachment.split('/').pop().split('?')[0];
        lines.push(otherPrev);
      }
    }
  }

  const smsOn = document.getElementById('methodSms').checked;
  const emailOn = document.getElementById('methodEmail').checked;
  lines.push('\n── RECIPIENTS ──');
  recipients.forEach(r => {
    lines.push(`${r.name}: ${smsOn ? formatPhone(r.phone) + ' (SMS)' : ''} ${emailOn ? r.email + ' (Email)' : ''}`);
  });
  lines.push(`\nSMS from: ${document.getElementById('smsFrom').selectedOptions[0]?.textContent || ''}`);
  lines.push(`Email from: ${document.getElementById('emailFrom').value || '(none selected)'}`);
  const _sigChk = document.getElementById('includeSignature');
  lines.push(`Signature: ${_sigChk.disabled ? 'n/a (sender has none)' : _sigChk.checked ? 'included' : 'off'}`);

  const previewArea = document.getElementById('previewArea');
  document.getElementById('previewContent').textContent = lines.join('\n\n');
  previewArea.style.display = 'block';
  previewArea.scrollIntoView({ behavior: 'smooth' });
}


/**
 * Attach the include-signature flag to an /internal/email/send payload.
 * Reads the checkbox at call time; disabled (sender has no signature) or
 * unchecked → payload untouched, so the request matches pre-feature traffic.
 */
function withSig(payload) {
  const chk = document.getElementById('includeSignature');
  if (chk && chk.checked && !chk.disabled) payload.signature = true;
  return payload;
}

async function send() {
  const actions = collectActions();
  const recipients = getRecipients();
  const smsOn = document.getElementById('methodSms').checked;
  const emailOn = document.getElementById('methodEmail').checked;
  const smsFrom = document.getElementById('smsFrom').value;
  const emailFrom = document.getElementById('emailFrom').value;

  if (actions.length === 0) return Swal.fire({ icon: 'warning', title: 'Nothing selected', timer: 2500 });
  if (recipients.length === 0) return Swal.fire({ icon: 'warning', title: 'No recipients', timer: 2500 });
  if (!smsOn && !emailOn) return Swal.fire({ icon: 'warning', title: 'No method selected', timer: 2500 });
  // emailFrom === '' means the "— Select sender —" placeholder is still
  // selected (user has no matching default). Refuse rather than let the
  // browser's silent first-option fallback pick a sender for them.
  if (emailOn && !emailFrom) return Swal.fire({ icon: 'warning', title: 'Select an email sender', text: 'Pick an address in the "Email from" dropdown.', timer: 3500 });

  const confirm = await Swal.fire({
    icon: 'question', title: 'Send messages?',
    text: `Send to ${recipients.length} contact(s) via ${[smsOn ? 'SMS' : '', emailOn ? 'Email' : ''].filter(Boolean).join(' + ')}?`,
    showCancelButton: true, confirmButtonText: 'Send',
  });
  if (!confirm.isConfirmed) return;

  Swal.fire({ title: 'Sending...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  const errors = [], successes = [];

  for (const action of actions) {
    try {
      // ── PAYMENT OPTIONS ──
      if (action.type === 'payment_options') {
        for (const r of recipients) {
          if (smsOn && r.phone) { await P.apiSend('/internal/sms/send', 'POST', { from: smsFrom, to: r.phone, message: PAYMENT_OPTIONS_TEXT }); successes.push(`Payment Options SMS → ${r.name}`); }
          if (emailOn && r.email) { await P.apiSend('/internal/email/send', 'POST', withSig({ from: emailFrom, to: r.email, subject: 'Payment Options', html: PAYMENT_OPTIONS_HTML, text: PAYMENT_OPTIONS_TEXT })); successes.push(`Payment Options Email → ${r.name}`); }
        }
      }

      // ── OTHER ──
      if (action.type === 'other') {
        for (const r of recipients) {
          // Per-recipient placeholder substitution. The Insert Video picker
          // emits {{contacts.contact_id}} as a literal (campaign mode) so
          // each recipient's URL tracks correctly to their own contact_id.
          // No server-side resolver runs on the 'other' send path; this is
          // intentional client-side substitution.
          const recipSmsText  = (action.sms_text  || '').replace(/\{\{contacts\.contact_id\}\}/g, r.contact_id);
          const recipEmailHtml = (action.email_html || '').replace(/\{\{contacts\.contact_id\}\}/g, r.contact_id);
          const recipEmailText = (action.email_text || '').replace(/\{\{contacts\.contact_id\}\}/g, r.contact_id);

          if (action.mode === 'sms' && smsOn && r.phone) {
            if (action.mms_attachment) {
              const smsOpt = document.getElementById('smsFrom').selectedOptions[0];
              if (smsOpt?.dataset.mmsCapable === '1') {
                await P.apiSend('/internal/mms/send', 'POST', {
                  from: smsFrom, to: r.phone, text: recipSmsText, attachment_url: action.mms_attachment
                });
                successes.push(`Other MMS → ${r.name}`);
              } else if (recipSmsText) {
                await P.apiSend('/internal/sms/send', 'POST', { from: smsFrom, to: r.phone, message: recipSmsText });
                successes.push(`Other SMS → ${r.name} (image skipped — not RC)`);
              }
            } else if (recipSmsText) {
              await P.apiSend('/internal/sms/send', 'POST', { from: smsFrom, to: r.phone, message: recipSmsText });
              successes.push(`Other SMS → ${r.name}`);
            }
          }
          if (action.mode === 'email' && emailOn && r.email && recipEmailHtml) {
            const emailPayload = {
              from: emailFrom, to: r.email,
              subject: action.email_subject || 'Message from 4LSG',
              html: recipEmailHtml, text: recipEmailText,
            };
            if (action.email_attachment) {
              const name = action.email_attachment.split('/').pop().split('?')[0] || 'attachment';
              emailPayload.attachment_urls = [{ url: action.email_attachment, name }];
            }
            await P.apiSend('/internal/email/send', 'POST', withSig(emailPayload));
            successes.push(`Other Email → ${r.name}`);
          }
        }
      }

    } catch (err) { errors.push(`${action.type}: ${err.message}`); }
  }

  Swal.close();
  if (errors.length === 0) {
    Swal.fire({ icon: 'success', title: 'Sent!', html: successes.map(s => `✅ ${s}`).join('<br>'), timer: 5000, timerProgressBar: true });
  } else {
    Swal.fire({ icon: 'warning', title: 'Sent with errors', html: successes.map(s => `✅ ${s}`).join('<br>') + '<br><br>' + errors.map(e => `❌ ${e}`).join('<br>') });
  }
}


// ═══════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════

function formatPhone(phone) {
  if (!phone) return '';
  const d = phone.toString().replace(/\D/g, '').slice(-10);
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return phone;
}

function stripPhone(phone) {
  return phone.replace(/\D/g, '').slice(-10);
}

function toggleOtherMode() {
  const isEmail = document.getElementById('otherModeToggle').checked;
  document.getElementById('otherSmsFields').style.display = isEmail ? 'none' : '';
  document.getElementById('otherEmailFields').style.display = isEmail ? '' : 'none';
  document.getElementById('otherToggleSmsLabel').style.fontWeight = isEmail ? 'normal' : 'bold';
  document.getElementById('otherToggleSmsLabel').style.color = isEmail ? 'var(--text-muted)' : 'var(--accent-2)';
  document.getElementById('otherToggleEmailLabel').style.fontWeight = isEmail ? 'bold' : 'normal';
  document.getElementById('otherToggleEmailLabel').style.color = isEmail ? 'var(--ok)' : 'var(--text-muted)';
}

function otherUpdateSubjectHint() {
  const len = document.getElementById('otherEmailSubject').value.length;
  const hint = document.getElementById('otherSubjectHint');
  if (len === 0) { hint.textContent = ''; return; }
  if (len <= 60) { hint.textContent = `${len}/150 — good length`; hint.style.color = 'green'; }
  else if (len <= 90) { hint.textContent = `${len}/150 — may truncate on mobile`; hint.style.color = 'orange'; }
  else { hint.textContent = `${len}/150 — high risk of truncation`; hint.style.color = 'red'; }
}

// ── Quill image handler ──

async function otherQuillImageHandler() {
  const url = await AssetPicker.pick({
    collection: 'comms-images',
    accept: 'image/png,image/jpeg,image/gif,image/webp',
    mimeFilter: 'image/',
    maxMB: 10,
    title: 'Insert Image',
    apiSend: P.apiSend
  });
  if (!url) return;
  const { value: width, isConfirmed } = await Swal.fire({
    title: 'Image Size',
    input: 'select',
    inputOptions: { '600': 'Full width (600px)', '400': 'Medium (400px)', '200': 'Small (200px)', '': 'Original size' },
    inputValue: '600', showCancelButton: true, confirmButtonText: 'Insert'
  });
  if (!isConfirmed) return;
  quillEditor.focus();
  const range = quillEditor.getSelection(true);
  const idx = range ? range.index : quillEditor.getLength();
  quillEditor.insertEmbed(idx, 'image', {
    src: url, width: width || undefined,
    style: 'display:block; max-width:100%; height:auto; border:0; outline:none; text-decoration:none;'
  });
  quillEditor.setSelection(idx + 1);
}

// ── MMS attachment (Other section) ──

async function otherAttachMmsImage() {
  const smsSelect = document.getElementById('smsFrom');
  const senderOpt = smsSelect.selectedOptions[0];
  if (senderOpt?.dataset.mmsCapable !== '1') {
    return Swal.fire('SMS Only', 'The selected phone line does not support MMS. Choose a RingCentral line.', 'warning');
  }
  const url = await AssetPicker.pick({
    collection: 'comms-images',
    accept: 'image/png,image/jpeg,image/gif,image/webp',
    mimeFilter: 'image/',
    maxMB: 5,
    title: 'Attach Image (MMS)',
    apiSend: P.apiSend
  });
  if (url) otherSetMmsAttachment(url);
}

function otherSetMmsAttachment(url) {
  otherMmsAttachmentUrl = url;
  document.getElementById('otherMmsPreviewImg').src = url;
  document.getElementById('otherMmsPreviewName').textContent = url.split('/').pop().split('?')[0] || 'image';
  document.getElementById('otherMmsPreview').style.display = 'inline-flex';
  Toast.fire({ icon: 'success', title: 'Image attached' });
}

function otherRemoveMmsAttachment() {
  otherMmsAttachmentUrl = null;
  document.getElementById('otherMmsPreviewImg').src = '';
  document.getElementById('otherMmsPreviewName').textContent = '';
  document.getElementById('otherMmsPreview').style.display = 'none';
}

function updateOtherMmsVisibility() {
  const smsSelect = document.getElementById('smsFrom');
  const senderOpt = smsSelect.selectedOptions[0];
  const mmsCapable = senderOpt?.dataset.mmsCapable === '1';
  document.getElementById('otherMmsSection').style.display = mmsCapable ? '' : 'none';
  if (!mmsCapable && otherMmsAttachmentUrl) otherRemoveMmsAttachment();
}

// ── Email attachment (Other section) ──

  const url = await AssetPicker.pick({

// ── Insert Video (YisraVideo picker) ──
//
// sendingform.html is multi-recipient (primary + secondary contact). We pass
// contactId: null so the picker emits {{contacts.contact_id}} as a literal
// placeholder, and the 'other' action send path substitutes per-recipient
// at send time (see actions.js, search "{{contacts.contact_id}}").

async function otherInsertVideoSms() {
  const smsSelect = document.getElementById('smsFrom');
  const senderOpt = smsSelect.selectedOptions[0];
  if (!senderOpt) {
    return Toast.fire({ icon: 'warning', title: 'Select an SMS sender first' });
  }
  const mmsCapable = senderOpt.dataset.mmsCapable === '1';
  const result = await YisraVideoInsert.openVideoPicker({
    contactId: null,        // multi-recipient → leave placeholder literal
    context: 'sms',
    mmsCapable,
  });
  if (!result) return;

  const ta = document.getElementById('otherSms');
  if (result.kind === 'sms-text') {
    sfInsertAtCursor(ta, result.text);
  } else if (result.kind === 'mms') {
    sfInsertAtCursor(ta, result.text);
    otherSetMmsAttachment(result.attachmentUrl);
  } else {
    console.warn('[otherInsertVideoSms] Unexpected result kind:', result.kind);
  }
  document.getElementById('otherSmsChars').textContent = ta.value.length + '/1000';
}

async function otherInsertVideoEmail() {
  if (!quillEditor) {
    return Toast.fire({ icon: 'warning', title: 'Editor not ready' });
  }
  const result = await YisraVideoInsert.openVideoPicker({
    contactId: null,        // multi-recipient → leave placeholder literal
    context: 'email',
    mmsCapable: false,
  });
  if (!result) return;
  if (result.kind !== 'html') {
    console.warn('[otherInsertVideoEmail] Unexpected result kind:', result.kind);
    return;
  }
  const sel = quillEditor.getSelection(true);
  const idx = sel ? sel.index : quillEditor.getLength();
  quillEditor.clipboard.dangerouslyPasteHTML(idx, result.html);
}

/**
 * Insert text at the textarea's current cursor position. Adds a leading space
 * if the preceding character isn't whitespace.
 */
function sfInsertAtCursor(textarea, text) {
  const start = textarea.selectionStart || 0;
  const end   = textarea.selectionEnd   || 0;
  const before = textarea.value.slice(0, start);
  const after  = textarea.value.slice(end);
  const sep = (before && !before.endsWith(' ') && !before.endsWith('\n')) ? ' ' : '';
  textarea.value = before + sep + text + after;
  const newPos = (before + sep + text).length;
  textarea.focus();
  textarea.setSelectionRange(newPos, newPos);
}
