<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes &amp; Lists</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Diagnostics ring buffer. Loaded BEFORE scripts.js so it also catches
       errors thrown by scripts.js itself. See public/js/diag.js. -->
  <script src="/js/diag.js"></script>
  <script src="/js/yc-sync.js"></script>
  <script src="/scripts.js"></script>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <style>
    /* Widget chrome (esign/caseWidget + automationsWidget idiom). */
    body { margin: 0; padding: 12px; background: #fff; }

    /* All classes prefixed .ck- for scoping — this file is iframed into
       case.html and the shell, both of which have their own global CSS. */

    .ck-wrap { max-width: 760px; margin: 0 auto; }

    .ck-empty {
      color: #64748b;
      font-size: 14px;
      padding: 18px 4px;
    }

    /* ── Kind filter (S2) ──
       Tri-state: All (default) · Notes · Lists. Deliberately styled to match
       .cx-scope in checklistsView.html — that page frames this one for the
       Mine and Unlinked scopes, so two differently-shaped segmented controls
       would otherwise stack on one screen. */
    .ck-kinds {
      display: inline-flex;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .ck-kinds button {
      background: #fff; border: none; padding: 5px 12px;
      font-size: 13px; cursor: pointer; color: #334155; font-family: inherit;
    }
    .ck-kinds button.active { background: #2563eb; color: #fff; }
    .ck-kinds button:not(.active):hover { background: #f1f5f9; }

    /* ── The card stack (S2) ──
       A GRID, not CSS `columns:`. `columns:` reflows reading order
       top-to-bottom per column, which would fight manual reordering if that is
       ever added, and can split one card across the column break.

       The card's own margin-bottom is GONE — `gap` owns inter-card spacing
       now, and keeping both would double it.

       The media query below evaluates against THIS IFRAME's viewport, not the
       window. The case tab measures ~835px in practice, and
       checklistsView.html frames this file inside an 860px .cx-wrap, so the
       900px breakpoint does NOT fire on either surface today — it activates
       only if a surface is ever widened. That is intended: do not try to
       detect the parent's width. */
    .ck-stack { display: grid; gap: 8px; }
    @media (min-width: 900px) {
      /* align-items:start so a two-line note does not stretch to the height of
         the 30-item list beside it. */
      .ck-stack { grid-template-columns: 1fr 1fr; align-items: start; }
    }

    /* ── One card ── */
    .ck-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
    }
    .ck-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }
    .ck-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid transparent;
    }
    .ck-title:hover { background: #f8fafc; border-color: #e2e8f0; }
    .ck-title-input {
      /* Must match .ck-title's font-size or the swap-to-edit jumps. */
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      padding: 2px 4px;
      border: 1px solid #2563eb;
      border-radius: 4px;
      font-family: inherit;
      min-width: 180px;
    }

    /* Tag is a SYSTEM field — rendered as a badge, never an input. The
       backend enforces this too (mayWriteTag: api_key/SU only), so a staff
       user editing the DOM gets a 403 rather than a corrupted invariant. */
    .ck-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: #1e40af;
      background: #dbeafe;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: default;
    }
    /* Superuser only — the badge becomes an edit affordance. Staff never see
       this class, and the backend rejects them anyway (mayWriteTag). */
    .ck-tag.ck-tag-su { cursor: pointer; }
    .ck-tag.ck-tag-su:hover { background: #bfdbfe; }
    .ck-tag.ck-tag-empty {
      color: #94a3b8; background: #f8fafc; border-color: #e2e8f0;
      font-weight: 600; text-transform: none;
    }

    .ck-progress {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
    }
    .ck-progress.done { color: #15803d; }

    .ck-icon-btn {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      color: #334155;
      line-height: 1;
    }
    .ck-icon-btn:hover { background: #f1f5f9; }
    .ck-icon-btn.danger:hover { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }

    /* ── Note card (S2) ──
       The distinguishing cue is a left border tint plus a warm background: a
       user must be able to tell a note from a list at a glance, before
       reading either. */
    .ck-card.ck-note {
      border-left: 3px solid #f59e0b;
      background: #fffdf7;
    }
    .ck-card.ck-note .ck-card-head { border-bottom-color: #fdf0d5; }

    /* ── Native (pinned) note card (S5) ──
       Synthesized from a column on the ENTITY (cases.case_notes and friends),
       not from a checklists row. Deliberately NOT the note amber: a native
       card has no delete, no tag and no Done pill, and someone hunting for the
       trash can must be able to see before they hunt that this card is a
       different animal. Three classes, so it outranks .ck-card.ck-note. */
    .ck-card.ck-note.ck-native {
      border-left-color: #6366f1;
      background: #f8f9ff;
    }
    .ck-card.ck-native .ck-card-head { border-bottom-color: #e0e7ff; }
    .ck-pin { color: #6366f1; font-size: 12px; }
    /* Title comes from the adapter, not the database — kill the rename
       affordance rather than leaving a hover state that does nothing. */
    .ck-title.ck-title-fixed { cursor: default; }
    .ck-title.ck-title-fixed:hover { background: transparent; border-color: transparent; }
    /* Occupies the slot .ck-progress / .ck-done hold on the other kinds, and
       carries the explanation for everything this card is missing. */
    .ck-native-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: #4338ca;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: default;
      white-space: nowrap;
    }

    /* ── Foreign (contact-scoped) cards on a case board (W3) ──
       A card that belongs to a CONTACT related to this case, not to the case.
       TEAL — the third cue after S2's amber (a note) and S5's indigo (a native
       pinned field), and it has to outrank both: a card can be foreign AND a
       note AND native at once, and "this is not this case's" is the fact that
       matters most when deciding whether to edit it.

       SPECIFICITY, deliberately explicit. `.ck-card.ck-note.ck-native` is three
       classes, so a two-class `.ck-card.ck-foreign` would lose to it on a
       foreign native. Each combination is therefore listed at its own weight,
       and the whole block sits AFTER the note and native rules so an equal-
       weight tie also resolves this way. */
    .ck-card.ck-foreign,
    .ck-card.ck-note.ck-foreign,
    .ck-card.ck-note.ck-native.ck-foreign {
      border-left: 3px solid #0d9488;
      background: #f4fefc;
    }
    .ck-card.ck-foreign .ck-card-head { border-bottom-color: #ccfbf1; }

    /* The group heading. One per related contact, above that contact's cards. */
    .ck-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0 8px;
      padding: 7px 10px;
      border-left: 3px solid #0d9488;
      background: #f0fdfa;
      border-radius: 0 6px 6px 0;
    }
    .ck-group-name {
      font-size: 14px; font-weight: 700; color: #0f766e;
      text-decoration: none; cursor: pointer;
    }
    .ck-group-name:hover { text-decoration: underline; }
    .ck-group-rel { font-size: 12px; color: #0f766e; opacity: .75; }
    /* The multi-case disclosure. AMBER, not teal — it is a warning about the
       blast radius of an edit, not more scope chrome. */
    .ck-group-warn {
      margin-left: auto;
      font-size: 11px; font-weight: 700; letter-spacing: .02em;
      color: #b45309; background: #fffbeb;
      border: 1px solid #fcd34d; border-radius: 4px;
      padding: 2px 7px; white-space: nowrap; cursor: help;
    }
    .ck-group-warn i { margin-right: 4px; }

    /* Label over the case's OWN cards. Rendered only when at least one contact
       group is also on screen — on a board with no groups there is nothing to
       tell it apart from, and a lone "This case" heading would be noise. */
    .ck-own-head {
      font-size: 12px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: #64748b;
      margin: 2px 0 8px; padding: 0 2px;
    }

    /* Degraded states. A contact group that could not be loaded says so in
       place rather than vanishing — the case's own board is unaffected either
       way. */
    .ck-group-note {
      font-size: 13px; color: #b45309;
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px;
      padding: 7px 10px; margin-bottom: 8px;
    }

    /* ALWAYS-EDITABLE, no click-to-edit swap — the idiom case.html
       (#overviewCaseNotes) and tabLeads.html already use for notes fields.
       resize:none because the height is driven by resizeTextarea(). */
    .ck-note-body {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 6px 10px 10px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.45;
      color: #0f172a;
      resize: none;
      /* ~3 rows floor; 300px ceiling then scroll, so one long note cannot
         dominate the column. The 300 MUST agree with resizeTextarea() in
         scripts.js, which caps scrollHeight at the same number. */
      min-height: 58px;
      max-height: 300px;
      overflow-y: auto;
    }
    .ck-note-body:focus { outline: none; background: #fff; }
    .ck-note-body::placeholder { color: #94a3b8; }
    /* Only a NATIVE card whose entity read failed (S5) — editing it would
       save an empty string over whatever the column actually holds. */
    .ck-note-body:disabled { background: #f8fafc; color: #64748b; cursor: not-allowed; }

    /* Manual completion for a note. Labelled so it does not read as an item
       checkbox — a note has no items, and its status is set by hand (S1). */
    .ck-done {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: #475569;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 2px 9px 2px 6px;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    .ck-done input { margin: 0; cursor: pointer; }
    .ck-done.done { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }

    /* Save state for a note body. Empty by default and collapsed, so a saved
       note costs no vertical space. */
    .ck-saveflag { font-size: 11px; color: #94a3b8; padding: 0 10px 8px; }
    .ck-saveflag:empty { display: none; }
    .ck-saveflag.err { color: #b91c1c; font-weight: 600; }

    /* Character counter (S5). Stays EMPTY — and so collapsed, reserving no
       space — while a body is shorter than COUNT_SHOW_AT. See the counter
       visibility block near NOTE_MAX_CHARS for the threshold options. */
    .ck-count {
      font-size: 11px; color: #94a3b8;
      padding: 0 10px 8px; text-align: right;
    }
    .ck-count:empty { display: none; }
    .ck-count.over { color: #b91c1c; font-weight: 600; }

    /* ── Items ── */
    .ck-items { padding: 4px 10px 2px; }
    .ck-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #f8fafc;
    }
    .ck-row:last-child { border-bottom: none; }
    .ck-box {
      transform: scale(1.25);
      margin-top: 3px;
      cursor: pointer;
      flex: none;
    }
    .ck-name {
      flex: 1;
      font-size: 14px;
      color: #0f172a;
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid transparent;
      word-break: break-word;
    }
    .ck-name:hover { background: #f8fafc; border-color: #e2e8f0; }
    .ck-row.complete .ck-name { text-decoration: line-through; color: #94a3b8; }
    .ck-name-input {
      flex: 1;
      /* Must match .ck-name or the swap-to-edit jumps. */
      font-size: 14px;
      padding: 2px 4px;
      border: 1px solid #2563eb;
      border-radius: 4px;
      font-family: inherit;
    }
    .ck-row-del {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      line-height: 1;
      flex: none;
    }
    .ck-row:hover .ck-row-del { color: #94a3b8; }
    .ck-row-del:hover { color: #b91c1c; }

    /* ── Add-item row: an always-present input, not a prompt() ── */
    .ck-add {
      display: flex;
      gap: 8px;
      padding: 6px 10px 10px;
    }
    .ck-add input {
      flex: 1;
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
    }
    .ck-add input:focus { outline: none; border-color: #2563eb; }

    .ck-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .ck-btn:hover { background: #1d4ed8; }
    .ck-btn:disabled { background: #cbd5e1; cursor: default; }
    /* Secondary action in the footer — New Note sits beside New List and
       should not compete with it for the primary affordance. */
    .ck-btn.ck-btn-alt {
      background: #fff; color: #b45309; border: 1px solid #fcd34d;
    }
    .ck-btn.ck-btn-alt:hover { background: #fffbeb; }

    /* ── New-card footer ── */
    .ck-newlist {
      display: flex;
      gap: 8px;
      padding: 12px 0 4px;
      border-top: 1px solid #e2e8f0;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .ck-newlist input {
      flex: 1;
      min-width: 140px;
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
    }
    .ck-newlist input:focus { outline: none; border-color: #2563eb; }

    .ck-loading { color: #64748b; font-size: 14px; padding: 18px 4px; }
    .ck-error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="ck-wrap">
    <div id="ckBody"><div class="ck-loading">Loading…</div></div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   checklistView.html — stacked notes & lists surface.

   MODES (from the query string):
     ?id=123                          one card
     ?link_type=case&link=rIxpyvYG    every card on that entity
     ?link_type=user&link=me          the caller's personal cards
     (no params) or ?unlinked=1       cards with no link

   `link` is the column name and the API's param name — NOT `link_id`.

   KINDS (S2). Every row is a 'checklist' (title + checkitems, status DERIVED
   from the items) or a 'note' (title + freeform `body`, never any items,
   status MANUAL). One table, one route, one board — see the file header of
   routes/api.checklists.js, which is the contract this page consumes.

   Two consequences run through everything below:
     - Branch on `cl.kind`, NEVER on a zero item count. A note has zero items
       and so does an empty checklist; the old `items.length ? … : 'empty'`
       badge cannot tell them apart.
     - Note bodies are PLAIN TEXT. `.value` on a <textarea>, never innerHTML.
       There is no HTML sanitizer anywhere in this repo, and a body is an
       obvious future sink for machine-written content (form submissions, AI
       extraction).

   TRANSPORT: window.top.apiSend, NOT P.apiSend. When this page is iframed
   into case.html, scripts.js's `P` is window.parent === case.html, whose own
   apiSend relay may not have run yet. window.top is always the index.html
   shell, which owns the JWT. There is no standalone mode: the shell is the
   only thing on this origin that can mint a token, so opening this file
   directly leaves it with no way to authenticate.

   The tag is rendered as a read-only badge. Titles are staff-editable and
   nothing keys off them (identity is tag='docs_needed'); tags are machine
   fields and the backend 403s a non-SU write, so the UI just agrees.

   NATIVE FIELDS (S5). Several entities carry a single freeform notes column
   that predates this page — cases.case_notes, contacts.contact_notes,
   appts.appt_note, and (W2) events.event_note. Now that an entity can also
   hold N proper notes, staff would otherwise have two unrelated places to
   look, and appt_note was invisible before this.

   cases.341_notes is deliberately NOT here — see the note above NATIVE_NOTES.

   NATIVE_NOTES below synthesizes a PINNED VIRTUAL CARD per column. It is a
   VIEW, not a migration: the column stays the one and only store, the card
   reads and writes it directly, and there is nothing to sync and nothing to
   drift. No route, no table, no column was added for this. cases.case_notes in
   particular cannot move — caseService.searchCases, report definition 10, and
   three published form templates all read it.

   A native card has no checklists row, so it has no id, no tag, no items and
   no status. Everything keyed by checklist id must therefore tolerate one:
   see draftKeyOf().

   RELATED CONTACTS (W3). A CASE board additionally shows the cards of every
   contact linked to it through case_relate, in a separate labelled group BELOW
   everything case-scoped — never interleaved, never sorted in. This follows the
   log, whose case view already expands to each related contact, and it costs
   almost nothing: 1,065 of 1,077 cases have exactly one contact (11 have two,
   1 has three).

   ONE ASYMMETRY WITH THE LOG drives the whole design. The log is read-only;
   these cards are editable. A note shown here belongs to the CONTACT, and 47
   contacts are attached to more than one case — so editing one from case A
   silently changes what case B shows. Expansion is free; the EDIT TARGET must
   never be ambiguous. Hence, in order of importance:
     - a distinct teal border on every foreign card, outranking note and native;
     - a heading naming the contact and the relation, which opens that contact;
     - an "also on N other cases" badge on the heading when the edit reaches
       further than this case;
     - the New List / New Note footer sits ABOVE the groups and still creates
       on the CASE, always. It gained no target picker. To make a note on a
       contact, open the contact (its own Notes & Lists tab, W1).

   The reverse direction — a case's notes on the CONTACT board — is NOT built.

   KNOWN WART — NOT FIXED HERE. On the case tab, case_notes is now editable in
   TWO places: the Overview tab's #overviewCaseNotes textarea (case.html) and
   the pinned card here. Both write the same column, last write wins, and the
   other surface shows a stale value until its tab reloads. They are different
   tabs, so a collision needs one person editing both in one sitting — low
   risk, and making Overview read-only is a case.html change outside this
   slice. Documented rather than fixed, deliberately.
   ═══════════════════════════════════════════════════════════════════ */

const params = new URLSearchParams(location.search);
const P_ID        = params.get('id');
const P_LINK_TYPE = params.get('link_type') || null;
const P_LINK      = params.get('link') || null;
const P_UNLINKED  = params.get('unlinked') === '1';

const MODE = P_ID ? 'single'
           : (P_LINK_TYPE && P_LINK && !P_UNLINKED) ? 'entity'
           : 'unlinked';

let lists   = [];
let busy    = false;   // suppresses re-entrant writes from double-Enter

/* W3 — related-contact groups on a CASE board, in the order they are rendered.
   `lists` holds their cards too (see sortLists / render); this holds only the
   per-group LABEL data: id, name, relate types, other-case count, failure.
   Empty on every other mode and link_type. */
let contactGroups = [];
/* Set when GET /api/cases/:id/contacts itself failed. The case's own board
   still renders; the groups are replaced by one line saying why. */
let groupsError = null;

/* Tri-state kind filter: '' = both (the merged board, and the default),
   'note', or 'checklist'. '' is sent as NO `kind` key at all — never
   `kind=''`, which would put a bare `kind=` on the wire. */
let kindFilter = '';

// ── Note body drafts ──────────────────────────────────────────────
/* THE RE-RENDER HAZARD. render() rebuilds the whole DOM from scratch, and
   every mutation handler in this file calls it after committing. A <textarea>
   cannot survive that: the element being typed into is destroyed and the
   caret is lost mid-word. (The add-item input already works around this with
   refocusAddInput, which re-finds the rebuilt element by card index — a
   focus target is recoverable, a caret inside free text is not.)

   So the body-save path NEVER calls render() on success. It writes the saved
   value into cl.body in memory and stops there.

   This map is the second half of that defence: it holds per-card draft state
   OUTSIDE the DOM, so a render() triggered by something else (a title edit on
   another card, an item toggle, a failed status flip) restores what the user
   had typed instead of reverting it. It is a safety net, not a substitute —
   a render() still costs the caret, which is why the save path avoids one.

   KEYED BY draftKeyOf(cl), NOT by cl.id — a native card (S5) has no id. See
   that function for why the two key spaces cannot collide.

     draft     the textarea's current text, or null when clean
     dirty     draft differs from the STORED value (cl.body)
     timer     pending debounced autosave
     inflight  a PATCH is in the air; a second save reschedules rather than racing
     flag      the .ck-saveflag element from the last render (may be detached —
               writing to a detached node is harmless, and the next render
               re-points it)
     count     the .ck-count element, same re-pointing contract as `flag`
     countText what updateCount() last computed, restored on the next render */
const bodyDrafts = new Map();
const BODY_AUTOSAVE_MS = 2000;

/* MUST STAY IN SYNC with NOTE_MAX_CHARS in lib/noteLimits.js — the browser
   cannot require a Node module, so the number is duplicated. The SERVER is the
   guarantee (checklists, cases, contacts and appts all reject past it with a
   400); this copy exists only so the user is stopped before the 400, the same
   way .ck-note-body's max-height duplicates resizeTextarea()'s 300.
   If you change one, change the other. */
const NOTE_MAX_CHARS = 10000;
/* ── Counter visibility ───────────────────────────────────────────
   How much text a body needs before the "n / 10,000" counter appears under
   it. updateCount() shows it when `len >= COUNT_SHOW_AT` and blanks it
   otherwise; .ck-count:empty collapses the blank one, so a hidden counter
   reserves no space.

   UNCOMMENT EXACTLY ONE. Two live `const` lines is a SyntaxError that takes
   the whole widget down at parse time — loud, which is the point.

   Sizes for reference, measured 2026-08-20:
     case_notes     avg 63, max 3,558   ← the longest real note text in the app
     contact_notes  max 141
     appt_note      max 1,000           (the old varchar ceiling, since widened)
   Nothing in production is within 6,000 characters of the limit, so anything
   above ~4,000 here means the counter is effectively never seen today. */

// const COUNT_SHOW_AT = 0;                                 // ALWAYS. Pins "0 / 10,000" under every
                                                            // empty note too — including Case Notes,
                                                            // which renders on every case.
const COUNT_SHOW_AT  = 1;                                   // ANY TEXT AT ALL. Empty cards stay clean;
                                                            // the limit shows the moment you type.
// const COUNT_SHOW_AT = Math.floor(NOTE_MAX_CHARS * 0.5);  // 5,000. Silent for every real note today,
                                                            // but well before anyone is in trouble.
// const COUNT_SHOW_AT = Math.floor(NOTE_MAX_CHARS * 0.9);  // 9,000. Only near the ceiling. Original
                                                            // S5 behaviour: 1,000 chars of runway.
/* ─────────────────────────────────────────────────────────────── */

// ── Native notes adapter (S5) ─────────────────────────────────────
/* Freeform notes columns that live on the ENTITY, surfaced here as pinned
   virtual cards. See the NATIVE FIELDS block in the file header.

   THIS IS THE WHOLE CONFIGURATION. Adding another native field is a one-line
   edit here and nothing else — unless it is on an entity not already listed,
   which also needs a NATIVE_ENVELOPE row for that endpoint's response shape.
   There is no per-field length: lib/noteLimits.js governs all of them with one
   number.

   WHY cases.341_notes IS NOT HERE. S5 originally pinned it. It was removed
   2026-08-20 once the reason for its emptiness became clear: the column has
   never had a write path. Form template 5 (form_key='341_notes', "341 Meeting
   Notes", published, rendered by case.html's 341 tab) maps its fields to
   341_status / docs_missing / docs_due / case_trustee / case_number_full /
   case_id — NOT to cases.341_notes. So 0 of 1,077 was never staff declining to
   fill it in; nothing in the app could write it. Pinning a card on all 1,077
   cases to expose a dead column — when only a subset of cases ever hold a 341
   meeting, and case.html already has a 341 tab — was chrome for a third place
   to look.

   The column still exists (it is in cases.js's automation allowlist and in
   noteLimits.NOTE_COLUMNS, so a write would still be length-checked). Do not
   re-add it here. If 341 notes are wanted, the right shape is the docs_needed
   pattern: have the 341 form upsert a TAGGED NOTE on the case, so the card
   exists only where there is a 341 to write about. */
const NATIVE_NOTES = {
  case: [
    { field: 'case_notes', title: 'Case Notes', endpoint: '/api/cases' },
  ],
  contact: [
    { field: 'contact_notes', title: 'Notes', endpoint: '/api/contacts' },
  ],
  appt: [
    { field: 'appt_note', title: 'Note', endpoint: '/api/appts' },
  ],
  /* events.event_note (W2). DIVERGES from the four above in one respect: it is
     NULLABLE, where case_notes / contact_notes / appt_note are all NOT NULL.
     Nothing special-cases it — saveBody() sends '' on a clear for every native
     field, and '' is a legitimate value in a nullable column too.
     Writing NULL here instead would buy nothing and would fork the save path.

     The card attaches to the EVENT, not to whatever the event links upward to.
     113 of 151 events link by `event_link_type='case_number'` — a free-text
     docket, not a foreign key — so an event-scoped note is the only
     unambiguous place to hang this. */
  event: [
    { field: 'event_note', title: 'Note', endpoint: '/api/events' },
  ],
};

/* The GET-one endpoints wrap their row in different keys, so the adapter
   cannot read them uniformly:
     GET /api/cases/:id     -> { case:    {...} }   caseService.getCase
     GET /api/contacts/:id  -> { contact: {...} }   contactService.getContact
     GET /api/appts/:id     -> { data:    {...} }   inline in routes/api.appts.js
     GET /api/events/:id    -> { data:    {...} }   routes/api.events.js
   A missing entry means "the response IS the row". */
const NATIVE_ENVELOPE = {
  '/api/cases':    'case',
  '/api/contacts': 'contact',
  '/api/appts':    'data',
  '/api/events':   'data',
};

/* Sync-bus address TYPE per native endpoint — the other half of NATIVE_ENVELOPE.
   Kept as its own table rather than reusing `cl.native.entityType`: the address
   space is a property of the ENDPOINT (what the bus calls the thing), while
   entityType is a checklists link_type. They agree today; a divergence should
   be a visible edit here, not a silent mismatch. */
const TYPE_BY_ENDPOINT = {
  '/api/cases':    'case',
  '/api/contacts': 'contact',
  '/api/appts':    'appt',
  '/api/events':   'event',
};

/* Live YC.on unsubscribe functions, one per native card. load() rebuilds every
   card object from scratch, so these MUST be dropped there or each reload
   leaves another generation of handlers closed over dead cards. */
let busUnsubs = [];

function clearBusSubs() {
  for (const off of busUnsubs) { try { off(); } catch (_) { /* noop */ } }
  busUnsubs = [];
}

function unwrapEntity(endpoint, res) {
  const key = NATIVE_ENVELOPE[endpoint];
  const row = key ? (res && res[key]) : res;
  return (row && typeof row === 'object') ? row : null;
}

/* The native fields in play for one link_type. Empty for every mode and
   link_type that has none — `single`, `unlinked` and link_type='user' must
   behave exactly as they did before S5.

   TAKES A PARAMETER since W3: a case board also builds the native cards of the
   CONTACTS related to it, which is a different link_type from this page's own.
   Called bare it still means "this page's entity", as before. */
function nativeSpecs(linkType) {
  if (MODE !== 'entity') return [];
  return NATIVE_NOTES[linkType || P_LINK_TYPE] || [];
}

function api(...args) {
  try {
    if (window.top && typeof window.top.apiSend === 'function') {
      return window.top.apiSend.apply(window.top, args);
    }
  } catch (_) { /* cross-origin — cannot happen same-origin, but don't throw */ }
  return Promise.reject(new Error('apiSend unavailable — open this page inside YisraCase.'));
}

/* `link=me` is resolved server-side for READS (the GET route accepts it), but
   a write must store a real id — otherwise the literal string 'me' lands in
   the column. The shell already has the answer. */
function myUserId() {
  try { return window.top.firmData?.currentUser?.user ?? null; } catch (_) { return null; }
}

/* Mirrors lib/auth.superuser.isSuperuser, which is the server's single source
   of truth: JWT + user_auth === 'authorized - SU'. api.firmData's USER_STRIP
   only removes password fields, so user_auth reaches the client intact.
   This gates the UI ONLY — mayWriteTag() on the server is the real check, and
   a staff member editing the DOM gets a 403, not a corrupted invariant. */
function isSU() {
  try { return window.top.firmData?.currentUser?.user_auth === 'authorized - SU'; }
  catch (_) { return false; }
}

/* The scope a newly-created card should be attached to. In `single` mode there
   is no scope — the footer is hidden. */
function newListScope() {
  if (MODE === 'entity') {
    const link = (P_LINK === 'me') ? myUserId() : P_LINK;
    return { link_type: P_LINK_TYPE, link };
  }
  return { link_type: null, link: null };
}

function toast(icon, title, text) {
  try { Toast.fire({ icon, title, text }); }
  catch (_) { console.error(title, text); }
}

/* Confirmation dialogs render through the SHELL's Swal, not this iframe's.
   This page is nested two deep (index.html > case.html > here), and a modal
   fired from inside the iframe is clipped to the iframe's box — it centres
   itself in a panel, not on screen. window.top.Swal always exists (the shell
   loads it) and overlays the whole app.
   Falls back to the local Swal, then to confirm(), so the page still works if
   it is ever opened somewhere without a shell. */
function swal() {
  try { if (window.top && window.top.Swal) return window.top.Swal; } catch (_) {}
  return (typeof Swal !== 'undefined') ? Swal : null;
}

/**
 * @param {object} o  title, html, confirmText, danger
 * @returns {Promise<boolean>}
 */
async function confirmDialog(o) {
  const S = swal();
  if (!S) {
    // Last-resort fallback — strip tags so the plain dialog stays readable.
    const plain = String(o.html || '').replace(/<br\s*\/?>/gi, '\n')
                                      .replace(/<[^>]+>/g, '');
    return window.confirm((o.title ? o.title + '\n\n' : '') + plain);
  }
  const r = await S.fire({
    title: o.title,
    html: o.html,
    icon: o.danger ? 'warning' : 'question',
    showCancelButton: true,
    confirmButtonText: o.confirmText || 'OK',
    cancelButtonText: 'Cancel',
    confirmButtonColor: o.danger ? '#b91c1c' : '#2563eb',
    cancelButtonColor: '#64748b',
    reverseButtons: true,
    focusCancel: !!o.danger,
    // Cross-frame: this dialog lives in the shell but the thing that should
    // hold focus afterwards (the tag input) lives in THIS iframe. Swal's
    // default would hand focus back to the shell document and blur it away.
    returnFocus: false,
    // Swal mutates the host body's height by default; suppress it so opening
    // a dialog can't jog the shell's scroll position.
    heightAuto: false,
  });
  return !!r.isConfirmed;
}

/* Escapes values interpolated into Swal `html`. Titles, item names and note
   bodies are free text typed by staff — without this, a title containing
   markup would render as markup inside the dialog. */
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* Surfaces the API's own message. The route layer returns real ones —
   409 on a tag collision, 403 on someone else's personal list — and they are
   more useful than anything this page could invent. */
function apiError(err, fallback) {
  toast('error', fallback, err?.message || '');
}

// ── Load ──────────────────────────────────────────────────────────
async function load() {
  // Every card object is about to be replaced, so last load's bus handlers —
  // which close over the OLD card objects — have to go first. Dropped before
  // flushBodies() so a PATCH it fires cannot echo back into a stale handler.
  clearBusSubs();
  // Any unsaved note body goes to the server BEFORE the refetch, or the GET
  // races the PATCH and the response overwrites cl.body with the stale value.
  // Reached on tab re-entry (reloadChecklists) and on every filter change.
  await flushBodies();
  try {
    if (MODE === 'single') {
      const one = await api('/checklists/' + encodeURIComponent(P_ID), 'GET');
      lists = one ? [one] : [];
    } else {
      // Build the query object with DEFINED keys only: apiSend does
      // `new URLSearchParams(payload)`, which stringifies undefined to the
      // literal "undefined" and would silently filter on garbage.
      const q = { include: 'items', order: 'created_asc' };
      if (MODE === 'entity') { q.link_type = P_LINK_TYPE; q.link = P_LINK; }
      else                   { q.unlinked = '1'; }
      // Omitted means BOTH kinds, which is what the All position wants. The
      // route treats '' as absent too, but sending it would still put a bare
      // `kind=` on the wire.
      if (kindFilter) q.kind = kindFilter;
      // IN PARALLEL, not in sequence — this is the case tab's first paint, and
      // the native read is a second round trip that must not be stacked on top
      // of the first. Neither loadNativeCards() nor loadContactGroups() ever
      // rejects (see their comments), so Promise.all can only fail on the
      // /checklists leg, which is the one the catch below is already about.
      //
      // W3's leg is unavoidably two deep — the per-contact fan-out cannot start
      // until GET /api/cases/:id/contacts has said who the contacts are — but
      // it STARTS here rather than after the other two, and the fan-out itself
      // is parallel across contacts. Flattening it would need a route that
      // returned contacts and their cards together, which this slice may not
      // add.
      const [data, natives, foreign] = await Promise.all([
        api('/checklists', 'GET', q),
        loadNativeCards(),
        loadContactGroups(),
      ]);
      contactGroups = foreign.groups;
      groupsError   = foreign.error;
      lists = natives.concat(data?.checklists || [], foreign.cards);
    }
    // sortLists() ranks by owner FIRST, so it has to see the groups.
    sortLists();
    // Drop settled draft entries; anything still dirty (a save that failed)
    // is kept so the user's text survives the reload.
    for (const [key, d] of bodyDrafts) {
      if (!d.dirty && !d.inflight) bodyDrafts.delete(key);
    }
    render();
  } catch (err) {
    E('ckBody').innerHTML = '';
    const box = document.createElement('div');
    box.className = 'ck-error';
    box.textContent = 'Could not load notes & lists: ' + (err?.message || 'unknown error');
    E('ckBody').appendChild(box);
  }
}

/* Card order, in one place because TWO callers need the same rule: load()
   after a fetch, and editTag() after a tag change (which re-pins).

   Native cards (S5) pin above EVERYTHING — they are the fields staff have
   always looked at, and burying them under a working list would defeat the
   point. Tagged rows then pin above untagged ones, so on a case Docs Needed
   still sits above whatever lists staff have added.

   Array.sort is stable (ES2019+), so within each band the server's
   created_asc order — and the adapter's declaration order for natives — is
   preserved.

   W3 adds an OUTER key, ranked ahead of both: the owner. The case's own cards
   come first, then each contact group in contactGroups order. This is what
   makes every owner's cards one CONTIGUOUS RUN in `lists`, which render()'s
   single-cursor walk depends on — and through that, so does refocusAddInput.
   Pinning and tagging then apply WITHIN a group, so a contact's native Notes
   card heads its own group rather than jumping to the top of the board. */
function ownerRank(cl) {
  if (!cl.ownerKey) return 0;
  const i = contactGroups.findIndex(g => g.key === cl.ownerKey);
  // An unknown owner sorts last rather than colliding with 0 — it would
  // otherwise be dropped into the case's own section, which is precisely the
  // ambiguity this whole slice exists to avoid.
  return i < 0 ? contactGroups.length + 1 : i + 1;
}

function sortLists() {
  lists.sort((a, b) =>
       ownerRank(a) - ownerRank(b)
    || (b.native ? 1 : 0) - (a.native ? 1 : 0)
    || (b.tag    ? 1 : 0) - (a.tag    ? 1 : 0));
}

function groupFor(key) {
  return contactGroups.find(g => g.key === key) || null;
}

/**
 * Build the pinned virtual cards for this entity (S5).
 *
 * NEVER REJECTS. A native field is a nice-to-have pinned on top of the real
 * board; a case with an unreachable /api/cases must still show its checklists.
 * So a failed entity read degrades to `unavailable` cards — rendered, locked,
 * and flagged — rather than propagating and blanking the list.
 *
 * The notes route knows nothing about these columns and S5 adds no route, so
 * the values come from the entity's own GET. One request per DISTINCT
 * endpoint, not per field: a case declares two native fields and they arrive
 * on the same row.
 *
 * Shaped to need the smallest possible branch in renderCard():
 *   status: null   there is no status column to fake — no Done pill
 *   tag:    null   there is no tag column — no badge
 *   items:  []     a note never has items
 *   id:     null   there is no checklists row; see draftKeyOf()
 */
async function loadNativeCards() {
  const specs = nativeSpecs();
  if (!specs.length) return [];
  // The Lists position of the kind filter hides notes, and a native card IS a
  // note. The filter is applied SERVER-SIDE on /checklists and cannot know
  // about natives, so it is applied here instead. Dropping them from `lists`
  // (rather than hiding them in CSS) is what keeps refocusAddInput's
  // positional index honest — see its comment.
  if (kindFilter === 'checklist') return [];

  const rows = await fetchNativeRows(specs, P_LINK);
  return buildNativeCards(specs, rows, P_LINK_TYPE, P_LINK, null);
}

/**
 * Read the entity rows a set of native specs needs. ONE request per DISTINCT
 * endpoint, never one per field — a case declares two native fields and they
 * arrive on the same row.
 *
 * NEVER REJECTS, for the reason in loadNativeCards' docblock. A failed read
 * lands as `row: null`, which becomes an `unavailable` card downstream.
 *
 * Returns endpoint -> { res, row }. `res` is the RAW response and `row` is it
 * unwrapped: W3 needs both, because the multi-case count rides in a SIBLING
 * key (`cases`) that unwrapEntity deliberately drops on the floor.
 *
 * @param {object[]} specs     NATIVE_NOTES entries
 * @param {string}   entityId  the id to read
 * @param {object=}  query     extra GET params, e.g. { include: 'cases' }
 */
async function fetchNativeRows(specs, entityId, query) {
  const endpoints = [...new Set(specs.map(s => s.endpoint))];
  const out = new Map();
  await Promise.all(endpoints.map(async (ep) => {
    try {
      // `query || null` keeps the no-query call byte-identical to what S5 sent:
      // apiSend only appends a `?` when the payload is non-null.
      const res = await api(ep + '/' + encodeURIComponent(entityId), 'GET', query || null);
      out.set(ep, { res, row: unwrapEntity(ep, res) });
    } catch (err) {
      // Deliberately swallowed. Surfaced on the card itself, not as a toast:
      // a toast on every tab entry for a field the user may not even be
      // looking at is worse than a locked card that says why.
      console.error('checklistView: native notes fetch failed for ' + ep, err);
      out.set(ep, { res: null, row: null });
    }
  }));
  return out;
}

/**
 * Turn fetched rows into pinned virtual cards.
 *
 * @param {Map} rows       from fetchNativeRows
 * @param {string} linkType   the entity's link_type — 'case', 'contact', …
 * @param {string} ownerKey   null for this page's own entity; 'contact:<id>'
 *                            for a related contact's card (W3)
 */
function buildNativeCards(specs, rows, linkType, entityId, ownerKey) {
  return specs.map(s => {
    const got = rows.get(s.endpoint);
    const row = got ? got.row : null;
    const cl = {
      id: null,
      kind: 'note',
      title: s.title,
      // `?? ''` guards a response that omits the key AND a real NULL. Four of
      // the five columns are NOT NULL and can only hit the first case;
      // events.event_note is nullable and hits the second (42 of 151 rows).
      body: row ? (row[s.field] ?? '') : '',
      status: null,
      tag: null,
      items: [],
      ownerKey: ownerKey || null,
      native: {
        field:       s.field,
        endpoint:    s.endpoint,
        // W3. Part of the bodyDrafts key — two contacts on one case both
        // declare contact_notes, and without the entity in the key they would
        // share one draft, one save flag and one save target. See draftKeyOf.
        entityType:  linkType,
        entityId,
        unavailable: !row,
      },
    };
    subscribeNativeCard(cl);
    return cl;
  });
}

/**
 * Keep one native card in step with the rest of the app.
 *
 * The same column is editable in more than one place — case_notes lives here
 * AND in case.html's Overview textarea; contact_notes lives here AND in
 * contact-form. Whichever one you type in, the other should follow without a
 * tab switch or a reload.
 *
 * §3.6: NEVER EMITS. It writes cl.body and repaints. It does not call
 * saveBody(), so the value it just received cannot bounce back out.
 *
 * THREE FENCES, in order:
 *   1. dirty/inflight — the user has unsaved text here, or a PATCH of theirs
 *      is in the air. A draft always outranks an announcement.
 *   2. value equality — this card's OWN save echoes back through the bus
 *      (local dispatch + the shell's sniff), arriving while the user may still
 *      be sitting in the textarea after a debounced (non-blur) save. Assigning
 *      an identical string to a focused textarea still moves the caret in some
 *      browsers, so don't touch the DOM when there is nothing to change.
 *   3. shownBody() — the draft-wins read, the same fence render() uses.
 *
 * A minimal repaint, never load(): a full reload would rebuild every card on
 * the board and cost the caret in whichever one is being typed into.
 */
function subscribeNativeCard(cl) {
  const type = TYPE_BY_ENDPOINT[cl.native.endpoint];
  // An unavailable card holds a placeholder, not the column — painting a real
  // value into a locked, blanked textarea would be a lie about what is saved.
  if (!type || !window.YC || cl.native.unavailable) return;

  const off = YC.on(`${type}:${cl.native.entityId}`, cl.native.field, (fields) => {
    const value = fields[cl.native.field];
    const d = bodyDrafts.get(draftKeyOf(cl));
    if (d && (d.dirty || d.inflight)) return;          // fence 1

    cl.body = value == null ? '' : value;

    if (!d) return;                                    // never rendered yet
    const shown = shownBody(cl, d);                    // fence 3
    if (d.ta && d.ta.value !== shown) {                // fence 2
      d.ta.value = shown;
      resizeTextarea(d.ta);
    }
    updateCount(d, shown.length);
  });
  busUnsubs.push(off);
}

/**
 * The related-contact groups for a CASE board (W3).
 *
 * NEVER REJECTS, for the same reason loadNativeCards does not: the case's own
 * board is the point of the page, and a contact's notes are an expansion of it.
 * Every failure degrades to a flag on the returned shape and is rendered in
 * place — the contacts call failing costs the groups, one contact's call
 * failing costs only that group's cards.
 *
 * Returns { groups, cards, error }. `cards` are ordinary card objects carrying
 * `ownerKey`, concatenated into `lists` by the caller so that ONE array drives
 * both the render and refocusAddInput's index.
 *
 * NO NEW ROUTE. The multi-case count comes from `include=cases` on the contact
 * read the native card already needs, so the disclosure costs zero extra round
 * trips.
 */
async function loadContactGroups() {
  const out = { groups: [], cards: [], error: null };
  if (MODE !== 'entity' || P_LINK_TYPE !== 'case') return out;

  let rows;
  try {
    const res = await api('/api/cases/' + encodeURIComponent(P_LINK) + '/contacts', 'GET');
    rows = Array.isArray(res?.contacts) ? res.contacts : [];
  } catch (err) {
    console.error('checklistView: case contacts fetch failed', err);
    out.error = err?.message || 'unknown error';
    return out;
  }
  if (!rows.length) return out;

  // DEDUPE BY contact_id. case_relate's unique key is (case, client, TYPE) —
  // so one contact may legally hold two rows on one case (Primary AND
  // Secondary). None do today, but two rows would otherwise become two groups
  // sharing an ownerKey, and render()'s cursor walk would hand every card to
  // the first and leave the second an empty heading. Merge the relate types
  // into one label instead.
  const byId = new Map();
  for (const r of rows) {
    if (r.contact_id == null) continue;
    const id = String(r.contact_id);
    const g  = byId.get(id);
    if (g) {
      if (r.relate_type && !g.relates.includes(r.relate_type)) g.relates.push(r.relate_type);
      continue;
    }
    byId.set(id, {
      id,
      key:        'contact:' + id,
      name:       r.contact_name || ('Contact ' + id),
      relates:    r.relate_type ? [r.relate_type] : [],
      otherCases: null,      // unknown until the contact read lands
      failed:     false,
      cards:      [],
    });
  }
  const groups = [...byId.values()];

  const specs      = nativeSpecs('contact');
  // Same rule as loadNativeCards: a native card IS a note, and the Lists
  // position of the filter hides notes.
  const wantNative = specs.length > 0 && kindFilter !== 'checklist';

  const baseQuery = { include: 'items', order: 'created_asc', link_type: 'contact' };
  if (kindFilter) baseQuery.kind = kindFilter;

  await Promise.all(groups.map(async (g) => {
    const [listRes, nativeRows] = await Promise.all([
      api('/checklists', 'GET', { ...baseQuery, link: g.id }).catch((err) => {
        console.error('checklistView: contact checklists fetch failed for ' + g.id, err);
        g.failed = true;
        return null;
      }),
      wantNative ? fetchNativeRows(specs, g.id, { include: 'cases' }) : null,
    ]);

    let natives = [];
    if (nativeRows) {
      natives = buildNativeCards(specs, nativeRows, 'contact', g.id, g.key);
      // The disclosure. `cases` is a sibling of `contact` in the response, so
      // it is read off the raw `res`, not off the unwrapped row.
      const got = nativeRows.get('/api/contacts');
      const cs  = (got && got.res && Array.isArray(got.res.cases)) ? got.res.cases : null;
      if (cs) g.otherCases = cs.filter(c => String(c.case_id) !== String(P_LINK)).length;
    }

    const real = (listRes?.checklists || []).map((cl) => {
      cl.ownerKey = g.key;
      cl.items    = cl.items || [];
      return cl;
    });

    g.cards = natives.concat(real);
  }));

  out.groups = groups;
  for (const g of groups) out.cards = out.cards.concat(g.cards);
  return out;
}

// Called by case.html on tab re-entry (autoFrame idiom) so the cards are fresh.
window.reloadChecklists = load;

// ── Render ────────────────────────────────────────────────────────
/* THE INVARIANT, restated because W3 is the change most likely to break it:
   every entry in `lists` produces exactly ONE .ck-card, and the Nth .ck-card in
   the document is lists[N]. refocusAddInput depends on it (it matches a
   findIndex against querySelectorAll('.ck-card')[idx]), and the failure is
   silent — focus lands on the wrong card's add-item input.

   Grouping is compatible with it because of two rules kept together:

     1. sortLists() ranks by owner FIRST, so each owner's cards are one
        contiguous run in `lists`.
     2. The partition below holds a SINGLE cursor `i` into `lists`, moves it
        forward only, and every card it passes goes into exactly one section —
        which is then rendered, in section order, into stacks appended in that
        same order. Nothing is skipped, nothing is reordered, and nothing is
        built-then-hidden (S5's lesson: a display:none card is still a .ck-card
        and would throw the count off by one).

   Anything the cursor could not place lands in `leftover` and is rendered at
   the end rather than dropped — dropping one is the failure that breaks the
   invariant, so it is made loud instead.

   Headings, the footer and the failure notices are NOT .ck-card, so they can
   sit anywhere between the stacks without affecting the count. */
function render() {
  const body = E('ckBody');
  body.innerHTML = '';

  // Nothing to filter in single mode — there is exactly one card.
  if (MODE !== 'single') body.appendChild(renderKindFilter());

  // PARTITION FIRST, render second. The cursor is consumed in owner order in
  // one pass here, so the sections below are exactly the runs of `lists` — and
  // `hasGroup` can then be asked of what will ACTUALLY render rather than of
  // what loadContactGroups fetched, which drifts the moment a card is deleted.
  let i = 0;
  const take = (key) => {
    const out = [];
    while (i < lists.length && (lists[i].ownerKey || '') === key) out.push(lists[i++]);
    return out;
  };
  const own      = take('');
  const sections = contactGroups.map(g => ({ g, cards: take(g.key) }));
  const leftover = lists.slice(i);

  const hasGroup = sections.some(s => s.cards.length || s.g.failed) || !!groupsError;

  // Only worth labelling when there is something below to tell it apart from.
  if (hasGroup && MODE !== 'single') {
    const h = document.createElement('div');
    h.className = 'ck-own-head';
    h.textContent = 'This case';
    body.appendChild(h);
  }

  if (!own.length) {
    const empty = document.createElement('div');
    empty.className = 'ck-empty';
    empty.textContent = MODE === 'single'          ? 'Not found.'
                      : kindFilter === 'note'      ? 'No notes yet.'
                      : kindFilter === 'checklist' ? 'No lists yet.'
                      : 'Nothing here yet.';
    body.appendChild(empty);
  } else {
    body.appendChild(renderStack(own));
  }

  // ABOVE the contact groups, not below them. The footer creates on the CASE
  // and nothing else (W3 deliberately gave it no target picker), so it stays
  // welded to the case's own section rather than floating at the bottom of a
  // board whose last card belongs to someone else.
  if (MODE !== 'single') body.appendChild(renderNewListFooter());

  // ── one section per related contact (W3) ──
  for (const { g, cards } of sections) {
    // Absent, not empty: a contact with nothing to show under the Lists filter
    // would otherwise leave a heading with nothing under it. A FAILED group
    // still renders — the whole point is to say so.
    if (!cards.length && !g.failed) continue;
    body.appendChild(renderGroupHeading(g));
    if (g.failed) {
      const note = document.createElement('div');
      note.className = 'ck-group-note';
      note.textContent = 'Could not load this contact’s notes & lists. '
                       + 'Reopen the tab to retry.';
      body.appendChild(note);
    }
    if (cards.length) body.appendChild(renderStack(cards));
  }

  if (groupsError) {
    const note = document.createElement('div');
    note.className = 'ck-group-note';
    note.textContent = 'Could not load this case’s contacts, so their notes are '
                     + 'not shown: ' + groupsError;
    body.appendChild(note);
  }

  // Defensive. Unreachable while sortLists and contactGroups agree — but if
  // they ever disagree, DROPPING a card would break the invariant above
  // silently: `lists` would be longer than the .ck-card count and every index
  // past the gap would be wrong. Render the remainder rather than lose it, and
  // say so loudly in the console.
  if (leftover.length) {
    console.error('checklistView: ' + leftover.length + ' card(s) with an '
                + 'unplaced owner — check sortLists/contactGroups agreement.');
    body.appendChild(renderStack(leftover));
  }

  // Height every note body now that they are in the document — scrollHeight
  // is meaningless on a detached node.
  body.querySelectorAll('.ck-note-body').forEach(resizeTextarea);
}

/* The grid container (see .ck-stack). Headings, the empty message, the footer
   and the failure notices stay OUTSIDE it so they never become grid items. */
function renderStack(cards) {
  const stack = document.createElement('div');
  stack.className = 'ck-stack';
  cards.forEach(cl => stack.appendChild(renderCard(cl)));
  return stack;
}

/* One related contact's heading (W3): who they are, how they relate, whether
   an edit here reaches beyond this case, and a way to go and edit it at
   source. */
function renderGroupHeading(g) {
  const head = document.createElement('div');
  head.className = 'ck-group';

  const link = document.createElement('a');
  link.className = 'ck-group-name';
  link.href = '#';
  link.textContent = g.name;
  link.title = 'Open this contact';
  link.onclick = (e) => {
    e.preventDefault();
    // The shell's workspace-file idiom, same call SCOPE_NAV.contact makes in
    // checklistsView.html. ARGUMENT ORDER IS (fileName, fileType, fileID) and a
    // contact is 'client' there — passing the id where fileType belongs matches
    // no branch and opens an empty file. Unlike SCOPE_NAV we have a real name
    // to label the tab with, so pass it.
    try { window.top.addFile(g.name, 'client', String(g.id)); }
    catch (err) { apiError(err, 'Could not open ' + g.name); }
  };
  head.appendChild(link);

  const rel = document.createElement('span');
  rel.className = 'ck-group-rel';
  rel.textContent = '· ' + (g.relates.length
    ? g.relates.join(' / ') + ' contact'
    : 'related contact');
  head.appendChild(rel);

  // THE DISCLOSURE, shown at the moment it matters — beside the cards whose
  // edits would reach those other cases. Null means the contact read failed and
  // the count is simply unknown; claiming "0 other cases" would be a lie.
  if (g.otherCases > 0) {
    const warn = document.createElement('span');
    warn.className = 'ck-group-warn';
    const icon = document.createElement('i');
    icon.className = 'fa-solid fa-triangle-exclamation';
    warn.appendChild(icon);
    warn.appendChild(document.createTextNode(
      'also on ' + g.otherCases + ' other case' + (g.otherCases === 1 ? '' : 's')));
    warn.title = 'These cards belong to ' + g.name + ', not to this case. '
               + 'Editing one changes what those other cases show too.';
    head.appendChild(warn);
  }

  return head;
}

function renderKindFilter() {
  const grp = document.createElement('div');
  grp.className = 'ck-kinds';
  [['', 'All'], ['note', 'Notes'], ['checklist', 'Lists']].forEach(([v, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (kindFilter === v) b.classList.add('active');
    // load(), not render(): the filter is applied server-side by the GET
    // route's `kind` param, so there is nothing local to re-filter.
    b.onclick = () => { if (kindFilter === v) return; kindFilter = v; load(); };
    grp.appendChild(b);
  });
  return grp;
}

function renderCard(cl) {
  const isNote = cl.kind === 'note';
  // S5. A native card is a note SYNTHESIZED from an entity column — it has no
  // checklists row behind it, so every affordance that needs one is suppressed
  // below: rename, tag, Done, delete, re-home.
  const isNative = !!cl.native;
  // W3. The card belongs to a related CONTACT, not to the entity this board is
  // for. Derived from ownerKey rather than passed in, so there is one source of
  // truth for it and a card cannot be tinted into the wrong group.
  const isForeign = !!cl.ownerKey;

  const card = document.createElement('section');
  card.className = 'ck-card'
    + (isNote    ? ' ck-note'    : '')
    + (isNative  ? ' ck-native'  : '')
    + (isForeign ? ' ck-foreign' : '');

  const items = cl.items || [];
  const done  = items.filter(i => i.status === 'complete').length;

  // ── header (shared by both kinds) ──
  const head = document.createElement('div');
  head.className = 'ck-card-head';

  if (isNative) {
    const pin = document.createElement('i');
    pin.className = 'fa-solid fa-thumbtack ck-pin';
    pin.title = 'Pinned — this field lives on the record itself.';
    head.appendChild(pin);
  }

  const title = document.createElement('span');
  title.className = 'ck-title' + (isNative ? ' ck-title-fixed' : '');
  title.textContent = cl.title;
  if (isNative) {
    // The title comes from the NATIVE_NOTES adapter, not from a database
    // column. There is nothing to PATCH, so it is not wired to editTitle.
    title.title = 'Built-in field name — not editable';
  } else {
    title.title = 'Click to rename';
    title.onclick = () => editTitle(cl, title);
  }
  head.appendChild(title);

  // No tag column on a native card — not even for a superuser, who would
  // otherwise get an edit affordance with nothing behind it.
  if (!isNative && (cl.tag || isSU())) {
    const badge = document.createElement('span');
    badge.className = 'ck-tag'
      + (isSU() ? ' ck-tag-su' : '')
      + (cl.tag ? '' : ' ck-tag-empty');
    badge.textContent = cl.tag || '+ tag';
    if (isSU()) {
      badge.title = 'Superuser: click to edit the system tag';
      badge.onclick = () => editTag(cl, badge);
    } else {
      badge.title = 'System tag — set automatically, not editable';
    }
    head.appendChild(badge);
  }

  if (isNative) {
    // Takes the slot .ck-progress / .ck-done hold on the other kinds, and
    // carries the explanation for everything this card is missing. There is NO
    // status column behind a native field, so a Done pill would be a lie —
    // hence a label here rather than a disabled checkbox.
    const badge = document.createElement('span');
    badge.className = 'ck-native-badge';
    badge.textContent = 'Built-in';
    badge.title = 'A field on the record itself, shown here for convenience. '
                + 'It cannot be renamed, tagged, marked done or deleted.';
    head.appendChild(badge);
  } else if (isNote) {
    // A note's status is MANUAL (S1) — there are no items to derive it from.
    head.appendChild(renderDonePill(cl));
  } else {
    // BRANCHED ON KIND, NOT ON items.length. A note has zero items and would
    // render 'empty' here — indistinguishable from an empty checklist.
    const prog = document.createElement('span');
    prog.className = 'ck-progress' + (items.length && done === items.length ? ' done' : '');
    prog.textContent = items.length ? `${done}/${items.length}` : 'empty';
    head.appendChild(prog);
  }

  // Nothing to delete on a native card — the column is not the card's to
  // remove, and DELETE /checklists/null is not a thing.
  if (!isNative) {
    const del = document.createElement('button');
    del.className = 'ck-icon-btn danger';
    del.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
    del.title = isNote ? 'Delete this note' : 'Delete this list';
    del.onclick = () => deleteList(cl);
    head.appendChild(del);
  }

  card.appendChild(head);

  if (isNote) {
    // ── body ── (replaces BOTH the items list and the add-item row)
    const d = draftFor(draftKeyOf(cl));

    card.appendChild(renderNoteBody(cl));

    const flag = document.createElement('div');
    flag.className = 'ck-saveflag';
    d.flag = flag;                       // re-pointed on every render
    flag.textContent = d.flagText || '';
    flag.classList.toggle('err', !!d.flagErr);
    card.appendChild(flag);

    // Same re-pointing contract as the flag: held on the draft so a render()
    // triggered elsewhere restores it.
    const count = document.createElement('div');
    count.className = 'ck-count';
    d.count = count;
    card.appendChild(count);
    updateCount(d, shownBody(cl, d).length);

    return card;
  }

  // ── items ──
  const wrap = document.createElement('div');
  wrap.className = 'ck-items';
  items.forEach(item => wrap.appendChild(renderRow(cl, item)));
  card.appendChild(wrap);

  // ── add item ──
  const add = document.createElement('div');
  add.className = 'ck-add';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Add an item…';
  const btn = document.createElement('button');
  btn.className = 'ck-btn';
  btn.textContent = 'Add';
  const submit = () => addItem(cl, input);
  input.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  };
  btn.onclick = submit;
  add.appendChild(input);
  add.appendChild(btn);
  card.appendChild(add);

  return card;
}

function renderRow(cl, item) {
  const row = document.createElement('div');
  row.className = 'ck-row' + (item.status === 'complete' ? ' complete' : '');

  const box = document.createElement('input');
  box.type = 'checkbox';
  box.className = 'ck-box';
  box.checked = item.status === 'complete';
  box.onchange = () => toggleItem(cl, item, box);
  row.appendChild(box);

  const name = document.createElement('span');
  name.className = 'ck-name';
  name.textContent = item.name;
  name.title = 'Click to edit';
  name.onclick = () => editItemName(cl, item, name);
  row.appendChild(name);

  const del = document.createElement('button');
  del.className = 'ck-row-del';
  del.innerHTML = '&#x2716;';
  del.title = 'Delete item';
  del.onclick = () => deleteItem(cl, item);
  row.appendChild(del);

  return row;
}

/* Notes only. Labelled "Done" rather than left as a bare checkbox so it does
   not read as an item checkbox — the two mean different things and sit within
   a few pixels of each other on a mixed board. */
function renderDonePill(cl) {
  const label = document.createElement('label');
  label.className = 'ck-done' + (cl.status === 'complete' ? ' done' : '');
  label.title = 'A note has no items — mark it done by hand.';

  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = cl.status === 'complete';
  box.onchange = () => toggleNoteDone(cl, box, label);
  label.appendChild(box);

  const txt = document.createElement('span');
  txt.textContent = 'Done';
  label.appendChild(txt);

  return label;
}

/* The note body. ALWAYS EDITABLE — no click-to-edit swap, matching how
   case.html (#overviewCaseNotes) and tabLeads.html already treat notes.

   `.value`, never innerHTML: this is plain text and must stay plain text. */
function renderNoteBody(cl) {
  const key = draftKeyOf(cl);
  const d   = draftFor(key);

  const ta = document.createElement('textarea');
  ta.className = 'ck-note-body';
  ta.placeholder = 'Write a note…';
  // Browser-level guard: blocks typing past the ceiling and CLAMPS a paste to
  // it, so the 400 from lib/noteLimits.js is normally never reached. It is not
  // sufficient on its own — it does not clamp a value assigned in script, and
  // a stored value can already exceed the limit (caseService's merge concat is
  // deliberately exempt). saveBody() is the guard that actually holds.
  ta.maxLength = NOTE_MAX_CHARS;
  // An unsaved draft wins over the stored value, so a render() triggered
  // elsewhere does not silently revert what the user typed.
  ta.value = shownBody(cl, d);
  // Held on the draft entry, SAME RE-POINTING CONTRACT as `flag` and `count`:
  // a detached node from a previous render is harmless to write to, and the
  // next render re-points it. The sync-bus subscriber needs a handle on the
  // live textarea to repaint one card without a full render().
  d.ta = ta;

  // S5: the entity read failed, so cl.body is a placeholder, not the column.
  // Typing here and saving would write that placeholder over whatever the
  // column really holds — so the field is locked until the next successful
  // load. No oninput, no onblur: nothing can mark it dirty.
  if (cl.native && cl.native.unavailable) {
    ta.disabled = true;
    ta.value = '';
    ta.placeholder = 'Could not load this field — reopen the tab to retry.';
    setFlag(d, 'Unavailable — this field could not be loaded.', true);
    return ta;
  }

  ta.oninput = () => {
    // resizeTextarea() is scripts.js's shared helper (height:auto, then
    // scrollHeight capped at 300px). The same one case.html uses for case
    // notes — see .ck-note-body's max-height, which must agree with it.
    resizeTextarea(ta);
    d.draft = ta.value;
    // Dirty means "differs from what the server holds" — typing and undoing
    // back to the stored text leaves nothing to save.
    d.dirty = ta.value !== (cl.body ?? '');
    updateCount(d, ta.value.length);
    setFlag(d, d.dirty ? 'Unsaved…' : '');
    if (d.timer) { clearTimeout(d.timer); d.timer = null; }
    if (d.dirty) d.timer = setTimeout(() => saveBody(key), BODY_AUTOSAVE_MS);
  };

  // Blur commits immediately. saveBody() clears the pending timer first, so
  // the debounce and the blur cannot both fire a PATCH for the same edit.
  ta.onblur = () => { saveBody(key); };

  return ta;
}

// ── Inline editing ────────────────────────────────────────────────
/* Shared swap-to-input helper. Commits on Enter or blur, cancels on Escape,
   and no-ops when the value is unchanged so a stray click costs no request.
   NOT used for note bodies: those are always editable and multi-line. */
function inlineEdit(el, current, inputClass, onCommit, allowEmpty) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = inputClass;
  input.value = current;

  let settled = false;
  const finish = (commit) => {
    if (settled) return;
    settled = true;
    const next = input.value.trim();
    input.replaceWith(el);
    if (commit && next !== current && (next || allowEmpty)) onCommit(next);
  };

  input.onkeydown = (e) => {
    if (e.key === 'Enter')  { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  input.onblur = () => finish(true);

  el.replaceWith(input);
  input.focus();
  input.select();
}

function editTitle(cl, el) {
  inlineEdit(el, cl.title, 'ck-title-input', async (next) => {
    try {
      await api('/checklists/' + cl.id, 'PATCH', { title: next });
      cl.title = next;
      render();
    } catch (err) { apiError(err, 'Could not rename'); render(); }
  });
}

/* SU-only. Tags are what automation matches on: tag='docs_needed' is the
   identity used by services/portalDocsService.js and the public docReq route.
   Renaming or clearing it does NOT error — the portal card and document
   requests just go quietly empty. Hence the explicit confirm naming the
   consequence, rather than a generic "are you sure".
   Adding a duplicate is already impossible: uq_link_kind_tag returns 409. */
async function editTag(cl, el) {
  const current = cl.tag || '';
  const what    = cl.kind === 'note' ? 'note' : 'list';
  const body = current
    ? `<p style="text-align:left">The tag <code>${esc(current)}</code> is how automation finds this ${what}.</p>`
      + (current === 'docs_needed'
          ? '<p style="text-align:left;color:#b91c1c"><b>This is the list the client portal '
            + 'and document requests read.</b> Renaming or clearing it makes both go blank '
            + 'for this case &mdash; silently, with no error.</p>'
          : `<p style="text-align:left">Changing it detaches this ${what} from whatever matches that tag.</p>`)
      + '<p style="text-align:left;color:#64748b">Clear the box to remove the tag entirely.</p>'
    : '<p style="text-align:left">Tags are matched by automation and never shown to clients. '
      + 'Only set one if you know what reads it.</p>';

  const ok = await confirmDialog({
    title: current ? 'Edit system tag' : 'Add a system tag',
    html: body,
    confirmText: 'Edit tag',
    danger: current === 'docs_needed',
  });
  if (!ok) return;

  inlineEdit(el, current, 'ck-title-input', async (next) => {
    try {
      await api('/checklists/' + cl.id, 'PATCH', { tag: next || null });
      cl.tag = next || null;
      // Re-pin: tagged cards sort above untagged ones. Via sortLists(), NOT a
      // bare tag sort — a tag-only comparator would rank every native card
      // (tag: null) below a tagged one and knock them off the top.
      sortLists();
      render();
    } catch (err) {
      // 409 = another row OF THE SAME KIND on this entity already holds that
      // tag (uq_link_kind_tag). A note and a checklist may share one.
      apiError(err, 'Could not change tag');
      render();
    }
  }, true);
}

function editItemName(cl, item, el) {
  inlineEdit(el, item.name, 'ck-name-input', async (next) => {
    try {
      await api('/checkitems/' + item.id, 'PATCH', { name: next });
      item.name = next;
      render();
    } catch (err) { apiError(err, 'Could not rename item'); render(); }
  });
}

// ── Mutations ─────────────────────────────────────────────────────
async function toggleItem(cl, item, box) {
  const next = box.checked ? 'complete' : 'incomplete';
  const prev = item.status;
  item.status = next;          // optimistic — the checkbox already moved
  render();
  try {
    await api('/checkitems/' + item.id, 'PATCH', { status: next });
    // The parent's status is recomputed server-side; refetch is overkill for
    // a checkbox, so recompute the same rule locally for the progress badge.
    //
    // The "zero items -> incomplete" polarity below is WRONG for a note, but
    // unreachable on one: this function is only ever wired up by renderRow,
    // which runs only for items, which a note never has.
    const items = cl.items || [];
    cl.status = items.length && items.every(i => i.status === 'complete')
      ? 'complete' : 'incomplete';
  } catch (err) {
    item.status = prev;
    apiError(err, 'Could not update item');
    render();
  }
}

/* Notes only. Optimistic in the same shape as toggleItem — the checkbox has
   already moved, so flip the model to match and revert on failure.

   Does NOT render() on success: the click that got here blurred any focused
   note body (committing it), but a save may still be in the air, and a full
   rebuild costs the caret for no gain. The pill is updated in place. */
async function toggleNoteDone(cl, box, label) {
  const next = box.checked ? 'complete' : 'incomplete';
  const prev = cl.status;
  if (next === prev) return;
  cl.status = next;
  label.classList.toggle('done', next === 'complete');
  try {
    await api('/checklists/' + cl.id, 'PATCH', { status: next });
  } catch (err) {
    cl.status = prev;
    apiError(err, 'Could not update note');
    render();
  }
}

// ── Note body persistence ─────────────────────────────────────────
/* THE bodyDrafts KEY. A real note is keyed by its checklists id. A NATIVE card
   (S5) has id === null, and every native on the page would therefore collide
   on the same `null` key — one shared draft, one shared save flag, and a
   saveBody() lookup that finds whichever native happens to sit first.
   So natives are keyed by their column instead. The two key spaces cannot
   overlap: one is a number, the other a 'native:…' string.

   W3 ADDS THE ENTITY to that key. The column alone was unique while a board
   showed exactly one entity's natives; a case board now also shows its related
   contacts', and two contacts on one case would BOTH key 'native:contact_notes'
   — sharing a draft, a save flag and, worst, a save target, so typing in one
   would PATCH the other. 11 cases have two contacts and 1 has three, so this is
   reachable today, not hypothetical.

   Contact-scoped REAL cards need nothing here: they are ordinary rows with
   ordinary ids, unique across the whole table. */
function draftKeyOf(cl) {
  if (!cl.native) return cl.id;
  return 'native:' + cl.native.entityType + ':' + cl.native.entityId
       + ':' + cl.native.field;
}

/* What the textarea should be showing: an unsaved draft if there is one,
   otherwise the stored value. Shared by renderNoteBody (which sets it) and
   renderCard (which counts it). */
function shownBody(cl, d) {
  return (d.dirty && d.draft != null) ? d.draft : (cl.body ?? '');
}

function draftFor(key) {
  let d = bodyDrafts.get(key);
  if (!d) {
    d = { draft: null, dirty: false, timer: null, inflight: false,
          flag: null, flagText: '', flagErr: false,
          count: null, countText: '', ta: null };
    bodyDrafts.set(key, d);
  }
  return d;
}

/* The save-state line under a note body. Held on the draft entry as well as
   written to the DOM, so the next render() can restore it. */
function setFlag(d, text, isErr) {
  d.flagText = text || '';
  d.flagErr  = !!isErr;
  if (!d.flag) return;
  d.flag.textContent = d.flagText;
  d.flag.classList.toggle('err', d.flagErr);
}

/* The character counter, on the same held-on-the-draft contract as setFlag.
   Silent below COUNT_SHOW_AT — see the counter visibility block near
   NOTE_MAX_CHARS to change where that sits. Red once a body is actually over
   the ceiling, which is only reachable on a value the browser did not clamp
   (a stored row that predates the limit, or one grown by an append path that
   lib/noteLimits.js exempts). */
function updateCount(d, len) {
  d.countText = len >= COUNT_SHOW_AT
    ? len.toLocaleString() + ' / ' + NOTE_MAX_CHARS.toLocaleString()
    : '';
  d.countOver = len > NOTE_MAX_CHARS;
  if (!d.count) return;
  d.count.textContent = d.countText;
  d.count.classList.toggle('over', d.countOver);
}

/**
 * Commit one note body. Both the blur handler and the debounced autosave land
 * here; the pending timer is cleared before the dirty check, so exactly one
 * PATCH fires per edit no matter which path wins the race.
 *
 * An EMPTY STRING is a legitimate body — a title-only note. The route
 * distinguishes '' from null (`body ?? null`, not `body || null`), so this
 * must not `|| null` it on the way out either.
 *
 * NEVER calls render() on success — see the bodyDrafts comment at the top.
 * On failure the draft is KEPT and the card is marked unsaved rather than
 * reverted: a title is cheap to retype, a paragraph is not, and the next blur
 * or idle retries it. cl.body still holds the STORED value throughout, so the
 * card never lies about what the server has.
 *
 * S5: ONE save path, two requests. A native card writes its column on the
 * entity; a real note writes checklists.body. Everything either side of the
 * request — the dirty flag, the debounce, the blur commit, the in-flight
 * re-arm, the keep-the-text-on-failure rule — is identical, deliberately.
 *
 * @param {number|string} key  a bodyDrafts key — see draftKeyOf()
 */
async function saveBody(key) {
  const d = bodyDrafts.get(key);
  if (!d) return;
  if (d.timer) { clearTimeout(d.timer); d.timer = null; }
  if (!d.dirty) return;
  // A second save while one is in the air would race to write the same row.
  // Re-arm instead; the follow-up picks up whatever the latest draft is.
  if (d.inflight) { d.timer = setTimeout(() => saveBody(key), 250); return; }

  const cl = lists.find(l => draftKeyOf(l) === key);
  if (!cl) {
    // Absent from `lists` means one of two very different things, and dropping
    // the draft is only right for one of them:
    //
    //   DELETED   the row is gone; there is nothing to save it back to.
    //   FILTERED  the kind filter (or a scope change) rebuilt `lists` without
    //             it. The row still exists and the card will return.
    //
    // A dirty draft here is text the user typed that a failed save has not yet
    // landed. Deleting it discards that text SILENTLY — no toast, no flag,
    // because the card it would render on is not on screen. So keep anything
    // dirty: shownBody() restores it the moment the card comes back, and
    // beforeunload still warns if the tab closes first. Clean entries are just
    // bookkeeping and go.
    if (!d.dirty) bodyDrafts.delete(key);
    return;
  }

  // Belt and braces: renderNoteBody leaves an unavailable native card disabled,
  // so nothing can mark it dirty in the first place.
  if (cl.native && cl.native.unavailable) {
    d.dirty = false;
    setFlag(d, 'Unavailable — this field could not be loaded.', true);
    return;
  }

  const value = d.draft ?? '';

  // OVER-LENGTH. The server rejects this with a 400 (lib/noteLimits.js) on
  // every one of these endpoints, and the textarea's maxLength normally stops
  // it long before — but a STORED value can already exceed the ceiling (the
  // merge concat and apptService's CONCAT sites are exempt from the limit),
  // and maxLength does not clamp a value assigned in script. Refuse to send
