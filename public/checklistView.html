  // rather than eat the 400: `dirty` stays true, so the text is kept and the
  // next edit or blur retries, exactly like any other failed save.
  if (value.length > NOTE_MAX_CHARS) {
    updateCount(d, value.length);
    setFlag(d, `Too long to save — ${value.length.toLocaleString()} characters, `
             + `limit ${NOTE_MAX_CHARS.toLocaleString()}.`, true);
    return;
  }

  d.dirty    = false;
  d.inflight = true;
  setFlag(d, 'Saving…');
  try {
    if (cl.native) {
      // '' when cleared, NEVER null. Four of the five native columns are NOT
      // NULL and would reject it. events.event_note IS nullable, but is sent
      // '' anyway rather than forking the save path on a per-field
      // nullability flag — '' is a legitimate empty in a nullable column too.
      // (checklists.body is nullable and S1 treats null as a legitimate value;
      // the native columns do not.)
      await api(cl.native.endpoint + '/' + encodeURIComponent(cl.native.entityId),
                'PATCH', { [cl.native.field]: value });
      // Sync bus (public/js/yc-sync.js). REQUIRED for appt/event notes: those
      // PATCH responses carry no `changes`, so the shell's auto-sniff has
      // nothing to read and this is the only announcement. For case/contact it
      // harmlessly double-covers the sniff — emits are idempotent by design,
      // and a duplicate costs one extra guarded repaint.
      const type = TYPE_BY_ENDPOINT[cl.native.endpoint];
      if (type && window.YC) {
        YC.emit(`${type}:${cl.native.entityId}`,
                { [cl.native.field]: value }, 'checklistView:saveBody');
      }
    } else {
      await api('/checklists/' + cl.id, 'PATCH', { body: value });
    }
    cl.body = value;
    if (d.draft === value) d.draft = null;
    setFlag(d, '');
  } catch (err) {
    d.dirty = true;                                // keep the text, allow retry
    setFlag(d, 'Unsaved — retrying on next edit', true);
    apiError(err, cl.native ? `Could not save ${cl.title}` : 'Could not save note');
  } finally {
    d.inflight = false;
  }
}

/* Flush every dirty body. Called before a refetch so the GET cannot race a
   pending PATCH and hand back the stale text.

   Covers native cards too, and has to: their refetch is a DIFFERENT endpoint
   (loadNativeCards' entity GET, not /checklists), so an unflushed native draft
   would be clobbered by a response this function never saw. Nothing special is
   needed for that — the drafts share one Map, so iterating its keys reaches
   both kinds, and saveBody() picks the right request per card. Same reason
   beforeunload's dirty check covers natives for free. */
async function flushBodies() {
  const keys = [...bodyDrafts.keys()];
  await Promise.allSettled(keys.map(k => saveBody(k)));
}

async function addItem(cl, input) {
  const name = input.value.trim();
  if (!name || busy) return;
  busy = true;
  try {
    // POST /checklists/:id/items returns the WHOLE checklist with items.
    const updated = await api('/checklists/' + cl.id + '/items', 'POST', { name });
    Object.assign(cl, updated);
    render();
    // Re-focus this card's input so several items can be typed in a row.
    refocusAddInput(cl.id);
  } catch (err) {
    apiError(err, 'Could not add item');
  } finally { busy = false; }
}

/* render() rebuilds the DOM, so the input that was just typed into is gone.
   Find the rebuilt one for the same card and put the cursor back.

   POSITIONAL, and it stays correct only because of one invariant: every entry
   in `lists` produces exactly one .ck-card, in order. Notes hold to it (S2),
   and so do the pinned native cards (S5) — they are PREPENDED INTO `lists`,
   not rendered separately ahead of the stack, so the index of a checklist
   shifts by exactly the same amount in both the array and the DOM.

   That is also why the Lists filter drops natives from `lists` rather than
   hiding them with CSS: a display:none card is still a .ck-card and would
   throw this off by one per hidden native. The failure is quiet — focus simply
   lands on the wrong card's input after adding an item.

   W3's contact groups hold to the same invariant, and it survives for exactly
   the same reason: their cards are IN `lists`, and render() walks it with one
   forward-only cursor. A group's heading and failure notice are not .ck-card,
   an empty group is skipped rather than rendered hidden, and a group whose
   cards the filter removed contributes nothing to either side. See render()'s
   docblock, which states the two rules that keep it true.

   The findIndex is ACROSS ALL GROUPS, which is correct — checklists.id is
   unique table-wide, so a contact-scoped card matches its own index and no
   other. It excludes natives explicitly. `clId` is always a real id here
   (addItem is unreachable without an add row, and neither a note nor a native
   has one), but a native's id is null and `l.id === clId` would match it for a
   null clId — cheaper to exclude than to reason about. */
function refocusAddInput(clId) {
  const idx = lists.findIndex(l => !l.native && l.id === clId);
  if (idx < 0) return;
  const cards = document.querySelectorAll('.ck-card');
  const input = cards[idx]?.querySelector('.ck-add input');
  if (input) input.focus();
}

async function deleteItem(cl, item) {
  const ok = await confirmDialog({
    title: 'Delete item?',
    html: `<p style="text-align:left">${esc(item.name)}</p>`,
    confirmText: 'Delete',
    danger: true,
  });
  if (!ok) return;
  try {
    await api('/checkitems/' + item.id, 'DELETE');
    cl.items = (cl.items || []).filter(i => i.id !== item.id);
    const items = cl.items;
    // Same reachability argument as toggleItem: only renderRow wires this up,
    // so `cl` is always a checklist here and the derivation polarity holds.
    cl.status = items.length && items.every(i => i.status === 'complete')
      ? 'complete' : 'incomplete';
    render();
  } catch (err) { apiError(err, 'Could not delete item'); }
}

async function deleteList(cl) {
  // Unreachable — renderCard gives a native card no delete button. Guarded
  // anyway because the filter below removes by id, and a native's id is null:
  // one slip here would silently drop EVERY native card from the board.
  if (cl.native) return;
  const isNote  = cl.kind === 'note';
  const n       = (cl.items || []).length;
  const hasBody = !!String(cl.body || '').trim();
  const warn = cl.tag
    ? `<p style="text-align:left;color:#b91c1c"><b>This is a system `
      + `${isNote ? 'note' : 'list'} (<code>${esc(cl.tag)}</code>).</b> Deleting it removes `
      + `it from the client portal and document requests until it is recreated.</p>`
    : '';
  /* W3. The card is on a case board but the ROW belongs to a contact, and the
     delete reaches every case that contact is on. The heading already carries
     the standing disclosure; this is the same fact restated at the one moment
     it is irreversible. */
  const g = cl.ownerKey ? groupFor(cl.ownerKey) : null;
  const foreignWarn = g
    ? `<p style="text-align:left;color:#b45309"><b>This ${isNote ? 'note' : 'list'} `
      + `belongs to ${esc(g.name)}, not to this case.</b> Deleting it removes it `
      + `from that contact everywhere`
      + (g.otherCases > 0
          ? `, including ${g.otherCases} other case${g.otherCases === 1 ? '' : 's'}`
          : '')
      + `.</p>`
    : '';
  const detail = isNote
    ? (hasBody ? ' <span style="color:#64748b">&mdash; its text will be deleted too.</span>' : '')
    : (n ? ` <span style="color:#64748b">&mdash; ${n} item${n === 1 ? '' : 's'} `
         + `will be deleted too.</span>` : '');
  const ok = await confirmDialog({
    title: isNote ? 'Delete note?' : 'Delete list?',
    html: foreignWarn + warn + `<p style="text-align:left">${esc(cl.title)}${detail}</p>`,
    confirmText: 'Delete',
    danger: true,
  });
  if (!ok) return;
  try {
    await api('/checklists/' + cl.id, 'DELETE');
    lists = lists.filter(l => l.id !== cl.id);
    // Drop any pending draft with it, or a queued autosave would 404 and the
    // entry would leak for the life of the page. Keyed via draftKeyOf for
    // consistency — a native card is unreachable here (it has no delete
    // button), and filtering by `l.id !== cl.id` would drop every native along
    // with it if one ever were.
    const d = bodyDrafts.get(draftKeyOf(cl));
    if (d?.timer) clearTimeout(d.timer);
    bodyDrafts.delete(draftKeyOf(cl));
    render();
  } catch (err) {
    apiError(err, isNote ? 'Could not delete note' : 'Could not delete list');
  }
}

/**
 * Create a card of either kind.
 *
 * SHAPE KEYS ARE TESTED BY PRESENCE, NOT CONTENTS (POST /checklists): `items`
 * on a note is a 400 even as `[]`, and `body` on a checklist is a 400 even as
 * `''`. So a note is created with NO body key at all, and a checklist with no
 * items key — neither is sent below, deliberately.
 *
 * `kind` is omitted for a checklist so the request stays byte-identical to
 * what this page sent before S2; the route and the column both default to it.
 */
async function addList(input, kind) {
  const title = input.value.trim();
  if (!title || busy) return;
  const scope = newListScope();
  if (scope.link_type === 'user' && !scope.link) {
    toast('error', 'Could not create', 'No current user — reload the page.');
    return;
  }
  busy = true;
  try {
    const payload = {
      title,
      link:      scope.link,
      link_type: scope.link_type,
    };
    if (kind === 'note') payload.kind = 'note';
    const created = await api('/checklists', 'POST', payload);
    created.items = created.items || [];
    // W3. newListScope() is THIS BOARD's scope and nothing else — on a case
    // board that is always the case, never a contact — so the new card belongs
    // in the own section. Stated rather than left undefined, because sortLists
    // now ranks on it.
    created.ownerKey = null;
    // Pushed even when it does not match the active filter — the user just
    // made this thing and has to be able to see it. The next load() re-applies
    // the filter honestly.
    lists.push(created);
    // W3. A bare push would leave it AFTER the contact groups, which breaks the
    // contiguous-run rule render()'s cursor walk relies on. sortLists puts it
    // back at the end of the own-untagged band — the same place the push landed
    // it on a board with no groups, so nothing changes there.
    sortLists();
    render();
  } catch (err) {
    // 409 (tag collision) and 403 (someone else's personal list) both arrive
    // here with a real message from the route.
    apiError(err, kind === 'note' ? 'Could not create note' : 'Could not create list');
  } finally { busy = false; }
}

/* One input, two buttons. Enter keeps its pre-S2 meaning — it creates a
   CHECKLIST — so existing muscle memory is unbroken; a note needs the button. */
function renderNewListFooter() {
  const foot = document.createElement('div');
  foot.className = 'ck-newlist';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'New list or note name…';

  const listBtn = document.createElement('button');
  listBtn.className = 'ck-btn';
  listBtn.textContent = 'New List';
  listBtn.onclick = () => addList(input, 'checklist');

  const noteBtn = document.createElement('button');
  noteBtn.className = 'ck-btn ck-btn-alt';
  noteBtn.textContent = 'New Note';
  noteBtn.onclick = () => addList(input, 'note');

  input.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addList(input, 'checklist'); }
  };

  foot.appendChild(input);
  foot.appendChild(listBtn);
  foot.appendChild(noteBtn);
  return foot;
}

/* Last line of defence for an unsaved body.
 *
 * bodyDrafts lives in memory, so it survives render() and survives load()
 * while dirty — but NOT a real page unload. A save that failed shows
 * "Unsaved — retrying on next edit", and if the user simply walks away that
 * retry never comes and the text is gone.
 *
 * SCOPE, deliberately narrow: case.html HIDES its tabs rather than unloading
 * the iframe, and the shell's addFile() does not navigate this document
 * either. So this fires only on an actual reload or close of the whole app —
 * which is exactly the case nothing else covers. Typing in the textarea gives
 * the frame sticky activation, so the browser will honour the prompt.
 *
 * A child frame's beforeunload runs when the parent document unloads, so this
 * works from inside the iframe. The text is ignored by modern browsers, which
 * render their own wording; returnValue is set for older ones. */
window.addEventListener('beforeunload', (e) => {
  let dirty = false;
  for (const d of bodyDrafts.values()) {
    if (d.dirty || d.inflight) { dirty = true; break; }
  }
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = '';
  return '';
});

// ── Boot ──────────────────────────────────────────────────────────
// Wait for the shell to expose apiSend (esign/automationsWidget idiom). The
// iframe can parse before index.html has finished defining it.
(function waitForShell() {
  try {
    if (window.top && typeof window.top.apiSend === 'function') return load();
  } catch (_) { /* fall through to retry */ }
  setTimeout(waitForShell, 100);
})();
</script>
</body>
</html>
