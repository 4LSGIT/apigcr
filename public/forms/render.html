<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/css/yc-forms.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Local-only. yc-forms.css is untouched (per contract §8). A single note
       banner for preview mode + a hook for the disabled preview save button. */
    .ycr-preview-note {
      margin: 8px 0;
      padding: 6px 12px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 4px;
      color: #9a3412;
      font-size: 13px;
    }
    .ycr-fatal {
      color: #b91c1c;
      padding: 20px;
      font-family: system-ui, sans-serif;
    }
    #saveBtn[disabled] { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body>
<!-- Body is built at runtime from the template definition. Nothing here is
     static form content: render.html is generic. -->

<script src="/js/yc-forms.js"></script>
<script>
/* ============================================================================
 * render.html — generic YisraForm template renderer (Slice 2).
 *
 * Turns a published form_templates.definition (or a draft, in preview) into a
 * working YCForm with no per-form code. Governing contract:
 * ref/FORM_TEMPLATE_SCHEMA_V1.md §§3–5, §8.
 *
 * SLICE 2 SCOPE (contract §10) — everything Slice 1 rendered, plus:
 *   - Repeater sections (§4.2): container + <template> + add/remove wired to
 *     yc-forms' _setupRepeaters/_addRepeaterItemWithData/collect expectations.
 *   - showWhen (§4.4) on sections, rows, and fields — translated to the
 *     existing data-yc-show-when / -value / -values runtime attrs. No runtime
 *     changes; _setupConditionals consumes them as-is.
 *   - Checkgroup allowOther (§4.3): the data-yc-other checkbox +
 *     data-yc-other-text input + .yc-other-text wrapper markup that
 *     _getCheckgroup/_setCheckgroup expect, plus the user-click toggle the
 *     runtime does NOT provide (hand-built forms wire it themselves — see
 *     341notes setupOtherToggle).
 *   - Resolver prefill (§5): one batched POST /resolve in the generated
 *     onLoad; refs auto-built from linkType; ||| separator; prefillMode
 *     ifEmpty (default) / always. Runs before init step 13c so prefilled
 *     values are part of the clean baseline. Skipped in preview and when
 *     there is no linkId.
 *   - Hooks (§3): /forms/hooks/{name}.js loaded and awaited before YCForm
 *     construction; window.ycHooks.onLoad(form, data) called at the END of
 *     the generated onLoad (after prefill); ycHooks.onSave(form, result)
 *     from onSave. Missing file → console.warn, render proceeds. Hooks are
 *     NOT loaded in preview (preview must never execute side-effecting code).
 *
 * Still out (Slice 3/4 + reserved): tabs, external/portal mode, builder UI,
 * computed fields.
 *
 * MODES
 *   Normal : ?form_key=X&<linkType>_id=N   (param name follows the template's
 *            link_type: case_id | contact_id | appt_id)
 *   Preview: ?template_id=N&preview=1[&link_id=M]  — renders draft_definition.
 *            NEVER writes: autosave off, Save disabled, draft banner omitted,
 *            endpoints.load skipped when no link_id, prefill + hooks skipped
 *            always.
 *
 * SECURITY (contract §8): every template-sourced string reaches the DOM via
 * textContent / setAttribute only. The el() helper below has no innerHTML path.
 * ==========================================================================*/

(function () {
  'use strict';

  var params  = new URLSearchParams(location.search);
  var preview = params.get('preview') === '1';

  // ── DOM builder (no innerHTML; text via textContent, attrs via setAttribute) ──
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;          // safe
        else n.setAttribute(k, v === true ? '' : String(v)); // safe
      }
    }
    if (kids != null) {
      (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
        if (c == null) return;
        n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return n;
  }

  function fatal(msg) {
    document.body.textContent = '';
    document.body.appendChild(el('p', { class: 'ycr-fatal', text: msg }));
  }

  // ── Wait for the parent iframe chain to expose apiSend (standard boot). ──
  // Slice 2 is still internal-only: render.html lives in an iframe whose parent
  // (case.html / contact.html / the builder page) relays window.apiSend.
  function waitForParent(cb) {
    var tries = 0;
    (function loop() {
      var ok = false;
      try { ok = !!(window.parent && window.parent.apiSend); } catch (e) { ok = false; }
      if (ok) return cb();
      if (++tries > 100) {                       // ~10s
        return fatal('This form must run inside the app (no parent apiSend found). '
                   + 'Standalone/external rendering is not available in this version.');
      }
      setTimeout(loop, 100);
    })();
  }

  function api(url, method, body) {
    return window.parent.apiSend(url, method, body);
  }

  // ── Type maps ──
  var YC_TYPE = {
    text: 'text', textarea: 'textarea', number: 'number', date: 'date',
    datetime: 'text',            // datetime-local input; YCForm auto-detects it
    select: 'select', radio: 'radio', checkbox: 'checkbox',
    checkgroup: 'checkgroup', tags: 'tags', hidden: 'text'
  };
  var WIDTH_CLASS = {
    '2x': 'yc-2x', '3x': 'yc-3x', 'fixed-sm': 'yc-fixed-sm', 'fixed-md': 'yc-fixed-md'
  };
  // Contract §4.2: field subset allowed inside repeaters. Anything else is
  // rendered as text (with a warn) — server validation doesn't restrict
  // repeater field types today, so degrade rather than break.
  var REPEATER_TYPES = { text: 1, number: 1, date: 1, select: 1, checkbox: 1 };

  // Mirror of the resolver-prefill separator in contract §5 and the 341notes
  // pattern. NOTE (accepted risk, per contract): a resolved VALUE containing
  // "|||" would break part alignment — the count guard below aborts the whole
  // prefill write in that case instead of writing misaligned values.
  var PREFILL_SEP = '|||';

  // refs auto-build (contract §5): linkType → { table: { pk: linkId } }
  var REFS_FOR = {
    case:    function (id) { return { cases:    { case_id:    id } }; },
    contact: function (id) { return { contacts: { contact_id: id } }; },
    appt:    function (id) { return { appts:    { appt_id:    id } }; }
  };

  function fieldSelector(f) {
    return f.type === 'checkgroup'
      ? '[data-yc-checkgroup="' + f.name + '"]'
      : '[name="' + f.name + '"]';
  }

  function optOf(o) {
    if (o && typeof o === 'object') {
      return { value: String(o.value != null ? o.value : ''),
               label: String(o.label != null ? o.label : (o.value != null ? o.value : '')) };
    }
    return { value: String(o), label: String(o) };
  }

  // ── showWhen (§4.4) → the existing runtime attrs. Nothing new at runtime:
  //    _setupConditionals/_evaluateConditionals consume exactly these. ──
  function applyShowWhen(node, sw, path, warn) {
    if (!sw || typeof sw !== 'object' || !node) return;
    var field = (typeof sw.field === 'string') ? sw.field : '';
    if (!field) { warn(path + ': showWhen.field missing — condition ignored'); return; }

    switch (sw.op) {
      case 'eq':
        node.setAttribute('data-yc-show-when', field);
        node.setAttribute('data-yc-show-value', String(sw.value != null ? sw.value : ''));
        break;
      case 'neq':
        node.setAttribute('data-yc-show-when', field);
        node.setAttribute('data-yc-show-value', '!' + String(sw.value != null ? sw.value : ''));
        break;
      case 'in': {
        var vals = Array.isArray(sw.value) ? sw.value : [sw.value];
        node.setAttribute('data-yc-show-when', field);
        node.setAttribute('data-yc-show-values',
          vals.map(function (v) { return String(v != null ? v : ''); }).join(','));
        break;
      }
      case 'notEmpty':
        node.setAttribute('data-yc-show-when', field);
        node.setAttribute('data-yc-show-value', '*');
        break;
      default:
        warn(path + ': showWhen.op "' + sw.op + '" is unknown — condition ignored');
    }
  }

  // ── Build one field's DOM. Returns an element (or a bare hidden input,
  //    which never affects row layout). ──
  function buildField(f, warn) {
    if (f.type === 'hidden') {
      // showWhen on a hidden field is meaningless (nothing to show/hide) —
      // silently ignored.
      return el('input', { type: 'hidden', name: f.name });
    }

    var wrapClass = 'yc-field';
    if (WIDTH_CLASS[f.width]) wrapClass += ' ' + WIDTH_CLASS[f.width];
    if (f.readonly) wrapClass += ' yc-field-locked';
    var wrap = el('div', { class: wrapClass });

    // Field-level showWhen wraps the individual .yc-field (contract §4.4).
    if (f.showWhen) applyShowWhen(wrap, f.showWhen, 'field "' + f.name + '"', warn);

    if (f.label != null && f.label !== '' && f.type !== 'checkbox') {
      wrap.appendChild(el('label', { class: 'yc-label', text: f.label }));
    }
    if (f.sublabel) {
      wrap.appendChild(el('div', { class: 'yc-sublabel', text: f.sublabel }));
    }

    var input;
    switch (f.type) {
      case 'textarea':
        input = el('textarea', {
          name: f.name, rows: f.rows || 3,
          placeholder: f.placeholder || null,
          maxlength: (f.maxLength > 0 ? f.maxLength : null)
        });
        break;

      case 'number':
        input = el('input', {
          type: 'number', name: f.name,
          placeholder: f.placeholder || null,
          min: (f.min != null ? f.min : null),
          max: (f.max != null ? f.max : null),
          step: (f.step != null ? f.step : null),
          maxlength: (f.maxLength > 0 ? f.maxLength : null)
        });
        break;

      case 'date':
        input = el('input', { type: 'date', name: f.name });
        break;

      case 'datetime':
        input = el('input', { type: 'datetime-local', name: f.name });
        break;

      case 'select': {
        input = el('select', { name: f.name });
        input.appendChild(el('option', { value: '', text: (f.placeholder || 'Select\u2026') }));
        (f.options || []).forEach(function (o) {
          var op = optOf(o);
          input.appendChild(el('option', { value: op.value, text: op.label }));
        });
        break;
      }

      case 'radio': {
        input = el('div', { class: 'yc-radio-group' });
        (f.options || []).forEach(function (o) {
          var op = optOf(o);
          input.appendChild(el('label', null, [
            el('input', { type: 'radio', name: f.name, value: op.value }),
            ' ' + op.label
          ]));
        });
        break;
      }

      case 'checkbox':
        // Single checkbox — label sits beside the box.
        input = el('label', null, [
          el('input', { type: 'checkbox', name: f.name }),
          ' ' + (f.label != null ? f.label : '')
        ]);
        break;

      case 'checkgroup': {
        input = el('div', { class: 'yc-check-grid', 'data-yc-checkgroup': f.name });
        (f.options || []).forEach(function (o) {
          var op = optOf(o);
          input.appendChild(el('label', null, [
            el('input', { type: 'checkbox', value: op.value }),
            ' ' + op.label
          ]));
        });
        if (f.allowOther) {
          // Exactly the markup _getCheckgroup/_setCheckgroup expect (mirrors
          // 341notes): data-yc-other checkbox, then a .yc-other-text wrapper
          // (initially hidden) containing the data-yc-other-text input.
          // _setCheckgroup manages the wrapper's visibility on populate; the
          // USER-click toggle is wired in renderBody (the runtime doesn't do
          // it — hand-built forms wire it themselves).
          input.appendChild(el('label', null, [
            el('input', { type: 'checkbox', 'data-yc-other': true, value: 'Other' }),
            ' Other'
          ]));
          input.appendChild(el('div', { class: 'yc-other-text', style: 'display:none;' }, [
            el('input', { type: 'text', 'data-yc-other-text': true,
                          placeholder: 'Please specify\u2026' })
          ]));
        }
        break;
      }

      case 'tags':
        // Source input; yc-forms hides it and builds the pill UI on init.
        input = el('input', { type: 'text', name: f.name });
        break;

      case 'text':
      default:
        input = el('input', {
          type: 'text', name: f.name,
          placeholder: f.placeholder || null,
          maxlength: (f.maxLength > 0 ? f.maxLength : null)
        });
        break;
    }

    // Locked message + mask attribute apply to the actual control element.
    var control = (f.type === 'checkbox') ? input.querySelector('input') : input;
    if (f.readonly && f.lockedMsg && control && control.setAttribute) {
      control.setAttribute('data-yc-locked-msg', f.lockedMsg);
    }
    if (f.mask && control && control.setAttribute && control.tagName === 'INPUT') {
      control.setAttribute('data-yc-mask', f.mask);
    }

    wrap.appendChild(input);
    wrap.appendChild(el('small', { class: 'yc-error' }));   // §4.3 locked decision
    return wrap;
  }

  // ── Build one REPEATER field's DOM (contract §4.2 subset: text, number,
  //    date, select, checkbox). No masks, no validation, no showWhen, no
  //    prefill inside repeaters in v1 (matches runtime capability). ──
  function buildRepeaterField(f, repKey, warn) {
    var type = f.type;
    if (!REPEATER_TYPES[type]) {
      warn('repeater "' + repKey + '" field "' + f.name + '": type "' + type
         + '" is not supported inside repeaters — rendered as text');
      type = 'text';
    }
    if (f.prefill)  warn('repeater "' + repKey + '" field "' + f.name + '": prefill is not supported inside repeaters — ignored');
    if (f.showWhen) warn('repeater "' + repKey + '" field "' + f.name + '": showWhen is not supported inside repeaters — ignored');
    if (f.mask)     warn('repeater "' + repKey + '" field "' + f.name + '": masks are not supported inside repeaters — ignored');

    var wrapClass = 'yc-field';
    if (WIDTH_CLASS[f.width]) wrapClass += ' ' + WIDTH_CLASS[f.width];
    var wrap = el('div', { class: wrapClass });

    if (f.label != null && f.label !== '' && type !== 'checkbox') {
      wrap.appendChild(el('label', { class: 'yc-label', text: f.label }));
    }

    var input;
    switch (type) {
      case 'number':
        input = el('input', {
          type: 'number', name: f.name,
          placeholder: f.placeholder || null,
          min: (f.min != null ? f.min : null),
          max: (f.max != null ? f.max : null),
          step: (f.step != null ? f.step : null)
        });
        break;
      case 'date':
        input = el('input', { type: 'date', name: f.name });
        break;
      case 'select': {
        input = el('select', { name: f.name });
        input.appendChild(el('option', { value: '', text: (f.placeholder || 'Select\u2026') }));
        (f.options || []).forEach(function (o) {
          var op = optOf(o);
          input.appendChild(el('option', { value: op.value, text: op.label }));
        });
        break;
      }
      case 'checkbox':
        input = el('label', null, [
          el('input', { type: 'checkbox', name: f.name }),
          ' ' + (f.label != null ? f.label : '')
        ]);
        break;
      case 'text':
      default:
        input = el('input', {
          type: 'text', name: f.name,
          placeholder: f.placeholder || null
        });
        break;
    }

    wrap.appendChild(input);
    wrap.appendChild(el('small', { class: 'yc-error' }));   // uniform markup (§4.3)
    return wrap;
  }

  // ── Build a repeater section (contract §4.2). Emits:
  //      <div.yc-section>
  //        title / subtitle
  //        <div.yc-repeater id=ycRep_{key}>          ← repConfig.container
  //        <button.yc-repeater-add data-repeater={key}>  ← _setupRepeaters binds
  //        <template id=ycRepTpl_{key}>              ← repConfig.template
  //          <div.yc-repeater-item><div.yc-row> fields… <button.yc-repeater-remove>
  //    Add button sits AFTER the container (contact-form pattern):
  //    _addRepeaterItemWithData finds no .yc-repeater-add inside the container
  //    and appends items at the container end. The button IS inside the form
  //    root, which is what _setupRepeaters' this.el scan requires.
  //    IMPORTANT: children of a programmatically-built <template> must go into
  //    template.content — appendChild on the element itself leaves .content
  //    empty and _addRepeaterItemWithData would clone nothing. ──
  function buildRepeaterSection(section, warn) {
    var repKey = section.repeater;
    var sec = el('div', { class: 'yc-section' });
    if (section.showWhen) applyShowWhen(sec, section.showWhen, 'repeater section "' + repKey + '"', warn);
    if (section.title)    sec.appendChild(el('div', { class: 'yc-section-title', text: section.title }));
    if (section.subtitle) sec.appendChild(el('div', { class: 'yc-section-subtitle', text: section.subtitle }));

    var contId = 'ycRep_' + repKey;
    var tplId  = 'ycRepTpl_' + repKey;

    sec.appendChild(el('div', { class: 'yc-repeater', id: contId }));
    sec.appendChild(el('button', {
      type: 'button', class: 'yc-repeater-add', 'data-repeater': repKey,
      text: section.addLabel || '+ Add'
    }));

    var tpl  = el('template', { id: tplId });
    var item = el('div', { class: 'yc-repeater-item' });
    var row  = el('div', { class: 'yc-row' });
    var repFields = {};
    (section.fields || []).forEach(function (f) {
      if (!f || !f.name) return;
      row.appendChild(buildRepeaterField(f, repKey, warn));
      repFields[f.name] = { type: (f.type === 'checkbox' ? 'checkbox' : (YC_TYPE[f.type] || 'text')) };
    });
    row.appendChild(el('button', { type: 'button', class: 'yc-repeater-remove',
                                   title: 'Remove', text: '\u00d7' }));
    item.appendChild(row);
    tpl.content.appendChild(item);       // ← .content, not the element (see above)
    sec.appendChild(tpl);

    return {
      node: sec,
      config: { container: '#' + contId, template: '#' + tplId, fields: repFields }
    };
  }

  // ── Build the skeleton chrome (header + optional draft banner + form). ──
  function buildSkeleton(def) {
    var toggle = def.toggle !== false;
    var warningText = (def.warningText != null) ? def.warningText : 'You must press SAVE to keep changes!';

    // Header
    var toggleBox;
    if (toggle) {
      toggleBox = el('div', { class: 'yc-toggle' }, [
        el('span', { class: 'yc-toggle-label-view', text: 'View Mode' }),
        el('div', { class: 'form-check form-switch' }, [
          el('input', { class: 'form-check-input', type: 'checkbox', id: 'toggleBtn' }),
          el('label', { class: 'form-check-label', for: 'toggleBtn', id: 'toggleLabel', text: 'Mode' })
        ]),
        el('span', { class: 'yc-toggle-label-edit', text: 'Edit Mode' })
      ]);
    } else {
      toggleBox = el('div', { class: 'yc-toggle', style: 'display:none;' }, [
        el('input', { class: 'form-check-input', type: 'checkbox', id: 'toggleBtn' }),
        el('label', { class: 'form-check-label', for: 'toggleBtn', id: 'toggleLabel', text: 'View Mode' })
      ]);
    }
    var header = el('div', { class: 'yc-form-header' }, [
      toggleBox,
      el('span', { class: 'yc-save-status', id: 'saveStatus' }),
      // Initial display:none; setReadonly() shows it in edit mode.
      el('span', { class: 'yc-warning', id: 'warning', style: 'display:none;', text: warningText })
    ]);
    document.body.appendChild(header);

    // Draft banner — OMITTED in preview so the Discard→DELETE path can't exist
    // and _showDraftBanner() no-ops (it returns early when #draftBanner absent).
    if (!preview) {
      document.body.appendChild(
        el('div', { class: 'yc-draft-banner', id: 'draftBanner', style: 'display:none;' }, [
          el('span', null, [
            'You have unsaved changes from ',
            el('strong', { id: 'draftTimestamp' })
          ]),
          el('button', { class: 'yc-btn yc-btn-sm yc-btn-primary', id: 'draftRestore', text: 'Restore' }),
          el('button', { class: 'yc-btn yc-btn-sm yc-btn-secondary', id: 'draftDiscard', text: 'Discard' })
        ])
      );
    } else {
      document.body.appendChild(
        el('div', { class: 'ycr-preview-note', text:
          'Preview' + (params.get('link_id') ? ' (reading live data — nothing is saved)' : ' (layout only — no entity loaded)') })
      );
    }

    // Form
    var form = el('form', { id: 'ycRenderForm', class: 'yc-form' });
    document.body.appendChild(form);
    return form;
  }

  // ── Render sections into the form + collect field configs. ──
  function renderBody(def, form, warn) {
    var fields = {}, validation = {}, apiMap = {}, repeaters = {};
    var forwardMap = {};   // fieldName -> apiColumn (only fields with apiColumn)
    var readonlySet = {};
    var prefills = [];     // [{ name, expr, mode }] — batched /resolve in onLoad (§5)

    function registerField(f) {
      var ycType = YC_TYPE[f.type] || 'text';
      var fc = { el: fieldSelector(f), type: ycType };
      if (f.readonly) { fc.readonly = true; readonlySet[f.name] = true; }
      fields[f.name] = fc;

      if (f.apiColumn) {
        apiMap[f.apiColumn] = f.name;   // {apiColumn: fieldName} — _mergeApiData direction
        forwardMap[f.name] = f.apiColumn;
      }

      // Prefill (§5): collected here, resolved in one batched call by the
      // generated onLoad. prefillMode defaults to ifEmpty.
      if (typeof f.prefill === 'string' && f.prefill) {
        prefills.push({
          name: f.name,
          expr: f.prefill,
          mode: f.prefillMode === 'always' ? 'always' : 'ifEmpty'
        });
      }

      // Validation derivation (§4.3). pattern MUST be a RegExp — validate()
      // calls rules.pattern.test(). Bad regexes are rejected at publish (§7),
      // but guard here too so a preview of a bad draft doesn't throw.
      var rules = {};
      if (f.required) rules.required = true;
      if (f.minLength > 0) rules.minLength = f.minLength;
      if (f.maxLength > 0) rules.maxLength = f.maxLength;
      if (f.email) rules.email = true;
      if (f.mask) rules.mask = f.mask;
      if (f.pattern) {
        try {
          rules.pattern = new RegExp(f.pattern);
          if (f.patternMessage) rules.patternMessage = f.patternMessage;
        } catch (e) {
          warn('field "' + f.name + '": pattern is not a valid RegExp — skipped (' + e.message + ')');
        }
      }
      if (Object.keys(rules).length) validation[f.name] = rules;
    }

    (def.sections || []).forEach(function (section, i) {
      if (section && Object.prototype.hasOwnProperty.call(section, 'repeater')) {
        var rep = buildRepeaterSection(section, warn);
        // Repeater field names are validated unique form-wide (server §7), so
        // they can never shadow a top-level [name=…] the conditional engine or
        // validate() would query.
        repeaters[section.repeater] = rep.config;
        form.appendChild(rep.node);
        return;
      }

      var sec = el('div', { class: 'yc-section' });
      if (section.showWhen) applyShowWhen(sec, section.showWhen, 'sections[' + i + ']', warn);
      if (section.title)    sec.appendChild(el('div', { class: 'yc-section-title', text: section.title }));
      if (section.subtitle) sec.appendChild(el('div', { class: 'yc-section-subtitle', text: section.subtitle }));

      (section.rows || []).forEach(function (row, j) {
        var rowEl = el('div', { class: 'yc-row' });
        if (row && row.showWhen) applyShowWhen(rowEl, row.showWhen, 'sections[' + i + '].rows[' + j + ']', warn);
        (row.fields || []).forEach(function (f) {
          var node = buildField(f, warn);
          if (node) rowEl.appendChild(node);
          registerField(f);
        });
        sec.appendChild(rowEl);
      });

      form.appendChild(sec);
    });

    // Wire the user-click "Other" toggle on every allowOther checkgroup. The
    // runtime only manages .yc-other-text visibility on populate
    // (_setCheckgroup); the click behavior is form-page responsibility (see
    // 341notes setupOtherToggle — mirrored here).
    form.querySelectorAll('.yc-check-grid').forEach(function (grid) {
      var otherCb  = grid.querySelector('input[data-yc-other]');
      var otherDiv = grid.querySelector('.yc-other-text');
      if (!otherCb || !otherDiv) return;
      otherCb.addEventListener('change', function () {
        otherDiv.style.display = otherCb.checked ? '' : 'none';
      });
    });

    // Save button (label from definition). Disabled in preview → its click
    // listener (added by yc-forms) never fires, so save() can't run.
    var saveLabel = def.saveLabel || 'Save';
    var saveBtn = el('button', {
      type: 'button', class: 'yc-btn yc-btn-primary yc-btn-block',
      id: 'saveBtn', text: preview ? (saveLabel + ' \u2014 disabled in preview') : saveLabel
    });
    if (preview) saveBtn.setAttribute('disabled', '');
    form.appendChild(saveBtn);

    return { fields: fields, validation: validation, apiMap: apiMap,
             repeaters: repeaters, prefills: prefills,
             forwardMap: forwardMap, readonlySet: readonlySet };
  }

  // ── Hooks (§3): load /forms/hooks/{name}.js and wait for it. Missing or
  //    broken file → console.warn + resolve anyway (render proceeds without
  //    hooks). 10s safety timeout in case the request never settles. ──
  function loadHooks(name) {
    return new Promise(function (resolve) {
      var done = false;
      function finish() { if (!done) { done = true; resolve(); } }

      // Same guard the server enforces (§7). Published definitions have
      // already passed it; belt-and-braces for anything else.
      if (!/^[a-zA-Z0-9_-]{1,50}$/.test(name)) {
        console.warn('[render] hooks "' + name + '" has an invalid name — not loaded');
        return finish();
      }
      var s = document.createElement('script');
      s.src = '/forms/hooks/' + name + '.js';
      s.onload = finish;
      s.onerror = function () {
        console.warn('[render] hooks file /forms/hooks/' + name + '.js failed to load — continuing without hooks');
        finish();
      };
      setTimeout(function () {
        if (!done) console.warn('[render] hooks file /forms/hooks/' + name + '.js load timed out — continuing without hooks');
        finish();
      }, 10000);
      document.head.appendChild(s);
    });
  }

  // ── Prefill write helper: set one field's value the way populate() would,
  //    honoring prefillMode. Runs inside onLoad — i.e. BEFORE init step 13c's
  //    resetBaseline — so prefilled values are part of the clean state. ──
  function writePrefill(form_, fields, name, rawVal, mode) {
    var fc = fields[name];
    if (!fc) return;
    var ctl = form_.el.querySelector(fc.el);
    if (!ctl) return;

    // Current value, read the way collect() reads it (ifEmpty guard).
    var cur;
    if (fc.type === 'checkbox') {
      cur = ctl.checked ? 'x' : '';
    } else if (fc.type === 'radio') {
      var ck = form_.el.querySelector('input[name="' + name + '"]:checked');
      cur = ck ? ck.value : '';
    } else if (fc.type === 'tags') {
      cur = form_._getTags(name);
    } else if (fc.type === 'checkgroup') {
      cur = form_._getCheckgroup(ctl);
    } else {
      cur = ctl.value;
    }
    if (mode !== 'always' && String(cur).trim() !== '') return;   // ifEmpty

    var val = form_._formatForDisplay(rawVal, fc);   // date/datetime/mask normalization
    if (fc.type === 'checkbox') {
      ctl.checked = !!rawVal && rawVal !== 'false' && rawVal !== '0';
    } else if (fc.type === 'radio') {
      form_.el.querySelectorAll('input[name="' + name + '"]').forEach(function (r) {
        r.checked = r.value === String(val);
      });
    } else if (fc.type === 'tags') {
      form_._setTags(name, String(val));
    } else if (fc.type === 'checkgroup') {
      form_._setCheckgroup(ctl, String(val));
    } else {
      ctl.value = val;
    }
  }

  // ── Assemble the YCForm config and boot. ──
  function boot(def, meta) {
    var warned = {};
    function warn(msg) { if (!warned[msg]) { warned[msg] = 1; console.warn('[render] ' + msg); } }

    document.title = meta.title || 'Form';

    var form = buildSkeleton(def);
    var maps = renderBody(def, form, warn);

    var toggle = def.toggle !== false;

    var config = {
      formKey:       meta.formKey,
      schemaVersion: meta.schemaVersion,
      linkType:      meta.linkType,
      linkId:        meta.linkId || '',
      container:     '#ycRenderForm',
      dataMode:      def.dataMode === 'snapshot' ? 'snapshot' : 'live',
      autosave:      preview ? false : (def.autosave !== false),
      autosaveMs:    (typeof def.autosaveMs === 'number' && def.autosaveMs > 0) ? def.autosaveMs : 3000,
      readonly:      toggle,                 // toggle:true → start read-only; false → always edit
      fields:        maps.fields,
      repeaters:     maps.repeaters,
      validation:    maps.validation,
      apiMap:        maps.apiMap,
      endpoints:     {},
      onSubmit:      def.onSubmit || {}
    };

    // endpoints.load: pass through the definition's. Skipped entirely in
    // preview-without-entity (pure layout). Included (read-only GET) when a
    // link_id is present.
    var wantLoad = def.endpoints && def.endpoints.load && (!preview || !!meta.linkId);
    if (wantLoad) config.endpoints.load = def.endpoints.load;

    // Prefill is active only in normal mode with a linkId. (Preview never
    // executes prefill — a preview must not fire resolver calls; and without a
    // linkId there is nothing to anchor the refs on.)
    var wantPrefill = maps.prefills.length > 0 && !preview && !!meta.linkId;
    if (maps.prefills.length && !wantPrefill) {
      warn('prefill skipped (' + (preview ? 'preview mode' : 'no linkId') + ')');
    }

    // Generated onLoad (§5 prefill + §3 hooks.onLoad). Runs at init step 13,
    // BEFORE step 13c's resetBaseline — so nothing written here dirties the
    // form — and before 13b, so prefilled values drive conditionals.
    config.onLoad = async function (data) {
      if (wantPrefill) {
        try {
          var res = await api('/resolve', 'POST', {
            text: maps.prefills.map(function (p) { return p.expr; }).join(PREFILL_SEP),
            refs: REFS_FOR[meta.linkType] ? REFS_FOR[meta.linkType](meta.linkId) : {}
          });
          if (res && (res.status === 'success' || res.status === 'partial_success')
              && typeof res.text === 'string') {
            var parts = res.text.split(PREFILL_SEP);
            if (parts.length === maps.prefills.length) {
              maps.prefills.forEach(function (p, i) {
                // Unresolved placeholders come back LITERAL ("{{…}}" — see
                // resolverService replacePlaceholders). Never write those.
                if (parts[i].indexOf('{{') !== -1) return;
                writePrefill(form_, maps.fields, p.name, parts[i], p.mode);
              });
            } else {
              warn('prefill: resolver part count mismatch (a resolved value likely contains "' + PREFILL_SEP + '") — prefill skipped');
            }
          } else if (res && res.status === 'failed') {
            warn('prefill: resolver returned failed — ' + ((res.errors || []).join('; ') || 'no detail'));
          }
        } catch (e) {
          console.warn('[render] prefill failed:', e);
        }
      }

      // Hooks onLoad — LAST in the generated onLoad, after prefill (§3).
      // Isolated: a broken hook degrades, it must not abort init (which would
      // skip steps 13c/13b and leave the form dirty with stale conditionals).
      if (window.ycHooks && typeof window.ycHooks.onLoad === 'function') {
        try { await window.ycHooks.onLoad(form_, data); }
        catch (e) { console.warn('[render] ycHooks.onLoad failed:', e); }
      }
    };

    // Hooks onSave — awaited by save() step 11, then save() re-baselines
    // (unless the user typed during the await; yc-forms fences that).
    config.onSave = async function (result) {
      if (window.ycHooks && typeof window.ycHooks.onSave === 'function') {
        try { await window.ycHooks.onSave(form_, result); }
        catch (e) { console.warn('[render] ycHooks.onSave failed:', e); }
      }
    };

    var form_ = new YCForm(config);

    // apiColumn whitelist PATCH payload (contract §3): changed ∧ has apiColumn
    // ∧ not readonly. Deliberately narrower than the default _buildPatchPayload
    // (which would send every changed non-readonly field under its own name).
    form_._buildPatchPayload = function () {
      var diff = this.getDiff();
      var payload = {};
      for (var name in diff) {
        if (!Object.prototype.hasOwnProperty.call(diff, name)) continue;
        var col = maps.forwardMap[name];
        if (!col) continue;                    // no apiColumn → not part of PATCH
        if (maps.readonlySet[name]) continue;  // readonly → excluded
        payload[col] = diff[name][1];          // [oldVal, newVal]
      }
      return payload;
    };

    // Hooks file (§3): loaded + awaited BEFORE init so window.ycHooks exists
    // by the time the generated onLoad runs. Not loaded in preview — preview
    // must never execute side-effecting per-form code.
    if (def.hooks && !preview) {
      loadHooks(String(def.hooks)).then(function () { form_.init(); });
    } else {
      if (def.hooks && preview) warn('hooks ("' + def.hooks + '") are not loaded in preview mode');
      form_.init();
    }
  }

  // ── Resolve the definition + metadata, then boot. ──
  function start() {
    if (preview) {
      var templateId = params.get('template_id');
      if (!templateId) return fatal('Preview mode requires a template_id parameter.');
      api('/api/form-templates/' + encodeURIComponent(templateId), 'GET')
        .then(function (res) {
          var t = res && res.template;
          if (!t) return fatal('Template ' + templateId + ' not found.');
          var def = t.draft_definition;
          if (!def || typeof def !== 'object') return fatal('Template has no draft definition to preview.');
          boot(def, {
            formKey:       t.form_key,
            schemaVersion: t.schema_version,
            linkType:      t.link_type,
            title:         t.title,
            linkId:        params.get('link_id') || ''    // optional in preview
          });
        })
        .catch(function (e) { fatal('Could not load template for preview: ' + (e && e.message || e)); });
      return;
    }

    // Normal mode
    var formKey = params.get('form_key');
    if (!formKey) return fatal('Missing form_key parameter.');
    api('/api/form-templates/render/' + encodeURIComponent(formKey), 'GET')
      .then(function (res) {
        if (!res || res.status !== 'success' || !res.definition) {
          return fatal('No published form found for "' + formKey + '".');
        }
        var linkParam = res.link_type + '_id';           // case_id | contact_id | appt_id
        var linkId = params.get(linkParam);
        if (!linkId) return fatal('Missing ' + linkParam + ' parameter.');
        boot(res.definition, {
          formKey:       formKey,
          schemaVersion: res.schema_version,
          linkType:      res.link_type,
          title:         res.title,
          linkId:        linkId
        });
      })
      .catch(function (e) { fatal('Could not load form: ' + (e && e.message || e)); });
  }

  waitForParent(start);
})();
</script>
</body>
</html>
