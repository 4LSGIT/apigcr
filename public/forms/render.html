    //    tab-reveal listener. ORDER MATTERS for tab-reveal: yc-forms binds its
    //    own #saveBtn click listener in init step 1 (_setupToggle), so a
    //    listener registered after init() is guaranteed to run SECOND on the
    //    same click; validate() runs synchronously inside save() before its
    //    first await (and returns before any await when invalid), so the
    //    .yc-error.visible classes are already set when this fires. Sticky-
    //    region errors are always visible → scroll only. No errors → no-op.
    //    KNOWN NON-FIX: an error inside a showWhen-hidden wrapper on the
    //    ACTIVE tab stays invisible (A7-lint territory, unchanged by tabs).
    var wantTabs = Array.isArray(def.tabs);
    function afterInit() {
      if (!wantTabs) return;
      form_.setupTabs('.yc-tab-bar', '.yc-tab-panel');
      var saveBtnEl = document.getElementById('saveBtn');
      if (saveBtnEl) {
        saveBtnEl.addEventListener('click', function () {
          var err = form_.el.querySelector('.yc-error.visible');
          if (!err) return;
          var panel = err.closest('.yc-tab-panel');
          if (panel && !panel.classList.contains('active')) {
            var panels = Array.prototype.slice.call(form_.el.querySelectorAll('.yc-tab-panel'));
            var idx = panels.indexOf(panel);
            var btns = form_.el.querySelectorAll('.yc-tab-bar button');
            if (idx >= 0 && btns[idx]) btns[idx].click();
          }
          var fieldEl = err.closest('.yc-field') || err;
          if (fieldEl.scrollIntoView) {
            try { fieldEl.scrollIntoView({ block: 'center' }); } catch (e) { /* older engines */ }
          }
        });
      }
    }
    function startInit() { form_.init().then(afterInit); }

    // Per-form code (2.6 addendum A1): executed SYNCHRONOUSLY at exactly the
    // point the hooks file would load — before init, same boot-branch
    // structure — so window.ycHooks (if the code defines it) is guaranteed to
    // exist when the generated onLoad runs. new Function + immediate call
    // rather than an injected <script> element: appended-script execution is
    // task-queue-scheduled (environment-dependent ordering vs init's await
    // chain), while this is strictly before startInit in every environment,
    // and the try/catch gives the degrade guarantee directly (broken code
    // warns, never aborts init). Stored code is an IIFE assigning
    // window.ycHooks — the standard interface, wired identically to file
    // hooks with the same per-call isolation. NEVER executed in preview — any
    // preview mode. `code` and `hooks` are mutually exclusive (server-
    // enforced), so the branches below never both fire. This is AUTHORED code
    // under the reformulated §8 invariant (internal surfaces only; external
    // routes must refuse) — the textContent-for-data rule governs data, not
    // this.
    if (typeof def.code === 'string' && def.code && !preview && !VIEW) {
      try { new Function(def.code)(); }
      catch (e) { console.warn('[render] template code failed:', e); }
    } else if (def.code && (preview || VIEW)) {
      warn('template code is not executed in ' + (VIEW ? 'view' : 'preview') + ' mode');
    }

    // Hooks file (§3): loaded + awaited BEFORE init so window.ycHooks exists
    // by the time the generated onLoad runs. Not loaded in preview OR view —
    // neither may execute side-effecting per-form code (view's onLoad is the
    // populate-only replacement anyway).
    if (def.hooks && !preview && !VIEW) {
      loadHooks(String(def.hooks)).then(startInit);
    } else {
      if (def.hooks && (preview || VIEW)) warn('hooks ("' + def.hooks + '") are not loaded in ' + (VIEW ? 'view' : 'preview') + ' mode');
      startInit();
    }
  }

  // ── Resolve the definition + metadata, then boot. ──
  function start() {
    if (preview) {
      var templateId = params.get('template_id');
      if (!templateId) return fatal('Preview mode requires a template_id parameter.');
      api('/api/form-templates/' + encodeURIComponent(templateId), 'GET')
        .then(function (res) {
          var t = res && res.template;
          if (!t) return fatal('Template ' + templateId + ' not found.');
          var def = t.draft_definition;
          if (!def || typeof def !== 'object') return fatal('Template has no draft definition to preview.');
          boot(def, {
            formKey:       t.form_key,
            schemaVersion: t.schema_version,
            linkType:      t.link_type,
            title:         t.title,
            linkId:        params.get('link_id') || ''    // optional in preview
          });
        })
        .catch(function (e) { fatal('Could not load template for preview: ' + (e && e.message || e)); });
      return;
    }

    // External mode (X2): fetch the one /api/ext payload directly — no
    // parent, no authed routes. Error mapping (§5.4/§6): a badLink-reject
    // response renders the standing Unauthorized-Link copy; every other
    // failure (the one generic 404, network trouble) renders a generic
    // unavailable message that confirms nothing.
    if (EXT) {
      var extKey = params.get('form_key');
      if (!extKey) return fatal('Missing form_key parameter.');
      var extCaseId = params.get('case_id') || '';
      var extUrl = '/api/ext/forms/' + encodeURIComponent(extKey) +
                   (extCaseId ? '?case_id=' + encodeURIComponent(extCaseId) : '');
      fetch(extUrl)
        .then(function (resp) {
          return resp.json().catch(function () { return {}; }).then(function (body) {
            if (!resp.ok || !body || body.status !== 'success' || !body.definition) {
              if (body && body.badLink) {
                // §6 reject copy — matches the standing go.4lsg.com behavior.
                return fatal('Unauthorized Link or Client ID — Sorry, the link you '
                  + 'followed is unauthorized or the client ID is invalid. Please '
                  + 'contact us if you believe that this error is an error.');
              }
              return fatal('Sorry, this form is not available.');
            }
            EXT.load   = body.load || null;
            EXT.linked = !!body.linked;
            // postSubmit (X3/X3.3): validated server-side (message string
            // ≤2000, edit/new/redirectBack booleans, redirect path-or-https
            // ≤2000), rendered via textContent only below; redirect
            // navigates instead of the panel.
            EXT.postSubmit = (body.postSubmit && typeof body.postSubmit === 'object')
              ? body.postSubmit : null;
            boot(body.definition, {
              formKey:       extKey,
              schemaVersion: body.schema_version,
              linkType:      body.link_type,
              title:         body.title,
              // linkId only when the server confirmed the link — a degraded
              // anonymous boot must not carry a dead case_id into the submit
              // body or the draft key.
              linkId:        EXT.linked ? extCaseId : ''
            });
          });
        })
        .catch(function (e) {
          fatal('Sorry, this form is not available.');
        });
      return;
    }

    // View mode (X4): one round trip — submission + the definition to render
    // it under, version-matched server-side (getSubmissionForRender). Runs on
    // the parent apiSend chain like normal mode.
    if (VIEW) {
      api('/api/forms/submissions/' + encodeURIComponent(VIEW.id) + '/render', 'GET')
        .then(function (res) {
          if (!res || res.status !== 'success' || !res.definition) {
            return fatal('Could not load submission ' + VIEW.id + '.');
          }
          var sub = res.submission || {};
          VIEW.data = (typeof sub.data === 'string')
            ? (function () { try { return JSON.parse(sub.data); } catch (e) { return {}; } })()
            : (sub.data || {});

          // Banner: id, form, version, received, linkage.
          var when = String(sub.created_at || '').replace('T', ' ').replace(/\.\d+Z?$/, '').replace(/Z$/, '');
          var linkage = sub.link_type
            ? ('linked to ' + sub.link_type + ' ' + sub.link_id)
            : 'unlinked';
          VIEW.note = 'Submission #' + sub.id + ' \u2014 ' + (res.title || sub.form_key)
                    + ' (schema v' + sub.schema_version + ')'
                    + (when ? ' \u2014 received ' + when : '')
                    + ' \u2014 ' + linkage;
          if (res.schema_matched === false) {
            VIEW.warn = 'No stored definition matches schema v' + sub.schema_version
                      + ' \u2014 rendering under the current v' + res.definition_schema_version
                      + '; answers for removed fields are not shown.';
          }

          boot(res.definition, {
            formKey:       sub.form_key,
            schemaVersion: res.definition_schema_version,
            linkType:      res.link_type,
            title:         res.title,
            linkId:        ''            // deliberate — see the config comment
          });
        })
        .catch(function (e) { fatal('Could not load submission: ' + (e && e.message || e)); });
      return;
    }

    // Normal mode
    var formKey = params.get('form_key');
    if (!formKey) return fatal('Missing form_key parameter.');
    api('/api/form-templates/render/' + encodeURIComponent(formKey), 'GET')
      .then(function (res) {
        if (!res || res.status !== 'success' || !res.definition) {
          return fatal('No published form found for "' + formKey + '".');
        }
        var linkParam = res.link_type + '_id';           // case_id | contact_id | appt_id
        var linkId = params.get(linkParam);
        if (!linkId) return fatal('Missing ' + linkParam + ' parameter.');
        boot(res.definition, {
          formKey:       formKey,
          schemaVersion: res.schema_version,
          linkType:      res.link_type,
          title:         res.title,
          linkId:        linkId
        });
      })
      .catch(function (e) { fatal('Could not load form: ' + (e && e.message || e)); });
  }

  if (EXT) start();            // X2: no parent chain to wait for
  else waitForParent(start);
})();
</script>
</body>
</html>
