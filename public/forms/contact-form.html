<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Information</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="/themeSync.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="/css/yc-forms.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* ──────────────────────────────────────────────────────────
       Slice 3 Stage B.2 — repeater-specific styling
       Local to this form. Keep yc-forms.css untouched.
       ────────────────────────────────────────────────────────── */

    /* Section header with title + History/Add affordances */
    .ycp-section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .ycp-section-head .yc-section-title { margin: 0; flex: 1; }
    .ycp-section-head button {
      background: none;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--text-2);
      cursor: pointer;
    }
    .ycp-section-head button:hover { background: var(--hover); color: var(--text); }
    .yc-readonly .ycp-section-head .ycp-history-btn:hover { background: var(--hover); color: var(--text); }
    .yc-readonly .ycp-section-head .ycp-add-inline { display: none; }

    /* Inline-style add button (lives in section head instead of bottom dashed bar) */
    .ycp-add-inline {
      color: var(--accent-2);
      border-color: var(--accent);
    }
    .ycp-add-inline:hover { background: var(--accent-soft); color: var(--accent-on-soft); }

    /* Per-row mini header: label + primary + remove on one tight row */
    .ycp-row-main {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .ycp-row-main .yc-field { margin-bottom: 0; }
    .ycp-primary-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-bottom: 8px;
      font-size: 12px;
      color: var(--text-2);
      white-space: nowrap;
    }
    .ycp-primary-wrap input { margin: 0; cursor: pointer; }
    .ycp-actions {
      display: flex;
      gap: 4px;
      padding-bottom: 4px;
    }
    .ycp-advanced-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 32px;
      height: 32px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
    }
    .ycp-advanced-toggle:hover { background: var(--hover); color: var(--text); }

    /* Section title icon — sits left of the title text */
    .ycp-section-icon {
      color: var(--text-muted);
      margin-right: 6px;
      font-size: 14px;
    }

    /* Readonly state for repeater controls.
       Driven by JS (applyRepeaterReadonly) which sets readOnly on text/email
       inputs and disabled on checkboxes/selects. CSS here just dims the
       visual so view mode is obviously non-interactive. The advanced ⚙
       toggle is intentionally NOT styled here so it stays usable in view
       mode. */
    .yc-readonly .yc-repeater-item input[readonly] {
      background: var(--surface-2);
      color: var(--text-2);
    }
    .yc-readonly .yc-repeater-item input[disabled],
    .yc-readonly .yc-repeater-item select[disabled] {
      background: var(--surface-2);
      color: var(--text-2);
      opacity: 0.7;
    }
    .yc-readonly .yc-repeater-item .yc-repeater-remove { display: none; }

    /* Per-row error stamp (Stage B.2.b) — set via .dataset.ycpError when a
       400 validation response includes a row-level error. Cleared by the
       user editing any input in the row, or by the next showValidationModal
       call (fresh re-stamp). */
    .yc-repeater-item[data-ycp-error] {
      border-left: 3px solid var(--danger);
      background: var(--danger-soft);
      padding-left: 8px;
    }
    .yc-repeater-item[data-ycp-error]::before {
      content: attr(data-ycp-error);
      display: block;
      color: var(--danger);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px 4px 0;
      margin: 0 0 6px 0;
    }

    /* Advanced block — collapsed by default; .open shows it */
    .ycp-advanced { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .ycp-repeater-item.ycp-open .ycp-advanced { display: block; }

    /* Field width tweaks (mostly narrowing fixed-size inputs for the inline row) */
    .ycp-w-phone   { flex: 0 0 160px; }
    .ycp-w-label   { flex: 0 0 110px; }
    .ycp-w-state   { flex: 0 0 80px; }
    .ycp-w-zip     { flex: 0 0 110px; }
    .ycp-w-grow    { flex: 1 1 auto; min-width: 180px; }

    /* History modal table */
    .ycp-hist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .ycp-hist-table th, .ycp-hist-table td {
      padding: 4px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .ycp-hist-table th { background: var(--surface-2); font-weight: 600; color: var(--text-2); }
    .ycp-revive-btn {
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--accent-2);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .ycp-revive-btn:hover { background: var(--accent-soft); color: var(--accent-on-soft); }

    /* Transfer modal list — readable, grouped by source contact */
    .ycp-conflict-source { font-weight: 600; margin-top: 8px; }
    .ycp-conflict-source:first-child { margin-top: 0; }
    .ycp-conflict-list { margin: 4px 0 0 18px; font-size: 13px; }
    /* SweetAlert in dark mode. This form puts THEMED markup inside its
       popups — the history table, the transfer list, the revive confirm —
       so the popup has to be a themed surface or --text-2 lands on Swal's
       hardcoded white. Same block as index.html:531, reports.html:190 and
       dbConsole.html:131. */
    html[data-theme="dark"] .swal2-popup {
      background: var(--surface) !important;
      color: var(--text) !important;
    }
    html[data-theme="dark"] .swal2-title,
    html[data-theme="dark"] .swal2-html-container {
      color: var(--text) !important;
    }
    html[data-theme="dark"] .swal2-input,
    html[data-theme="dark"] .swal2-textarea,
    html[data-theme="dark"] .swal2-select {
      background: var(--surface-2) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    /* ── Kind selector (org-contacts slice 3) ───────────────────────────
       Sits above the identity rows and swaps which of the two blocks is
       displayed. Both blocks stay in the DOM: yc-forms.js resolves every
       config.fields entry with querySelector at construction time, and a
       removed node would make the hidden kind's fields permanently
       unreadable (populate and collect both silently skip a null el).
       Display-toggling keeps the values live and the diff honest. */
    .ycp-kind-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .ycp-kind-row .yc-label { margin: 0; }
    /* Track for a two-position slider.
       A COLOURED half — tint or solid fill — cannot work here: with exactly
       two options nothing tells you whether the colour marks the one you
       picked or the one you didn't. So the slider physically COVERS the
       option you did not pick. Exactly one word is ever readable, and that
       word is the answer:  [/////] Organization  =  it's an Organization. */
    .ycp-kind-seg {
      position: relative;
      /* GRID, not flex. The track is shrink-to-fit, so a flex row has no free
         space to distribute and `flex:1` leaves the halves at their natural
         widths (72px vs 109px — measured); two 1fr columns are equal to the
         wider label by definition, which is what makes the pill's 50% land. */
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      background: var(--surface-sunken);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    /* The cover. Absolutely positioned, so its percentages resolve against the
       track's PADDING box: one half is calc(50% - 3px), and translateX(100%)
       — 100% of the cover's OWN width — parks it exactly over the other half.
       No JS measurement, and nothing to re-measure when the labels or the
       font change.

       Person always holds the left slot and Organization the right; only the
       cover moves. It sits ABOVE the labels (z-index) and is fully OPAQUE —
       a translucent slab would ghost the hidden word through and put both
       words back on screen. pointer-events:none lets the click fall through
       to the button underneath, so shoving the slider off a word selects it. */
    .ycp-kind-cover {
      position: absolute;
      top: 3px; bottom: 3px; left: 3px;
      width: calc(50% - 3px);
      z-index: 2;
      pointer-events: none;
      border-radius: 6px;
      background-color: var(--border-strong);
      /* The grip: five hairlines, centred. Purely so the slab reads as a
         thing you push rather than an empty box. */
      background-image: repeating-linear-gradient(90deg, var(--surface) 0 1px, transparent 1px 4px);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 21px 11px;
      transform: translateX(100%);   /* person selected → cover the RIGHT half */
    }
    .ycp-kind-seg[data-kind="org"] .ycp-kind-cover { transform: translateX(0); }
    /* Hovering the covered half darkens the slab. An inset shadow paints OVER
       the opaque background, so the hidden word stays hidden — dropping
       opacity here would leak it. */
    .ycp-kind-seg button:not(.active):not(:disabled):hover ~ .ycp-kind-cover {
      box-shadow: inset 0 0 0 99px rgba(0, 0, 0, .07);
    }
    /* Slide only AFTER the first render — .is-ready is added a frame later, so
       a stored org paints covered-on-the-left instead of gliding across. */
    .ycp-kind-seg.is-ready .ycp-kind-cover { transition: transform .16s cubic-bezier(.4, 0, .2, 1); }
    @media (prefers-reduced-motion: reduce) {
      .ycp-kind-seg.is-ready .ycp-kind-cover { transition: none; }
    }

    /* The weight stays 600 in BOTH states on purpose: a weight that changed
       with selection would resize the track under the pill mid-slide and
       leave it straddling the seam. */
    .ycp-kind-seg button {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .12s ease;
    }
    /* The readable half is the value, so it gets full body text. The covered
       half's colour only matters if the cover ever fails to paint — keep it
       legible rather than invisible, so a CSS failure degrades to the old
       two-words state instead of a blank. Clicking the value is a no-op, so
       only the covered half claims the pointer cursor. */
    .ycp-kind-seg button.active { color: var(--text); cursor: default; }
    .yc-readonly .ycp-kind-seg { opacity: .75; }
    .yc-readonly .ycp-kind-seg button { cursor: default; }

    /* ──────────────────────────────────────────────────────────
       Role-forms slice — Roles section. Child resource with its
       own save path; NOT part of the aggregate PATCH, autosave,
       or dirty tracking (it lives outside #contactForm).
       ────────────────────────────────────────────────────────── */
    /* The section sits OUTSIDE <form id="contactForm">, so it never picked up
       .yc-form's card box (max-width 950 / centred / padded) and ran the full
       body width while the form above it stayed 950. Mirror the card here so
       the two line up; keep the values in step with .yc-form in yc-forms.css. */
    #rolesSection {
      max-width: 950px;
      margin: 16px auto 0;
      padding: 20px;
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    @media (max-width: 600px) { #rolesSection { padding: 14px; } }
    /* .yc-section-title's 20px top margin is meant to separate stacked
       sections inside a card; as the card's first line it just dents the top. */
    #rolesSection .yc-section-title { margin-top: 0; }

    .ycr-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--surface);
    }
    .ycr-card.ycr-inactive { opacity: 0.55; background: var(--surface-2); }
    .ycr-card.ycr-pending  { border-style: dashed; border-color: var(--accent); }
    .ycr-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .ycr-title { font-weight: 600; flex: 1; }
    .ycr-badge {
      font-size: 11px; border: 1px solid var(--border-strong); border-radius: 4px;
      padding: 1px 6px; color: var(--text-muted); white-space: nowrap;
    }
    .ycr-status { font-size: 11px; color: var(--text-muted); }
    .ycr-head button {
      background: none; border: 1px solid var(--border-strong); border-radius: 4px;
      padding: 3px 10px; font-size: 12px; color: var(--text-2); cursor: pointer;
    }
    .ycr-head button:hover { background: var(--hover); color: var(--text); }
    .ycr-head .ycr-save { color: var(--accent-2); border-color: var(--accent); }
    .ycr-head .ycr-save:hover { background: var(--accent-soft); color: var(--accent-on-soft); }
    .ycr-checks { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 6px; }
    .ycr-req { color: var(--danger); }
    .ycr-empty { color: var(--text-muted); font-size: 12px; }
    .ycr-note { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .ycr-status.ycr-err { color: var(--danger); }
    /* The pending card's role picker. It replaces a modal, so it has to read as
       the card's title line, not as a stray control tucked in the header. */
    .ycr-picker {
      flex: 1; min-width: 170px; max-width: 320px;
      padding: 5px 8px; border: 1px solid var(--accent); border-radius: 4px;
      background: var(--surface-2); color: var(--text);
      font-family: inherit; font-size: 0.92rem; font-weight: 600;
    }
    .ycr-picker:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
    /* View mode: hide every mutating affordance; JS locks the inputs.
       #roleAddBtn is the exception — it stays visible and flips the form into
       edit mode itself, so adding a role no longer means scrolling to the
       header toggle first. */
    .ycr-readonly .ycr-save, .ycr-readonly .ycr-remove, .ycr-readonly .ycr-reactivate,
    .ycr-readonly .ycr-delete, .ycr-readonly .ycr-cancel { display: none; }
    .ycr-readonly .ycr-card input[readonly] { background: var(--surface-2); color: var(--text-2); }
    .ycr-readonly .ycr-card input[disabled],
    .ycr-readonly .ycr-card select[disabled] { background: var(--surface-2); color: var(--text-2); opacity: 0.7; }
  </style>
</head>
<body>

<div class="yc-form-header">
  <div class="yc-toggle">
    <span class="yc-toggle-label-view">View Mode</span>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="toggleBtn">
      <label class="form-check-label" for="toggleBtn" id="toggleLabel">Mode</label>
    </div>
    <span class="yc-toggle-label-edit">Edit Mode</span>
  </div>
  <span class="yc-save-status" id="saveStatus"></span>
  <span class="yc-warning" id="warning">You must press SAVE to keep changes!</span>
</div>

<div class="yc-draft-banner" id="draftBanner" style="display:none;">
  <span>You have unsaved changes from <strong id="draftTimestamp"></strong></span>
  <button class="yc-btn yc-btn-sm yc-btn-primary" id="draftRestore">Restore</button>
  <button class="yc-btn yc-btn-sm yc-btn-secondary" id="draftDiscard">Discard</button>
</div>

<form id="contactForm" class="yc-form">

  <!-- ── Row 0: Kind selector (org-contacts slice 3) ── -->
  <div class="ycp-kind-row">
    <label class="yc-label">This contact is a</label>
    <div class="ycp-kind-seg" id="kindSeg" data-kind="person">
      <button type="button" data-kind="person" aria-pressed="true">Person</button>
      <button type="button" data-kind="org" aria-pressed="false">Organization</button>
      <!-- The slider, LAST so the hover rule can reach it as a sibling. It is
           absolutely positioned, so document order costs it nothing in layout.
           Decorative: hiding a word is a visual act only — the real state goes
           to assistive tech through aria-pressed on the buttons. -->
      <span class="ycp-kind-cover" aria-hidden="true"></span>
    </div>
    <!-- The real field. Hidden input, not the buttons — yc-forms.js reads
         and diffs `value`, and the segmented control is only its skin. -->
    <input type="hidden" name="kind" value="person">
  </div>

  <!-- ── Row 1: Preferred Name / DBA + Contact ID ── -->
  <div class="yc-row">
    <div class="yc-field">
      <label class="yc-label" data-kind-label="pname">Preferred Name</label>
      <input type="text" name="pname" placeholder="Preferred name">
    </div>
    <div class="yc-field yc-field-locked">
      <label class="yc-label">Contact ID</label>
      <input type="text" name="contact_id" placeholder="Contact ID" data-yc-locked-msg="The Contact ID cannot be changed">
    </div>
  </div>

  <!-- ── Row 2a: PERSON name (first / middle / last) ── -->
  <div class="yc-row" data-kind-block="person">
    <div class="yc-field">
      <label class="yc-label">First Name</label>
      <input type="text" name="fname" placeholder="First name">
    </div>
    <div class="yc-field">
      <label class="yc-label">Middle Name</label>
      <input type="text" name="mname" placeholder="Middle name">
    </div>
    <div class="yc-field">
      <label class="yc-label">Last Name</label>
      <input type="text" name="lname" placeholder="Last name">
    </div>
  </div>

  <!-- ── Row 2b: ORG name ── -->
  <div class="yc-row" data-kind-block="org" style="display:none;">
    <div class="yc-field">
      <label class="yc-label">Organization Name</label>
      <input type="text" name="org_name" placeholder="Legal entity name" maxlength="120">
      <small class="yc-error"></small>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════
       PHONES repeater
       ════════════════════════════════════════════════════════════════ -->
  <div class="yc-section">
    <div class="ycp-section-head">
      <div class="yc-section-title"><i class="fa-solid fa-phone ycp-section-icon"></i>Phone(s)</div>
      <button type="button" class="ycp-history-btn" data-kind="phones">History</button>
      <button type="button" class="ycp-add-inline yc-repeater-add" data-repeater="phones">+ Add Phone</button>
    </div>
    <div class="yc-repeater" id="phonesRepeater"></div>
  </div>

  <template id="phoneRowTemplate">
    <div class="yc-repeater-item ycp-repeater-item">
      <input type="hidden" name="id">
      <div class="ycp-row-main">
        <div class="yc-field ycp-w-phone">
          <label class="yc-label">Phone</label>
          <input type="text" name="phone" placeholder="(000) 000-0000" data-yc-mask="phone">
        </div>
        <div class="yc-field ycp-w-label">
          <label class="yc-label">Label</label>
          <select name="label">
            <option value="Mobile" selected>Mobile</option>
            <option value="Home">Home</option>
            <option value="Work">Work</option>
            <option value="Office">Office</option>
            <option value="Fax">Fax</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <label class="ycp-primary-wrap">
          <input type="checkbox" name="is_primary"> Primary
        </label>
        <div class="ycp-actions">
          <button type="button" class="ycp-advanced-toggle" title="Show advanced fields">⚙</button>
          <button type="button" class="yc-repeater-remove" title="Remove">×</button>
        </div>
      </div>
      <div class="ycp-advanced">
        <div class="yc-row">
          <label class="ycp-primary-wrap"><input type="checkbox" name="sms_optout"> SMS opted out</label>
          <label class="ycp-primary-wrap"><input type="checkbox" name="mms_capable" checked> MMS capable</label>
          <label class="ycp-primary-wrap"><input type="checkbox" name="verified"> Verified</label>
        </div>
        <div class="yc-row">
          <div class="yc-field ycp-w-grow">
            <label class="yc-label">Notes</label>
            <input type="text" name="notes" placeholder="Notes (optional)">
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ════════════════════════════════════════════════════════════════
       EMAILS repeater
       ════════════════════════════════════════════════════════════════ -->
  <div class="yc-section">
    <div class="ycp-section-head">
      <div class="yc-section-title"><i class="fa-solid fa-envelope ycp-section-icon"></i>Email(s)</div>
      <button type="button" class="ycp-history-btn" data-kind="emails">History</button>
      <button type="button" class="ycp-add-inline yc-repeater-add" data-repeater="emails">+ Add Email</button>
    </div>
    <div class="yc-repeater" id="emailsRepeater"></div>
  </div>

  <template id="emailRowTemplate">
    <div class="yc-repeater-item ycp-repeater-item">
      <input type="hidden" name="id">
      <div class="ycp-row-main">
        <div class="yc-field ycp-w-grow">
          <label class="yc-label">Email</label>
          <input type="email" name="email" placeholder="Email">
        </div>
        <div class="yc-field ycp-w-label">
          <label class="yc-label">Label</label>
          <select name="label">
            <option value="Personal" selected>Personal</option>
            <option value="Work">Work</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <label class="ycp-primary-wrap">
          <input type="checkbox" name="is_primary"> Primary
        </label>
        <div class="ycp-actions">
          <button type="button" class="ycp-advanced-toggle" title="Show advanced fields">⚙</button>
          <button type="button" class="yc-repeater-remove" title="Remove">×</button>
        </div>
      </div>
      <div class="ycp-advanced">
        <div class="yc-row">
          <label class="ycp-primary-wrap"><input type="checkbox" name="email_optout"> Email opted out</label>
          <label class="ycp-primary-wrap"><input type="checkbox" name="verified"> Verified</label>
        </div>
        <div class="yc-row">
          <div class="yc-field ycp-w-grow">
            <label class="yc-label">Notes</label>
            <input type="text" name="notes" placeholder="Notes (optional)">
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ════════════════════════════════════════════════════════════════
       ADDRESSES repeater
       ════════════════════════════════════════════════════════════════ -->
  <div class="yc-section">
    <div class="ycp-section-head">
      <div class="yc-section-title"><i class="fa-solid fa-location-dot ycp-section-icon"></i>Address(es)</div>
      <button type="button" class="ycp-history-btn" data-kind="addresses">History</button>
      <button type="button" class="ycp-add-inline yc-repeater-add" data-repeater="addresses">+ Add Address</button>
    </div>
    <div class="yc-repeater" id="addressesRepeater"></div>
  </div>

  <template id="addressRowTemplate">
    <div class="yc-repeater-item ycp-repeater-item">
      <input type="hidden" name="id">
      <div class="yc-row">
        <div class="yc-field yc-3x">
          <label class="yc-label">Street Address</label>
          <input type="text" name="address1" placeholder="Street address">
        </div>
      </div>
      <div class="yc-row">
        <div class="yc-field yc-3x">
          <input type="text" name="address2" placeholder="Apt, suite, unit (optional)">
        </div>
      </div>
      <div class="yc-row">
        <div class="yc-field yc-2x">
          <input type="text" name="city" placeholder="City">
        </div>
        <div class="yc-field ycp-w-state">
          <input type="text" name="state" placeholder="State">
        </div>
        <div class="yc-field ycp-w-zip">
          <input type="text" name="zip" placeholder="ZIP code" data-yc-mask="zip">
        </div>
      </div>
      <div class="ycp-row-main">
        <div class="yc-field ycp-w-label">
          <label class="yc-label">Label</label>
          <select name="label">
            <option value="Home" selected>Home</option>
            <option value="Work">Work</option>
            <option value="Mailing">Mailing</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <label class="ycp-primary-wrap">
          <input type="checkbox" name="is_primary"> Primary
        </label>
        <div class="ycp-actions">
          <button type="button" class="ycp-advanced-toggle" title="Show advanced fields">⚙</button>
          <button type="button" class="yc-repeater-remove" title="Remove">×</button>
        </div>
      </div>
      <div class="ycp-advanced">
        <div class="yc-row">
          <div class="yc-field ycp-w-label">
            <label class="yc-label">Country</label>
            <input type="text" name="country" placeholder="US" value="US">
          </div>
          <label class="ycp-primary-wrap"><input type="checkbox" name="verified"> Verified</label>

  <!-- ── DOB + SSN (relabelled "Date formed" / "EIN" for orgs) ── -->
  <div class="yc-row">

      <label class="yc-label" data-kind-label="dob">Date of Birth</label>
