      <input type="text" name="ssn" placeholder="###-##-####" data-yc-mask="ssn">
      <small class="yc-error"></small>
    </div>
  </div>

  <!-- ── Tags + Notes ── -->
  <div class="yc-row">
    <div class="yc-field">
      <label class="yc-label">Tags</label>
      <input type="hidden" name="tags">
      <!-- Pill UI auto-generated by yc-forms.js -->
    </div>
    <div class="yc-field">
      <label class="yc-label">Notes</label>
      <!-- Stage B.2.b: scalar uses `contact_notes` (not `notes`) to avoid
           a name collision with row-level `<input name="notes">` inputs in
           the repeaters. After any row is populated, document-order
           querySelector('[name="notes"]') would return the first row's
           notes input, breaking populate/collect/diff for the scalar.
           Form-field name now matches the DB column name. -->
      <textarea name="contact_notes" rows="4" placeholder="Notes" maxlength="1000"></textarea>
      <!-- Counter auto-injected by yc-forms.js (selects by textarea[maxlength]) -->
    </div>
  </div>

  <button type="button" class="yc-btn yc-btn-primary yc-btn-block" id="saveBtn" style="display:none;">
    Save
  </button>
</form>

<!-- ════════════════════════════════════════════════════════════════
     ROLES (role-forms slice)

     Child resource with its OWN save path (/api/contacts/:id/roles*),
     deliberately OUTSIDE <form id="contactForm">: yc-forms.js dirty
     tracking walks config.fields + repeaters only, and keeping these
     inputs outside the form element keeps even its input/change
     listeners out of the picture. Roles never ride the aggregate
     PATCH — per-card Save is the only writer.
     ════════════════════════════════════════════════════════════════ -->
<div class="yc-section" id="rolesSection" style="display:none;">
  <div class="ycp-section-head">
    <div class="yc-section-title"><i class="fa-solid fa-user-tag ycp-section-icon"></i>Roles</div>
    <button type="button" class="ycp-add-inline" id="roleAddBtn">+ Role</button>
  </div>
  <!-- Inline replacement for the "nothing to add" / "finish the open one"
       modals: a modal opens at the centre of the IFRAME, which contact.html
       sizes to full content height, so it lands far above the section the
       user is looking at. -->
  <div class="ycr-note" id="roleNote" style="display:none;"></div>
  <div id="rolesList"></div>
</div>

<script src="/js/yc-forms.js"></script>
<script>
  /**
   * Slice 3 Stage B.2 — contact-form.html
   *
   * Adds three native repeaters (phones, emails, addresses) on top of the
   * aggregate PATCH /api/contacts/:id endpoint shipped in Stage A.
   *
   * Departures from stock yc-forms.js:
   *
   *  1. Full save() override. The aggregate PATCH /api/contacts/:id endpoint
   *     returns structured 409 (conflicts) and 400 (errors) bodies that
   *     need custom UI flows (transfer modal, validation modal, force-retry
   *     loop). yc-forms.js's stock save() can't drive those flows, so we
   *     replace it with our own. Everything else (validate, getDiff,
   *     _buildPatchPayload, form_submissions/workflow/log dispatch via
   *     form._api) is reused from YF as-is. If yc-forms.js's save() changes
   *     structurally, this override needs to be re-ported.
   *
   *  2. Per-form glue (not in YF core):
   *     - Per-kind primary-checkbox exclusivity inside each repeater
   *     - Auto-promote first row's is_primary on add-to-empty
   *     - Auto-promote next row's is_primary when primary row is removed
   *     - Save-time at-least-one-primary guard with Swal prompt
   *     - 409 conflict → transfer modal → retry with ?force=true
   *     - 400 validation → error modal listing errors
   *     - Per-kind History modal (read-only)
   *     - Per-row Advanced toggle (show/hide secondary fields)
   *     - iframe-resize message to parent on body resize
   *
   *  3. Scalar phone/email/address fields removed entirely. The repeaters
   *     are the only data source. contact_phone2 / contact_email2 are
   *     also dropped from the UI (Slice 3 deprecates them; Fred handles
   *     residual DB values manually).
   */

  const P = window.parent;
  const params = new URLSearchParams(location.search);
  const contactId = params.get('contact_id');

  if (!contactId) {
    document.body.innerHTML = '<p style="color:var(--danger);padding:20px;">Missing contact_id parameter.</p>';
  } else {

    // ─── YCForm config ──────────────────────────────────────────────
    const form = new YCForm({
      formKey:       'contact_info',
      schemaVersion: 1,
      linkType:      'contact',
      linkId:        contactId,
      container:     '#contactForm',
      dataMode:      'live',
      autosave:      true,
      autosaveMs:    3000,
      readonly:      true,

      fields: {
        contact_id:    { el: '[name="contact_id"]',    type: 'text', readonly: true },
        // Org-contacts slice 3. `kind` is a hidden input driven by the
        // segmented control; `org_name` lives in the org-only row. Both are
        // always in config.fields regardless of the current kind — yc-forms.js
        // resolves every field's element once at construction, so a field that
        // is only registered for one kind would be unreadable in the other.
        kind:          { el: '[name="kind"]',          type: 'text' },
        org_name:      { el: '[name="org_name"]',      type: 'text' },
        pname:         { el: '[name="pname"]',         type: 'text' },
        fname:         { el: '[name="fname"]',         type: 'text' },
        mname:         { el: '[name="mname"]',         type: 'text' },
        lname:         { el: '[name="lname"]',         type: 'text' },
        dob:           { el: '[name="dob"]',           type: 'date' },
        ssn:           { el: '[name="ssn"]',           type: 'text' },
        tags:          { el: '[name="tags"]',          type: 'tags' },
        // Stage B.2.b: scalar uses `contact_notes` (matches DB column) to
        // avoid collision with row-level `<input name="notes">` inputs.
        contact_notes: { el: '[name="contact_notes"]', type: 'textarea' },
      },

      // Repeater config — YF auto-collects, populates, dirty-tracks.
      // We add per-form glue (primary exclusivity, auto-promote, advanced
      // toggle, history) below in init(). Field set per row matches what
      // the aggregate PATCH reconciler accepts.
      repeaters: {
        phones: {
          container: '#phonesRepeater',
          template:  '#phoneRowTemplate',
          fields: {
            id:          { type: 'text' },
            phone:       { type: 'text' },
            label:       { type: 'select' },
            is_primary:  { type: 'checkbox' },
            sms_optout:  { type: 'checkbox' },
            mms_capable: { type: 'checkbox' },
            verified:    { type: 'checkbox' },
            notes:       { type: 'text' },
          },
        },
        emails: {
          container: '#emailsRepeater',
          template:  '#emailRowTemplate',
          fields: {
            id:           { type: 'text' },
            email:        { type: 'text' },
            label:        { type: 'select' },
            is_primary:   { type: 'checkbox' },
            email_optout: { type: 'checkbox' },
            verified:     { type: 'checkbox' },
            notes:        { type: 'text' },
          },
        },
        addresses: {
          container: '#addressesRepeater',
          template:  '#addressRowTemplate',
          fields: {
            id:         { type: 'text' },
            address1:   { type: 'text' },
            address2:   { type: 'text' },
            city:       { type: 'text' },
            state:      { type: 'text' },
            zip:        { type: 'text' },
            country:    { type: 'text' },
            label:      { type: 'select' },
            is_primary: { type: 'checkbox' },
            verified:   { type: 'checkbox' },
            notes:      { type: 'text' },
          },
        },
      },

      // Top-level field validation only. Repeater rows are validated
      // server-side by validatePhoneRow / validateEmailRow / validateAddressRow.
      validation: {
        ssn: { mask: 'ssn' },
      },

      endpoints: {
        load: { method: 'GET', url: '/api/contacts/{linkId}', path: 'contact' },
      },

      // API column → form-field name. Repeater arrays land under the same
      // key on both sides (phones/emails/addresses), so they don't need
      // entries here. _mergeApiData passes unmapped keys through unchanged.
      apiMap: {
        'contact_id':    'contact_id',
        'contact_kind':     'kind',
        'contact_org_name': 'org_name',
        'contact_pname': 'pname',
        'contact_fname': 'fname',
        'contact_mname': 'mname',
        'contact_lname': 'lname',
        'contact_dob':   'dob',
        'contact_ssn':   'ssn',
        'contact_tags':  'tags',
        // contact_notes maps to itself — omitted (apiMap fallback uses key as-is).
      },

      onSubmit: {
        patch: { method: 'PATCH', url: '/api/contacts/{linkId}' },
      },

      onLoad: () => {
        // KIND FIRST. populate() has just written the hidden `kind` input from
        // the loaded row, so this reflects stored data — an existing org must
        // never render as a person for the split second before a toggle.
        // clearOther:false — this is a render, not a user switch; nothing is
        // wiped and nothing becomes dirty. The stash resets with the row: a
        // name stashed off the PREVIOUS record must never be restored onto
        // this one.
        resetKindStash();
        applyKind(readKind(), { clearOther: false });
        // Arm the pill's slide a frame after it has painted where it belongs.
        // Same task would let the browser see the position change and the
        // transition in one recalc, and a stored org would glide across on
        // load as if someone had just clicked it.
        requestAnimationFrame(() => {
          const seg = document.getElementById('kindSeg');
          if (seg) seg.classList.add('is-ready');
        });
        // Wire per-form glue after first populate.
        bindRepeaterGlue('phones');
        bindRepeaterGlue('emails');
        bindRepeaterGlue('addresses');
        bindHistoryButtons();
        bindRepeaterMasks();
        bindRepeaterErrorClear();
        // Apply readonly state to freshly-populated rows.
        // yc-forms.js's setReadonly fires before populate at init step 6,
        // so the rows that exist now need their readonly attributes set
        // based on the form's current state.
        applyRepeaterReadonly(document.querySelector('#contactForm').classList.contains('yc-readonly'));
        // First height report after layout settles.
        reportHeight();
      },

      // No-op. yc-forms.js fires its own postMessage 'form-saved' after a
      // successful save (lines 673–682), which is what triggers the parent's
      // refreshEntityData. This callback exists for parity with other forms
      // that need post-save side effects.
      onSave: () => {},
    });

    // ────────────────────────────────────────────────────────────────
    // REPEATER READONLY — yc-forms.js's setReadonly only toggles the
    // `yc-readonly` class on the form element and walks `config.fields`
    // to re-apply field locks. Repeater inputs aren't in config.fields,
    // so they need their own readonly application.
    //
    // We wrap form.setReadonly to call the original and then push the
    // readonly state down to repeater controls via real DOM attributes
    // (readOnly for text/email, disabled for checkbox/select). The ⚙
    // advanced toggle is intentionally NOT disabled — users still need
    // to see advanced fields in view mode.
    // ────────────────────────────────────────────────────────────────
    const _origSetReadonly = form.setReadonly.bind(form);
    form.setReadonly = function(on) {
      _origSetReadonly(on);
      applyRepeaterReadonly(on);
      // The kind control is a pair of <button>s, not a config.fields input, so
      // yc-forms.js's field-lock walk never reaches it.
      document.querySelectorAll('#kindSeg button').forEach(b => { b.disabled = on; });
      // Roles section (role-forms slice) — outside the form element, so the
      // same walk never reaches it either.
      applyRolesReadonly(on);
    };

    function applyRepeaterReadonly(isReadonly) {
      const formEl = document.querySelector('#contactForm');
      if (!formEl) return;
      formEl.querySelectorAll('.yc-repeater-item').forEach(item => {
        // Text-like inputs: use readOnly (preserves text selection for copy).
        item.querySelectorAll('input[type="text"], input[type="email"], input[type="date"]').forEach(el => {
          el.readOnly = isReadonly;
        });
        // Checkboxes and selects: must use disabled (no readonly attr exists).
        item.querySelectorAll('input[type="checkbox"]').forEach(el => {
          el.disabled = isReadonly;
        });
        item.querySelectorAll('select').forEach(el => {
          el.disabled = isReadonly;
        });
        // Remove button — hidden by CSS (.yc-readonly selector) — no JS needed.
      });
    }

    // ════════════════════════════════════════════════════════════════
    // KIND TOGGLE (org-contacts slice 3)
    //
    // One contact row can be a PERSON or an ORGANIZATION. The DB triggers
    // contact_name_insert / contact_name_update branch on contacts.contact_kind
    // and compute the three derived name columns from a DIFFERENT source per
    // kind — fname/mname/lname for a person, contact_org_name verbatim (no
    // comma flip) for an org. So the kind is not cosmetic: it decides which
    // inputs are the real ones.
    //
    // Both blocks stay mounted and are display-toggled rather than swapped,
    // because yc-forms.js resolves config.fields elements ONCE at construction.
    // A detached element makes its field silently unreadable — populate() and
    // collect() both skip a null el without complaining.
    // ════════════════════════════════════════════════════════════════

    const KIND_LABELS = {
      person: { pname: 'Preferred Name', dob: 'Date of Birth', ssn: 'SSN' },
      org:    { pname: 'DBA',            dob: 'Date Formed',   ssn: 'EIN' },
    };

    /** The name inputs each kind owns — the ones clearOther blanks. */
    const KIND_FIELDS = { person: ['fname', 'mname', 'lname'], org: ['org_name'] };

    /**
     * Per-kind stash of the names the toggle blanks.
     *
     * clearOther wipes the outgoing kind's names on purpose (see applyKind),
     * but that made person → org → person destroy a name the user never meant
     * to touch. Stash the outgoing values on the way out and put them back on
     * the way in: a round trip is then a no-op and the diff closes empty
     * again. Reset on every populate — a freshly loaded row has nothing to do
     * with the previous one's stash.
     */
    let kindStash = { person: null, org: null };
    function resetKindStash() { kindStash = { person: null, org: null }; }

    /** The stored kind, normalized. Anything unrecognised reads as person —
     *  same direction the DB trigger falls, so UI and DB agree. */
    function readKind() {
      const el = document.querySelector('[name="kind"]');
      const v = String((el && el.value) || 'person').trim().toLowerCase();
      return v === 'org' ? 'org' : 'person';
    }

    /**
     * Render for `kind`.
     *
     * clearOther=true is the USER-SWITCH path: it blanks the outgoing kind's
     * name inputs so they land in the diff and get PATCHed to ''. Without it
     * an org would keep stale contact_fname/contact_lname that no screen shows
     * but every export and report does. (contactService.updateContact enforces
     * the same thing server-side; this is the half the user can see.)
     *
     * pname is NEVER cleared — it is Preferred Name for a person and DBA for
     * an org, one column serving both.
     */
    function applyKind(kind, { clearOther = false } = {}) {
      const k = kind === 'org' ? 'org' : 'person';

      const hidden = document.querySelector('[name="kind"]');
      if (hidden && hidden.value !== k) hidden.value = k;

      // data-kind on the track is what parks the cover (CSS owns the travel);
      // .active and aria-pressed carry the label colour and the state
      // assistive tech reads.
      const seg = document.getElementById('kindSeg');
      if (seg) seg.dataset.kind = k;
      document.querySelectorAll('#kindSeg button').forEach(b => {
        const on = b.dataset.kind === k;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        // The covered word is unreadable on purpose, so the tooltip is the
        // only way to learn what is under the slider without moving it.
        if (on) b.removeAttribute('title');
        else    b.title = `Switch to ${b.textContent.trim()}`;
      });

      document.querySelectorAll('[data-kind-block]').forEach(el => {
        el.style.display = (el.dataset.kindBlock === k) ? '' : 'none';
      });

      const labels = KIND_LABELS[k];
      document.querySelectorAll('[data-kind-label]').forEach(el => {
        const t = labels[el.dataset.kindLabel];
        if (t) el.textContent = t;
      });

      // SSN ↔ EIN. Both masks are 9 digits and both strip to bare digits, so
      // contact_ssn char(11) holds either without a storage change. Swapping
      // the dataset keeps _stripMask coherent; swapping the validation rule
      // makes the error message name the right thing. The blur FORMATTER is
      // handled by the extra listener installed below — yc-forms.js closes
      // over the mask type when it binds, so its own listener cannot be
      // retargeted.
      const ssnEl = document.querySelector('[name="ssn"]');
      if (ssnEl) {
        ssnEl.dataset.ycMask = (k === 'org') ? 'ein' : 'ssn';
        ssnEl.placeholder    = (k === 'org') ? '##-#######' : '###-##-####';
        if (form.config.validation.ssn) form.config.validation.ssn.mask = ssnEl.dataset.ycMask;
        ssnEl.value = form._formatMask(ssnEl.value, ssnEl.dataset.ycMask);
      }

      if (clearOther) {
        const other = (k === 'org') ? 'person' : 'org';

        // Out: remember what we are about to blank, so switching back can
        // hand it straight back instead of the user retyping it.
        kindStash[other] = {};
        KIND_FIELDS[other].forEach(n => {
          const el = document.querySelector(`[name="${n}"]`);
          if (el) { kindStash[other][n] = el.value; el.value = ''; }
        });

        // In: restore whatever the last switch away from this kind blanked.
        // Null on the first switch — the loaded values are already in place.
        if (kindStash[k]) {
          Object.entries(kindStash[k]).forEach(([n, v]) => {
            const el = document.querySelector(`[name="${n}"]`);
            if (el) el.value = v;
          });
          kindStash[k] = null;   // consumed; those inputs are live again
        }
      }
    }

    // Segmented control → hidden input. The hidden input is what yc-forms.js
    // diffs, so the events have to be dispatched from it, not from the button.
    document.querySelectorAll('#kindSeg button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        const next = btn.dataset.kind === 'org' ? 'org' : 'person';
        if (next === readKind()) return;
        applyKind(next, { clearOther: true });
        const hidden = document.querySelector('[name="kind"]');
        if (hidden) {
          hidden.dispatchEvent(new Event('input',  { bubbles: true }));
          hidden.dispatchEvent(new Event('change', { bubbles: true }));
        }
        reportHeight();
      });
    });

    /**
     * Save-time shape check, mirroring contactService.updateContact's
     * kind-switch guard. Returns false and paints the offending field.
     */
    function kindGuard() {
      const k = readKind();
      const show = (name, msg) => {
        const el  = document.querySelector(`[name="${name}"]`);
        const err = el && el.parentElement && el.parentElement.querySelector('.yc-error');
        if (err) { err.textContent = msg; err.classList.add('visible'); }
        if (el) el.focus();
      };
      if (k === 'org') {
        const v = (document.querySelector('[name="org_name"]') || {}).value || '';
        if (!v.trim()) { show('org_name', 'Organization name is required'); return false; }
        if (v.trim().length > 120) { show('org_name', 'Organization name must be 120 characters or fewer'); return false; }
      } else {
        const f = ((document.querySelector('[name="fname"]') || {}).value || '').trim();
        const l = ((document.querySelector('[name="lname"]') || {}).value || '').trim();
        if (!f || !l) { show(!f ? 'fname' : 'lname', 'First and last name are required'); return false; }
      }
      return true;
    }

    // Kind-aware blur formatter. Registered AFTER yc-forms.js's _setupMasks
    // ran at construction, so it fires second and has the last word on the
    // displayed value — which is the only way to retarget a mask whose type
    // was captured in a closure.
    (function bindKindAwareSsnMask() {
      const ssnEl = document.querySelector('[name="ssn"]');
      if (!ssnEl) return;
      ssnEl.addEventListener('blur', () => {
        ssnEl.value = form._formatMask(ssnEl.value, readKind() === 'org' ? 'ein' : 'ssn');
      });
    })();

    // ────────────────────────────────────────────────────────────────
    // CUSTOM SAVE — full override of YF's save()
    //
    // Mirrors yc-forms.js's save() (lines 559–693), with two changes:
    //   - PATCH goes through `P.apiSend()` so we get status codes and
    //     response bodies on 4xx (apiSend throws an ApiError with .status
    //     and .body for non-2xx).
    //   - Before PATCH, run primaryGuard() — prompt user when any kind
    //     has rows but no primary marked.
    //   - Handle 409 (conflicts) with transfer modal + retry-with-force.
    //   - Handle 400 (errors) with validation modal.
    //   - After successful PATCH, rehydrate form from the response's
    //     `contact` envelope before doing forms/submit + workflow + log.
    //
    // If yc-forms.js's save() materially changes (e.g. new tracking calls,
    // changed audit log shape), re-port this override.
    // ────────────────────────────────────────────────────────────────
    form.save = async function() {
      if (this._saving) return;

      // 0. Primary guard — interactive; may mutate is_primary in-place.
      const proceed = await primaryGuard();
      if (!proceed) return;

      // 0b. Kind guard. The server rejects an org with no org_name (and a
      // person with no fname/lname) with a plain 500-shaped error, which this
      // form's 400/409 handlers do not decorate. Catching it here gives the
      // user the field instead of a toast.
      if (!kindGuard()) return;

      // 1. Validate (top-level fields only)
      if (!this.validate()) return;

      // 2. Diff check
      const diff = this.getDiff();
      if (Object.keys(diff).length === 0) {
        this._toast('success', 'No changes to save');
        if (this.config.readonly) this.setReadonly(true);
        return;
      }

      this._saving = true;
      this._showLoading(true);

      try {
        this._showStatus('Saving...', true);

        // 3. PATCH with 409/400 handling and force-retry loop
        const patchPayload = this._buildPatchPayload();
        let patchResp = null;

        if (Object.keys(patchPayload).length > 0) {
          let force = false;
          // eslint-disable-next-line no-constant-condition
          while (true) {
            try {
              const url = `/api/contacts/${this.config.linkId}${force ? '?force=true' : ''}`;
              patchResp = await P.apiSend(url, 'PATCH', patchPayload);
              break;
            } catch (e) {
              if (e.status === 409 && e.body && Array.isArray(e.body.conflicts) && e.body.conflicts.length) {
                const accept = await showTransferModal(e.body.conflicts);
                if (!accept) {
                  // User cancelled. Unwind state, restore last-saved status,
                  // do NOT bubble to the catch block (would show error toast).
                  this._showLoading(false);
                  this._saving = false;
                  this._showLastSaved();
                  return;
                }
                force = true;
                continue;
              }
              if (e.status === 400 && e.body && e.body.errors) {
                await showValidationModal(e.body.errors);
                this._showLoading(false);
                this._saving = false;
                this._showLastSaved();
                return;
              }
              // Other error — fall through to outer catch
              throw e;
            }
          }
        }

        // 4. Rehydrate form from PATCH response.
        //
        // Server shape: { status, data, contact: <getContact result> }
        //   where <getContact result> = { contact: {...}, phones, emails, addresses }
        //
        // Flatten into the same shape entityData.contact uses (Stage B.2
        // in contact.html), so populate() via endpoints.load.path='contact'
        // hits the child arrays naturally.
        if (patchResp && patchResp.contact) {
          const fresh = patchResp.contact;
          const flat = {
            ...fresh.contact,
            phones:    fresh.phones    || [],
            emails:    fresh.emails    || [],
            addresses: fresh.addresses || [],
          };

          // Update parent's entityData so subsequent refresh paths see
          // consistent data even before the postMessage round-trip.
          try {
            if (P.entityData && P.entityData.contact) {
              P.entityData.contact = flat;
            }
          } catch (_) { /* cross-origin */ }

          // Re-populate from the rehydrated row. refresh() repopulates, awaits
          // onLoad (which re-binds the repeater glue that populate() just tore
          // down when it rebuilt the .yc-repeater-item nodes) and only then
          // re-baselines — so onLoad's writes can't read as unsaved changes.
          // force: true because we ARE dirty here; the pending changes are
          // exactly the ones we just persisted.
          await this.refresh({ liveData: flat, force: true });
        } else {
          // Scalar-only save (no aggregate arrays in payload): server
          // returned { status, data } without rehydration envelope.
          // populate() didn't run, so re-baseline explicitly.
          this.resetBaseline();
        }

        // 5. Record submission in form_submissions
        const submitResult = await this._api('/api/forms/submit', 'POST', {
          form_key:       this.config.formKey,
          link_type:      this.config.linkType,
          link_id:        this.config.linkId,
          schema_version: this.config.schemaVersion,
          data:           this.collect(),
        });

        // 6. Workflow trigger (fire-and-forget) — not configured here, but
        //    kept for parity if future config adds it.
        if (this.config.onSubmit.workflow) {
          const wfConfig = this.config.onSubmit.workflow;
          const initData = Object.assign(
            {},
            this.collect(),
            wfConfig.initData || {},
            {
              form_key:      this.config.formKey,
              link_type:     this.config.linkType,
              link_id:       this.config.linkId,
              submission_id: submitResult.id,
            }
          );
          this._api(`/workflows/${wfConfig.id}/start`, 'POST', initData)
            .catch(err => console.warn('[YCForm] Workflow trigger failed (non-blocking):', err));
        }

        // 7. Audit log
        try {
          await this._api('/api/log', 'POST', {
            type:      'form',
            link_type: this.config.linkType,
            link_id:   this.config.linkId,
            by:        0,
            data: JSON.stringify({
              form_key: this.config.formKey,
              action:   'form_submit',
              version:  submitResult.version,
              changes:  JSON.stringify(diff),
            }),
          });
        } catch (err) {
          console.warn('[YCForm] Audit log failed (non-blocking):', err);
        }

        // 8. Status & banner update
        this._showStatus('Saved just now');

        let currentUserName = null;
        try { currentUserName = P.firmData?.currentUser?.user_name || null; } catch (_) {}
        this._submittedData = {
          version: submitResult.version,
          updated_at: submitResult.updated_at,
          user_name: currentUserName,
          submitted_by: null,
        };
        this._showSnapshotBanner();

        // 9. Return to view mode
        if (this.config.readonly) this.setReadonly(true);

        // 10. Success toast
        this._toast('success', 'Saved successfully');

        // 11. Callbacks + parent notification
        // Awaited + re-baselined, mirroring yc-forms.js save() step 11: an onSave
        // that writes fields would otherwise land after the baseline and leave the
        // form dirty forever. Fenced on _userEditSeq so a keystroke during the
        // await isn't swallowed. (This form's onSave is a no-op today — kept in
        // sync so the un-awaited pattern doesn't creep back in.)
        const seqBeforeOnSave = this._userEditSeq;
        if (this.config.onSave) await this.config.onSave(submitResult);
        if (this._userEditSeq === seqBeforeOnSave) this.resetBaseline();
        if (!this.config.external) {
          try {
            P.postMessage({
              type: 'form-saved',
              form: this.config.formKey,
              linkType: this.config.linkType,
              linkId: this.config.linkId,
            }, '*');
          } catch (_) {}
        }
      } catch (err) {
        console.error('[YCForm] Save error:', err);
        this._showStatus('Save failed!');
        this._toast('error', 'Save failed', err.message);
        if (this.config.onError) this.config.onError(err);
      } finally {
        this._saving = false;
        this._showLoading(false);
      }
    };

    // ────────────────────────────────────────────────────────────────
    // PRIMARY GUARD — save-time at-least-one-primary check.
    //
    // For each kind that has rows, ensure exactly one is_primary=true.
    // If none, prompt the user. On confirm, check the first row's
    // is_primary and continue. On cancel, abort save.
    // Returns false to abort, true to continue.
    // ────────────────────────────────────────────────────────────────
    async function primaryGuard() {
      const kindLabels = {
        phones:    { singular: 'phone',   plural: 'phones'    },
        emails:    { singular: 'email',   plural: 'emails'    },
        addresses: { singular: 'address', plural: 'addresses' },
      };

      for (const kind of ['phones', 'emails', 'addresses']) {
        const container = document.querySelector(`#${kind}Repeater`);
        if (!container) continue;
        const rows = container.querySelectorAll('.yc-repeater-item');
        if (rows.length === 0) continue;

        const hasPrimary = Array.from(rows).some(r => {
          const cb = r.querySelector('input[type="checkbox"][name="is_primary"]');
          return cb && cb.checked;
        });
        if (hasPrimary) continue;

        const labels = kindLabels[kind];
        const result = await Swal.fire({
          title: `No primary ${labels.singular} selected`,
          text: `A primary ${labels.singular} is required when ${labels.plural} are present. Make the first row primary?`,
          showCancelButton: true,
          confirmButtonText: 'Make first row primary',
          cancelButtonText: 'Cancel save',
          icon: 'warning',
        });
        if (!result.isConfirmed) return false;

        const firstCb = rows[0].querySelector('input[type="checkbox"][name="is_primary"]');
        if (firstCb) {
          firstCb.checked = true;
          firstCb.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
      return true;
    }

    // ────────────────────────────────────────────────────────────────
    // TRANSFER MODAL — shown on 409.
    //
    // Conflicts shape (from contactService._planPhones / _planEmails):
    //   [{ kind, from_contact_id, from_contact_name, phone|email, closed_phone_id|closed_email_id }, ...]
    //
    // We group by source contact for readability. Returns true if user
    // accepts (caller retries with ?force=true), false on cancel.
    // ────────────────────────────────────────────────────────────────
    async function showTransferModal(conflicts) {
      // Group by from_contact_id for clearer presentation
      const groups = new Map(); // contact_id → { name, items: [{kind, display}] }
      for (const c of conflicts) {
        const id = c.from_contact_id;
        if (!groups.has(id)) groups.set(id, { name: c.from_contact_name, items: [] });
        const display = c.kind === 'phone' ? formatPhoneDisplay(c.phone) : c.email;
        groups.get(id).items.push({ kind: c.kind, display });
      }

      let html = '<p>The following values are currently on other contacts. Saving will end them on the source contact and move them here:</p>';
      for (const [id, g] of groups) {
        html += `<div class="ycp-conflict-source">${escapeHtml(g.name)} (#${id}):</div>`;
        html += '<ul class="ycp-conflict-list">';
        for (const it of g.items) {
          html += `<li>${escapeHtml(it.display)} <small style="color:var(--text-muted)">(${it.kind})</small></li>`;
        }
        html += '</ul>';
      }
      html += '<p style="margin-top:10px;font-size:13px;color:var(--text-2)">Proceed?</p>';

      const result = await Swal.fire({
        title: `Transfer ${conflicts.length} value(s) from ${groups.size} contact(s)?`,
        html,
        showCancelButton: true,
        confirmButtonText: 'Transfer and save',
        cancelButtonText: 'Cancel',
        icon: 'question',
        width: 560,
      });
      return result.isConfirmed;
    }

    // ────────────────────────────────────────────────────────────────
    // VALIDATION MODAL — shown on 400.
    //
    // errors shape (from contactService.updateContact):
    //   { phones?: [...], emails?: [...], addresses?: [...], contact?: [...] }
    //   each entry: { index, field, message }
    //
    // index = -1 means "applies to the whole kind" (e.g. "Exactly one row
    // may be marked is_primary").
    //
    // Stage B.2.b: also stamps `.yc-repeater-item[data-ycp-error]` on
    // offending rows for inline visual feedback. Stale stamps from any
    // prior 400 are cleared at the top, so the visible state always
    // reflects the current error set. Stamps are also cleared per-row
    // when the user starts editing the row (see bindRepeaterErrorClear).
    // We do NOT clear all stamps on Swal close — that would remove the
    // visual cues the moment the user dismisses the modal, before they
    // could act on them.
    // ────────────────────────────────────────────────────────────────
    async function showValidationModal(errors) {
      // 1. Clear any stamps from a prior save attempt.
      document.querySelectorAll('.yc-repeater-item[data-ycp-error]')
        .forEach(el => el.removeAttribute('data-ycp-error'));

      // 2. Stamp rows with their first row-level error (kind in {phones,emails,addresses}).
      for (const [kind, arr] of Object.entries(errors)) {
        if (!['phones', 'emails', 'addresses'].includes(kind)) continue;
        const container = document.querySelector(`#${kind}Repeater`);
        if (!container) continue;
        const rows = container.querySelectorAll('.yc-repeater-item');
        for (const e of arr) {
          if (e.index === -1) continue;
          const row = rows[e.index];
          if (!row) continue;
          // First error per row wins (don't overwrite if a previous entry
          // in this same modal already stamped this row).
          if (row.dataset.ycpError) continue;
          row.dataset.ycpError = e.message;
        }
      }

      // 3. Build the modal HTML.
      const labels = { phones: 'Phone', emails: 'Email', addresses: 'Address', contact: 'Contact' };
      let html = '<ul style="text-align:left;margin:0;padding-left:18px">';
      for (const [kind, arr] of Object.entries(errors)) {
        const labelBase = labels[kind] || kind;
        for (const e of arr) {
          const prefix = (e.index === -1)
            ? `All ${kind}:`
            : `${labelBase} row ${e.index + 1}:`;
          const field = e.field ? ` <small style="color:var(--text-muted)">(${escapeHtml(e.field)})</small>` : '';
          html += `<li><strong>${escapeHtml(prefix)}</strong> ${escapeHtml(e.message)}${field}</li>`;
        }
      }
      html += '</ul>';

      await Swal.fire({
        icon: 'error',
        title: 'Validation errors',
        html,
        confirmButtonText: 'Fix and retry',
        width: 600,
      });
      // No stamp-clearing here — see header comment.
    }

    // ────────────────────────────────────────────────────────────────
    // REPEATER ERROR-CLEAR — input listener that wipes a row's
    // [data-ycp-error] stamp when the user starts editing it.
    //
    // Stamps are set by showValidationModal after a 400. They persist
    // until either (a) the user types in any input inside the row, or
    // (b) the next showValidationModal call (which clears all and
    // re-stamps based on the new error set).
    // ────────────────────────────────────────────────────────────────
    function bindRepeaterErrorClear() {
      const formEl = document.querySelector('#contactForm');
      if (!formEl || formEl.dataset.ycpErrClearBound) return;
      formEl.dataset.ycpErrClearBound = '1';
      // Delegated on the form; one listener covers all current and
      // future repeater rows. 'input' fires for typing in text/email,
      // 'change' fires for selects + checkboxes.
      const clearOnEdit = (e) => {
        const row = e.target.closest('.yc-repeater-item');
        if (!row) return;
        if (!row.hasAttribute('data-ycp-error')) return;
        row.removeAttribute('data-ycp-error');
      };
      formEl.addEventListener('input', clearOnEdit);
      formEl.addEventListener('change', clearOnEdit);
    }

    // ────────────────────────────────────────────────────────────────
    // REPEATER MASKS — delegated blur-formatting for data-yc-mask inputs.
    //
    // yc-forms.js's _setupMasks() binds blur handlers ONCE at init time
    // by querying this.el.querySelectorAll('[data-yc-mask]'). Template
    // content is not in the live DOM at that point, and repeater rows
    // added by _addRepeaterItemWithData (whether from initial populate
    // or user click) never get their mask handlers bound.
    //
    // Worked around here via delegated blur (capture phase since blur
    // doesn't bubble). One handler covers all current and future rows.
    // Format logic mirrors yc-forms.js's _formatMask exactly.
    // ────────────────────────────────────────────────────────────────
    function bindRepeaterMasks() {
      const formEl = document.querySelector('#contactForm');
      if (!formEl || formEl.dataset.ycpMasksBound) return;
      formEl.dataset.ycpMasksBound = '1';
      formEl.addEventListener('blur', (e) => {
        const t = e.target;
        if (!(t instanceof HTMLInputElement)) return;
        if (!t.dataset.ycMask) return;
        // Only act on inputs inside a repeater row (yc-forms.js already
        // handles scalar-field masks via direct binding at init time).
        if (!t.closest('.yc-repeater-item')) return;
        t.value = formatMaskInline(t.value, t.dataset.ycMask);
      }, true);
    }

    function formatMaskInline(value, maskType) {
      if (!value) return '';
      const digits = String(value).replace(/\D/g, '');
      switch (maskType) {
        case 'phone':
          if (digits.length === 10) return digits.replace(/^(\d{3})(\d{3})(\d{4})$/, '($1) $2-$3');
          return value;
        case 'ssn':
          if (digits.length === 9) return digits.replace(/^(\d{3})(\d{2})(\d{4})$/, '$1-$2-$3');
          return value;
        case 'zip':
          if (digits.length === 5) return digits;
          if (digits.length === 9) return digits.replace(/^(\d{5})(\d{4})$/, '$1-$2');
          return value;
        default:
          return value;
      }
    }

    // ────────────────────────────────────────────────────────────────
    // REPEATER GLUE — per-kind setup:
    //   - Primary checkbox exclusivity
    //   - Auto-promote on add to empty repeater
    //   - Auto-promote on removal of primary row
    //   - Advanced toggle (per row)
    //
    // Bound once via the container element. Survives populate()'s
    // teardown-and-rebuild because the container is stable.
    // ────────────────────────────────────────────────────────────────
    function bindRepeaterGlue(kind) {
      const container = document.querySelector(`#${kind}Repeater`);
      if (!container) return;
      if (container.dataset.ycpGlueBound) return;
      container.dataset.ycpGlueBound = '1';

      const singular = { phones: 'phone', emails: 'email', addresses: 'address' }[kind];
      const plural   = { phones: 'phones', emails: 'emails', addresses: 'addresses' }[kind];

      // Stage B.2.b: last-row-removal warning.
      // Fires BEFORE yc-forms.js's per-button bubble-phase remove handler
      // (registered in _addRepeaterItemWithData at yc-forms.js line ~910).
      // When the row being removed is the only one, intercept the click,
      // confirm via Swal, then either let the original handler proceed
      // (we just don't block) or — since we already stopped propagation —
      // perform the removal manually on confirm.
      //
      // The MutationObserver below sees the manual remove just as it
      // would see yc-forms.js's; its auto-promote logic short-circuits
      // when remaining.length === 0, so no spurious promotion fires.
      container.addEventListener('click', async (e) => {
        const btn = e.target.closest('.yc-repeater-remove');
        if (!btn) return;
        if (!container.contains(btn)) return; // safety
        const rows = container.querySelectorAll('.yc-repeater-item');
        if (rows.length !== 1) return; // only intercept on last row

        // Block yc-forms.js's bubble-phase handler.
        e.preventDefault();
        e.stopImmediatePropagation();

        const result = await Swal.fire({
          title: `Remove the last ${singular}?`,
          text: `This contact will have no ${plural} after save.`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Remove',
          cancelButtonText: 'Keep',
        });
        if (!result.isConfirmed) return;

        // Confirmed — perform the removal manually since we blocked the
        // original handler. Mirrors yc-forms.js's removeBtn click handler.
        const item = btn.closest('.yc-repeater-item');
        if (item) {
          item.remove();
          if (typeof form._onFieldChange === 'function') {
            form._onFieldChange();
          }
        }
      }, true); // capture phase — runs before yc-forms.js's bubble handler

      // Primary exclusivity: clicking primary on one row unchecks others.
      container.addEventListener('change', (e) => {
        if (e.target.matches('input[type="checkbox"][name="is_primary"]') && e.target.checked) {
          container.querySelectorAll('input[type="checkbox"][name="is_primary"]').forEach(cb => {
            if (cb !== e.target) cb.checked = false;
          });
        }
      });

      // Advanced toggle: click the ⚙ button on a row to expand its
      // .ycp-advanced section.
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.ycp-advanced-toggle');
        if (!btn) return;
        const item = btn.closest('.ycp-repeater-item');
        if (item) {
          item.classList.toggle('ycp-open');
          // Trigger height report after toggle
          setTimeout(reportHeight, 0);
        }
      });

      // Hook the Add button to apply auto-promote-on-empty.
      // yc-forms.js already binds .yc-repeater-add to addRepeaterItem.
      // We need to act AFTER the row is appended. Easiest: wrap the
      // form-level method here. (Per-form glue, not framework changes.)
      const addBtn = document.querySelector(`.yc-repeater-add[data-repeater="${kind}"]`);
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          // Defer so yc-forms.js's click handler runs first and the new
          // .yc-repeater-item is in the DOM.
          setTimeout(() => {
            const rows = container.querySelectorAll('.yc-repeater-item');
            if (rows.length === 1) {
              // First row in a previously-empty repeater → auto-primary.
              const cb = rows[0].querySelector('input[type="checkbox"][name="is_primary"]');
              if (cb) {
                cb.checked = true;
                cb.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }
            reportHeight();
          }, 0);
        });
      }

      // Hook removal: use a MutationObserver so we react to yc-forms.js's
      // built-in remove handler (which calls itemEl.remove() directly).
      // If the leaving row was primary AND no remaining row is primary,
      // promote the first remaining row.
      //
      // Race-safe vs. populate(): populate clears all rows then adds new
      // ones synchronously, batching into a single MO callback. By the
      // time we run, container holds the new rows (some may already be
      // primary). The "no remaining primary" check prevents spurious
      // promotion when populate replaces a primary-having state with
      // a new primary-having state.
      const mo = new MutationObserver((mutations) => {
        let sawPrimaryRemoval = false;
        for (const m of mutations) {
          for (const removed of m.removedNodes) {
            if (!(removed instanceof HTMLElement)) continue;
            if (!removed.classList.contains('yc-repeater-item')) continue;
            if (removed.querySelector('input[type="checkbox"][name="is_primary"]:checked')) {
              sawPrimaryRemoval = true;
            }
          }
        }
        if (sawPrimaryRemoval) {
          const remaining = container.querySelectorAll('.yc-repeater-item');
          if (remaining.length > 0) {
            const someoneIsPrimary = Array.from(remaining).some(r =>
              !!r.querySelector('input[type="checkbox"][name="is_primary"]:checked')
            );
            if (!someoneIsPrimary) {
              const cb = remaining[0].querySelector('input[type="checkbox"][name="is_primary"]');
              if (cb) {
                cb.checked = true;
                cb.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }
          }
        }
        reportHeight();
      });
      mo.observe(container, { childList: true });
    }

    // ────────────────────────────────────────────────────────────────
    // HISTORY MODAL — per-kind read-only list of ended rows.
    //
    // Hits the dedicated GET /api/contacts/:id/{phones|emails|addresses}
    // ?include_inactive=true and filters client-side to end_date != null.
    // Read-only: no revive, no permanent delete.
    // ────────────────────────────────────────────────────────────────
    function bindHistoryButtons() {
      document.querySelectorAll('.ycp-history-btn').forEach(btn => {
        if (btn.dataset.ycpBound) return;
        btn.dataset.ycpBound = '1';
        btn.addEventListener('click', () => openHistoryModal(btn.dataset.kind));
      });
    }

    async function openHistoryModal(kind) {
      const url = `/api/contacts/${contactId}/${kind}?include_inactive=true`;
      let data;
      try {
        data = await P.apiSend(url, 'GET');
      } catch (e) {
        await Swal.fire({ icon: 'error', title: 'Failed to load history', text: e.message });
        return;
      }

      const arr = data[kind] || [];
      const ended = arr.filter(r => r.end_date != null);
      const labelKind = { phones: 'phones', emails: 'emails', addresses: 'addresses' }[kind];

      if (ended.length === 0) {
        await Swal.fire({
          icon: 'info',
          title: 'No history',
          text: `No ended ${labelKind} for this contact.`,
        });
        return;
      }

      const valueColLabel = { phones: 'Phone', emails: 'Email', addresses: 'Address' }[kind];
      const renderValue = (r) => {
        if (kind === 'phones')    return formatPhoneDisplay(r.phone);
        if (kind === 'emails')    return r.email;
        // address: collapse the four address columns into one line
        const parts = [r.address1, r.city, r.state, r.zip].filter(Boolean);
        return parts.join(', ') || '(no street/city/state/zip)';
      };

      // Stage B.2.b: each row gets a Revive button. We pass enough info
      // on the button via data-* attrs to reconstruct the POST body
      // without keeping a closure over the original `ended` array.
      let html = '<table class="ycp-hist-table"><thead><tr>';
      html += `<th>${valueColLabel}</th><th>Label</th><th>Ended</th><th>Reason</th><th>Notes</th><th></th>`;
      html += '</tr></thead><tbody>';
      for (const r of ended) {
        const reviveData = encodeURIComponent(JSON.stringify({
          // Per kind, the fields the dedicated POST cares about.
          phone:    r.phone,
          email:    r.email,
          address1: r.address1,
          address2: r.address2,
          city:     r.city,
          state:    r.state,
          zip:      r.zip,
          country:  r.country,
          label:    r.label,
          note:     r.note ?? r.notes,  // tolerate either column name
          // Display-only — used in the confirm prompt.
          _display: renderValue(r),
        }));
        html += '<tr>';
        html += `<td>${escapeHtml(renderValue(r))}</td>`;
        html += `<td>${escapeHtml(r.label || '')}</td>`;
        html += `<td>${escapeHtml(r.end_date || '')}</td>`;
        html += `<td>${escapeHtml(r.end_reason || '')}</td>`;
        html += `<td>${escapeHtml(r.note ?? r.notes ?? '')}</td>`;
        html += `<td><button class="ycp-revive-btn" data-kind="${kind}" data-payload="${reviveData}">Revive</button></td>`;
        html += '</tr>';
      }
      html += '</tbody></table>';

      // Use Swal's didOpen to bind click handlers on the Revive buttons.
      // The handler closes the history modal, runs the revive flow, and
      // (on success) refreshes the form from the server.
      await Swal.fire({
        title: `${valueColLabel} history`,
        html,
        width: 760,
        showConfirmButton: true,
        confirmButtonText: 'Close',
        didOpen: () => {
          const container = Swal.getHtmlContainer();
          if (!container) return;
          container.addEventListener('click', async (e) => {
            const btn = e.target.closest('.ycp-revive-btn');
            if (!btn) return;
            const kind = btn.dataset.kind;
            let payload;
            try { payload = JSON.parse(decodeURIComponent(btn.dataset.payload)); }
            catch (_) { return; }
            Swal.close();
            await reviveRow(kind, payload);
          });
        },
      });
    }

    // ────────────────────────────────────────────────────────────────
    // REVIVE — POST a previously-ended row's value to the dedicated
    // /api/contact-{phones|emails|addresses} endpoint to bring it back
    // as an active row on this contact.
    //
    // Routes accept { contact_id, ...fields } and return 201 on success.
    // Phone & email routes support ?force=true for 409 cross-contact
    // conflicts (matches the slice 2 Stage 1 uc_contact_phone removal —
    // same-contact re-activation does not collide). Addresses don't have
    // cross-contact uniqueness, so no force flag needed.
    //
    // 409 body shape: { status:'error', message, conflict: <singular> }
    // (different from PATCH's plural `conflicts`). The conflict object's
    // shape is service-internal and may differ from the modal's expected
    // fields, so revive uses a simpler confirmation Swal rather than
    // reusing showTransferModal.
    // ────────────────────────────────────────────────────────────────
    async function reviveRow(kind, payload) {
      const singular = { phones: 'phone', emails: 'email', addresses: 'address' }[kind];
      if (!singular) return;

      // Build POST body — strip null/empty values and the _display helper.
      const fields = {};
      for (const [k, v] of Object.entries(payload)) {
        if (k.startsWith('_')) continue;
        if (v === null || v === undefined || v === '') continue;
        fields[k] = v;
      }
      const body = { contact_id: contactId, ...fields };

      // Confirm prompt.
      const confirmRes = await Swal.fire({
        title: `Revive this ${singular}?`,
        html: `<p><strong>${escapeHtml(payload._display)}</strong> will be added back to this contact as an active ${singular}.</p>` +
              `<p style="font-size:13px;color:var(--text-2)">If the value is currently active on another contact, you'll be prompted to transfer it.</p>`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Revive',
        cancelButtonText: 'Cancel',
      });
      if (!confirmRes.isConfirmed) return;

      // Endpoint per kind.
      const endpointBase = {
        phones:    '/api/contact-phones',
        emails:    '/api/contact-emails',
        addresses: '/api/contact-addresses',
      }[kind];

      // Try once, retry with ?force=true on 409 if user accepts.
      // (Addresses don't support force; the loop only runs once.)
      let force = false;
      // eslint-disable-next-line no-constant-condition
      while (true) {
        try {
          const url = endpointBase + (force && kind !== 'addresses' ? '?force=true' : '');
          await P.apiSend(url, 'POST', body);
          break;
        } catch (e) {
          if (e.status === 409 && e.body && e.body.conflict && kind !== 'addresses') {
            const c = e.body.conflict;
            // Shape may vary — extract whatever we can for the prompt.
            const otherName = c.from_contact_name || c.contact_name || `contact #${c.from_contact_id || c.contact_id || '?'}`;
            const transferRes = await Swal.fire({
              title: 'Value in use elsewhere',
              html: `<p><strong>${escapeHtml(payload._display)}</strong> is currently active on <strong>${escapeHtml(otherName)}</strong>.</p>` +
                    `<p>Transfer it to this contact? The other contact's row will be ended.</p>`,
              icon: 'warning',
              showCancelButton: true,
              confirmButtonText: 'Transfer and revive',
              cancelButtonText: 'Cancel',
            });
            if (!transferRes.isConfirmed) return;
            force = true;
            continue;
          }
          // Unknown error.
          await Swal.fire({ icon: 'error', title: 'Revive failed', text: e.message || 'Unknown error' });
          return;
        }
      }

      // Success — refresh the form from the server (out-of-band mutation,
      // not via form.save, so postMessage 'form-saved' is the right way
      // to tell the parent + siblings to refresh too. We refresh ourselves
      // locally since contact.html's refreshEntityData skips the sender.)
      try {
        const fresh = await P.apiSend(
          `/api/contacts/${contactId}`,
          'GET',
          { include: 'cases,appts,tasks,log,phones,emails,addresses' }
        );
        const flat = {
          ...fresh.contact,
          phones:    fresh.phones    || [],
          emails:    fresh.emails    || [],
          addresses: fresh.addresses || [],
        };
        try {
          if (P.entityData) {
            P.entityData.contact = flat;
          }
        } catch (_) {}
        // force: true — the revived contact's data IS the truth now, and
        // refresh() awaits onLoad before re-baselining (see yc-forms.js).
        await form.refresh({ liveData: flat, force: true });
      } catch (refreshErr) {
        console.warn('[contact-form] Revive refresh failed:', refreshErr);
      }

      // Notify parent so the header/other tabs update.
      try {
        P.postMessage({
          type: 'form-saved',
          form: 'contact_info',
          linkType: 'contact',
          linkId: contactId,
        }, '*');
      } catch (_) {}

      await Swal.fire({
        icon: 'success',
        title: 'Revived',
        text: `The ${singular} is back on this contact.`,
        timer: 1800,
        showConfirmButton: false,
      });
    }

    // ────────────────────────────────────────────────────────────────
    // IFRAME HEIGHT REPORTING
    //
    // The form grows as the user adds repeater rows or expands advanced
    // sections. Parent (contact.html) listens for {type:'iframe-resize',
    // form:'contact_info', height} and sets iframe.style.height.
    //
    // Uses ResizeObserver for robustness — fires on any body size change.
    // ────────────────────────────────────────────────────────────────
    let lastReportedHeight = 0;
    function reportHeight() {
      const h = Math.max(
        document.documentElement.scrollHeight,
        document.body.scrollHeight
      );
      if (h === lastReportedHeight) return;
      lastReportedHeight = h;
      try {
        P.postMessage({
          type: 'iframe-resize',
          form: 'contact_info',
          height: h,
        }, '*');
      } catch (_) {}
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(reportHeight).observe(document.body);
    }
    // Backup: also report after a short delay post-load.
    window.addEventListener('load', () => setTimeout(reportHeight, 100));

    // ────────────────────────────────────────────────────────────────
    // Utility helpers
    // ────────────────────────────────────────────────────────────────
    function formatPhoneDisplay(raw) {
      if (!raw) return '';
      const d = String(raw).replace(/\D/g, '');
      if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
      if (d.length === 11 && d.startsWith('1')) return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
      return String(raw);
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // ════════════════════════════════════════════════════════════════
    // ROLES SECTION (role-forms slice)
    //
    // Per-card save through /api/contacts/:id/roles* — never the aggregate
    // PATCH. The section sits outside <form id="contactForm">, so dirty
    // tracking and autosave structurally cannot see it (no re-snapshot
    // dance needed).
    //
    // UNDECLARED-ATTRS CONTRACT: updateRole REPLACES the whole attrs JSON,
    // so collectRoleAttrs merges declared-field values OVER a clone of the
    // row's loaded attrs — keys the schema doesn't declare survive a form
    // save byte-for-byte.
    //
    // NUMBER IDENTITY IS LOAD-BEARING: select/multi_select inputs carry
    // the OPTION INDEX, never the value; collect maps index →
    // schema.options[i]. A trustee chapter checkbox therefore writes the
    // NUMBER 7, never the string '7' — lib/trusteeRoster explodes
    // attrs.chapter into roster case_type entries and trusteeMatch rule 0
    // keys on them.
    // ════════════════════════════════════════════════════════════════

    let roleTypesByCode = null; // code → type row; include_inactive so existing
                                // rows on a retired type still render their schema
    let roleRowsState   = null; // GET /api/contacts/:id/roles (attrs pre-parsed)
    let rolePendingRole = null; // role code chosen in the unsaved "+ Role" card
    let rolePendingOpen = false; // card is open; role may not be chosen yet

    function rolesReadonlyNow() {
      const f = document.querySelector('#contactForm');
      return !!(f && f.classList.contains('yc-readonly'));
    }

    function applyRolesReadonly(on) {
      const sec = document.getElementById('rolesSection');
      if (!sec) return;
      // View mode hides Save/Cancel, which would strand an open pending card
      // with no way to finish or dismiss it. Drop it instead. renderRoles()
      // calls back into here, so clear the flag BEFORE re-rendering.
      if (on && rolePendingOpen) {
        rolePendingOpen = false;
        rolePendingRole = null;
        renderRoles();
        return;
      }
      sec.classList.toggle('ycr-readonly', on);
      // Inactive cards stay locked in BOTH modes (their own render pass
      // disabled them); only active/pending cards follow the toggle.
      sec.querySelectorAll('.ycr-card:not(.ycr-inactive) input:not([type="checkbox"])')
        .forEach(el => { el.readOnly = on; });
      sec.querySelectorAll('.ycr-card:not(.ycr-inactive) input[type="checkbox"], .ycr-card:not(.ycr-inactive) select')
        .forEach(el => { el.disabled = on; });
    }

    async function loadRoles() {
      try {
        const [typesResp, rowsResp] = await Promise.all([
          P.apiSend('/api/contact-role-types', 'GET', { include_inactive: 'true' }),
          P.apiSend(`/api/contacts/${contactId}/roles`, 'GET'),
        ]);
        roleTypesByCode = {};
        (typesResp.types || []).forEach(t => { roleTypesByCode[t.role_code] = t; });
        roleRowsState = rowsResp.roles || [];
        renderRoles();
      } catch (err) {
        console.warn('[contact-form] roles load failed:', err);
        document.getElementById('rolesList').innerHTML =
          `<div class="ycr-empty">Failed to load roles: ${escapeHtml(err.message || 'unknown error')}</div>`;
      }
      document.getElementById('rolesSection').style.display = '';
      reportHeight();
    }

    /** One schema field → HTML. THE renderer — ~30 lines over the five-type
     *  vocabulary, deliberately not generalized (charter). */
    function roleFieldHtml(f, value) {
      const req = f.required ? ' <span class="ycr-req">*</span>' : '';
      const label = `<label class="yc-label">${escapeHtml(f.label || f.key)}${req}</label>`;
      let inner;
      if (f.type === 'select') {
        const opts = ['<option value=""></option>'].concat((f.options || []).map((o, i) =>
          `<option value="${i}"${o === value ? ' selected' : ''}>${escapeHtml(String(o))}</option>`));
        inner = `<select data-rkey="${escapeHtml(f.key)}">${opts.join('')}</select>`;
      } else if (f.type === 'multi_select') {
        inner = '<div class="ycr-checks">' + (f.options || []).map((o, i) =>
          `<label class="ycp-primary-wrap"><input type="checkbox" data-rkey="${escapeHtml(f.key)}" data-opt="${i}"${Array.isArray(value) && value.some(v => v === o) ? ' checked' : ''}> ${escapeHtml(String(o))}</label>`
        ).join('') + '</div>';
      } else {
        const t = f.type === 'number' ? 'number' : (f.type === 'url' ? 'url' : 'text');
        const ph = f.placeholder ? ` placeholder="${escapeHtml(f.placeholder)}"` : '';
        const val = value == null ? '' : escapeHtml(String(value));
        inner = `<input type="${t}" data-rkey="${escapeHtml(f.key)}" value="${val}"${ph}>`;
      }
      return `<div class="yc-field ycp-w-grow">${label}${inner}</div>`;
    }

    function roleFieldsBlock(schema, attrs) {
      if (!schema) return '';
      return `<div class="yc-row" style="flex-wrap:wrap">` +
        schema.map(f => roleFieldHtml(f, (attrs || {})[f.key])).join('') + '</div>';
    }

    /** Role types this contact can still take on. uk_contact_role is one row per
     *  (contact, role) INCLUDING inactive rows — those reactivate instead of
     *  re-attaching, so a held code is never offered again. */
    function eligibleRoleTypes() {
      const held = new Set((roleRowsState || []).map(r => r.role));
      return Object.values(roleTypesByCode || {})
        .filter(t => t.active && !held.has(t.role_code))
        .sort((a, b) => (a.sort_order - b.sort_order) || String(a.role_code).localeCompare(String(b.role_code)));
    }

    function pendingSchema() {
      const type = roleTypesByCode[rolePendingRole] || {};
      return Array.isArray(type.attrs_schema) ? type.attrs_schema : null;
    }

    /** Section-level message, inline rather than modal — see #roleNote. */
    function roleNote(msg) {
      const el = document.getElementById('roleNote');
      if (!el) return;
      el.textContent = msg;
      el.style.display = msg ? '' : 'none';
      reportHeight();
      if (msg) setTimeout(() => {
        if (el.textContent === msg) { el.textContent = ''; el.style.display = 'none'; reportHeight(); }
      }, 5000);
    }

    function renderRoles() {
      const host = document.getElementById('rolesList');
      const rows = roleRowsState || [];
      let html = rows.map(r => {
        const type = roleTypesByCode[r.role] || {};
        const schema = Array.isArray(type.attrs_schema) ? type.attrs_schema : null;
        const head = r.active
          ? `${schema ? `<button type="button" class="ycr-save" data-role-save="${r.id}">Save</button>` : ''}
             <button type="button" class="ycr-remove" data-role-remove="${r.id}" title="Remove — kept in history, can be reactivated">×</button>`
          : `<span class="ycr-badge">Inactive</span>
             <button type="button" class="ycr-reactivate" data-role-reactivate="${r.id}">Reactivate</button>
             <button type="button" class="ycr-delete" data-role-delete="${r.id}" title="Permanently delete — only for roles added in error">Delete</button>`;
        return `<div class="ycr-card${r.active ? '' : ' ycr-inactive'}" data-role-card="${r.id}">
          <div class="ycr-head">
            <span class="ycr-title">${escapeHtml(r.label || type.label || r.role)}</span>
            <span class="ycr-status" data-role-status="${r.id}"></span>
            ${head}
          </div>
          ${roleFieldsBlock(schema, r.attrs)}
        </div>`;
      }).join('');

      // The pending card carries its OWN role picker. Choosing the role used to
      // be a Swal modal, which lands mid-iframe — a long scroll up from the
      // section that opened it. Inline, the choice happens where the click was.
      if (rolePendingOpen) {
        const opts = ['<option value="">Choose a role…</option>'].concat(
          eligibleRoleTypes().map(t =>
            `<option value="${escapeHtml(t.role_code)}"${t.role_code === rolePendingRole ? ' selected' : ''}>${escapeHtml(t.label || t.role_code)}</option>`));
        html += `<div class="ycr-card ycr-pending" data-role-card="new">
          <div class="ycr-head">
            <select class="ycr-picker" data-role-picker="1" aria-label="Role">${opts.join('')}</select>
            <span class="ycr-badge">Unsaved</span>
            <span class="ycr-status" data-role-status="new"></span>
            <button type="button" class="ycr-save" data-role-attach="1">Add</button>
            <button type="button" class="ycr-cancel" data-role-cancel="1">Cancel</button>
          </div>
          <div data-role-pending-fields>${rolePendingRole ? roleFieldsBlock(pendingSchema(), {}) : ''}</div>
        </div>`;
      }

      if (!html) html = '<div class="ycr-empty">No roles. Use “+ Role” to add one.</div>';
      host.innerHTML = html;
      // Inactive rows: visible for reference, never editable in either mode.
      host.querySelectorAll('.ycr-inactive input, .ycr-inactive select')
        .forEach(el => { el.disabled = true; });
      applyRolesReadonly(rolesReadonlyNow());
      reportHeight();
    }

    function roleStatus(id, msg, isErr) {
      const el = document.querySelector(`[data-role-status="${id}"]`);
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('ycr-err', !!isErr);
      setTimeout(() => {
        if (el.textContent === msg) { el.textContent = ''; el.classList.remove('ycr-err'); }
      }, isErr ? 6000 : 2500);
    }

    function roleErr(title, err) {
      Swal.fire({ icon: 'error', title,
        text: (err && err.body && err.body.message) || (err && err.message) || 'Unknown error' });
    }

    /** Declared-field values merged OVER a clone of baseAttrs — undeclared
     *  keys survive (updateRole replaces the whole attrs object). */
    function collectRoleAttrs(cardEl, schema, baseAttrs) {
      const attrs = Object.assign({}, baseAttrs || {});
      for (const f of schema || []) {
        const els = cardEl.querySelectorAll(`[data-rkey="${f.key}"]`);
        if (!els.length) continue;
        if (f.type === 'multi_select') {
          attrs[f.key] = Array.prototype.filter.call(els, el => el.checked)
            .map(el => f.options[+el.dataset.opt]);      // index → OPTION VALUE, type intact
        } else if (f.type === 'select') {
          const v = els[0].value;
          if (v === '') delete attrs[f.key];
          else attrs[f.key] = f.options[+v];             // index → OPTION VALUE, type intact
        } else if (f.type === 'number') {
          const v = els[0].value.trim();
          if (v === '') delete attrs[f.key];
          else attrs[f.key] = Number(v);                 // a NUMBER, never '7'
        } else {
          attrs[f.key] = els[0].value;                   // text/url — '' stored (seeded zoom_link idiom)
        }
      }
      return attrs;
    }

    function roleRequiredErrors(schema, attrs) {
      const errs = [];
      for (const f of schema || []) {
        if (!f.required) continue;
        const v = attrs[f.key];
        if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) {
          errs.push(`${f.label || f.key} is required`);
        }
      }
      return errs;
    }

    async function saveRoleCard(rowId) {
      const row = (roleRowsState || []).find(r => r.id === rowId);
      if (!row) return;
      const type = roleTypesByCode[row.role] || {};
      const schema = Array.isArray(type.attrs_schema) ? type.attrs_schema : null;
      if (!schema) return; // NULL schema: no structured attrs, no Save rendered
      const card = document.querySelector(`[data-role-card="${rowId}"]`);
      const attrs = collectRoleAttrs(card, schema, row.attrs);
      const missing = roleRequiredErrors(schema, attrs);
      if (missing.length) return roleStatus(rowId, 'Required: ' + missing.join(', '), true);
      try {
        await P.apiSend(`/api/contacts/${contactId}/roles/${rowId}`, 'PATCH', { attrs });
        row.attrs = attrs;
        roleStatus(rowId, 'Saved');
      } catch (err) { roleErr('Save failed', err); }
    }

    async function deactivateRole(rowId) {
      if (!confirm('Remove this role? It is kept in history and can be reactivated.')) return;
      try {
        await P.apiSend(`/api/contacts/${contactId}/roles/${rowId}`, 'PATCH', { active: 0 });
        const row = (roleRowsState || []).find(r => r.id === rowId);
        if (row) row.active = 0;
        renderRoles();
      } catch (err) { roleErr('Remove failed', err); }
    }

    async function reactivateRole(rowId) {
      try {
        await P.apiSend(`/api/contacts/${contactId}/roles/${rowId}`, 'PATCH', { active: 1 });
        const row = (roleRowsState || []).find(r => r.id === rowId);
        if (row) row.active = 1;
        renderRoles();
      } catch (err) { roleErr('Reactivate failed', err); }
    }

    async function hardDeleteRole(rowId) {
      if (!confirm('Permanently delete this role row? Only for roles added in error — use Remove otherwise.')) return;
      try {
        await P.apiSend(`/api/contacts/${contactId}/roles/${rowId}`, 'DELETE');
        roleRowsState = (roleRowsState || []).filter(r => r.id !== rowId);
        renderRoles();
      } catch (err) { roleErr('Delete failed', err); }
    }

    async function attachPendingRole() {
      const code = rolePendingRole;
      if (!code) {
        const sel = document.querySelector('[data-role-picker]');
        if (sel) sel.focus();
        return roleStatus('new', 'Choose a role first', true);
      }
      const schema = pendingSchema();
      const card = document.querySelector('[data-role-card="new"]');
      const attrs = schema ? collectRoleAttrs(card, schema, {}) : null;
      const missing = schema ? roleRequiredErrors(schema, attrs) : [];
      // Inline, not a modal: the modal opens mid-iframe, out of sight of the
      // card the user is filling in.
      if (missing.length) return roleStatus('new', 'Required: ' + missing.join(', '), true);
      try {
        await P.apiSend(`/api/contacts/${contactId}/roles`, 'POST', { role: code, attrs });
        rolePendingOpen = false;
        rolePendingRole = null;
        await loadRoles(); // canonical re-read: row id, label, created_at
      } catch (err) { roleErr('Add failed', err); }
    }

    document.getElementById('rolesList').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const d = b.dataset;
      if (d.roleSave)            saveRoleCard(+d.roleSave);
      else if (d.roleRemove)     deactivateRole(+d.roleRemove);
      else if (d.roleReactivate) reactivateRole(+d.roleReactivate);
      else if (d.roleDelete)     hardDeleteRole(+d.roleDelete);
      else if (d.roleAttach)     attachPendingRole();
      else if (d.roleCancel)     { rolePendingOpen = false; rolePendingRole = null; renderRoles(); }
    });

    // Picking the role swaps in that type's field block. Only the pending
    // card's body is replaced — a full renderRoles() here would discard
    // unsaved edits in the cards above it.
    document.getElementById('rolesList').addEventListener('change', (e) => {
      const sel = e.target.closest('[data-role-picker]');
      if (!sel) return;
      rolePendingRole = sel.value || null;
      const body = document.querySelector('[data-role-pending-fields]');
      if (body) body.innerHTML = rolePendingRole ? roleFieldsBlock(pendingSchema(), {}) : '';
      applyRolesReadonly(rolesReadonlyNow());
      const first = body && body.querySelector('input, select');
      if (first) first.focus();
      reportHeight();
    });

    document.getElementById('roleAddBtn').addEventListener('click', () => {
      if (!roleTypesByCode) return;
      if (rolePendingOpen) {
        const sel = document.querySelector('[data-role-picker]');
        if (sel) sel.focus();
        return roleNote('Finish or cancel the unsaved role below first.');
      }
      if (!eligibleRoleTypes().length) {
        return roleNote('This contact already holds every active role type. '
          + 'Inactive rows below can be reactivated.');
      }
      // The button stays visible in view mode and flips the form itself, so
      // adding a role no longer means scrolling up to the header toggle and
      // back down. setReadonly is the wrapped one — it syncs the toggle,
      // the Save button and the repeaters along with the roles section.
      if (rolesReadonlyNow()) form.setReadonly(false);
      rolePendingOpen = true;
      rolePendingRole = null;
      roleNote('');
      renderRoles();
      const sel = document.querySelector('[data-role-picker]');
      if (sel) sel.focus();
    });

    // Boot — the house iframe pattern, though contact.html always creates
    // this iframe after apiSend exists (form.init() relies on that too).
    (function waitRolesBoot() {
      if (P && P.apiSend) return loadRoles();
      setTimeout(waitRolesBoot, 100);
    })();

    form.init();
  }
</script>
