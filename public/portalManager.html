<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/themeSync.js"></script>
  <style>
    /* ══════════════════════════════════════════════
       SHELL — owns topbar + tab switcher + iframe container only.
       Mirrors automationManager.html; engine-specific styles live
       inside the sub-pages.
       ══════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Topbar ── */
    #topbar {
      background: var(--surface);
      color: var(--text);
      min-height: 48px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 0 16px;
      gap: 0;
      flex-shrink: 0;
      border-bottom: 2px solid var(--accent);
    }

    #topbar .title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      margin-right: 24px;
      white-space: nowrap;
    }
    /* --accent-2, not --accent: this is accent-as-TEXT, and --accent measures
       2.55 on --surface in light. --accent-2 is the sheet's text-only accent
       (TOKEN-MAP §2) and is 5.65 light / 6.88 dark. */
    #topbar .title span { color: var(--accent-2); }

    .tab-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .tab-nav-btn {
      height: 48px;
      padding: 0 10px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .tab-nav-btn:hover { color: var(--text); background: var(--hover); }
    .tab-nav-btn.active { color: var(--text); border-bottom-color: var(--accent); }

    .topbar-actions { display: flex; gap: 8px; margin-left: auto; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 6px; border: none;
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
    }
    /* --accent, not --info: this is a solid fill and --info has no fill
       partner in the sheet. White on --info is 3.21; --accent-text is 7.57. */
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--hover); }
    .btn-danger { background: var(--danger-fill); color: var(--fill-text); }
    .btn-danger:hover { filter: brightness(1.12); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Iframe container ── */
    .subpage-panel {
      display: none;
      flex: 1;
      overflow: hidden;
    }
    .subpage-panel.active { display: flex; }
    .subpage-panel iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── Topbar (generated into by boot script) ── -->
<div id="topbar">
  <div class="title">Yisra<span>Case</span> — Portal Manager</div>
  <div class="tab-nav" id="tab-nav"></div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" id="btn-refresh" style="display:none" onclick="onTopbarRefresh()" title="Refresh">
      <i class="fa-solid fa-rotate-right"></i>
    </button>
    <button class="btn btn-danger" id="btn-delete" style="display:none" onclick="onTopbarDelete()">
      <i class="fa-solid fa-trash"></i> Delete
    </button>
    <button class="btn btn-primary" id="btn-save" style="display:none" onclick="onTopbarSave()">
      <i class="fa-solid fa-floppy-disk"></i> Save
    </button>
    <button class="btn btn-primary" id="btn-new" style="display:none" onclick="onTopbarNew()">
      <i class="fa-solid fa-plus"></i> <span id="btn-new-label">New</span>
    </button>
  </div>
</div>

<!-- ── Sub-page panels (generated by boot script) ── -->
<div id="subpages-root" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// PORTAL MANAGER — SHELL (Client Portal admin home)
// ═══════════════════════════════════════════════════════════════
//
// Structure and protocol copied from automationManager.html: sub-pages
// are lazy-loaded iframes talking to the shell only via
//   - window.parent.apiSend(...)          (relay up to index.html)
//   - window.parent.firmData              (live getter → index.html's object)
//   - window.parent.setTopbarButtons({...})
//   - lifecycle hooks (onShow, onHide, onSave, onDelete, onRefresh,
//     onNew) exposed on their own window, which the shell calls.
//
// The firmData-select helper suite (fdPhoneLines etc.) is deliberately
// NOT duplicated here — no Portal Manager sub-page needs phone/email
// pickers. If one ever does, lift the helpers from automationManager.
// ═══════════════════════════════════════════════════════════════

// ── Parent bridges ─────────────────────────────────────────────
// apiSend: relay. Sub-pages call window.parent.apiSend(...); we forward
// to index.html's apiSend (JWT handling, error shaping all live there).
function apiSend(...args) {
  return window.parent.apiSend(...args);
}

// firmData: live getter by reference (matches automationManager.html).
Object.defineProperty(window, 'firmData', {
  get()  { return window.parent ? window.parent.firmData : undefined; },
  configurable: true,
});

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════════════════════════════
// SUB-PAGE REGISTRY
//
// The staff-side admin home for everything client-portal: Cards
// (portal_cards engine, E2), Access (per-contact portal logins +
// force-logout), Settings (global kill switch + SMS cap, backed by
// the generic app_settings API). Sub-pages live in public/portaladmin/.
// ═══════════════════════════════════════════════════════════════
const SUB_PAGES = [
  { id: 'cards',    title: 'Cards',    icon: 'address-card', src: '/portaladmin/portalCards.html',    newLabel: 'New Card' },
  { id: 'access',   title: 'Access',   icon: 'user-lock',    src: '/portaladmin/portalAccess.html',   newLabel: '' },
  { id: 'settings', title: 'Settings', icon: 'sliders',      src: '/portaladmin/portalSettings.html', newLabel: '' },
];

// ── Shell state ────────────────────────────────────────────────
let activeSubPageId = null;
let topbarButtons = { save: false, delete: false, refresh: false, new: false };

// ── Render tab buttons + iframe containers from registry ───────
function renderShellStructure() {
  const nav = document.getElementById('tab-nav');
  const root = document.getElementById('subpages-root');

  nav.innerHTML = SUB_PAGES.map(p => `
    <button class="tab-nav-btn" id="tabnav-${p.id}" onclick="switchSubPage('${p.id}')">
      <i class="fa-solid fa-${p.icon}"></i> ${esc(p.title)}
    </button>
  `).join('');

  root.innerHTML = SUB_PAGES.map(p => `
    <div class="subpage-panel" id="subpage-panel-${p.id}">
      <iframe id="subpage-${p.id}" data-src="${p.src}" title="${esc(p.title)}"></iframe>
    </div>
  `).join('');
}

// ── Tab switching + lazy-load (data-src → src on first activation) ──
function switchSubPage(id) {
  const page = SUB_PAGES.find(p => p.id === id);
  if (!page) return;

  if (activeSubPageId && activeSubPageId !== id) {
    callSubPageHook(activeSubPageId, 'onHide');
  }

  activeSubPageId = id;

  topbarButtons = { save: false, delete: false, refresh: false, new: false };
  applyTopbarButtons();
  document.getElementById('btn-new-label').textContent = page.newLabel;

  document.querySelectorAll('.subpage-panel').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`subpage-panel-${id}`).classList.add('active');
  document.getElementById(`tabnav-${id}`).classList.add('active');

  const iframe = document.getElementById(`subpage-${id}`);
  if (iframe && iframe.dataset.src) {
    iframe.src = iframe.dataset.src;
    delete iframe.dataset.src;
    // onShow is called by the sub-page's own init() after it boots.
    return;
  }

  callSubPageHook(id, 'onShow');
}

// ── Lifecycle hook invocation ──────────────────────────────────
function callSubPageHook(id, hookName, ...args) {
  const iframe = document.getElementById(`subpage-${id}`);
  if (!iframe || !iframe.contentWindow) return undefined;
  let fn;
  try { fn = iframe.contentWindow[hookName]; }
  catch { return undefined; }
  return (typeof fn === 'function') ? fn(...args) : undefined;
}

// ── Topbar button state ────────────────────────────────────────
function setTopbarButtons(partial) {
  if (!partial || typeof partial !== 'object') return;
  for (const k of ['save', 'delete', 'refresh', 'new']) {
    if (k in partial) topbarButtons[k] = !!partial[k];
  }
  applyTopbarButtons();
}

function applyTopbarButtons() {
  document.getElementById('btn-save').style.display    = topbarButtons.save    ? '' : 'none';
  document.getElementById('btn-delete').style.display  = topbarButtons.delete  ? '' : 'none';
  document.getElementById('btn-refresh').style.display = topbarButtons.refresh ? '' : 'none';
  document.getElementById('btn-new').style.display     = topbarButtons.new     ? '' : 'none';
}

// ── Topbar button click handlers → delegate to active sub-page ─
function onTopbarSave()    { callSubPageHook(activeSubPageId, 'onSave'); }
function onTopbarDelete()  { callSubPageHook(activeSubPageId, 'onDelete'); }
function onTopbarRefresh() { callSubPageHook(activeSubPageId, 'onRefresh'); }
function onTopbarNew()     { callSubPageHook(activeSubPageId, 'onNew'); }

// ── Expose to sub-pages via window.parent ──────────────────────
window.apiSend          = apiSend;
window.setTopbarButtons = setTopbarButtons;
window.esc              = esc;

// ── Boot ───────────────────────────────────────────────────────
renderShellStructure();
switchSubPage(SUB_PAGES[0].id);
</script>

</body>
</html>
