<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Inbox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Diagnostics ring buffer. Loaded BEFORE scripts.js so it also catches
       errors thrown by scripts.js itself. See public/js/diag.js. -->
  <script src="/js/diag.js"></script>
  <script src="/js/yc-sync.js"></script>
  <script src="/scripts.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <script src="/themeSync.js"></script>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <style>
    body { margin: 0; padding: 12px; background: var(--page-bg); }
    /* .fx- prefix scopes this page (formInbox). */
    .fx-wrap { max-width: 980px; margin: 0 auto; }

    .fx-head {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 0 14px; flex-wrap: wrap;
    }
    .fx-title { font-size: 17px; font-weight: 700; color: var(--text); margin: 0; }
    .fx-count {
      font-size: 12px; font-weight: 700; color: var(--info); background: var(--info-soft);
      border: 1px solid var(--info); border-radius: 10px; padding: 1px 8px;
    }
    .fx-spacer { flex: 1; }
    .fx-filter {
      font-size: 13px; padding: 6px 8px; border: 1px solid var(--border-strong);
      border-radius: 6px; font-family: inherit; color: var(--text-2); background: var(--surface);
    }
    .fx-refresh {
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text-2);
    }
    .fx-refresh:hover { background: var(--hover); }

    .fx-note {
      font-size: 12.5px; color: var(--text-muted); margin: 0 0 12px;
    }

    .fx-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 8px; background: var(--surface);
    }
    .fx-row-main { flex: 1; min-width: 0; }
    .fx-row-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .fx-row-form { font-size: 14px; font-weight: 600; color: var(--text); }
    .fx-row-id   { font-size: 11.5px; color: var(--text-muted); }
    .fx-row-when { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .fx-row-who {
      font-size: 12.5px; color: var(--text-2); margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fx-row-who i { color: var(--text-muted); margin-right: 3px; }
    .fx-row-who span + span { margin-left: 10px; }
    .fx-row-target { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .fx-row-target i { color: var(--text-muted); margin-right: 5px; }
    .fx-badge {
      font-size: 10px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
      color: var(--info); background: var(--info-soft); border: 1px solid var(--info);
      border-radius: 4px; padding: 1px 5px; margin-left: 6px;
    }

    .fx-btn {
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text-2);
      white-space: nowrap;
    }
    .fx-btn:hover { background: var(--hover); }
    .fx-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .fx-btn-primary:hover { background: var(--accent-dark); }

    .fx-empty {
      padding: 34px 12px; text-align: center; color: var(--text-muted); font-size: 14px;
      border: 1px dashed var(--border-strong); border-radius: 8px;
    }
    .fx-error { color: var(--danger); padding: 14px 0; font-size: 13.5px; }

    /* View modal iframe */
    .fx-view-frame { width: 100%; height: 72vh; border: 0; }

    /* Adopt dialog internals (mirrors oad-/cad- conventions) */
    .fx-dlg-header { text-align: left; margin-bottom: 8px; }
    .fx-dlg-form { font-weight: 700; font-size: 15px; color: var(--text); }
    .fx-dlg-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .fx-dlg-who  { font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }
    .fx-dlg-section-label {
      text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .02em;
      text-transform: uppercase; color: var(--text-muted); margin: 12px 0 6px;
    }
    .fx-dlg-create-row { margin: 10px 0 2px; text-align: left; }
    .fx-dlg-create-btn {
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text-2);
    }
    .fx-dlg-create-btn:hover { background: var(--hover); }
    .fx-appt-input {
      width: 160px; font-size: 13px; padding: 6px 8px;
      border: 1px solid var(--border-strong); border-radius: 6px;
    }
    /* Selected-target confirmation (replaces the search box once a row is
       picked, since CasePicker leaves the typed query in place). */
    .fx-picked {
      display: flex; align-items: center; gap: 10px; text-align: left;
      border: 1px solid var(--ok); background: var(--ok-soft);
      border-radius: 6px; padding: 8px 10px;
    }
    .fx-picked > i { color: var(--ok); font-size: 15px; }
    .fx-picked-main { flex: 1; min-width: 0; }
    .fx-picked-label { font-size: 13.5px; font-weight: 600; color: var(--ok); }
    .fx-picked-sub { font-size: 12px; color: var(--text-2); margin-top: 1px; }
    .fx-change {
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px;
      padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--text-2);
    }
    .fx-change:hover { background: var(--hover); }
    /* Let picker dropdowns escape the swal container (oad-html precedent). */
    .fx-dlg-html { overflow: visible !important; }
    /* style.css pins inputs to 200px at higher specificity than .cp-input's
       own width:100% — scope the fix to this mount (acc-picker precedent). */
    #fxPickerMount .cp-input { width: 100%; }
  </style>
</head>
<body>
<!-- ===========================================================================
   formInbox.html — X4 Form Inbox (EXTERNAL_FORMS_DESIGN §8).

   Staff workspace for UNLINKED form submissions (link_type='' — the anonymous
   external convention). Lists them with a submitter preview, opens a
   read-only rendered view (render.html ?view_submission mode — one renderer,
   always), and adopts a submission onto a case / contact / appt via
   PATCH /api/forms/submissions/:id/link.

   Runs as an index.html more-panel iframe: parent === the shell, so
   P.apiSend (scripts.js) is the auth transport. This page re-exposes
   window.apiSend so the render.html view iframe (whose parent is THIS page)
   finds the chain — the same relay case.html / formBuilder.html do.

   The adopt dialog follows the CaseAdoptDialog / OrphanAdoptDialog
   precedents: picker matching the TEMPLATE's link_type (case → CasePicker,
   contact → ContactPicker, appt → id input — no ApptPicker exists yet), and
   for case-forms a create branch that hands off to scripts.js newContact
   (find-or-create contact + optional case in one dialog) and links to the
   case it returns. The RG task from wf40 is the NOTIFICATION; this page is
   the WORKSPACE (§8).
============================================================================ -->
<div class="fx-wrap">
  <div class="fx-head">
    <h1 class="fx-title">Form Inbox</h1>
    <span class="fx-count" id="fxCount" style="display:none;">0</span>
    <div class="fx-spacer"></div>
    <select class="fx-filter" id="fxScope">
      <option value="unlinked" selected>Needs linking</option>
      <option value="linked">Linked</option>
      <option value="all">All submissions</option>
    </select>
    <select class="fx-filter" id="fxClass">
      <option value="" selected>All classes</option>
      <option value="ext">External (portal + public)</option>
      <option value="public">Public</option>
      <option value="portal">Portal</option>
      <option value="internal">Internal</option>
      <option value="none">No template</option>
    </select>
    <select class="fx-filter" id="fxFilter">
      <option value="">All forms</option>
    </select>
    <button class="fx-refresh" id="fxRefresh"><i class="fa-solid fa-rotate"></i>&nbsp;Refresh</button>
  </div>
  <p class="fx-note" id="fxNote"></p>
  <div id="fxList"></div>
</div>

<script>
(function () {
  'use strict';

  // ── Transport: the shell owns the JWT (checklistsView pattern). Re-exposed
  //    on window BECAUSE render.html resolves window.parent.apiSend — the view
  //    iframe's parent is THIS page, so without the relay the modal can't talk.
  //
  //    The relay is exactly why the lookup must be `window.parent` guarded by
  //    `!== window`: opened standalone, parent === window and the guard-less
  //    version would find the relay we just installed and recurse until the
  //    stack blew. Fail loudly instead. ──
  function shellApi() {
    var p = window.parent;
    return (p && p !== window && typeof p.apiSend === 'function') ? p.apiSend : null;
  }
  function api() {
    var fn = shellApi();
    if (!fn) return Promise.reject(new Error('apiSend unavailable — open this page inside YisraCase.'));
    return fn.apply(window.parent, arguments);
  }
  window.apiSend = api;

  var TPL = {};        // form_key → { title, link_type }
  var SUBS = [];       // rows for the current scope
  var UNLINKED_COUNT = null;   // badge value — always the "needs linking" count
  var PAGE_LIMIT = 100;

  function fmtWhen(iso) {
    if (!iso) return '';
    var s = String(iso).replace('T', ' ');
    return s.replace(/(\.\d+)?Z?$/, '').slice(0, 16);
  }

  function parseData(d) {
    if (d == null) return {};
    if (typeof d === 'object') return d;
    try { return JSON.parse(d); } catch (e) { return {}; }
  }

  var NOTE = {
    unlinked: 'Submissions that arrived without a link — usually an intake filled ' +
              'anonymously (expired or missing link). View the answers, then link each ' +
              'one to the right case, or create the contact + case first.',
    linked:   'Submissions already attached to a case, contact or appointment. ' +
              'Read-only here — linking is one-way, so a wrong link is a fix at the ' +
              'database, not a re-link in this screen.',
    all:      'Every submitted form, linked or not. The badge counts the ones still ' +
              'needing a link.',
  };

  // Class = the TEMPLATE's `visibility` (enum: internal | portal | public), so
  // it is a live property of the form, not something stamped on the submission
  // — reclassifying a template retroactively moves its old submissions. Rows
  // whose form_key has no template row at all (legacy hand-built keys, 58 of
  // them in prod) are their own 'none' bucket rather than silently absent.
  // "External" is a FILTER grouping over portal+public, not a fourth enum
  // value; extFormService gates on a scopes ARRAY, which is where that pairing
  // actually lives.
  var CLASS_MATCH = {
    '':         function () { return true; },
    'ext':      function (c) { return c === 'portal' || c === 'public'; },
    'public':   function (c) { return c === 'public'; },
    'portal':   function (c) { return c === 'portal'; },
    'internal': function (c) { return c === 'internal'; },
    'none':     function (c) { return c === 'none'; },
  };

  function classOf(s) {
    var t = TPL[s.form_key];
    return t && t.visibility ? t.visibility : 'none';
  }

  // ── List rendering (textContent/createElement only — no innerHTML for
  //    submitter-controlled strings) ──
  function render() {
    var list = E('fxList');
    list.textContent = '';
    var scope = E('fxScope').value;
    var filter = E('fxFilter').value;
    var cls = E('fxClass').value;
    var matchCls = CLASS_MATCH[cls] || CLASS_MATCH[''];

    var rows = SUBS.filter(function (s) {
      return (!filter || s.form_key === filter) && matchCls(classOf(s));
    });
    var hidden = SUBS.length - rows.length;

    E('fxNote').textContent = NOTE[scope] || NOTE.unlinked;

    var badge = E('fxCount');
    badge.textContent = (UNLINKED_COUNT === null) ? '—' : String(UNLINKED_COUNT);
    badge.title = 'Submissions still needing a link';
    badge.style.display = '';

    if (!rows.length) {
      var empty = document.createElement('div');
      empty.className = 'fx-empty';
      empty.textContent = SUBS.length
        ? 'Nothing matches the current filters — ' + SUBS.length + ' hidden.'
        : (scope === 'unlinked'
            ? 'Inbox zero — every submission is linked.'
            : 'Nothing to show.');
      list.appendChild(empty);
      return;
    }

    // A work queue must never hide work silently: whenever the filters drop
    // rows, say so out loud.
    if (hidden > 0) {
      var hint = document.createElement('div');
      hint.className = 'fx-note';
      hint.textContent = hidden + ' more ' + (hidden === 1 ? 'submission is' : 'submissions are')
        + ' hidden by the class/form filters.';
      list.appendChild(hint);
    }

    rows.forEach(function (s) {
      var d = s._data;
      var row = document.createElement('div');
      row.className = 'fx-row';

      var main = document.createElement('div');
      main.className = 'fx-row-main';

      var top = document.createElement('div');
      top.className = 'fx-row-top';
      var formEl = document.createElement('span');
      formEl.className = 'fx-row-form';
      formEl.textContent = (TPL[s.form_key] && TPL[s.form_key].title) || s.form_key;
      var idEl = document.createElement('span');
      idEl.className = 'fx-row-id';
      idEl.textContent = '#' + s.id;
      var whenEl = document.createElement('span');
      whenEl.className = 'fx-row-when';
      whenEl.textContent = fmtWhen(s.created_at);
      top.appendChild(formEl); top.appendChild(idEl); top.appendChild(whenEl);

      var who = document.createElement('div');
      who.className = 'fx-row-who';
      var bits = [];
      if (d.name)  bits.push(['fa-user', String(d.name)]);
      if (d.phone) bits.push(['fa-phone', fmtPhone(d.phone)]);
      if (d.email) bits.push(['fa-envelope', String(d.email)]);
      if (!bits.length) bits.push(['fa-circle-question', 'no name / phone / email in the answers']);
      bits.forEach(function (b) {
        var span = document.createElement('span');
        var icon = document.createElement('i');
        icon.className = 'fa-solid ' + b[0];
        span.appendChild(icon);
        span.appendChild(document.createTextNode(b[1]));
        who.appendChild(span);
      });

      main.appendChild(top);
      main.appendChild(who);

      if (s.link_type) {
        var target = document.createElement('div');
        target.className = 'fx-row-target';
        var arrow = document.createElement('i');
        arrow.className = 'fa-solid fa-arrow-right-long';
        target.appendChild(arrow);
        target.appendChild(document.createTextNode(s.link_type + ' ' + s.link_id));
        if (s.linked_by) {
          var badgeEl = document.createElement('span');
          badgeEl.className = 'fx-badge';
          badgeEl.textContent = 'adopted';
          badgeEl.title = 'Arrived unlinked; linked from this inbox'
            + (s.linked_at ? ' on ' + fmtWhen(s.linked_at) : '');
          target.appendChild(badgeEl);
        }
        main.appendChild(target);
      }

      var viewBtn = document.createElement('button');
      viewBtn.className = 'fx-btn';
      viewBtn.textContent = 'View';
      viewBtn.addEventListener('click', function () { viewSubmission(s.id); });

      var pdfBtn = document.createElement('button');
      pdfBtn.className = 'fx-btn';
      pdfBtn.textContent = 'PDF';
      pdfBtn.title = 'Download a PDF of this submission (shift-click to open it for printing). '
                   + 'Nothing is saved to Dropbox.';
      pdfBtn.addEventListener('click', function (ev) { downloadPdf(s, pdfBtn, ev.shiftKey); });

      row.appendChild(main);
      row.appendChild(viewBtn);
      row.appendChild(pdfBtn);

      var fileBtn = document.createElement('button');
      fileBtn.className = 'fx-btn';
      fileBtn.textContent = 'File';
      fileBtn.title = 'Render and save this PDF to Dropbox — the case folder, or the '
                    + 'unsorted form-submissions folder when there is no case.';
      fileBtn.addEventListener('click', function () { filePdf(s, fileBtn); });
      row.appendChild(fileBtn);

      if (!s.link_type) {
        var linkBtn = document.createElement('button');
        linkBtn.className = 'fx-btn fx-btn-primary';
        linkBtn.textContent = 'Link…';
        linkBtn.addEventListener('click', function () { SubmissionAdoptDialog(s); });
        row.appendChild(linkBtn);
      } else if (s.link_type === 'case' || s.link_type === 'contact') {
        // Adopt is one-way, so a linked row gets no Link… button — the useful
        // action is jumping to the file. appts have no file to open.
        var openBtn = document.createElement('button');
        openBtn.className = 'fx-btn';
        openBtn.textContent = 'Open';
        openBtn.addEventListener('click', function () {
          var openFile = (typeof _resolveAddFile === 'function') ? _resolveAddFile() : null;
          if (!openFile) {
            Toast.fire({ icon: 'error', title: 'Cannot open the file from here' });
            return;
          }
          if (s.link_type === 'case') openFile(s.link_id, 'case', s.link_id);
          else openFile(String(d.name || ('Contact ' + s.link_id)), 'client', s.link_id);
        });
        row.appendChild(openBtn);
      }

      list.appendChild(row);
    });

    if (SUBS.length >= PAGE_LIMIT) {
      var more = document.createElement('div');
      more.className = 'fx-note';
      more.textContent = 'Showing the newest ' + PAGE_LIMIT + ' — narrow by form to see older ones.';
      list.appendChild(more);
    }
  }

  // ── Load: templates (titles + link_type) once per refresh, then the rows
  //    for the current scope, with data previews ──
  async function load() {
    var list = E('fxList');
    list.textContent = 'Loading…';
    var scope = E('fxScope').value;
    try {
      var tplRes = await api('/api/form-templates', 'GET');
      TPL = {};
      (tplRes.templates || []).forEach(function (t) {
        TPL[t.form_key] = { title: t.title, link_type: t.link_type };
      });

      var scopeParam = scope === 'linked' ? '&linked=1'
                     : scope === 'all'    ? ''
                     : '&unlinked=1';
      var res = await api('/api/forms/submissions?status=submitted&with_data=1&limit='
                          + PAGE_LIMIT + scopeParam, 'GET');
      SUBS = (res.submissions || []).map(function (s) {
        s._data = parseData(s.data);
        return s;
      });

      // The badge always means "still needs linking". In the unlinked scope
      // that's the list itself; otherwise it costs one summary-only query
      // (no data bodies) — there is no count endpoint, so this is the cheap
      // honest version. Capped, hence the "+".
      if (scope === 'unlinked') {
        UNLINKED_COUNT = SUBS.length;
      } else {
        try {
          var cnt = await api('/api/forms/submissions?status=submitted&unlinked=1&limit=200', 'GET');
          var n = (cnt.submissions || []).length;
          UNLINKED_COUNT = n >= 200 ? '200+' : n;
        } catch (e) { UNLINKED_COUNT = null; }
      }

      // Filter options: only form_keys actually present in the inbox.
      var filter = E('fxFilter');
      var current = filter.value;
      filter.textContent = '';
      var all = document.createElement('option');
      all.value = ''; all.textContent = 'All forms';
      filter.appendChild(all);
      var seen = {};
      SUBS.forEach(function (s) {
        if (seen[s.form_key]) return;
        seen[s.form_key] = 1;
        var o = document.createElement('option');
        o.value = s.form_key;
        o.textContent = (TPL[s.form_key] && TPL[s.form_key].title) || s.form_key;
        filter.appendChild(o);
      });
      if (seen[current]) filter.value = current;

      render();
    } catch (err) {
      list.textContent = '';
      var e = document.createElement('div');
      e.className = 'fx-error';
      e.textContent = 'Could not load the inbox: ' + (err && err.message || err);
      list.appendChild(e);
    }
  }

  // ── Read-only rendered view (render.html view mode — one renderer) ──
  function viewSubmission(id) {
    Swal.fire({
      html: '<iframe class="fx-view-frame" title="Submission" ' +
            'src="/forms/render.html?view_submission=' + encodeURIComponent(id) + '"></iframe>',
      width: '880px',
      showConfirmButton: false,
      showCloseButton: true,
      customClass: { htmlContainer: 'fx-dlg-html' },
    });
  }

  // ── PDF (X5.1) ─────────────────────────────────────────────────────────────
  //
  //    Two distinct actions, deliberately not merged:
  //      PDF  → render + hand the bytes over. No Dropbox write, so pressing it
  //             repeatedly costs nothing. Shift-click opens a print view.
  //      File → render + save to Dropbox on the ladder. Files a copy EVERY
  //             time (Dropbox autorenames), so the button reports where it
  //             landed and is not something to lean on.
  //
  //    apiSend carries a JWT the iframe cannot see, so the bytes must come
  //    through it — hence responseType 'blob' rather than a bare fetch or a
  //    window.open of the authed URL (which would 401).

  function pdfLabel(btn, text, disabled) {
    btn.textContent = text;
    btn.disabled = !!disabled;
  }

  async function downloadPdf(s, btn, forPrint) {
    var original = btn.textContent;
    pdfLabel(btn, '…', true);
    try {
      var blob = await api('/api/forms/submissions/' + encodeURIComponent(s.id) + '/pdf',
                           'GET', null, {}, { responseType: 'blob' });
      var name = ((TPL[s.form_key] && TPL[s.form_key].title) || s.form_key)
                 + ' (#' + s.id + ').pdf';
      var url = URL.createObjectURL(blob);
      if (forPrint) {
        // A new tab rather than a hidden iframe: the browser's own viewer
        // gives print + save + zoom, and a blob URL in a tab needs no auth.
        window.open(url, '_blank');
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      } else {
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      }
    } catch (err) {
      Toast.fire({ icon: 'error', title: 'PDF failed: ' + (err && err.message || err) });
    } finally {
      pdfLabel(btn, original, false);
    }
  }

  async function filePdf(s, btn) {
    var original = btn.textContent;
    pdfLabel(btn, '…', true);
    try {
      var res = await api('/api/forms/submissions/' + encodeURIComponent(s.id) + '/pdf/file', 'POST');
      var where = res.placement === 'case'
        ? 'Filed to the case folder'
        : 'Filed to the unsorted form-submissions folder';
      Toast.fire({ icon: 'success', title: where });
      if (res.placement_note || (res.warnings && res.warnings.length)) {
        // The ladder's reasons are the point of the feature, not noise —
        // "it saved somewhere" without saying where is how files get lost.
        Swal.fire({
          icon: 'info',
          title: 'Saved to Dropbox',
          html: '<div style="text-align:left;font-size:13px">'
              + '<div style="font-family:monospace;word-break:break-all;margin-bottom:8px">'
              + esc(res.path) + '</div>'
              + (res.warnings || []).map(function (w) {
                  return '<div style="margin-bottom:6px">' + esc(w) + '</div>';
                }).join('')
              + '</div>',
        });
      }
    } catch (err) {
      Toast.fire({ icon: 'error', title: 'Filing failed: ' + (err && err.message || err) });
    } finally {
      pdfLabel(btn, original, false);
    }
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ────────────────────────────────────────────────────────────────────────
     SubmissionAdoptDialog(sub)

     Adopt an unlinked submission (CaseAdoptDialog / OrphanAdoptDialog
     precedents). The link target TYPE comes from the template
     (TPL[form_key].link_type); a submission whose template row is gone gets
     an explicit type select. Confirm PATCHes /link — 409/400/404 surface as
     a validation message and the dialog stays open.

     Case-forms with a name + (phone|email) in the answers also get a
     "Create contact + case…" branch: scripts.js newContact (find-or-create
     contact, optional case in the same dialog, suppressOpen). Its onSuccess
     payload discriminates by `case_relate` (present only on the
     /api/intake/case response): a case → link it; contact-only → the
     submission stays unlinked and says so.
     ──────────────────────────────────────────────────────────────────────── */
  var PICKER_FOR = { case: 'CasePicker', contact: 'ContactPicker' };

  async function SubmissionAdoptDialog(sub, opts) {
    var seed = (opts && opts.initialQuery) || '';
    var d = sub._data || {};
    var tpl = TPL[sub.form_key] || null;
    var fixedType = tpl ? tpl.link_type : null;   // null → user picks the type
    var title = (tpl && tpl.title) || sub.form_key;

    var selected = null;    // { link_type, link_id, label }
    var picker = null;

    var canCreate = (fixedType === 'case') && d.name && (d.phone || d.email);

    var whoLines = [];
    if (d.name)  whoLines.push('Name: ' + d.name);
    if (d.phone) whoLines.push('Phone: ' + fmtPhone(d.phone));
    if (d.email) whoLines.push('Email: ' + d.email);

    var typeSelectHtml = fixedType ? '' :
      '<div class="fx-dlg-section-label">Link type</div>' +
      '<select id="fxLinkType" class="fx-filter">' +
        '<option value="case">Case</option>' +
        '<option value="contact">Contact</option>' +
        '<option value="appt">Appointment</option>' +
      '</select>';

    var result = await Swal.fire({
      title: 'Link submission #' + sub.id,
      html:
        '<div class="fx-dlg-header">' +
          '<div class="fx-dlg-form">' + escAttr(title) + '</div>' +
          '<div class="fx-dlg-meta">Received ' + escAttr(fmtWhen(sub.created_at)) + ' — unlinked</div>' +
          (whoLines.length ? '<div class="fx-dlg-who">' + whoLines.map(escAttr).join('<br>') + '</div>' : '') +
        '</div>' +
        typeSelectHtml +
        '<div class="fx-dlg-section-label" id="fxPickLabel"></div>' +
        '<div id="fxPickerMount"></div>' +
        '<div id="fxPicked" class="fx-picked" style="display:none"></div>' +
        (canCreate
          ? '<div class="fx-dlg-create-row">' +
              '<button type="button" id="fxCreateNew" class="fx-dlg-create-btn">' +
              '<i class="fa-solid fa-user-plus"></i>&nbsp;Create contact + case\u2026</button>' +
            '</div>'
          : ''),
      showCancelButton: true,
      showConfirmButton: true,
      confirmButtonText: 'Link',
      cancelButtonText: 'Cancel',
      showCloseButton: true,
      customClass: { htmlContainer: 'fx-dlg-html' },
      allowOutsideClick: true,

      didOpen: function () {
        var confirmBtn = Swal.getConfirmButton();
        if (confirmBtn) confirmBtn.disabled = true;

        function setSelected(type, id, label, sub) {
          selected = { link_type: type, link_id: String(id), label: label };
          if (confirmBtn) confirmBtn.disabled = false;
          if (label) showPicked(label, sub);
        }

        // CasePicker deliberately does NOT write the chosen row back into its
        // input ("caller owns input state for cases") and clears its dropdown
        // on click — so without this the box still reads whatever was typed
        // and nothing on screen says a case was picked, even though Link works.
        // Swap the search box for an explicit confirmation the user can undo.
        function showPicked(label, sub) {
          var box = E('fxPicked');
          box.textContent = '';
          var icon = document.createElement('i');
          icon.className = 'fa-solid fa-circle-check';
          var main = document.createElement('div');
          main.className = 'fx-picked-main';
          var l1 = document.createElement('div');
          l1.className = 'fx-picked-label';
          l1.textContent = label;
          main.appendChild(l1);
          if (sub) {
            var l2 = document.createElement('div');
            l2.className = 'fx-picked-sub';
            l2.textContent = sub;
            main.appendChild(l2);
          }
          var change = document.createElement('button');
          change.type = 'button';
          change.className = 'fx-change';
          change.textContent = 'Change';
          change.addEventListener('click', clearPicked);
          box.appendChild(icon);
          box.appendChild(main);
          box.appendChild(change);
          box.style.display = '';
          E('fxPickerMount').style.display = 'none';
          E('fxPickLabel').style.display = 'none';
        }

        // The picker stays mounted underneath, so Change restores it with the
        // previous query still in the box.
        function clearPicked() {
          selected = null;
          if (confirmBtn) confirmBtn.disabled = true;
          E('fxPicked').style.display = 'none';
          E('fxPicked').textContent = '';
          E('fxPickerMount').style.display = '';
          E('fxPickLabel').style.display = '';
          if (picker && typeof picker.focus === 'function') picker.focus();
        }

        function mountPicker(type) {
          if (picker && picker.destroy) picker.destroy();
          picker = null;
          selected = null;
          if (confirmBtn) confirmBtn.disabled = true;
          var picked = E('fxPicked');
          picked.style.display = 'none';
          picked.textContent = '';
          var mount = E('fxPickerMount');
          mount.style.display = '';
          mount.textContent = '';
          var label = E('fxPickLabel');
          label.style.display = '';

          if (type === 'appt') {
            // No ApptPicker exists yet — a plain id input keeps the route's
            // third type reachable without inventing a picker this slice. No
            // chip here: the id the user typed IS the visible selection, and
            // swapping the box out mid-keystroke would fight the input event.
            label.textContent = 'Appointment id';
            var inp = document.createElement('input');
            inp.type = 'number'; inp.min = '1';
            inp.id = 'fxApptId'; inp.className = 'fx-appt-input';
            inp.placeholder = 'appt_id';
            inp.addEventListener('input', function () {
              var v = inp.value.trim();
              if (v && Number(v) > 0) setSelected('appt', v, null);
              else { selected = null; if (confirmBtn) confirmBtn.disabled = true; }
            });
            mount.appendChild(inp);
            return;
          }

          label.textContent = type === 'contact'
            ? 'Find the contact to link this submission to'
            : 'Find the case to link this submission to';
          var Picker = window[PICKER_FOR[type]] || (window.parent && window.parent[PICKER_FOR[type]]);
          picker = Picker(mount, {
            placeholder: type === 'contact' ? 'Search contacts\u2026' : 'Search cases\u2026',
            // Seeded after the create-branch: /api/cases/search matches the
            // primary contact's name, so the just-created case comes up first.
            initialQuery: seed,
            onSelect: function (id, row) {
              var r = row || {};
              if (type === 'contact') {
                setSelected(type, id,
                  r.contact_name || ('Contact ' + id),
                  'contact #' + id);
                return;
              }
              // Cases here read like the picker's own rows: who it belongs to
              // on top, identifying detail underneath. These cases usually
              // have no docket number yet, so the contact name is the only
              // human handle — leading with the case_id would be unreadable.
              var numRaw = r.case_number_full || r.case_number || '';
              var num = (numRaw && numRaw !== r.case_id) ? numRaw : '(no case#)';
              var bits = [num, r.case_id, (typeof fmtCaseType === 'function' ? fmtCaseType(r) : r.case_type), r.case_stage];
              setSelected(type, id,
                r.primary_contact_name || r.case_caption || String(id),
                bits.filter(Boolean).join('  \u00b7  '));
            },
          });
        }

        mountPicker(fixedType || 'case');
        var typeSel = E('fxLinkType');
        if (typeSel) typeSel.addEventListener('change', function () { mountPicker(typeSel.value); });

        var createBtn = E('fxCreateNew');
        if (createBtn) {
          createBtn.addEventListener('click', function () {
            if (picker && picker.destroy) picker.destroy();
            picker = null;
            Swal.close();
            newContact(
              { name: String(d.name || ''), phone: String(d.phone || ''), email: String(d.email || ''), suppressOpen: true },
              function (data) {
                // newContact's onSuccess gets the CASE result on the
                // "Add & Open Case" path and the CONTACT result on the client
                // path — even when the client path also created a case from a
                // chosen Case Type. `case_relate` is present only on the
                // /api/intake/case response, so it identifies the first path
                // reliably but CANNOT rule out a case on the second. So:
                // link directly when we're handed a case, and otherwise
                // reopen this dialog with the picker seeded by name rather
                // than assert a "no case was created" that may be false.
                if (data && data.case_relate != null && data.id) {
                  patchLink(sub, 'case', String(data.id)).then(load);
                } else {
                  Toast.fire({ icon: 'success', title: 'Contact saved',
                    text: 'Now pick the case this submission belongs to.' });
                  SubmissionAdoptDialog(sub, { initialQuery: String(d.name || '') });
                }
              }
            );
          });
        }
      },

      // The PATCH runs inside preConfirm so a 409/404 keeps the dialog open
      // with the server's message (CaseAdoptDialog pattern).
      preConfirm: async function () {
        if (!selected) {
          Swal.showValidationMessage('Pick a target, or Create contact + case.');
          return false;
        }
        try {
          var out = await api('/api/forms/submissions/' + sub.id + '/link', 'PATCH',
            { link_type: selected.link_type, link_id: selected.link_id });
          return out;
        } catch (err) {
          var msg = (err && err.body && err.body.message) || (err && err.message) || 'Link failed';
          Swal.showValidationMessage(msg);
          return false;
        }
      },

      willClose: function () { if (picker && picker.destroy) picker.destroy(); },
    });

    if (!result.isConfirmed || !result.value) return;
    var out = result.value;
    Toast.fire({
      icon: 'success',
      title: 'Linked to ' + out.link_type + ' ' + out.link_id,
      text: out.intake_stamped ? 'Intake gate stamped — reminders stop.' : undefined,
    });
    load();
  }

  // Shared PATCH for the create-chain (errors toast — no dialog to keep open).
  async function patchLink(sub, linkType, linkId) {
    try {
      var out = await api('/api/forms/submissions/' + sub.id + '/link', 'PATCH',
        { link_type: linkType, link_id: linkId });
      Toast.fire({
        icon: 'success',
        title: 'Linked to ' + out.link_type + ' ' + out.link_id,
        text: out.intake_stamped ? 'Intake gate stamped — reminders stop.' : undefined,
      });
    } catch (err) {
      var msg = (err && err.body && err.body.message) || (err && err.message) || 'Link failed';
      Toast.fire({ icon: 'error', title: 'Link failed', text: msg });
    }
  }

  // ── Wiring ──
  E('fxRefresh').addEventListener('click', load);
  E('fxScope').addEventListener('change', load);   // scope is a SERVER filter
  E('fxFilter').addEventListener('change', render); // form is client-side
  E('fxClass').addEventListener('change', render);  // class is client-side too

  (function boot() {
    var tries = 0;
    (function wait() {
      if (shellApi()) return load();
      if (++tries > 100) {
        E('fxList').textContent = 'Open this page inside YisraCase.';
        return;
      }
      setTimeout(wait, 100);
    })();
  })();
})();
</script>
</body>
</html>
