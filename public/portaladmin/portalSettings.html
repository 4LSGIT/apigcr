<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Settings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Shared tokens duplicated from the shell (house pattern). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a1a2e; --blue: #4f8ef7; --blue2: #3a7de8;
      --green: #22c55e; --red: #ef4444; --amber: #f59e0b;
      --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0;
      --muted: #94a3b8; --text: #1e293b; --text2: #475569;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; color: var(--text); background: var(--bg);
      height: 100vh; overflow-y: auto; padding: 18px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; margin-bottom: 14px;
    }
    .box h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
    .warn-note { font-size: 11.5px; color: #b91c1c; background: #fee2e2;
      border-radius: 6px; padding: 7px 9px; margin-top: 8px; }
    .status-line { display: flex; align-items: center; gap: 12px; }
    .status-line .big {
      font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
    }
    .big.up   { color: #15803d; }
    .big.down { color: #b91c1c; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 6px; border: none;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-danger  { background: var(--red); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-success:hover { background: #16a34a; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue2); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    input[type=number] {
      width: 120px; padding: 7px 9px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; outline: none;
    }
    input[type=number]:focus { border-color: var(--blue); }
    input[type=text] {
      width: 100%; padding: 7px 9px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; outline: none;
    }
    input[type=text]:focus { border-color: var(--blue); }
    .brand-preview {
      margin-top: 8px; padding: 10px; border: 1px dashed var(--border);
      border-radius: 8px; background: #fbfdff; text-align: center;
    }
    .brand-preview img { max-height: 80px; max-width: 100%; object-fit: contain; }
    .brand-preview .none { font-size: 11.5px; color: var(--muted); }
    .brand-row { display: flex; gap: 10px; align-items: flex-start; }
    .brand-row > div:first-child { flex: 1; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--text2);
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
    code { background: var(--bg); border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="box"><h3>Loading…</h3><i class="fa-solid fa-spinner spin"></i></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// PORTAL SETTINGS SUB-PAGE (Portal Manager)
//
// Thin UI over the EXISTING generic app_settings API — no bespoke
// backend. Values:
//   portal_live             global kill switch. Enforcement lives in
//                           lib/auth.requireAuth (contact branch: every
//                           session-protected portal route — cases,
//                           docs, callback, and anything future that
//                           mounts requireAuth({audience:'contact'}))
//                           plus friendly 503s on the two login
//                           endpoints (routes/portal.auth.js). Absent
//                           or '1' = live; only '0' takes it down
//                           (fail-open: the switch postdates the
//                           portal).
//   portal_sms_monthly_cap  login-PIN SMS monthly cost cap (service
//                           default 300 when the row is absent).
//   portal_sms_counter      read-only usage JSON, shown if the row is
//                           visible through the settings API.
//   portal_logo_url         (S5.2) portal header/login logo. Blank =
//                           fall back to the firm-wide fe-firm_logo_url.
//   portal_favicon_url      (S5.2) portal favicon. Blank = use the
//                           effective logo.
//   portal_logo_href        (S5.3) where the header logo links. Blank =
//                           default (portal home on signed-in pages, no
//                           link on login). http(s) or a single-'/' path;
//                           anything else is dropped server-side.
//                           All three served to clients by the PUBLIC
//                           GET /api/portal/branding (fixed-set endpoint;
//                           5-minute client cache — edits take up to
//                           5 min to reach client browsers).
//
// Rows are created on first use via POST /api/app-settings when
// missing (signed-in staff only — the API rejects api-key creation by
// design). PUT thereafter.
// ═══════════════════════════════════════════════════════════════

const P = window.parent;
const api = (...args) => P.apiSend(...args);
const E = id => document.getElementById(id);
const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2500 });

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let settings = {};   // key → row from GET /api/app-settings

async function load() {
  const data = await api('/api/app-settings');
  settings = {};
  for (const row of (data.settings || [])) settings[row.key] = row;
  render();
}

function isLive() {
  const row = settings['portal_live'];
  return !row || String(row.value ?? '').trim() !== '0';   // mirror of isPortalLive
}

function render() {
  const live = isLive();
  const capRow = settings['portal_sms_monthly_cap'];
  const counterRow = settings['portal_sms_counter'];
  const logoRow = settings['portal_logo_url'];
  const favRow = settings['portal_favicon_url'];
  const hrefRow = settings['portal_logo_href'];
  const firmLogoRow = settings['fe-firm_logo_url'];
  const firmLogo = firmLogoRow && firmLogoRow.value ? String(firmLogoRow.value).trim() : '';

  let counterHtml = '';
  if (counterRow && counterRow.value) {
    let pretty = counterRow.value;
    try { pretty = JSON.stringify(JSON.parse(counterRow.value)); } catch (_) {}
    counterHtml = `<div class="hint">Current SMS counter: <code>${esc(pretty)}</code></div>`;
  }

  E('wrap').innerHTML = `
    <div class="box">
      <h3><i class="fa-solid fa-power-off"></i> Portal availability</h3>
      <div class="status-line">
        <span class="big ${live ? 'up' : 'down'}">
          <i class="fa-solid fa-circle" style="font-size:9px"></i>
          ${live ? 'Portal is LIVE' : 'Portal is DOWN'}
        </span>
        <span style="flex:1"></span>
        ${live
          ? `<button class="btn btn-danger" onclick="setLive(false)"><i class="fa-solid fa-power-off"></i> Take portal down</button>`
          : `<button class="btn btn-success" onclick="setLive(true)"><i class="fa-solid fa-power-off"></i> Bring portal up</button>`}
      </div>
      ${live ? '' : `<div class="warn-note"><i class="fa-solid fa-triangle-exclamation"></i>
        Clients cannot log in (they see a friendly "temporarily unavailable" message)
        and existing sessions are rejected on their next request.</div>`}
      <div class="hint">
        Global switch (<code>app_settings.portal_live</code>), enforced on every portal
        request. It covers every portal route automatically — including future ones.
        Staff-side YisraCase is unaffected. For a single client, use the
        <b>Access</b> tab instead.
      </div>
    </div>

    <div class="box">
      <h3><i class="fa-solid fa-comment-sms"></i> Login-code SMS cap</h3>
      <label>Max login-PIN SMS sends per month</label>
      <div style="display:flex;gap:10px;align-items:center">
        <input type="number" id="sms-cap" min="0" step="1"
               value="${esc(capRow ? capRow.value : '')}" placeholder="300 (default)">
        <button class="btn btn-primary" onclick="saveCap()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
      <div class="hint">
        Cost guard on portal login codes sent by SMS (<code>portal_sms_monthly_cap</code>).
        When the cap is hit, SMS PINs silently stop for the rest of the month (email
        PINs unaffected) and an alert fires. Absent = service default of 300.
      </div>
      ${counterHtml}
    </div>

    <div class="box">
      <h3><i class="fa-solid fa-image"></i> Branding</h3>
      <div class="brand-row">
        <div>
          <label>Portal logo URL</label>
          <input type="text" id="brand-logo" value="${esc(logoRow ? logoRow.value : '')}"
                 placeholder="Blank = firm-wide logo (${esc(firmLogo || 'not set')})"
                 oninput="previewBrand('logo')">
        </div>
        <button class="btn btn-primary" style="margin-top:19px" onclick="saveBrand('logo')">
          <i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
      <div class="brand-preview" id="brand-logo-preview"></div>

      <div class="brand-row" style="margin-top:14px">
        <div>
          <label>Favicon URL (browser-tab icon)</label>
          <input type="text" id="brand-favicon" value="${esc(favRow ? favRow.value : '')}"
                 placeholder="Blank = use the logo" oninput="previewBrand('favicon')">
        </div>
        <button class="btn btn-primary" style="margin-top:19px" onclick="saveBrand('favicon')">
          <i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
      <div class="brand-preview" id="brand-favicon-preview"></div>

      <div class="brand-row" style="margin-top:14px">
        <div>
          <label>Logo link (where clicking the logo goes)</label>
          <input type="text" id="brand-href" value="${esc(hrefRow ? hrefRow.value : '')}"
                 placeholder="Blank = portal home">
        </div>
        <button class="btn btn-primary" style="margin-top:19px" onclick="saveBrand('href')">
          <i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
      <div class="hint" style="margin-top:4px">
        Full http(s) URL (e.g. the firm website) or a portal path starting with
        <code>/</code>. Blank = the default: portal home when signed in, not clickable
        on the login page. When set, it applies on every page — login included.
      </div>

      <div class="hint">
        Shown on every portal page, login included, via the public
        <code>GET /api/portal/branding</code> endpoint (a fixed set of settings — nothing
        else is readable through it). The logo renders 120px tall in the portal header —
        a wide, transparent-background image works best. Client browsers cache branding
        for 5 minutes, so edits take up to 5 minutes to appear. Blank logo falls back to
        the firm-wide <code>fe-firm_logo_url</code>; blank favicon uses the logo.
      </div>
    </div>`;

  previewBrand('logo');
  previewBrand('favicon');
}

// ── branding (S5.2) ────────────────────────────────────────────

function effectiveBrandUrl(kind) {
  const raw = E(kind === 'logo' ? 'brand-logo' : 'brand-favicon');
  const v = raw ? raw.value.trim() : '';
  if (v) return v;
  if (kind === 'favicon') return effectiveBrandUrl('logo');       // favicon → logo
  const firm = settings['fe-firm_logo_url'];                      // logo → firm-wide
  return firm && firm.value ? String(firm.value).trim() : '';
}

function previewBrand(kind) {
  const host = E('brand-' + kind + '-preview');
  if (!host) return;
  const url = effectiveBrandUrl(kind);
  if (!url) {
    host.innerHTML = '<span class="none">Nothing to show — no URL set and no fallback.</span>';
    return;
  }
  const own = E(kind === 'logo' ? 'brand-logo' : 'brand-favicon').value.trim();
  const tag = own ? '' : ' <span class="none">(fallback)</span>';
  // Property assignment for the URL — never markup.
  host.innerHTML = '';
  const img = document.createElement('img');
  if (kind === 'favicon') img.style.maxHeight = '32px';
  img.onerror = () => { host.innerHTML = '<span class="none">Image failed to load — check the URL.</span>'; };
  img.src = url;
  host.appendChild(img);
  if (tag) host.insertAdjacentHTML('beforeend', tag);
}
window.previewBrand = previewBrand;

const BRAND_FIELDS = {
  logo: {
    key: 'portal_logo_url', input: 'brand-logo', toast: 'Logo saved',
    hrefOk: false,
    meta: { category: 'Portal', label: 'Portal logo URL', type: 'text', sort_order: 60,
      description: 'Logo shown in the client-portal header on every page including ' +
        'login (served by the public GET /api/portal/branding). Blank = fall back ' +
        'to the firm-wide fe-firm_logo_url. Renders 120px tall.' },
  },
  favicon: {
    key: 'portal_favicon_url', input: 'brand-favicon', toast: 'Favicon saved',
    hrefOk: false,
    meta: { category: 'Portal', label: 'Portal favicon URL', type: 'text', sort_order: 70,
      description: 'Browser-tab icon for the client portal (served by the public ' +
        'GET /api/portal/branding). Blank = use the effective portal logo.' },
  },
  href: {
    key: 'portal_logo_href', input: 'brand-href', toast: 'Logo link saved',
    hrefOk: true,   // http(s) OR a single-'/' portal path
    meta: { category: 'Portal', label: 'Portal logo link', type: 'text', sort_order: 80,
      description: 'Where the client-portal header logo links (served by the public ' +
        'GET /api/portal/branding). http(s) URL or a single-\'/\' site path. Blank = ' +
        'default: portal home on signed-in pages, not clickable on login. Applies on ' +
        'every page when set, login included.' },
  },
};

async function saveBrand(kind) {
  const f = BRAND_FIELDS[kind];
  const raw = E(f.input).value.trim();
  const ok = raw === '' ||
    /^https?:\/\//i.test(raw) ||
    (f.hrefOk && raw.charAt(0) === '/' && raw.charAt(1) !== '/');
  if (!ok) {
    Toast.fire({ icon: 'error', title: f.hrefOk
      ? 'Must be a full http(s) URL or a path starting with a single "/" — or blank'
      : 'Must be a full http(s) URL — or blank for the fallback' });
    return;
  }
  await writeSetting(f.key, raw, f.meta);
  Toast.fire({ icon: 'success', title: f.toast });
  load();
}
window.saveBrand = saveBrand;

// ── portal_live ────────────────────────────────────────────────

async function setLive(up) {
  if (!up) {
    const { isConfirmed } = await Swal.fire({
      icon: 'warning',
      title: 'Take the client portal down?',
      html: `<div style="font-size:13px;text-align:left">Every client is locked out until it's
        brought back up: logins get a "temporarily unavailable" message and open sessions are
        rejected on their next request.<br><br>Staff-side YisraCase keeps working normally.</div>`,
      showCancelButton: true, confirmButtonText: 'Take it down', confirmButtonColor: '#ef4444',
    });
    if (!isConfirmed) return;
  }
  await writeSetting('portal_live', up ? '1' : '0', {
    category: 'Portal', label: 'Portal live', type: 'bool', sort_order: 10,
    description: 'Global client-portal kill switch: 1 = portal up, 0 = portal down ' +
      '(logins refused with a friendly message; existing sessions rejected on next ' +
      'request). Absent behaves as 1. Enforced in lib/auth.requireAuth + portal.auth.',
  });
  Toast.fire({ icon: 'success', title: up ? 'Portal is live' : 'Portal is down' });
  load();
}
window.setLive = setLive;

// ── portal_sms_monthly_cap ─────────────────────────────────────

async function saveCap() {
  const raw = E('sms-cap').value.trim();
  if (raw === '' || !Number.isInteger(Number(raw)) || Number(raw) < 0) {
    Toast.fire({ icon: 'error', title: 'Cap must be a whole number ≥ 0' });
    return;
  }
  await writeSetting('portal_sms_monthly_cap', String(Number(raw)), {
    category: 'Portal', label: 'Portal SMS monthly cap', type: 'number', sort_order: 20,
    description: 'Max portal login-PIN SMS sends per calendar month (cost guard). ' +
      'When hit, SMS PINs silently stop until next month; email PINs unaffected.',
  });
  Toast.fire({ icon: 'success', title: 'SMS cap saved' });
  load();
}
window.saveCap = saveCap;

// PUT; on 404 (row doesn't exist yet) create via POST then retry-free —
// POST accepts the value inline. POST is signed-in-staff-only by API design.
async function writeSetting(key, value, createMeta) {
  try {
    await api(`/api/app-settings/${key}`, 'PUT', { value });
  } catch (e) {
    if (e.status === 404) {
      await api('/api/app-settings', 'POST', Object.assign({ key, value }, createMeta));
      return;
    }
    Toast.fire({ icon: 'error', title: e.message });
    throw e;
  }
}

// ── Lifecycle (Portal Manager shell protocol) ──────────────────
function onShow()    { P.setTopbarButtons({ refresh: true }); load().catch(showErr); }
function onHide()    {}
function onRefresh() { load().catch(showErr); }
window.onShow = onShow; window.onHide = onHide; window.onRefresh = onRefresh;

function showErr(e) {
  E('wrap').innerHTML = `<div class="box"><h3>Portal settings</h3>
    <div class="warn-note">${esc(e.message)}</div></div>`;
}

(function waitForShell() {
  if (P && typeof P.apiSend === 'function' && typeof P.setTopbarButtons === 'function') {
    P.setTopbarButtons({ refresh: true });
    return load().catch(showErr);
  }
  setTimeout(waitForShell, 50);
})();
</script>
</body>
</html>
