<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Diagnostics ring buffer. Loaded BEFORE anything that can throw. -->
  <script src="/js/diag.js"></script>
  <script src="/js/yc-sync.js"></script>
  <!-- theme.css + themeSync MUST be blocking and MUST precede this page's own
       <style> block (ref/THEME-HANDOFF-v2.md). themeSync sets
       html[data-theme] pre-paint and follows window.top live at any depth, so
       the scoped widget (depth 2, under case.html) tracks the shell toggle
       with no plumbing here. -->
  <link rel="stylesheet" href="/theme.css">
  <script src="/themeSync.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--ui);
      font-size: var(--fs);
      color: var(--text);
      background: var(--page-bg);
    }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* ── Topbar — GLOBAL mode only. The scoped widget is a panel inside a tab
       that already has a heading; a second title bar there is chrome for
       nothing. ────────────────────────────────────────────────── */
    #topbar {
      background: var(--code-bg);
      color: var(--code-fg);
      height: 44px;
      display: flex;
      align-items: center;
      gap: var(--gap);
      padding: 0 14px;
      flex-shrink: 0;
      border-bottom: 2px solid var(--info);
    }
    #topbar .title { font-weight: 700; letter-spacing: 0.02em; }
    #topbar .title span { color: var(--info); }
    #topbar .spacer { flex: 1; }
    #topbar .count { color: var(--code-fg); opacity: .65; font-size: var(--fs-sm); }
    body.scoped #topbar { display: none; }

    /* ── Scoped header — one compact line, no panel chrome. ─────────── */
    #scopedHead {
      display: none;
      align-items: center;
      gap: var(--gap);
      padding: 10px 12px 0;
      flex-shrink: 0;
    }
    body.scoped #scopedHead { display: flex; }
    #scopedHead h3 { font-size: var(--fs-lg); font-weight: 700; }
    #scopedHead h3 i { color: var(--text-muted); margin-right: 5px; }
    #scopedHead .spacer { flex: 1; }
    #scopedHead .count { color: var(--text-muted); font-size: var(--fs-sm); }
    /* The Include-related toggle. A LABEL wrapping the input so the text is
       part of the hit target — this widget lives in a cramped tab panel and a
       12px checkbox on its own is a poor one. */
    #scopedHead .toggle {
      display: flex; align-items: center; gap: 5px;
      font-size: var(--fs-sm); color: var(--text-2);
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    #scopedHead .toggle input { margin: 0; cursor: pointer; }

    /* One muted line above the list saying WHOSE documents got mixed in. */
    .rel-note {
      font-size: var(--fs-sm); color: var(--text-muted);
      margin-bottom: var(--gap); overflow-wrap: anywhere;
    }
    .rel-note.warn { color: var(--warn); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: var(--pad-btn);
      height: var(--ctl-h);
      border-radius: var(--radius);
      border: none;
      font-size: var(--fs-sm); font-weight: 500; cursor: pointer;
      white-space: nowrap; font-family: inherit;
      transition: background .15s, filter .15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* --accent, not --info: a fill. --info has no fill partner. */
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover:not(:disabled) { background: var(--info-dark); }
    .btn-ghost { background: transparent; color: var(--code-fg); border: 1px solid var(--border-strong); }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
    .btn-outline {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover:not(:disabled) { background: var(--page-bg); }
    .btn-outline.ok { color: var(--ok); border-color: var(--ok); }
    .btn-sm { padding: 3px 8px; height: auto; font-size: var(--fs-xs); }

    /* ── Scroll container ───────────────────────────── */
    #scroll { flex: 1; overflow-y: auto; padding: 14px 16px 26px; }
    body.scoped #scroll { padding: 10px 12px 20px; }
    #inner { max-width: 1280px; margin: 0 auto; }
    body.scoped #inner { max-width: none; }

    /* ── Toolbar ────────────────────────────────────── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center;
      margin-bottom: var(--gap-lg);
    }
    .toolbar .search { position: relative; flex: 1; min-width: 190px; }
    .toolbar .search i {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: var(--fs-sm); pointer-events: none;
    }
    .toolbar .search input { padding-left: 28px; }
    .toolbar .ctl { display: flex; align-items: center; gap: var(--gap-sm); }
    .toolbar .ctl label {
      font-size: var(--fs-xs); font-weight: 600; color: var(--text-2);
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .toolbar select, .toolbar input[type="text"] { width: auto; min-width: 110px; }

    input[type="text"], select {
      width: 100%;
      height: var(--ctl-h);
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: var(--fs);
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--info);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    /* ── Table ──────────────────────────────────────── */
    #docTable {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    #docTable th {
      text-align: left;
      padding: var(--pad-cell);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-2);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    #docTable td {
      padding: var(--pad-cell);
      border-top: 1px solid var(--border);
      vertical-align: top;
    }
    #docTable tr.doc-row:hover td { background: var(--hover); }
    /* Deleted rows stay VISIBLE and obviously dead — they only appear when
       the status filter asked for them, and the whole point of asking is to
       see them. Muted, not hidden. */
    #docTable tr.is-gone td { opacity: .55; }

    .d-name { font-weight: 600; overflow-wrap: anywhere; }
    .d-sub {
      font-size: var(--fs-sm); color: var(--text-muted);
      margin-top: 2px; overflow-wrap: anywhere;
    }
    .d-icon { color: var(--text-muted); margin-right: 6px; }
    .chip {
      display: inline-block;
      background: var(--accent-soft); color: var(--accent-on-soft);
      padding: 1px 6px; border-radius: 3px;
      font-weight: 600; font-size: var(--fs-xs);
      margin: 1px 3px 1px 0; white-space: nowrap;
    }
    .chip.type { background: var(--info-soft); color: var(--info); }
    .chip.gone { background: var(--danger-soft); color: var(--danger); }
    .chip.pub  { background: var(--warn-soft);  color: var(--warn); }
    /* PROVENANCE, not content. A `via` badge says "this row is here because of
       a RELATED record, not because it is on the thing you are looking at" —
       so it is deliberately quieter than a tag or type chip. A dashed outline
       rather than a fill reads as "borrowed" at a glance, which is exactly the
       distinction that matters when the list mixes both. */
    .chip.via {
      background: transparent; color: var(--text-muted);
      border: 1px dashed var(--border-strong);
      font-weight: 500;
    }
    .nowrap { white-space: nowrap; }
    .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .acts { white-space: nowrap; text-align: right; }
    .acts .icon-btn {
      width: 28px; height: 26px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-2);
      font-size: var(--fs-sm);
      display: inline-flex; align-items: center; justify-content: center;
      margin-left: 3px;
    }
    .acts .icon-btn:hover { background: var(--page-bg); color: var(--text); }
    .acts .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Columns the compact widget drops. */
    body.scoped .wide-only { display: none; }

    /* ── States ─────────────────────────────────────── */
    .state {
      padding: 40px 22px; text-align: center; color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    body.scoped .state { padding: 24px 16px; }
    .state i { font-size: 30px; display: block; margin-bottom: 10px; opacity: 0.5; }
    .state.err { color: var(--danger); }
    .state .sub { font-size: var(--fs-sm); margin-top: 6px; }

    /* ── Pagination ─────────────────────────────────── */
    #pager {
      margin-top: var(--gap-lg);
      display: flex; align-items: center; justify-content: center;
      gap: var(--gap-sm); flex-wrap: wrap;
    }
    #pager .range { color: var(--text-muted); font-size: var(--fs-sm); margin-right: 6px; }
    #pager .page-btn {
      min-width: 28px; height: 28px; padding: 0 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      cursor: pointer; color: var(--text-2);
      font-size: var(--fs-sm); font-family: inherit;
    }
    #pager .page-btn:hover:not(:disabled) { background: var(--page-bg); }
    #pager .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #pager .page-btn.active {
      background: var(--accent); color: var(--accent-text);
      border-color: var(--accent); font-weight: 600;
    }
    #pager .ellipsis { color: var(--text-muted); padding: 0 2px; }

    /* ── Viewer overlay ─────────────────────────────────────────────────
       Hand-rolled rather than a Swal: a PDF needs a full-height <iframe>,
       and Swal's popup sizes to its content. Fixed to THIS frame's
       viewport — the scoped widget is a tab panel, so the overlay covers
       the panel and not the whole app, which is the correct scope for a
       modal owned by this document. */
    #viewer {
      position: fixed; inset: 0; z-index: 900;
      background: var(--backdrop);
      display: none; flex-direction: column;
      padding: 18px;
    }
    #viewer.open { display: flex; }
    #viewer .vw-box {
      flex: 1; display: flex; flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 0;
    }
    #viewer .vw-head {
      display: flex; align-items: center; gap: var(--gap);
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      flex-shrink: 0;
    }
    #viewer .vw-title {
      font-weight: 600; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    #viewer .vw-body {
      flex: 1; min-height: 0;
      background: var(--surface-sunken);
      display: flex; align-items: center; justify-content: center;
      overflow: auto;
    }
    #viewer .vw-body iframe { width: 100%; height: 100%; border: 0; }
    #viewer .vw-body img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* ── Sync panel (S3.2) — GLOBAL only, collapsed until asked for ─────
       Not a Swal: it holds a table, a form and an expandable diagnostics
       block, and it is a thing you keep open while pressing buttons in it —
       a modal would fight that. Plain section, page tokens, no new chrome. */
    #syncPanel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: var(--gap-lg);
    }
    #syncPanel.open { display: block; }
    body.scoped #syncPanel { display: none !important; }
    #syncPanel h4 {
      font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-2); margin: 14px 0 6px;
    }
    #syncPanel h4:first-child { margin-top: 0; }
    #syncPanel table { width: 100%; border-collapse: collapse; }
    #syncPanel th {
      text-align: left; padding: 5px 8px;
      font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-2);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    #syncPanel td {
      padding: 6px 8px; border-top: 1px solid var(--border);
      vertical-align: top; font-size: var(--fs-sm);
    }
    /* THE PATH IS DATA, NOT A LABEL. These folders are named "  Active Cases"
       and the leading spaces are the firm's sort keys — a proportional font
       collapses them visually and a staffer comparing two roots cannot see
       the difference that matters. Monospace + pre-wrap preserves them. */
    .root-path {
      font-family: var(--mono); font-size: var(--fs-xs);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .banner {
      border-radius: var(--radius-sm); padding: 8px 10px;
      font-size: var(--fs-sm); margin-bottom: var(--gap);
    }
    .banner.warn { background: var(--warn-soft); color: var(--warn); }
    .banner.err  { background: var(--danger-soft); color: var(--danger); }
    .banner.ok   { background: var(--ok-soft, var(--accent-soft)); color: var(--ok); }
    .banner.info { background: var(--info-soft); color: var(--info); }
    .pill {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
    }
    .pill.on   { background: var(--info-soft); color: var(--info); }
    .pill.off  { background: var(--surface-2); color: var(--text-muted); }
    .pill.bad  { background: var(--danger-soft); color: var(--danger); }
    .pill.busy { background: var(--warn-soft); color: var(--warn); }
    .err-cell {
      color: var(--danger); font-size: var(--fs-xs);
      cursor: pointer; overflow-wrap: anywhere;
    }
    .mini { font-size: var(--fs-xs); color: var(--text-muted); }
    #syncPanel .addrow { display: flex; gap: var(--gap-sm); flex-wrap: wrap; align-items: center; }
    #syncPanel .addrow input { flex: 1; min-width: 160px; }
    #syncPanel .diag-cases {
      max-height: 260px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-top: 6px;
    }

    /* ── Re-link block (S3.3) ───────────────────────────────────────────
       The queue is ~418 rows of which ~24 can be acted on, so the layout's
       job is to put those 24 in front of a person and keep the other ~394
       reachable without being in the way. Rows, not a table: a case expands
       into its candidates and a table cannot hold that without colspan
       gymnastics. */
    #syncPanel .rl-row {
      border-top: 1px solid var(--border); padding: 7px 4px;
      display: flex; gap: var(--gap-sm); align-items: flex-start;
    }
    #syncPanel .rl-row:first-child { border-top: 0; }
    #syncPanel .rl-main { flex: 1; min-width: 0; }
    #syncPanel .rl-head {
      display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
      cursor: pointer;
    }
    #syncPanel .rl-id { font-family: var(--mono); font-size: var(--fs-xs); }
    #syncPanel .rl-name { font-weight: 600; font-size: var(--fs-sm); }
    #syncPanel .rl-cands {
      margin: 6px 0 2px; border-left: 2px solid var(--border); padding-left: 8px;
    }
    #syncPanel .rl-cand { padding: 5px 0; border-top: 1px dashed var(--border); }
    #syncPanel .rl-cand:first-child { border-top: 0; }
    /* A candidate that belongs to another case renders inert: dimmed, and with
       no confirm control in the DOM at all. Not disabled — absent. */
    #syncPanel .rl-cand.taken { opacity: 0.55; }
    #syncPanel .rl-strip {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    }
    #syncPanel .rl-list {
      max-height: 300px; overflow-y: auto; margin-top: 6px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 0 8px;
    }
    /* Confidence must be readable at a glance and must NOT read as a gradient
       of the same thing: docket is an opaque docket-number substring match,
       name is a whole-token client-name match, weak is a surname collision
       that is usually a different person. */
    .pill.lane-docket { background: var(--info-soft); color: var(--info); }
    .pill.lane-name   { background: var(--warn-soft); color: var(--warn); }
    .pill.lane-weak   { background: var(--danger-soft); color: var(--danger); }

    /* One muted line under the toolbar telling the truth about a big number. */
    .scope-note {
      font-size: var(--fs-sm); color: var(--text-muted);
      margin-bottom: var(--gap); overflow-wrap: anywhere;
    }

    .swal2-popup { font-size: var(--fs) !important; }
    .swal-lbl { font-weight: 600; font-size: var(--fs-sm); color: var(--text-2); display: block; }
    .swal-note { font-size: var(--fs-sm); color: var(--text-muted); }
  </style>
</head>
<body>
<!-- ═══════════════════════════════════════════════════════════════════════
  documents.html — the staff-facing documents surface (Documents S3).

  ONE FILE, TWO MODES, keyed on the URL:

    ?link_type=case&link_id=AAAA   SCOPED  — a compact widget, iframed into
                                             case.html / contact.html. The
                                             list is pre-filtered by the
                                             registry's own link_type/link_id
                                             params; no page chrome.
    (no params)                    GLOBAL  — the full page, opened from the
                                             shell's More grid. Search,
                                             facets, sort, paging.

  One file rather than two because every row affordance (view, download,
  share, edit, links) is identical in both and a second copy would drift.
  Everything mode-specific is `body.scoped` in CSS or `SCOPED` in JS.

  ── HOW THE BYTES GET HERE, AND WHY IT LOOKS ROUNDABOUT ──────────────────
  There is no auth cookie in this app — the JWT lives in localStorage and
  rides an Authorization header — so an <img src> or <iframe src> pointing at
  an authed API route sends no credentials and gets a 401. And the /view
  URL cannot be pointed at either: Dropbox serves it Content-Disposition:
  attachment, with no CORS and a CSP sandbox, so it can be downloaded but
  never rendered in-page.

  So: fetch GET /api/documents/:id/raw through the shell's apiSend with
  responseType:'blob', URL.createObjectURL the result, render THAT. This is
  public/formInbox.html's downloadPdf pattern; the object URLs are revoked on
  close and again on a safety timer.

  ── DEFAULT SORT IS `modified`, DELIBERATELY ─────────────────────────────
  Post-backfill every row shares one `updated_at`, so the registry's `newest`
  sort is meaningless on real data. `modified` sorts on the file's own
  server_modified, which is what staff mean by "recent".

  ── SCOPED MODE SHOWS RELATED DOCUMENTS BY DEFAULT (S3.1) ────────────────
  A case's documents mostly arrive filed against the CLIENT rather than the
  matter, so the strictly-direct list a scope produces is usually the shorter
  and less useful one. "Include related" expands the scope ONE HOP through
  case_relate — a case also sees its related contacts' documents, a contact
  also sees its related cases' — and every row that arrived that way is BADGED
  with the record it came through. One hop, never two: a related contact's
  OTHER cases are a different client matter and never appear here. The server
  enforces that structurally (see documentService.resolveRelatedTargets); this
  page only has to render it honestly, which means the badge.
═══════════════════════════════════════════════════════════════════════════ -->

<div id="topbar">
  <div class="title">Docu<span>ments</span></div>
  <div class="spacer"></div>
  <span class="count" id="topCount"></span>
  <!-- COLLAPSED BY DEFAULT, and it loads nothing until pressed. The roots
       table, the kill switch and the diagnostics are ops questions asked
       occasionally; paying for three requests on every page open to answer
       them proactively would be a cost every staffer pays so one person can
       occasionally look. -->
  <button class="btn btn-ghost btn-sm" id="syncToggle" onclick="onToggleSyncPanel()"
          title="Dropbox sync roots, status and diagnostics">
    <i class="fa-solid fa-rotate"></i> Sync
  </button>
  <button class="btn btn-ghost btn-sm" onclick="onRefresh()" title="Re-fetch the list">
    <i class="fa-solid fa-arrows-rotate"></i> Refresh
  </button>
</div>

<div id="scopedHead">
  <h3><i class="fa-solid fa-folder-open"></i> Documents</h3>
  <!-- DEFAULT ON. A case's documents mostly arrive filed against the CLIENT,
       not the matter, so an off-by-default toggle would ship the feature and
       hide it — staff would keep seeing the short list they already had and
       never learn there was a longer one. Rows that came in this way are
       badged, so "on" is never silently misleading. -->
  <label class="toggle" for="tb-related"
         title="Also show documents linked to the records related to this one">
    <input type="checkbox" id="tb-related" checked
           onchange="onRelatedChange(this.checked)">
    Include related
  </label>
  <div class="spacer"></div>
  <span class="count" id="scopedCount"></span>
  <button class="btn btn-outline btn-sm" onclick="onRefresh()" title="Re-fetch the list">
    <i class="fa-solid fa-arrows-rotate"></i> Refresh
  </button>
</div>

<div id="scroll">
  <div id="inner">

    <!-- ── Toolbar — GLOBAL only (hidden by body.scoped rules below) ── -->
    <div class="toolbar" id="toolbar">
      <div class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="tb-search" placeholder="Search name, title, tags…"
          oninput="onSearchInput(this.value)">
      </div>
      <div class="ctl">
        <label for="tb-doctype">Type</label>
        <input type="text" id="tb-doctype" list="dl-doctype" placeholder="any"
          maxlength="64" onchange="onDocTypeChange(this.value)">
        <datalist id="dl-doctype"></datalist>
      </div>
      <!-- FILE KIND. A fixed <select>, unlike the two free-text facets beside
           it: doc_type and tag are staff-authored and open-ended, but a file
           extension is a closed set the registry derived itself, and the thing
           staff actually mean is a CATEGORY ("a spreadsheet"), not an
           extension. Each option is therefore a CSV the API expands to an IN
           list. Values must stay inside _extOf's shape (lowercase
           alphanumeric) or the service drops them as junk.

           NO "Other" OPTION, deliberately: it would need a NOT IN over an
           open-ended set — a different predicate with different (worse)
           behaviour on an unindexed column, and one that silently changes
           meaning every time a new file type enters the estate. An absent
           option beats one that quietly means something else. -->
      <div class="ctl">
        <label for="tb-ext">File</label>
        <select id="tb-ext" onchange="onExtChange(this.value)">
          <option value="" selected>Any</option>
          <option value="pdf">PDF</option>
          <option value="png,jpg,jpeg,gif,webp,heic,tif,tiff,bmp">Images</option>
          <option value="doc,docx,rtf,odt">Word</option>
          <option value="xls,xlsx,ods,csv">Spreadsheets</option>
          <option value="ppt,pptx,odp">Slides</option>
          <option value="txt,md,log">Text</option>
          <option value="eml,msg">Email</option>
          <option value="zip,rar,7z,gz">Archives</option>
        </select>
      </div>
      <div class="ctl">
        <label for="tb-tag">Tag</label>
        <input type="text" id="tb-tag" list="dl-tag" placeholder="any"
          maxlength="64" onchange="onTagChange(this.value)">
        <datalist id="dl-tag"></datalist>
      </div>
      <div class="ctl">
        <label for="tb-status">Status</label>
        <select id="tb-status" onchange="onStatusChange(this.value)">
          <option value="" selected>Active</option>
          <option value="all">All</option>
          <option value="deleted">Deleted</option>
          <option value="missing">Missing</option>
        </select>
      </div>
      <div class="ctl">
        <label for="tb-sort">Sort</label>
        <select id="tb-sort" onchange="onSortChange(this.value)">
          <option value="modified" selected>File modified</option>
          <option value="name">Name</option>
          <option value="size">Size</option>
          <option value="newest">Registry — newest</option>
          <option value="oldest">Registry — oldest</option>
        </select>
      </div>
      <!-- TRIAGE SCOPE (S3.2). "Unlinked" is documents with no case link at
           all — the pile a human might file. It is a SELECT beside the other
           facets rather than a separate view, because it composes with every
           one of them: unlinked PDFs modified this month is the query that
           actually gets used, and a separate page would have to grow its own
           copy of the toolbar to offer it. -->
      <div class="ctl">
        <label for="tb-scope">Scope</label>
        <select id="tb-scope" onchange="onScopeChange(this.value)">
          <option value="" selected>All</option>
          <option value="case">Unlinked</option>
        </select>
      </div>
    </div>

    <div id="syncPanel"></div>

    <div id="relNote"></div>
    <div id="scopeNote"></div>

    <div id="listWrap">
      <div class="state"><i class="fa-solid fa-spinner fa-spin"></i>Loading…</div>
    </div>

    <div id="pager"></div>

  </div>
</div>

<!-- Viewer overlay (see the CSS note). Empty until openViewer fills it. -->
<div id="viewer" onclick="if (event.target === this) closeViewer()">
  <div class="vw-box">
    <div class="vw-head">
      <span class="vw-title" id="vwTitle"></span>
      <button class="btn btn-outline btn-sm" id="vwTab" onclick="viewerOpenTab()">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Open in tab
      </button>
      <button class="btn btn-outline btn-sm" id="vwDl" onclick="viewerDownload()">
        <i class="fa-solid fa-download"></i> Download
      </button>
      <button class="btn btn-outline btn-sm" onclick="closeViewer()">
        <i class="fa-solid fa-xmark"></i> Close
      </button>
    </div>
    <div class="vw-body" id="vwBody"></div>
  </div>
</div>

<script>
(function () {
'use strict';

// ════════════════════════════════════════════════════════════════════════════
// Mode
// ════════════════════════════════════════════════════════════════════════════
var Q         = new URLSearchParams(location.search);
var LINK_TYPE = (Q.get('link_type') || '').trim();
var LINK_ID   = (Q.get('link_id')   || '').trim();
var SCOPED    = !!(LINK_TYPE && LINK_ID);

// A human name for the scope, used in confirm text and the unlink button.
var SCOPE_WORD = LINK_TYPE === 'case' ? 'case'
               : LINK_TYPE === 'contact' ? 'contact'
               : (LINK_TYPE || 'record');

if (SCOPED) document.body.classList.add('scoped');
document.getElementById('toolbar').style.display = SCOPED ? 'none' : '';

// ════════════════════════════════════════════════════════════════════════════
// Transport
//
// window.top, not window.parent: this page runs at depth 1 (the shell's More
// panel) AND at depth 2 (case.html / contact.html tab). window.top reaches the
// shell's apiSend from either without a relay — the esign/caseWidget.html
// precedent. window.parent is kept as a fallback for the depth-1 case if a
// future host stops being the top window.
//
// Everything goes through this: apiSend owns the JWT, the 401-relogin retry,
// the VersionGuard check and — critically — the sync-bus sniff. A bare fetch
// here would be invisible to every other open frame.
// ════════════════════════════════════════════════════════════════════════════
function shellRealm() {
  try {
    if (window.top && window.top !== window && typeof window.top.apiSend === 'function') {
      return window.top;
    }
  } catch (_) { /* cross-origin top */ }
  try {
    var p = window.parent;
    if (p && p !== window && typeof p.apiSend === 'function') return p;
  } catch (_) { /* noop */ }
  return null;
}
function api() {
  var realm = shellRealm();
  if (!realm) {
    return Promise.reject(new Error('apiSend unavailable — open this page inside YisraCase.'));
  }
  return realm.apiSend.apply(realm, arguments);
}

var Toast = Swal.mixin({
  toast: true, position: 'top-end', timer: 2500,
  showConfirmButton: false, timerProgressBar: true,
});

function E(id) { return document.getElementById(id); }

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ════════════════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════════════════
var state = {
  docs:     [],
  total:    0,
  page:     1,                       // 1-indexed
  pageSize: SCOPED ? 25 : 30,
  q:        '',
  doc_type: '',
  ext:      '',                      // '' or a CSV of extensions
  tag:      '',
  status:   '',                      // '' → the API default (active only)
  sort:     'modified',
  // '' → every document; 'case' → only those with NO case link at all.
  // GLOBAL only: the whole point of a scoped widget is that its documents are
  // linked to something, so "unlinked" there is a guaranteed empty list.
  unlinked: '',
  // ONE HOP through case_relate. Scoped mode only — a global list has no scope
  // to expand, and the API ignores the flag there anyway. Default ON; see the
  // checkbox's own comment for why.
  related:  SCOPED,
  // The labelled target set the last related response actually used. This is
  // the bus's address book — see the doclink subscriber — and it is the
  // SERVER's answer, not something derived from what happened to be on screen.
  relatedTargets:   [],
  relatedTruncated: false,
  loading:  false,
};

/* ECHO FENCE for the doclink subscriber. A link/unlink WE performed already
   refetches on its own continuation; the bus then announces that same write
   back to us over BroadcastChannel (a macrotask, so it always lands after).
   Without the stamp every link action here costs two identical list GETs.
   Same shape as case.html's apptsLastRefresh. */
var linksLastRefresh = 0;

// ════════════════════════════════════════════════════════════════════════════
// Formatters
// ════════════════════════════════════════════════════════════════════════════
function fmtSize(bytes) {
  var n = Number(bytes);
  if (!Number.isFinite(n) || n < 0) return '—';
  if (n === 0) return '0 B';
  var units = ['B', 'KB', 'MB', 'GB', 'TB'];
  var i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  if (i === 0) return v + ' B';
  return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + units[i];
}

function fmtDate(v) {
  if (!v) return '—';
  try {
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString();
  } catch (_) { return String(v); }
}

function iconForExt(ext) {
  var e = String(ext || '').toLowerCase();
  if (e === 'pdf') return 'fa-file-pdf';
  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'heic', 'tif', 'tiff', 'bmp', 'svg'].indexOf(e) !== -1) return 'fa-file-image';
  if (['doc', 'docx', 'rtf', 'odt'].indexOf(e) !== -1) return 'fa-file-word';
  if (['xls', 'xlsx', 'ods'].indexOf(e) !== -1) return 'fa-file-excel';
  if (['ppt', 'pptx'].indexOf(e) !== -1) return 'fa-file-powerpoint';
  if (e === 'csv') return 'fa-file-csv';
  if (['txt', 'md', 'log'].indexOf(e) !== -1) return 'fa-file-lines';
  if (['zip', 'rar', '7z', 'gz'].indexOf(e) !== -1) return 'fa-file-zipper';
  if (['mp3', 'wav', 'm4a'].indexOf(e) !== -1) return 'fa-file-audio';
  if (['mp4', 'mov', 'avi', 'mkv'].indexOf(e) !== -1) return 'fa-file-video';
  return 'fa-file';
}

function docTitle(d) {
  return d.title || d.name || ('#' + d.id);
}

/* The extensions /raw will serve inline. MUST stay in step with
   RAW_INLINE_MIME in routes/api.documents.js — this copy exists so a
   non-viewable document never spends a round-trip discovering that. A drift
   is not dangerous (the server's list is the one that decides; ours only
   decides whether to ask), but it is a wasted 413 or a missing View button. */
var INLINE_EXT = ['pdf', 'png', 'jpg', 'jpeg', 'gif', 'webp'];
function isInlineExt(ext) {
  return INLINE_EXT.indexOf(String(ext || '').toLowerCase()) !== -1;
}

function tagList(tags) {
  return String(tags || '').split(',').map(function (t) { return t.trim(); })
    .filter(Boolean);
}

// ════════════════════════════════════════════════════════════════════════════
// List fetch + render
// ════════════════════════════════════════════════════════════════════════════
function buildListParams() {
  // Only non-empty keys: URLSearchParams stringifies undefined as the literal
  // "undefined", so an empty facet must be omitted entirely, not sent blank.
  var p = {
    sort:   state.sort,
    limit:  state.pageSize,
    offset: (state.page - 1) * state.pageSize,
  };
  if (state.q)        p.q        = state.q;
  if (state.doc_type) p.doc_type = state.doc_type;
  if (state.ext)      p.ext      = state.ext;
  if (state.tag)      p.tag      = state.tag;
  if (state.status)   p.status   = state.status;
  // Never sent alongside a scope. The server drops it there anyway (a scope
  // and an anti-scope intersect at the empty set), but sending a param that
  // is guaranteed to be ignored just to rely on being ignored is how a future
  // change to that rule becomes a mystery.
  if (!SCOPED && state.unlinked) p.unlinked = state.unlinked;
  if (SCOPED) {
    p.link_type = LINK_TYPE;
    p.link_id   = LINK_ID;
    // OMITTED when off rather than sent as 0: '0' is a truthy STRING on the
    // wire, and while the service normalises it, not sending it at all leaves
    // no room for a future caller to get that wrong.
    if (state.related) p.related = 1;
  }
  return p;
}

function renderState(html, cls) {
  E('listWrap').innerHTML =
    '<div class="state' + (cls ? ' ' + cls : '') + '">' + html + '</div>';
}

async function fetchDocs() {
  state.loading = true;
  renderState('<i class="fa-solid fa-spinner fa-spin"></i>Loading…');

  var data;
  try {
    data = await api('/api/documents', 'GET', buildListParams());
  } catch (err) {
    state.loading = false;
    renderState(
      '<i class="fa-solid fa-circle-exclamation"></i>Failed to load documents.'
      + '<div class="sub">' + esc(err && err.message || err) + '</div>'
      + '<div style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="fetchDocs()">'
      + '<i class="fa-solid fa-arrows-rotate"></i> Retry</button></div>',
      'err'
    );
    E('pager').innerHTML = '';
    E('relNote').innerHTML = '';
    E('scopeNote').innerHTML = '';
    setCount('');
    return;
  }

  state.loading = false;
  state.docs  = Array.isArray(data.documents) ? data.documents : [];
  state.total = Number(data.total) || 0;
  // Present only on a related response; reset either way so a toggle-off
  // cannot leave a stale address book behind for the bus subscriber.
  state.relatedTargets   = Array.isArray(data.related_targets) ? data.related_targets : [];
  state.relatedTruncated = !!data.related_truncated;

  // Clamp if we ran past the end (a filter change, or rows leaving the
  // status window) and re-fetch once.
  var maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
  if (state.page > maxPage) {
    state.page = maxPage;
    return fetchDocs();
  }

  renderRelNote();
  renderScopeNote();
  renderList();
  renderPagination();
  renderFacetHints();
  setCount(state.total
    ? state.total + ' document' + (state.total === 1 ? '' : 's')
    : '');
}
window.fetchDocs = fetchDocs;   // referenced by the Retry button's onclick

function setCount(text) {
  E('topCount').textContent    = text;
  E('scopedCount').textContent = text;
}

/* One muted line naming WHOSE documents got mixed in.
 *
 * Without it, "Include related" is a checkbox whose effect the user has to
 * reverse-engineer from the badges on individual rows — and on a page where
 * every row happens to be direct, from nothing at all. Naming the related
 * records up front makes the toggle's state legible even when it changed
 * nothing on this particular page. */
function renderRelNote() {
  var el = E('relNote');
  if (!el) return;

  var parts = [];

  if (state.relatedTruncated) {
    // The cap fired. Loud-ish, because a silently shortened related list is
    // indistinguishable from a complete one.
    parts.push('<div class="rel-note warn">'
      + '<i class="fa-solid fa-triangle-exclamation"></i> '
      + 'This ' + esc(SCOPE_WORD) + ' has more related records than can be '
      + 'included at once — some related documents are not shown.</div>');
  }

  var hops = (state.relatedTargets || []).filter(function (t) { return !t.direct; });
  if (state.related && hops.length) {
    parts.push('<div class="rel-note">Also showing documents linked to '
      + hops.map(function (t) {
          return '<b>' + esc(t.label) + '</b>'
               + (t.relate_type ? ' <span>(' + esc(t.relate_type) + ')</span>' : '');
        }).join(', ')
      + '.</div>');
  }

  el.innerHTML = parts.join('');
}

/* THE NUMBER IS NOT A DEFECT COUNT, AND WITHOUT THIS LINE IT READS AS ONE.
 *
 * Around 130,000 of the registry's ~153,000 documents have no case link, and
 * MOST OF THEM ARE CORRECTLY UNLINKED: the firm's Dropbox spans practice areas
 * and decades that the `cases` table never covered, so there is no case for
 * those files to belong to and there never will be. A staffer opening this
 * view and seeing six figures with no explanation concludes the sync is broken
 * and escalates — the honest framing has to arrive with the number, not after
 * someone asks about it.
 *
 * Sorting by file-modified is the other half of the same job: it puts the rows
 * that plausibly SHOULD be filed (recent arrivals) on page one, ahead of the
 * decades of correctly-unowned history behind them. */
function renderScopeNote() {
  var el = E('scopeNote');
  if (!el) return;
  if (SCOPED || !state.unlinked) { el.innerHTML = ''; return; }

  el.innerHTML = '<div class="scope-note">'
    + '<i class="fa-solid fa-circle-info"></i> '
    + 'Documents with no case link. <b>Most of these are correct</b> — the firm’s '
    + 'Dropbox covers work and years outside the case list, so a file here is not '
    + 'necessarily misfiled. This is a triage surface, not an error count; recent '
    + 'files sort first because they are the ones most likely to need filing.'
    + '</div>';
}

function emptyStateHtml() {
  var filtered = state.q || state.doc_type || state.ext || state.tag || state.status;
  if (!SCOPED && state.unlinked && !filtered) {
    // Genuinely good news, and worth saying so rather than showing the generic
    // "no documents in the registry" line, which would look like a failure.
    return '<i class="fa-solid fa-circle-check"></i>'
         + 'Every document has a case link.'
         + '<div class="sub">Nothing is waiting to be filed.</div>';
  }
  if (filtered) {
    return '<i class="fa-solid fa-filter-circle-xmark"></i>'
         + 'No documents match your filters.'
         + '<div class="sub">Try clearing the search or filters.</div>';
  }
  if (SCOPED) {
    /* THIS WORDING MATTERS THIS WEEK. The S2 backfill is still walking the
       tree while S3 ships, so a case whose folder has not been reached yet
       has a genuinely empty registry — and "No documents" next to a case
       everyone knows has forty files in Dropbox reads as a broken widget. */
    return '<i class="fa-solid fa-folder-open"></i>'
         + 'No documents synced yet.'
         + '<div class="sub">Files are indexed from Dropbox in the background. '
         + 'Nothing has been linked to this ' + esc(SCOPE_WORD)
         + (state.related ? ' or to its related records' : '')
         + ' yet.'
         // Only when the toggle is OFF and could actually widen the result —
         // suggesting a checkbox that is already ticked is noise.
         + (state.related ? '' : ' Try turning on “Include related”.')
         + '</div>';
  }
  return '<i class="fa-solid fa-folder-open"></i>'
       + 'No documents in the registry yet.'
       + '<div class="sub">Files are indexed from Dropbox in the background.</div>';
}

function rowHtml(d) {
  var gone   = d.status && d.status !== 'active';
  var inline = isInlineExt(d.ext);
  var tags   = tagList(d.tags);

  var chips = '';
  if (d.doc_type) chips += '<span class="chip type">' + esc(d.doc_type) + '</span>';
  chips += tags.map(function (t) {
    return '<span class="chip">' + esc(t) + '</span>';
  }).join('');
  if (d.shared_link) {
    chips += '<span class="chip pub" title="A permanent public link exists for this document">'
           + '<i class="fa-solid fa-globe"></i> public</span>';
  }
  if (gone) chips += '<span class="chip gone">' + esc(d.status) + '</span>';

  /* PROVENANCE BADGES (S3.1). `via` lists which of the scope's targets matched
     this row, direct first.
     A row that matched the scoped target DIRECTLY gets NO badge: it is this
     case's/contact's own document and saying so would be noise on the majority
     of rows. Everything else is here because of a RELATED record, and the user
     needs to know WHICH one before acting on it — "why is another client's
     file in this list" is the question the badge answers before it is asked. */
  var via = Array.isArray(d.via) ? d.via : [];
  var isDirect = via.some(function (v) { return v.direct; });
  if (via.length && !isDirect) {
    chips += via.map(function (v) {
      return '<span class="chip via" title="Linked to a related '
           + esc(v.link_type) + ', not to this ' + esc(SCOPE_WORD) + ' directly">'
           + 'via ' + esc(v.link_type) + ': ' + esc(v.label)
           + (v.relate_type ? ' (' + esc(v.relate_type) + ')' : '')
           + '</span>';
    }).join('');
  }

  // The title (human) is the headline when set; the file name is then the
  // subtitle. Untitled rows show the file name as the headline and the path
  // as the subtitle — the path is how staff recognise a case folder.
  var head = esc(docTitle(d));
  var sub  = d.title ? esc(d.name) : esc(d.path || '');

  return ''
    + '<tr class="doc-row' + (gone ? ' is-gone' : '') + '" data-row-id="' + d.id + '">'
    +   '<td>'
    +     '<div class="d-name"><i class="fa-solid ' + iconForExt(d.ext) + ' d-icon"></i>' + head + '</div>'
    +     (sub ? '<div class="d-sub">' + sub + '</div>' : '')
    +     (chips ? '<div style="margin-top:3px">' + chips + '</div>' : '')
    +   '</td>'
    +   '<td class="num wide-only">' + esc(fmtSize(d.size)) + '</td>'
    +   '<td class="nowrap">' + esc(fmtDate(d.server_modified)) + '</td>'
    +   '<td class="acts">'
    +     '<button class="icon-btn" title="' + (inline ? 'View' : 'Not viewable inline — downloads instead') + '" '
    +       'onclick="onView(' + d.id + ')"><i class="fa-solid fa-eye"></i></button>'
    +     '<button class="icon-btn" title="Download" onclick="onDownload(' + d.id + ')">'
    +       '<i class="fa-solid fa-download"></i></button>'
    +     '<button class="icon-btn" title="Copy public link" onclick="onCopyLink(' + d.id + ', this)">'
    +       '<i class="fa-solid fa-link"></i></button>'
    +     '<button class="icon-btn" title="Edit title, type and tags" onclick="onEdit(' + d.id + ')">'
    +       '<i class="fa-solid fa-pen"></i></button>'
    +     '<button class="icon-btn" title="Links" onclick="onLinks(' + d.id + ')">'
    +       '<i class="fa-solid fa-diagram-project"></i></button>'
    +   '</td>'
    + '</tr>';
}

function renderList() {
  if (!state.docs.length) {
    renderState(emptyStateHtml());
    return;
  }
  E('listWrap').innerHTML =
    '<table id="docTable">'
    + '<thead><tr>'
    +   '<th>Document</th>'
    +   '<th class="num wide-only">Size</th>'
    +   '<th>Modified</th>'
    +   '<th></th>'
    + '</tr></thead>'
    + '<tbody>' + state.docs.map(rowHtml).join('') + '</tbody>'
    + '</table>';
}

/** Repaint ONE row in place — used by the bus's value path, which must not
 *  cost a fetch. */
function replaceRow(d) {
  var el = document.querySelector('[data-row-id="' + d.id + '"]');
  if (el) el.outerHTML = rowHtml(d);
}

/* Datalist hints for the two free-text facets. The registry has no facet
   endpoint (no /api/documents/doc-types, no /api/documents/tags), so these
   are built from the CURRENT PAGE only — which is why they are a <datalist>
   on a text input and not a <select>: a hint that may be incomplete is fine,
   a dropdown that silently cannot offer a value that exists is not. */
function renderFacetHints() {
  if (SCOPED) return;
  var types = {}, tags = {};
  state.docs.forEach(function (d) {
    if (d.doc_type) types[d.doc_type] = 1;
    tagList(d.tags).forEach(function (t) { tags[t] = 1; });
  });
  E('dl-doctype').innerHTML = Object.keys(types).sort().map(function (t) {
    return '<option value="' + esc(t) + '">';
  }).join('');
  E('dl-tag').innerHTML = Object.keys(tags).sort().map(function (t) {
    return '<option value="' + esc(t) + '">';
  }).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// Pagination
// ════════════════════════════════════════════════════════════════════════════
function renderPagination() {
  var pager = E('pager');
  var total = state.total;
  if (!total) { pager.innerHTML = ''; return; }

  var maxPage = Math.max(1, Math.ceil(total / state.pageSize));
  if (maxPage === 1) { pager.innerHTML = ''; return; }

  var cur   = state.page;
  var start = (cur - 1) * state.pageSize + 1;
  var end   = Math.min(cur * state.pageSize, total);

  var nums = [1, maxPage, cur, cur - 1, cur - 2, cur + 1, cur + 2]
    .filter(function (n, i, a) { return n >= 1 && n <= maxPage && a.indexOf(n) === i; })
    .sort(function (a, b) { return a - b; });

  var html = '<span class="range">' + start + '–' + end + ' of ' + total + '</span>';
  html += '<button class="page-btn" ' + (cur <= 1 ? 'disabled' : '')
        + ' onclick="gotoPage(' + (cur - 1) + ')"><i class="fa-solid fa-chevron-left"></i></button>';

  var prev = 0;
  nums.forEach(function (n) {
    if (n - prev > 1) html += '<span class="ellipsis">…</span>';
    html += '<button class="page-btn ' + (n === cur ? 'active' : '') + '" '
          + 'onclick="gotoPage(' + n + ')">' + n + '</button>';
    prev = n;
  });

  html += '<button class="page-btn" ' + (cur >= maxPage ? 'disabled' : '')
        + ' onclick="gotoPage(' + (cur + 1) + ')"><i class="fa-solid fa-chevron-right"></i></button>';

  pager.innerHTML = html;
}

window.gotoPage = function (n) {
  var maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
  var target  = Math.min(Math.max(1, n), maxPage);
  if (target === state.page) return;
  state.page = target;
  fetchDocs();
  E('scroll').scrollTo({ top: 0, behavior: 'smooth' });
};

// ════════════════════════════════════════════════════════════════════════════
// Toolbar handlers
// ════════════════════════════════════════════════════════════════════════════
var searchTimer = null;
window.onSearchInput = function (v) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    state.q = (v || '').trim();
    state.page = 1;
    fetchDocs();
  }, 280);
};
window.onDocTypeChange = function (v) { state.doc_type = (v || '').trim(); state.page = 1; fetchDocs(); };
window.onExtChange     = function (v) { state.ext      = (v || '').trim(); state.page = 1; fetchDocs(); };
window.onTagChange     = function (v) { state.tag      = (v || '').trim(); state.page = 1; fetchDocs(); };
window.onStatusChange  = function (v) { state.status   = v || '';          state.page = 1; fetchDocs(); };
window.onSortChange    = function (v) { state.sort     = v || 'modified';  state.page = 1; fetchDocs(); };
/* Page 1, same reason as the related toggle: the result set changed size, and
   page 6 of a list that just shrank is an empty page under a lying pager. */
window.onScopeChange   = function (v) { state.unlinked = v || '';          state.page = 1; fetchDocs(); };

/* Widening or narrowing the scope changes the RESULT SET, so page 1 — staying
   on page 6 of a list that just got shorter shows an empty page and a pager
   that disagrees with it. (fetchDocs clamps too, but at the cost of a second
   round trip.) */
window.onRelatedChange = function (on) {
  state.related = !!on;
  state.page = 1;
  fetchDocs();
};

window.onRefresh = async function () {
  await fetchDocs();
  Toast.fire({ icon: 'success', title: 'Refreshed' });
};

/** Parent hook — mirrors reloadTasks / reloadChecklists / refreshEsign, so a
 *  host tab can push a reload on re-entry without knowing anything else. */
window.reloadDocuments = fetchDocs;

function findDoc(id) {
  for (var i = 0; i < state.docs.length; i++) {
    if (String(state.docs[i].id) === String(id)) return state.docs[i];
  }
  return null;
}

// ════════════════════════════════════════════════════════════════════════════
// Viewer
// ════════════════════════════════════════════════════════════════════════════
var viewer = { url: null, timer: null, doc: null };

function revokeViewerUrl() {
  if (viewer.timer) { clearTimeout(viewer.timer); viewer.timer = null; }
  if (viewer.url) {
    try { URL.revokeObjectURL(viewer.url); } catch (_) { /* noop */ }
    viewer.url = null;
  }
}

window.closeViewer = function () {
  E('viewer').classList.remove('open');
  E('vwBody').innerHTML = '';
  viewer.doc = null;
  revokeViewerUrl();
};

window.viewerOpenTab = function () {
  if (!viewer.url) return;
  // A blob URL in a tab needs no auth and gets the browser's native PDF /
  // image viewer, with print and save. Same move as formInbox's shift-click.
  var w = window.open(viewer.url, '_blank');
  if (!w) Toast.fire({ icon: 'warning', title: 'Popup blocked' });
};

window.viewerDownload = function () {
  if (viewer.doc) onDownload(viewer.doc.id);
};

/**
 * View a document.
 *
 * Three outcomes, and every one of them ends with the user holding the file:
 *   inline-capable ext  → /raw as a blob → in-page modal
 *   413 (too big / size unknown) → silently degrade to the /view download
 *   non-inline ext      → skip /raw entirely and go straight to /view
 */
window.onView = async function (id) {
  var d = findDoc(id);
  if (!d) return;

  if (!isInlineExt(d.ext)) return onDownload(id);

  var btn = document.querySelector('[data-row-id="' + id + '"] .icon-btn');
  if (btn) btn.disabled = true;

  var blob;
  try {
    blob = await api('/api/documents/' + id + '/raw', 'GET', null, {},
                     { responseType: 'blob' });
  } catch (err) {
    if (btn) btn.disabled = false;
    if (err && err.status === 413) {
      // The degrade path the size gate exists to produce. Not an error the
      // user has to act on — just tell them what is happening and do it.
      Toast.fire({ icon: 'info', title: 'Too large to preview — downloading instead' });
      return onDownload(id);
    }
    if (err && err.status === 410) {
      Toast.fire({ icon: 'error', title: 'This document was deleted from storage' });
      return;
    }
    Toast.fire({ icon: 'error', title: 'View failed: ' + (err && err.message || err) });
    return;
  }
  if (btn) btn.disabled = false;

  revokeViewerUrl();
  viewer.url = URL.createObjectURL(blob);
  viewer.doc = d;

  var ext = String(d.ext || '').toLowerCase();
  E('vwTitle').textContent = docTitle(d);
  E('vwBody').innerHTML = ext === 'pdf'
    ? '<iframe src="' + viewer.url + '" title="' + esc(docTitle(d)) + '"></iframe>'
    : '<img src="' + viewer.url + '" alt="' + esc(docTitle(d)) + '">';
  E('viewer').classList.add('open');

  // Safety revoke. The close handler is the real one; this catches a frame
  // that gets navigated or torn down with the viewer still open.
  viewer.timer = setTimeout(revokeViewerUrl, 300000);
};

// ════════════════════════════════════════════════════════════════════════════
// Download — always the EXPIRING /view URL, never a minted share link
// ════════════════════════════════════════════════════════════════════════════
window.onDownload = async function (id) {
  try {
    var res = await api('/api/documents/' + id + '/view', 'GET');
    if (!res || !res.url) throw new Error('No download URL returned');
    var w = window.open(res.url, '_blank');
    if (!w) {
      // Popup blockers fire on a window.open that follows an await. Hand the
      // URL over rather than swallowing the action.
      Swal.fire({
        icon: 'info',
        title: 'Open the download',
        html: '<a href="' + esc(res.url) + '" target="_blank" rel="noopener">'
            + 'Click here to download</a>'
            + '<div class="swal-note" style="margin-top:8px">'
            + 'Your browser blocked the automatic download.</div>',
      });
    }
  } catch (err) {
    if (err && err.status === 410) {
      Toast.fire({ icon: 'error', title: 'This document was deleted from storage' });
      return;
    }
    Toast.fire({ icon: 'error', title: 'Download failed: ' + (err && err.message || err) });
  }
};

// ════════════════════════════════════════════════════════════════════════════
// Share — the ONLY place a permanent public URL is minted
// ════════════════════════════════════════════════════════════════════════════
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) {
      var orig = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check"></i>';
      setTimeout(function () { btn.innerHTML = orig; }, 1400);
    } else {
      Toast.fire({ icon: 'success', title: 'Link copied' });
    }
    return true;
  } catch (_) {
    // The Clipboard API is blocked in some iframe / permission contexts.
    Swal.fire({
      icon: 'info', title: 'Copy manually',
      html: '<textarea readonly style="width:100%;height:64px;font-family:var(--mono);'
          + 'font-size:11px;">' + esc(text) + '</textarea>',
    });
    return false;
  }
}

window.onCopyLink = async function (id, btn) {
  var d = findDoc(id);
  if (!d) return;

  // Already shared → nothing to mint, nothing to confirm. Just copy.
  if (d.shared_link) return void copyText(d.shared_link, btn);

  /* FIRST MINT IS A CONSENT STEP, and the wording is not decoration. /share
     creates a PERMANENT, PUBLIC, UNAUTHENTICATED Dropbox URL: anyone holding
     it can read the file forever, with no login and no audit trail, and this
     UI is the only thing standing between "copy a link" and that. Say what it
     is, in those words, before the first one exists. */
  var r = await Swal.fire({
    icon: 'warning',
    title: 'Create a public link?',
    html: '<div style="text-align:left">'
        + '<p>This creates a <b>permanent, public link</b> to '
        + '“' + esc(docTitle(d)) + '”.</p>'
        + '<p class="swal-note" style="margin-top:8px">'
        + 'Anyone with the link can open the document — no login required — and '
        + 'the link does not expire. Use it for sending a document to a client, '
        + 'not for viewing it yourself.</p></div>',
    showCancelButton: true,
    confirmButtonText: 'Create public link',
    confirmButtonColor: 'var(--warn-fill)',
  });
  if (!r.isConfirmed) return;

  try {
    var res = await api('/api/documents/' + id + '/share', 'POST');
    if (!res || !res.shared_link) throw new Error('No link returned');
    d.shared_link = res.shared_link;
    replaceRow(d);
    await copyText(res.shared_link, null);
  } catch (err) {
    Swal.fire('Could not create link', (err && err.message) || String(err), 'error');
  }
};

// ════════════════════════════════════════════════════════════════════════════
// Edit — title / doc_type / tags
// ════════════════════════════════════════════════════════════════════════════
window.onEdit = async function (id) {
  var d = findDoc(id);
  if (!d) return;

  var r = await Swal.fire({
    title: 'Edit document',
    width: 500,
    html:
      '<div style="text-align:left">'
      +   '<div class="swal-note" style="margin-bottom:10px;overflow-wrap:anywhere">'
      +     esc(d.name) + '</div>'
      +   '<label class="swal-lbl">Title</label>'
      +   '<input id="ed-title" class="swal2-input" style="width:100%;margin:4px 0 12px" '
      +     'maxlength="255" value="' + esc(d.title || '') + '">'
      +   '<label class="swal-lbl">Type</label>'
      +   '<input id="ed-type" class="swal2-input" style="width:100%;margin:4px 0 12px" '
      +     'maxlength="64" value="' + esc(d.doc_type || '') + '">'
      +   '<label class="swal-lbl">Tags '
      +     '<span class="swal-note">(comma-separated)</span></label>'
      +   '<input id="ed-tags" class="swal2-input" style="width:100%;margin:4px 0 0" '
      +     'value="' + esc(d.tags || '') + '">'
      + '</div>',
    showCancelButton: true,
    confirmButtonText: 'Save',
    focusConfirm: false,
    preConfirm: function () {
      return {
        title:    document.getElementById('ed-title').value,
        doc_type: document.getElementById('ed-type').value,
        tags:     document.getElementById('ed-tags').value,
      };
    },
  });
  if (!r.isConfirmed || !r.value) return;

  try {
    var res = await api('/api/documents/' + id, 'PATCH', r.value);
    if (res && res.document) {
      // The response is the whole fresh row; merge rather than replace so
      // join-only fields the list query added survive. `via` (S3.1) is exactly
      // that: PATCH knows nothing about the scope this row was listed under,
      // so replacing outright would strip the provenance badge off any related
      // row the moment someone edited its title.
      var idx = state.docs.indexOf(d);
      var merged = Object.assign({}, d, res.document);
      if (idx !== -1) state.docs[idx] = merged;
      replaceRow(merged);
      renderFacetHints();
    }
    Toast.fire({ icon: 'success', title: 'Saved' });
  } catch (err) {
    Swal.fire('Save failed', (err && err.message) || String(err), 'error');
  }
};

// ════════════════════════════════════════════════════════════════════════════
// Links — which cases / contacts this document hangs off
// ════════════════════════════════════════════════════════════════════════════
function linksHtml(links) {
  if (!links.length) {
    return '<div class="swal-note">Not linked to anything yet.</div>';
  }
  return '<table style="width:100%;border-collapse:collapse">'
    + links.map(function (l) {
        var mine = SCOPED && l.link_type === LINK_TYPE && String(l.link_id) === String(LINK_ID);
        return '<tr>'
          + '<td style="padding:4px 6px;border-top:1px solid var(--border)">'
          +   '<span class="chip type">' + esc(l.link_type) + '</span> '
          +   esc(l.link_id)
          +   (l.relation ? ' <span class="swal-note">(' + esc(l.relation) + ')</span>' : '')
          +   (mine ? ' <span class="swal-note">— this ' + esc(SCOPE_WORD) + '</span>' : '')
          + '</td>'
          + '<td style="padding:4px 6px;border-top:1px solid var(--border);text-align:right">'
          +   '<button class="btn btn-outline btn-sm" data-unlink-type="' + esc(l.link_type) + '" '
          +     'data-unlink-id="' + esc(l.link_id) + '">'
          +     '<i class="fa-solid fa-link-slash"></i> '
          +     (mine ? 'Unlink from this ' + esc(SCOPE_WORD) : 'Unlink')
          +   '</button>'
          + '</td></tr>';
      }).join('')
    + '</table>';
}

window.onLinks = async function (id) {
  var d = findDoc(id);
  if (!d) return;

  var links = [];
  try {
    var res = await api('/api/documents/' + id, 'GET');
    links = Array.isArray(res && res.links) ? res.links : [];
  } catch (err) {
    Swal.fire('Could not load links', (err && err.message) || String(err), 'error');
    return;
  }

  var changed = false;

  await Swal.fire({
    title: 'Links',
    width: 560,
    html:
      '<div style="text-align:left">'
      +   '<div class="swal-note" style="margin-bottom:10px;overflow-wrap:anywhere">'
      +     esc(docTitle(d)) + '</div>'
      +   '<div id="lk-list">' + linksHtml(links) + '</div>'
      +   '<hr style="margin:12px 0;border:0;border-top:1px solid var(--border)">'
      +   '<label class="swal-lbl">Add a link</label>'
      +   '<div style="display:flex;gap:6px;margin-top:6px">'
      +     '<select id="lk-type" class="swal2-input" style="flex:0 0 120px;margin:0">'
      +       '<option value="case"' + (LINK_TYPE === 'case' ? ' selected' : '') + '>case</option>'
      +       '<option value="contact"' + (LINK_TYPE === 'contact' ? ' selected' : '') + '>contact</option>'
      +     '</select>'
      +     '<input id="lk-id" class="swal2-input" style="flex:1;margin:0" '
      +       'maxlength="64" placeholder="id" value="' + esc(SCOPED ? LINK_ID : '') + '">'
      +     '<button id="lk-add" class="btn btn-primary btn-sm">'
      +       '<i class="fa-solid fa-plus"></i> Link</button>'
      +   '</div>'
      + '</div>',
    showConfirmButton: false,
    showCloseButton: true,
    didOpen: function () {
      var listEl = document.getElementById('lk-list');

      function repaint() { listEl.innerHTML = linksHtml(links); }

      listEl.addEventListener('click', async function (ev) {
        var btn = ev.target.closest('[data-unlink-type]');
        if (!btn) return;
        btn.disabled = true;
        var t = btn.getAttribute('data-unlink-type');
        var i = btn.getAttribute('data-unlink-id');
        try {
          await api('/api/documents/' + id + '/links', 'DELETE',
                    { link_type: t, link_id: i });
          links = links.filter(function (l) {
            return !(l.link_type === t && String(l.link_id) === String(i));
          });
          changed = true;
          repaint();
        } catch (err) {
          btn.disabled = false;
          Toast.fire({ icon: 'error', title: (err && err.message) || 'Unlink failed' });
        }
      });

      document.getElementById('lk-add').addEventListener('click', async function () {
        var t = document.getElementById('lk-type').value;
        var i = (document.getElementById('lk-id').value || '').trim();
        if (!i) { Toast.fire({ icon: 'warning', title: 'Enter an id' }); return; }
        this.disabled = true;
        try {
          var res = await api('/api/documents/' + id + '/links', 'POST',
                              { link_type: t, link_id: i });
          links = Array.isArray(res && res.links) ? res.links : links;
          changed = true;
          repaint();
        } catch (err) {
          Toast.fire({ icon: 'error', title: (err && err.message) || 'Link failed' });
        }
        this.disabled = false;
      });
    },
  });

  if (changed) {
    // A scoped list may have gained or lost this row; a global list has not
    // changed at all, but its Links state has. Refetch either way — and stamp
    // the fence first, so our own bus echo does not buy a second identical GET.
    linksLastRefresh = Date.now();
    fetchDocs();
  }
};

// ════════════════════════════════════════════════════════════════════════════
// Sync panel (S3.2) — GLOBAL mode only
//
// Manage what the engine follows, see whether it is running, and surface the
// two diagnostics that no amount of correct sync code can detect on its own:
//
//   out_of_root        cases whose Dropbox folder sits under NO enabled root.
//                      Their documents will never be registered by anything.
//   zero_attribution   cases whose folder resolves PERFECTLY and yet hold no
//                      documents — the signature of a `cases.case_dropbox`
//                      still pointing at the intake folder after the case was
//                      filed and its contents moved to a new working folder.
//                      Around 416 of the 843 Potential-resolving cached rows
//                      are in this state. Making it visible is this slice's
//                      job; the guided re-link is a later one.
//
// NO DELETE BUTTON EXISTS, and that is not an omission — a deleted root leaves
// ~100k rows nothing claims and nothing revisits. Disable is the safe verb.
//
// The panel refetches its OWN data after each mutation rather than announcing
// on the bus. Roots are ops state, not entity state: no other frame renders
// them, so a bus address for them would be an address with no subscribers.
// ════════════════════════════════════════════════════════════════════════════
var sync = {
  open:     false,
  loaded:   false,
  loading:  false,
  roots:    [],
  enabled:  null,     // null = not yet known
  reports:  [],
  fresh:    null,     // an attribution report run from this panel, this session
  error:    null,
  busy:     {},       // root id → true while its own action is in flight
  running:  false,    // the diagnostics run
  // S3.3 — the re-link queue. Its own slot rather than fields on `sync`,
  // because it is a second, independently-failing fetch with its own paging
  // and its own busy set, and flattening the two made every read ambiguous
  // about which "busy" was meant.
  relink: {
    loaded: false, loading: false, error: null,
    cases: [], total: 0, dismissedN: 0, actionable: 0, noCandidate: 0,
    truncated: false,
    expanded: {},        // case_id → true
    weak:     {},        // case_id → true (surname-only matches for this case)
    busy:     {},        // case_id → true while its own action is in flight
    busyAll:  false,
    showNoCandidate: false,
    showDismissed:   false,
  },
};

function fmtDateTime(v) {
  if (!v) return '—';
  try {
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString();
  } catch (_) { return String(v); }
}

function fmtMs(ms) {
  var n = Number(ms);
  if (!Number.isFinite(n) || n < 0) return '';
  if (n < 1000) return n + 'ms';
  if (n < 60000) return (n / 1000).toFixed(1) + 's';
  return Math.round(n / 60000) + 'm ' + Math.round((n % 60000) / 1000) + 's';
}

window.onToggleSyncPanel = function () {
  if (SCOPED) return;
  sync.open = !sync.open;
  E('syncPanel').classList.toggle('open', sync.open);
  var btn = E('syncToggle');
  if (btn) btn.classList.toggle('ok', sync.open);
  // LAZY. Nothing is fetched until the panel is opened for the first time —
  // see the button's comment for why every page load should not pay for this.
  if (sync.open && !sync.loaded && !sync.loading) loadSyncPanel();
  else if (sync.open) renderSyncPanel();
};

async function loadSyncPanel() {
  sync.loading = true;
  sync.error = null;
  renderSyncPanel();

  try {
    var res = await api('/api/documents/sync-roots', 'GET');
    // The stub-shaped response (no roots key) must not throw — a panel that
    // white-screens on an unexpected body is worse than one that shows none.
    sync.roots   = Array.isArray(res && res.roots) ? res.roots : [];
    sync.enabled = res && typeof res.sync_enabled === 'boolean' ? res.sync_enabled : null;
    sync.loaded  = true;
  } catch (err) {
    sync.error = (err && err.message) || String(err);
  }

  // Diagnostics are a SEPARATE, non-fatal fetch: they read job_results, and a
  // failure there must not take the roots table (the actionable half) down
  // with it.
  try {
    var diag = await api('/api/documents/sync-diagnostics', 'GET');
    sync.reports = Array.isArray(diag && diag.reports) ? diag.reports : [];
  } catch (_) {
    sync.reports = [];
  }

  // The re-link queue (S3.3), same non-fatal treatment and for the same
  // reason: it ranks the whole estate and is the slowest of the three, so a
  // failure or a slow day here must not take the roots table down with it.
  await loadRelink();

  sync.loading = false;
  renderSyncPanel();
}

/** Which of the three states a root is in, said in words a human can act on. */
function rootStateHtml(r) {
  if (r.syncing_since) {
    return '<span class="pill busy" title="A run has this root claimed">running</span>';
  }
  if (!r.enabled) return '<span class="pill off">disabled</span>';
  if (r.backfill_done) return '<span class="pill on">incremental</span>';
  var mode = r.stats && r.stats.mode;
  if (mode === 'empty_root') {
    return '<span class="pill off" title="path/not_found — the folder has not been '
         + 'created in Dropbox yet. Not an error.">empty</span>';
  }
  return '<span class="pill busy" title="Still walking the initial listing — '
       + 'emissions are OFF until it completes">backfilling</span>';
}

function rootStatsText(r) {
  var s = r.stats;
  if (!s || typeof s !== 'object') return '';
  var bits = [];
  if (s.files != null)   bits.push(s.files + ' files');
  if (s.linked)          bits.push(s.linked + ' linked');
  if (s.unlinked)        bits.push(s.unlinked + ' unlinked');
  if (s.deleted)         bits.push(s.deleted + ' deleted');
  if (s.folder_heals)    bits.push(s.folder_heals + ' heals');
  if (s.pages != null)   bits.push(s.pages + 'p');
  if (s.stop && s.stop !== 'complete') bits.push('stopped: ' + s.stop);
  return bits.join(' · ');
}

function rootRowHtml(r) {
  var busy = !!sync.busy[r.id];
  var stats = rootStatsText(r);
  var ms = r.stats && r.stats.ms ? fmtMs(r.stats.ms) : '';

  return ''
    + '<tr>'
    +   '<td><div class="root-path">' + esc(r.path) + '</div>'
    +     (r.note ? '<div class="mini">' + esc(r.note) + '</div>' : '')
    +   '</td>'
    +   '<td class="nowrap">' + rootStateHtml(r) + '</td>'
    +   '<td>'
    +     '<div class="mini">' + esc(fmtDateTime(r.last_sync_at)) + (ms ? ' · ' + ms : '') + '</div>'
    +     (stats ? '<div class="mini">' + esc(stats) + '</div>' : '')
    /* THE ERROR IS SHOWN, NOT HIDDEN BEHIND A HOVER. last_error is the only
       record of why a root stopped moving, and a title attribute is invisible
       on touch and unsearchable everywhere. Truncated inline, full on click. */
    +     (r.last_error
            ? '<div class="err-cell" data-root-err="' + r.id + '">'
              + '<i class="fa-solid fa-triangle-exclamation"></i> '
              + esc(String(r.last_error).slice(0, 90))
              + (String(r.last_error).length > 90 ? '… (click for full)' : '')
              + '</div>'
            : '')
    +   '</td>'
    +   '<td class="acts nowrap">'
    +     '<button class="btn btn-outline btn-sm" ' + (busy ? 'disabled' : '')
    +       ' data-root-sync="' + r.id + '" title="Run one bounded tick against this root now">'
    +       '<i class="fa-solid ' + (busy ? 'fa-spinner fa-spin' : 'fa-rotate') + '"></i> Sync now</button> '
    +     '<button class="btn btn-outline btn-sm" ' + (busy ? 'disabled' : '')
    +       ' data-root-toggle="' + r.id + '" data-root-want="' + (r.enabled ? '0' : '1') + '" '
    +       'title="' + (r.enabled
                  ? 'Stop including this root in the automatic rotation. Its cursor and its documents are kept.'
                  : 'Put this root back into the automatic rotation.') + '">'
    +       '<i class="fa-solid ' + (r.enabled ? 'fa-pause' : 'fa-play') + '"></i> '
    +       (r.enabled ? 'Disable' : 'Enable') + '</button>'
    +   '</td>'
    + '</tr>';
}

/** The two reports, keyed by the internal function that produces them. */
function reportFor(name) {
  for (var i = 0; i < sync.reports.length; i++) {
    if (sync.reports[i].function_name === name) return sync.reports[i];
  }
  return null;
}

/* A run that produced no findings still has to say WHICH kind of nothing it
   was — never run, failed, or skipped by the kill switch all render as an
   empty block otherwise, and only one of those means "nothing to report".

   NEVER RUN is checked on `last_run`, not on the slot's existence: the server
   returns an entry for every diagnostic function whether or not it has ever
   executed (documents_attribution_report has no scheduled job at all), so a
   slot is always present and only `last_run === null` distinguishes "has never
   run" from "ran and found nothing to report". */
function reportStatusHtml(slot, label) {
  if (!slot || !slot.last_run) {
    return '<div class="mini">No ' + esc(label) + ' has run.</div>';
  }

  var out = '';
  if (slot.consecutive_failures > 1) {
    out += '<div class="banner err"><i class="fa-solid fa-circle-exclamation"></i> '
         + 'The last ' + slot.consecutive_failures + ' runs of <code>'
         + esc(slot.function_name) + '</code> failed'
         + (slot.last_run && slot.last_run.error_message
              ? ': ' + esc(slot.last_run.error_message) : '')
         + '. The figures below are from the last run that completed.</div>';
  } else if (slot.last_run.status === 'failed') {
    out += '<div class="banner warn"><i class="fa-solid fa-triangle-exclamation"></i> '
         + 'The most recent run failed'
         + (slot.last_run.error_message ? ': ' + esc(slot.last_run.error_message) : '')
         + '.</div>';
  } else if (slot.last_run.skipped) {
    out += '<div class="banner info"><i class="fa-solid fa-circle-info"></i> '
         + 'The most recent run was skipped — ' + esc(slot.last_run.skip_reason || 'sync disabled')
         + '.</div>';
  }
  if (!slot.last_report) {
    out += '<div class="mini">No completed run has produced figures yet.</div>';
  }
  return out;
}

function outOfRootHtml() {
  var slot = reportFor('documents_refresh_case_cache');
  var html = '<h4>Cases outside every sync root</h4>'
           + reportStatusHtml(slot, 'case-folder refresh');

  var rep = slot && slot.last_report && slot.last_report.report;
  if (!rep) return html;

  var list = Array.isArray(rep.out_of_root) ? rep.out_of_root : [];
  html += '<div class="mini">Last completed ' + esc(fmtDateTime(slot.last_report.executed_at))
        + ' · resolved ' + esc(String(rep.resolved != null ? rep.resolved : '—'))
        + ' · failed ' + esc(String(rep.failed != null ? rep.failed : '—'))
        + (rep.timed_out ? ' · <b>timed out</b>' : '') + '</div>';

  if (!list.length) {
    html += '<div class="mini">Every resolved case folder sits under a sync root.</div>';
  } else {
    html += '<div class="banner warn"><i class="fa-solid fa-triangle-exclamation"></i> '
          + list.length + ' case' + (list.length === 1 ? '' : 's')
          + ' have a Dropbox folder under no enabled root — their documents will '
          + 'never be registered.</div>'
          + '<div class="mini">' + list.map(esc).join(', ') + '</div>';
  }
  return html;
}

/* THE STALE-INTAKE-FOLDER SURFACE. This block is why S3.2 exists: the
   condition is invisible to out_of_root by construction (the intake folder IS
   watched — it is merely empty), so nothing else in the system reports it.
   The counts come from documents_attribution_report and are NEVER re-derived
   here: the SQL form of this question is a 986 × 153k correlated LIKE that
   times out, which is exactly why the function does it in memory. */
function zeroAttributionHtml() {
  var slot = reportFor('documents_attribution_report');
  var rep  = sync.fresh || (slot && slot.last_report && slot.last_report.report) || null;
  var when = sync.fresh
    ? 'just now'
    : (slot && slot.last_report ? fmtDateTime(slot.last_report.executed_at) : null);

  var html = '<h4>Cases with a folder but no documents</h4>';
  html += '<div class="addrow" style="margin-bottom:8px">'
        + '<button class="btn btn-outline btn-sm" id="diagRun" onclick="onRunDiagnostics()" '
        + (sync.running ? 'disabled' : '') + '>'
        + '<i class="fa-solid ' + (sync.running ? 'fa-spinner fa-spin' : 'fa-stethoscope') + '"></i> '
        + (sync.running ? 'Scanning…' : 'Run report') + '</button>'
        + '<span class="mini">Read-only. Scans the registry; takes a few seconds.</span>'
        + '</div>';

  if (!sync.fresh) html += reportStatusHtml(slot, 'attribution report');
  if (!rep) return html;

  if (rep.skipped) {
    return html + '<div class="banner info">Sync is disabled, so the report did not run.</div>';
  }

  var n = Number(rep.zero_attribution_cases) || 0;
  html += '<div class="mini">Last run ' + esc(when || '—')
        + ' · ' + esc(String(rep.cached_folders || 0)) + ' cached folders'
        + (rep.timed_out ? ' · <b>incomplete scan</b>' : '') + '</div>';

  if (!n) {
    html += '<div class="mini">Every case with a resolved folder holds at least one document.</div>';
    return html;
  }

  html += '<div class="banner warn"><i class="fa-solid fa-triangle-exclamation"></i> '
        + '<b>' + n + ' case' + (n === 1 ? '' : 's') + ' with a resolved folder and no documents.</b>'
        + '</div>'
        + '<div class="mini">These usually mean the case record still points at the intake '
        + 'folder — re-linking ships in a later update.</div>';

  var sample = Array.isArray(rep.sample) ? rep.sample : [];
  if (sample.length) {
    html += '<div class="diag-cases"><table>'
          + '<thead><tr><th>Case</th><th>Cached folder</th><th class="num">Docs still there</th></tr></thead>'
          + '<tbody>'
          + sample.map(function (c) {
              return '<tr>'
                + '<td class="nowrap">' + esc(c.case_id) + '</td>'
                + '<td><div class="root-path">' + esc(c.path_lower || '') + '</div></td>'
                + '<td class="num">' + esc(String(c.total || 0))
                + (c.deleted ? '<div class="mini">' + c.deleted + ' deleted</div>' : '')
                + (c.active_linked_elsewhere
                    ? '<div class="mini">' + c.active_linked_elsewhere + ' on another case</div>' : '')
                + (c.active_unlinked
                    ? '<div class="mini">' + c.active_unlinked + ' unlinked</div>' : '')
                + '</td></tr>';
            }).join('')
          + '</tbody></table></div>';
    if (rep.sample_truncated) {
      html += '<div class="mini">Showing the worst ' + sample.length + ' of ' + n + '.</div>';
    }
    // Only the cases carrying RESIDUE appear in the sample; the rest are empty
    // folders. Saying so stops the shorter list reading as a contradiction of
    // the count above it.
    html += '<div class="mini">Only cases with documents still under the cached path are '
          + 'listed; the remainder are empty folders.</div>';
  }
  if (rep.verdict) html += '<div class="mini">Verdict: ' + esc(rep.verdict) + '</div>';
  return html;
}

/* ════════════════════════════════════════════════════════════════════════════
   THE GUIDED RE-LINK (S3.3)

   S3.2 made the stale-intake-folder condition visible. This makes it fixable —
   for the cases where it IS fixable, which is far fewer than the count suggests
   and that is the single most important thing this block communicates.
