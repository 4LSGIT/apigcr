   ── WHAT THE QUEUE ACTUALLY IS ─────────────────────────────────────────────
   418 cases resolve a folder cleanly and hold no documents. Measured against
   production: 410 of them were never filed (pipeline_phase 'intake'), only 5
   carry a docket, and NONE has a single registered file under its cached
   folder. They are potential-case intake folders that are empty because the
   client never sent anything — the ordinary end state of a lead that did not
   convert. Ranking them all against the estate finds a confident candidate for
   about 24.

   So the default view is those 24, docket-first, and the rest live in a
   collapsed strip with a bulk dismiss. A screen that presented 418 rows as 418
   pending repairs would be lying about the work, and the person who worked
   through it would learn the queue is noise.

   ── THE CONFIRM IS THE CEREMONY ────────────────────────────────────────────
   A wrong link puts one client's documents on another client's case page, and
   S3.1's related-documents view then fans them out to every contact related to
   that case. So: old path and new path side by side, the document count, the
   disclosures (does this folder sit inside another case's folder, does it
   contain one), and an explicit sentence saying the case's Dropbox link is
   about to be rewritten. Surname-only matches need a second, separate tick.

   ── NO BUS ─────────────────────────────────────────────────────────────────
   Same rule as the rest of the panel (S3.2): this is ops state, no other frame
   renders it, so it refetches its own data after an action rather than
   announcing. The one exception is fetchDocs() after a confirm — that DID
   change documents, and the list behind the panel is now stale.
   ════════════════════════════════════════════════════════════════════════════ */

function laneLabel(c) {
  if (c === 'docket') return 'docket number';
  if (c === 'name')   return 'client name';
  return 'surname only';
}

function relinkCase(id) {
  var list = sync.relink.cases || [];
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].case_id) === String(id)) return list[i];
  }
  return null;
}

async function loadRelink() {
  sync.relink.loading = true;
  sync.relink.error = null;
  try {
    var res = await api('/api/documents/relink/queue'
      + (sync.relink.showDismissed ? '?include_dismissed=1' : ''), 'GET');
    sync.relink.cases       = Array.isArray(res && res.cases) ? res.cases : [];
    sync.relink.total       = Number(res && res.total) || 0;
    sync.relink.dismissedN  = Number(res && res.dismissed) || 0;
    sync.relink.actionable  = Number(res && res.actionable) || 0;
    sync.relink.noCandidate = Number(res && res.no_candidate) || 0;
    sync.relink.truncated   = !!(res && res.truncated);
    sync.relink.loaded      = true;
  } catch (err) {
    sync.relink.error = (err && err.message) || String(err);
  }
  sync.relink.loading = false;
}

/** One candidate, rendered. `taken` entries carry NO confirm control at all. */
function candidateHtml(c, idx, cs) {
  var taken = !!c.already_linked_to;
  var notes = [];
  if (c.inside_case_id) {
    notes.push('sits inside case ' + esc(c.inside_case_id) + '\u2019s folder');
  }
  if (c.nested_case_ids) {
    notes.push('contains ' + c.nested_case_ids.length + ' other case folder'
      + (c.nested_case_ids.length === 1 ? '' : 's'));
  }

  return '<div class="rl-cand' + (taken ? ' taken' : '') + '">'
    + '<div>'
    +   '<span class="pill lane-' + esc(c.confidence) + '">' + esc(laneLabel(c.confidence)) + '</span> '
    +   '<span class="mini">matched ' + esc(String(c.matched_on || '')) + '</span>'
    + '</div>'
    + '<div class="root-path">' + esc(c.path) + '</div>'
    + '<div class="mini">' + esc(String(c.files)) + ' document'
    +   (Number(c.files) === 1 ? '' : 's')
    +   (c.newest ? ' \u00b7 newest ' + esc(fmtDate(c.newest)) : '')
    +   (notes.length ? ' \u00b7 ' + notes.join(' \u00b7 ') : '')
    + '</div>'
    + (taken
        // SURFACED, NOT CONFIRMABLE. Seeing the collision tells a staffer where
        // the documents actually went; being able to click it is the bug.
        ? '<div class="mini" style="color:var(--danger)">already linked to case '
          + esc(c.already_linked_to.join(', ')) + ' \u2014 cannot be used here</div>'
        : '<button class="btn btn-outline btn-sm" style="margin-top:4px" '
          + 'data-relink-cand="' + esc(cs.case_id) + '|' + idx + '"'
          + (sync.relink.busy[cs.case_id] ? ' disabled' : '') + '>'
          + '<i class="fa-solid fa-link"></i> Use this folder</button>')
    + '</div>';
}

function relinkRowHtml(cs) {
  var open = !!sync.relink.expanded[cs.case_id];
  var cands = cs.candidates || [];
  var free = cands.filter(function (c) { return !c.already_linked_to; });
  var best = free.length ? free[0].confidence : null;

  var html = '<div class="rl-row"><div class="rl-main">'
    + '<div class="rl-head" data-relink-expand="' + esc(cs.case_id) + '">'
    +   '<i class="fa-solid fa-chevron-' + (open ? 'down' : 'right') + ' mini"></i>'
    +   '<span class="rl-name">' + esc((cs.client_names || [])[0] || '(no client)') + '</span>'
    +   '<span class="rl-id">' + esc(cs.case_id) + '</span>'
    +   (cs.case_number_full
          ? '<span class="pill on">' + esc(cs.case_number_full) + '</span>' : '')
    +   (cs.pipeline_phase
          ? '<span class="pill off">' + esc(cs.pipeline_phase) + '</span>' : '')
    +   (best ? '<span class="pill lane-' + esc(best) + '">' + free.length + ' candidate'
            + (free.length === 1 ? '' : 's') + '</span>'
          : '<span class="pill off">no candidate</span>')
    +   (cs.dismissed_at ? '<span class="pill off">dismissed</span>' : '')
    + '</div>'
    // What they are moving AWAY from — the stale intake link, always visible.
    + '<div class="root-path" style="color:var(--text-muted)">'
    +   esc(cs.current_path || '(no cached path)') + '</div>';

  if (open) {
    html += '<div class="rl-cands">';
    html += cands.length
      ? cands.map(function (c, i) { return candidateHtml(c, i, cs); }).join('')
      : '<div class="mini">Nothing in the registry matches this case\u2019s docket '
        + 'or client name. That usually means the client never sent a document.</div>';
    if (cs.candidates_truncated) {
      html += '<div class="mini">More matches exist than are shown.</div>';
    }
    html += '<div style="margin-top:6px">'
      + '<label class="mini" style="cursor:pointer">'
      + '<input type="checkbox" data-relink-weak="' + esc(cs.case_id) + '"'
      + (sync.relink.weak[cs.case_id] ? ' checked' : '') + '> '
      // Said plainly, because the number is persuasive and the matches are not.
      + 'Also show surname-only matches (usually a different client with the '
      + 'same last name)</label></div>';
    html += '</div>';
  }

  html += '</div><div style="flex:0 0 auto">'
    + (cs.dismissed_at
        ? '<button class="btn btn-ghost btn-sm" data-relink-undismiss="' + esc(cs.case_id) + '">'
          + '<i class="fa-solid fa-rotate-left"></i> Undo</button>'
        : '<button class="btn btn-ghost btn-sm" data-relink-dismiss="' + esc(cs.case_id) + '">'
          + '<i class="fa-solid fa-check"></i> Dismiss</button>')
    + '</div></div>';
  return html;
}

function relinkHtml() {
  var r = sync.relink;
  var html = '<h4>Re-link a case to its real folder</h4>';

  if (r.loading && !r.loaded) {
    return html + '<div class="mini"><i class="fa-solid fa-spinner fa-spin"></i> '
      + 'Ranking folders\u2026</div>';
  }
  if (r.error) {
    return html + '<div class="banner err">Could not load the re-link queue: '
      + esc(r.error) + '</div>'
      + '<button class="btn btn-outline btn-sm" data-relink-reload="1">Retry</button>';
  }
  if (!r.loaded) return html;

  var cases = r.cases || [];
  var actionable = cases.filter(function (c) { return c.actionable && !c.dismissed_at; });
  var none       = cases.filter(function (c) { return !c.actionable && !c.dismissed_at; });
  var dismissed  = cases.filter(function (c) { return !!c.dismissed_at; });

  // Docket-first, then by how much is behind the candidate.
  var rank = function (c) {
    var f = (c.candidates || []).filter(function (x) { return !x.already_linked_to; });
    return f.length && f[0].confidence === 'docket' ? 0 : 1;
  };
  actionable.sort(function (a, b) { return rank(a) - rank(b); });

  // THE FRAMING LINE. Same job as the Unlinked scope-note: a number this size
  // with no context reads as a backlog of 418 repairs, and it is not one.
  html += '<div class="banner info">'
    + '<b>' + actionable.length + '</b> of ' + r.total + ' case'
    + (r.total === 1 ? '' : 's') + ' have a folder we can suggest. '
    + 'The rest have no matching folder anywhere in Dropbox \u2014 almost all are '
    + 'potential cases where the client never sent a document.</div>';

  html += actionable.length
    ? '<div class="rl-list">' + actionable.map(relinkRowHtml).join('') + '</div>'
    : '<div class="mini">Nothing to re-link right now.</div>';

  // ── the "nothing to link" strip ─────────────────────────────────────────
  if (none.length) {
    html += '<div class="rl-strip">'
      + '<button class="btn btn-ghost btn-sm" data-relink-toggle-nocand="1">'
      +   '<i class="fa-solid fa-chevron-' + (r.showNoCandidate ? 'down' : 'right') + '"></i> '
      +   none.length + ' with no matching folder</button> '
      + '<button class="btn btn-outline btn-sm" data-relink-dismiss-all="1"'
      +   (r.busyAll ? ' disabled' : '') + '>'
      +   '<i class="fa-solid fa-check-double"></i> Dismiss all ' + none.length + '</button>'
      + '<div class="mini" style="margin-top:4px">Dismissing only clears them from '
      + 'this list. It changes no document and no case.</div>';
    if (r.showNoCandidate) {
      html += '<div class="rl-list">' + none.map(relinkRowHtml).join('') + '</div>';
    }
    html += '</div>';
  }

  // ── dismissed ───────────────────────────────────────────────────────────
  html += '<div class="rl-strip">'
    + '<label class="mini" style="cursor:pointer">'
    + '<input type="checkbox" data-relink-show-dismissed="1"'
    + (r.showDismissed ? ' checked' : '') + '> Show dismissed ('
    + esc(String(r.dismissedN || 0)) + ')</label>';
  if (r.showDismissed && dismissed.length) {
    html += '<div class="rl-list">' + dismissed.map(relinkRowHtml).join('') + '</div>';
  }
  html += '</div>';

  if (r.truncated) {
    html += '<div class="mini">The queue is longer than one page of ranking; '
      + 'dismiss some and reload to see the rest.</div>';
  }
  return html;
}

/** Repaint ONE case's candidates — used by the weak toggle and after a confirm. */
async function reloadRelinkCase(caseId) {
  try {
    var res = await api('/api/documents/relink/' + encodeURIComponent(caseId) + '/candidates'
      + (sync.relink.weak[caseId] ? '?include_weak=1' : ''), 'GET');
    var list = sync.relink.cases;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].case_id) === String(caseId)) {
        list[i] = { ...list[i], ...res };
        delete list[i].status;
        return;
      }
    }
  } catch (err) {
    Swal.fire('Could not reload that case', (err && err.message) || String(err), 'error');
  }
}

window.onRelinkConfirm = async function (caseId, idx) {
  var cs = relinkCase(caseId);
  if (!cs) return;
  var c = (cs.candidates || [])[Number(idx)];
  // Belt and braces against a stale repaint: a taken candidate has no button,
  // but if one ever reached this function it must not proceed to the POST.
  if (!c || c.already_linked_to) return;

  var weak = c.confidence === 'weak';
  var notes = '';
  if (c.inside_case_id) {
    notes += '<p class="swal-note">This folder sits <b>inside case '
      + esc(c.inside_case_id) + '\u2019s</b> folder. Documents already attributed '
      + 'to that case stay with it.</p>';
  }
  if (c.nested_case_ids) {
    notes += '<p class="swal-note">' + c.nested_case_ids.length
      + ' other case folder' + (c.nested_case_ids.length === 1 ? '' : 's')
      + ' sit inside this one (' + esc(c.nested_case_ids.join(', ')) + '). '
      + 'Their documents stay on their own cases.</p>';
  }

  var r = await Swal.fire({
    icon: weak ? 'warning' : 'question',
    title: 'Re-link this case?',
    width: 680,
    html: '<div style="text-align:left">'
      + '<span class="swal-lbl">Case</span>'
      + '<div>' + esc((cs.client_names || [])[0] || '') + ' \u00b7 ' + esc(cs.case_id) + '</div>'
      + '<span class="swal-lbl" style="margin-top:8px">From</span>'
      + '<div class="root-path">' + esc(cs.current_path || '(no cached path)') + '</div>'
      + '<span class="swal-lbl" style="margin-top:8px">To</span>'
      + '<div class="root-path">' + esc(c.path) + '</div>'
      + '<p class="swal-note" style="margin-top:8px">'
      + '<b>' + esc(String(c.files)) + ' document' + (Number(c.files) === 1 ? '' : 's')
      + '</b> will appear on this case. This rewrites the case\u2019s Dropbox link.</p>'
      + notes
      + (weak
          ? '<div class="banner err" style="margin-top:8px">This matched on the '
            + '<b>surname only</b>. A different client with the same last name is '
            + 'the most likely explanation \u2014 check the folder in Dropbox first.</div>'
          : '')
      + '</div>',
    showCancelButton: true,
    confirmButtonText: 'Re-link',
    // The second tick for a weak match. Not decoration: it is the difference
    // between a deliberate override and a mis-click on a plausible wrong row.
    ...(weak ? { input: 'checkbox', inputPlaceholder: 'I checked this folder in Dropbox' } : {}),
  });
  if (!r || !r.isConfirmed) return;
  if (weak && !r.value) {
    Toast.fire({ icon: 'info', title: 'Not re-linked \u2014 the box was not ticked' });
    return;
  }

  sync.relink.busy[caseId] = true;
  renderSyncPanel();
  try {
    var res = await api('/api/documents/relink', 'POST',
                        { case_id: caseId, folder_path: c.path });
    var out = (res && res.result) || {};
    if (out.skipped) {
      // A SKIP MUST NEVER PAINT AS A SUCCESS — same rule as the manual sync
      // button. Nothing was changed.
      Toast.fire({ icon: 'info', title: 'Skipped \u2014 ' + (out.reason || 'sync is disabled') });
    } else {
      Toast.fire({
        icon: 'success',
        title: out.linked_docs + ' document' + (out.linked_docs === 1 ? '' : 's') + ' linked',
      });
      if (out.warnings && out.warnings.length) {
        Swal.fire({
          icon: 'info', title: 'Re-linked, with notes', width: 620,
          html: '<ul style="text-align:left">'
            + out.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('')
            + '</ul>',
        });
      }
      // Optimistic: the row leaves the queue. The reload behind it is what
      // makes that true rather than merely apparent.
      sync.relink.cases = sync.relink.cases.filter(function (x) {
        return String(x.case_id) !== String(caseId);
      });
      sync.relink.actionable = Math.max(0, sync.relink.actionable - 1);
      sync.relink.total = Math.max(0, sync.relink.total - 1);
    }
  } catch (err) {
    // 409 is the cross-link guard and deserves its own words, not "error".
    Swal.fire({
      icon: 'error', title: 'Could not re-link',
      text: (err && err.message) || String(err),
    });
  }
  delete sync.relink.busy[caseId];
  renderSyncPanel();
  // A confirm attributes documents, so the list behind the panel is stale.
  fetchDocs();
};

window.onRelinkDismiss = async function (caseId, undo) {
  sync.relink.busy[caseId] = true;
  renderSyncPanel();
  try {
    await api('/api/documents/relink/dismiss', 'POST',
              { case_id: caseId, ...(undo ? { undo: true } : {}) });
    var cs = relinkCase(caseId);
    if (cs) cs.dismissed_at = undo ? null : new Date().toISOString();
    sync.relink.dismissedN = Math.max(0, (sync.relink.dismissedN || 0) + (undo ? -1 : 1));
    if (!sync.relink.showDismissed && !undo) {
      sync.relink.cases = sync.relink.cases.filter(function (x) {
        return String(x.case_id) !== String(caseId);
      });
    }
  } catch (err) {
    Swal.fire('Could not dismiss', (err && err.message) || String(err), 'error');
  }
  delete sync.relink.busy[caseId];
  renderSyncPanel();
};

window.onRelinkDismissAll = async function () {
  var ids = (sync.relink.cases || [])
    .filter(function (c) { return !c.actionable && !c.dismissed_at; })
    .map(function (c) { return c.case_id; });
  if (!ids.length) return;

  var r = await Swal.fire({
    icon: 'question', title: 'Dismiss ' + ids.length + ' cases?',
    html: '<div style="text-align:left"><p class="swal-note">These have no matching '
      + 'folder anywhere in Dropbox. Dismissing clears them from this list and '
      + '<b>changes no document, no case and nothing in Dropbox</b> \u2014 it is a note '
      + 'on the queue. You can undo it.</p></div>',
    showCancelButton: true, confirmButtonText: 'Dismiss them',
  });
  if (!r || !r.isConfirmed) return;

  sync.relink.busyAll = true;
  renderSyncPanel();
  try {
    var res = await api('/api/documents/relink/dismiss', 'POST', { case_ids: ids });
    Toast.fire({ icon: 'success', title: (res && res.updated) + ' dismissed' });
    await loadRelink();
  } catch (err) {
    Swal.fire('Could not dismiss', (err && err.message) || String(err), 'error');
  }
  sync.relink.busyAll = false;
  renderSyncPanel();
};

function renderSyncPanel() {
  var el = E('syncPanel');
  if (!el || SCOPED) return;

  if (sync.loading && !sync.loaded) {
    el.innerHTML = '<div class="mini"><i class="fa-solid fa-spinner fa-spin"></i> Loading sync status…</div>';
    return;
  }
  if (sync.error) {
    el.innerHTML = '<div class="banner err">Could not load sync status: ' + esc(sync.error) + '</div>'
                 + '<button class="btn btn-outline btn-sm" onclick="reloadSyncPanel()">Retry</button>';
    return;
  }

  var html = '';

  // THE KILL SWITCH BANNER COMES FIRST. With the engine off, every "last sync"
  // timestamp below is history — a roots table that looks orderly while
  // nothing is running is the most misleading thing this panel could show.
  if (sync.enabled === false) {
    html += '<div class="banner err"><i class="fa-solid fa-ban"></i> '
          + '<b>Sync is disabled</b> — <code>documents_sync_enabled</code> is not set to "1". '
          + 'No root is being walked and no document is being registered.</div>';
  }

  html += '<h4>Sync roots</h4>';
  html += sync.roots.length
    ? '<table><thead><tr><th>Folder</th><th>State</th><th>Last sync</th><th></th></tr></thead>'
      + '<tbody>' + sync.roots.map(rootRowHtml).join('') + '</tbody></table>'
    : '<div class="mini">No sync roots configured — nothing is being watched.</div>';

  html += '<h4>Add a root</h4>'
        + '<div class="addrow">'
        +   '<input type="text" id="rootPath" placeholder="/  Law Office/   Cases/  New Folder" '
        +     'maxlength="512" spellcheck="false" style="font-family:var(--mono)">'
        +   '<input type="text" id="rootNote" placeholder="note (optional)" maxlength="255">'
        +   '<button class="btn btn-primary btn-sm" id="rootAdd" onclick="onAddRoot()">'
        +     '<i class="fa-solid fa-plus"></i> Add</button>'
        + '</div>'
        // Leading spaces in these folder names are significant and are the
        // single most common way a pasted path is silently wrong.
        + '<div class="mini" style="margin-top:4px">Paste the full Dropbox path, including any '
        + 'leading spaces. A folder that does not exist yet is fine — it will sync once created.</div>'
        + '<div id="rootAddMsg"></div>';

  html += outOfRootHtml();
  html += zeroAttributionHtml();
  html += relinkHtml();

  el.innerHTML = html;
}
window.reloadSyncPanel = loadSyncPanel;

/* Delegated, because the panel's innerHTML is rebuilt on every state change
   and per-button listeners would be re-bound (or leak) each time. Registered
   in GLOBAL mode only: the scoped widget has no panel, so a handler there
   could only ever fail to match. */
if (!SCOPED) document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (!t || !t.closest) return;

  var syncBtn = t.closest('[data-root-sync]');
  if (syncBtn) return void onSyncRootNow(syncBtn.getAttribute('data-root-sync'));

  var togBtn = t.closest('[data-root-toggle]');
  if (togBtn) {
    return void onToggleRoot(togBtn.getAttribute('data-root-toggle'),
                             togBtn.getAttribute('data-root-want') === '1');
  }

  // ── S3.3 re-link ──────────────────────────────────────────────────────
  // Indices, not paths, in the data attribute: a folder name may contain a
  // quote, and round-tripping one through an HTML attribute to identify WHICH
  // FOLDER to link is not a risk worth taking for a shorter handler.
  var cand = t.closest('[data-relink-cand]');
  if (cand) {
    var parts = cand.getAttribute('data-relink-cand').split('|');
    return void onRelinkConfirm(parts[0], parts[1]);
  }
  var rlExp = t.closest('[data-relink-expand]');
  if (rlExp) {
    var eid = rlExp.getAttribute('data-relink-expand');
    sync.relink.expanded[eid] = !sync.relink.expanded[eid];
    return void renderSyncPanel();
  }
  var rlWeak = t.closest('[data-relink-weak]');
  if (rlWeak) {
    var wid = rlWeak.getAttribute('data-relink-weak');
    sync.relink.weak[wid] = !sync.relink.weak[wid];
    renderSyncPanel();
    return void reloadRelinkCase(wid).then(renderSyncPanel);
  }
  var rlDis = t.closest('[data-relink-dismiss]');
  if (rlDis) return void onRelinkDismiss(rlDis.getAttribute('data-relink-dismiss'), false);

  var rlUn = t.closest('[data-relink-undismiss]');
  if (rlUn) return void onRelinkDismiss(rlUn.getAttribute('data-relink-undismiss'), true);

  if (t.closest('[data-relink-dismiss-all]')) return void onRelinkDismissAll();

  if (t.closest('[data-relink-toggle-nocand]')) {
    sync.relink.showNoCandidate = !sync.relink.showNoCandidate;
    return void renderSyncPanel();
  }
  if (t.closest('[data-relink-show-dismissed]')) {
    sync.relink.showDismissed = !sync.relink.showDismissed;
    renderSyncPanel();
    return void loadRelink().then(renderSyncPanel);
  }
  if (t.closest('[data-relink-reload]')) {
    return void loadRelink().then(renderSyncPanel);
  }

  var errCell = t.closest('[data-root-err]');
  if (errCell) {
    var r = findRoot(errCell.getAttribute('data-root-err'));
    if (r) {
      Swal.fire({
        icon: 'error', title: 'Last error', width: 620,
        html: '<div class="root-path" style="text-align:left">' + esc(r.path) + '</div>'
            + '<pre style="text-align:left;white-space:pre-wrap;font-size:11px;'
            + 'margin-top:10px">' + esc(r.last_error) + '</pre>',
      });
    }
  }
});

function findRoot(id) {
  for (var i = 0; i < sync.roots.length; i++) {
    if (String(sync.roots[i].id) === String(id)) return sync.roots[i];
  }
  return null;
}

/** Merge one root row back into the panel's state without a full refetch. */
function mergeRoot(row) {
  if (!row) return;
  for (var i = 0; i < sync.roots.length; i++) {
    if (String(sync.roots[i].id) === String(row.id)) { sync.roots[i] = row; return; }
  }
  sync.roots.push(row);
}

window.onAddRoot = async function () {
  var pathEl = E('rootPath');
  var noteEl = E('rootNote');
  var msgEl  = E('rootAddMsg');
  if (!pathEl) return;

  var path = pathEl.value || '';
  if (!path.trim()) {
    msgEl.innerHTML = '<div class="banner err">Enter a folder path.</div>';
    return;
  }

  var btn = E('rootAdd');
  if (btn) btn.disabled = true;
  msgEl.innerHTML = '<div class="mini"><i class="fa-solid fa-spinner fa-spin"></i> Checking the folder…</div>';

  try {
    var res = await api('/api/documents/sync-roots', 'POST',
                        { path: path, note: (noteEl && noteEl.value) || null });
    if (res && res.root) mergeRoot(res.root);
    renderSyncPanel();
    // THE WARNING IS NOT AN ERROR AND MUST NOT LOOK LIKE ONE. The root exists,
    // it is enabled, and it will start working on its own — a red box here
    // would send someone hunting for a problem that is a scheduled outcome.
    E('rootAddMsg').innerHTML = res && res.warning
      ? '<div class="banner warn"><i class="fa-solid fa-clock"></i> Root added — '
        + esc(res.warning) + '</div>'
      : '<div class="banner ok"><i class="fa-solid fa-check"></i> Root added.</div>';
  } catch (err) {
    renderSyncPanel();
    E('rootAddMsg').innerHTML = '<div class="banner err">'
      + esc((err && err.message) || String(err)) + '</div>';
    var again = E('rootPath');
    if (again) again.value = path;   // survives the repaint; do not retype it
  }
};

window.onToggleRoot = async function (id, want) {
  var r = findRoot(id);
  if (!r) return;

  // Disabling is the reversible half and needs no ceremony; ENABLING one that
  // has never completed a backfill starts a walk, so say what will happen.
  if (want && !r.backfill_done) {
    var ok = await Swal.fire({
      icon: 'question', title: 'Enable this root?',
      html: '<div style="text-align:left"><div class="root-path">' + esc(r.path) + '</div>'
          + '<p class="swal-note" style="margin-top:8px">It has not finished its first walk, '
          + 'so it will run in backfill mode — bulk writes with automations switched off — '
          + 'until the whole folder has been listed.</p></div>',
      showCancelButton: true, confirmButtonText: 'Enable',
    });
    if (!ok.isConfirmed) return;
  }

  sync.busy[id] = true;
  renderSyncPanel();
  try {
    var res = await api('/api/documents/sync-roots/' + id, 'PATCH', { enabled: !!want });
    if (res && res.root) mergeRoot(res.root);
    Toast.fire({ icon: 'success', title: want ? 'Root enabled' : 'Root disabled' });
  } catch (err) {
    Swal.fire('Could not change the root', (err && err.message) || String(err), 'error');
  }
  delete sync.busy[id];
  renderSyncPanel();
};

window.onSyncRootNow = async function (id) {
  sync.busy[id] = true;
  renderSyncPanel();

  try {
    var res = await api('/api/documents/sync-roots/' + id + '/sync', 'POST');
    var out = (res && res.result) || {};
    if (res && res.root) mergeRoot(res.root);

    // A LOSS OF THE CLAIM RACE IS A NORMAL OUTCOME. The recurring tick may be
    // mid-walk on this very root; reporting that as a failure would teach
    // people to press the button again, which is the one thing that cannot
    // help.
    if (out.skipped) {
      Toast.fire({ icon: 'info', title: 'Skipped — ' + (out.reason || 'already running') });
    } else if (out.error) {
      Swal.fire('Sync failed', String(out.error), 'error');
    } else {
      Toast.fire({
        icon: 'success',
        title: (out.mode === 'empty_root'
          ? 'Folder does not exist yet'
          : (out.files || 0) + ' files · ' + (out.linked || 0) + ' linked'),
      });
    }
  } catch (err) {
    Swal.fire('Sync failed', (err && err.message) || String(err), 'error');
  }

  delete sync.busy[id];
  renderSyncPanel();
  // A manual tick can register or link documents, so the list behind the panel
  // may now be stale. Refetch it — this is a GET and therefore cannot announce.
  fetchDocs();
};

window.onRunDiagnostics = async function () {
  sync.running = true;
  renderSyncPanel();
  try {
    var res = await api('/api/documents/sync-diagnostics', 'POST');
    sync.fresh = (res && res.report) || null;
  } catch (err) {
    Swal.fire('Report failed', (err && err.message) || String(err), 'error');
  }
  sync.running = false;
  renderSyncPanel();
};

// ════════════════════════════════════════════════════════════════════════════
// Sync bus (public/js/yc-sync.js)
//
// §3.6: a handler triggered by a bus message MUST NEVER EMIT. Everything below
// reads, merges, paints, or issues a GET — and a GET can never announce (the
// sniff's method gate drops it), so this is structurally safe.
// ════════════════════════════════════════════════════════════════════════════
var refetchTimer = null;
function scheduleRefetch() {
  clearTimeout(refetchTimer);
  refetchTimer = setTimeout(function () { fetchDocs(); }, 250);
}

if (window.YC) {
  /* ONE `documents` row changed. PATCH and /share both carry REAL VALUES, so
     the common case costs no fetch at all: merge and repaint one row.

     A message about a row we are not currently listing is IGNORED. That is
     right for the values we carry (nothing on screen references it) and it
     accepts one narrow miss: a document whose status flips back to 'active'
     elsewhere does not appear in an active-only list until the next load.
     Announcing an id is not enough to place a row correctly in a sorted,
     paged, filtered window anyway — that needs the list query. */
  window.YC.on('document:*', '*', function (fields, msg) {
    if (Object.prototype.hasOwnProperty.call(fields, 'yc_refetch')) {
      scheduleRefetch();
      return;
    }
    var id = String(msg.addr).slice('document:'.length);
    var d  = findDoc(id);
    if (!d) return;

    Object.assign(d, fields);

    // A status change can move the row OUT of the current window, and the
    // total would then be a lie. That one needs the query.
    if (Object.prototype.hasOwnProperty.call(fields, 'status')) {
      var wanted = state.status || 'active';
      if (wanted !== 'all' && d.status !== wanted) { scheduleRefetch(); return; }
    }
    replaceRow(d);
  });

  /* A TARGET'S LINK SET changed — a document was attached to or detached from
     some case/contact. Only a scoped widget cares; an unscoped global list
     shows the same rows either way, which is why this whole block is behind
     SCOPED and the global page still subscribes to nothing.

     ── WHY THIS WATCHES MORE THAN ITS OWN ADDRESS NOW (S3.1) ──────────────
     S3 subscribed to the exact `doclink:<LINK_TYPE>:<LINK_ID>` and that was
     complete, because the view showed exactly one target's documents. With
     "Include related" on it does not: the list is the union over a TARGET SET,
     and a change to any member of that set can add or remove a row here. The
     bus addresses the target that changed, so under the old subscription:

       · unlink a doc from the related contact  → our row stays, stale
       · link a doc TO the related contact      → our row never appears

     Both are exactly the staleness the bus exists to prevent, so this is a
     real break rather than a theoretical one, and it is fixed rather than
     documented.

     THE ADDRESS BOOK IS THE SERVER'S, NOT THE PAGE'S. Deriving the watched
     addresses from the `via` entries on screen would half-work — it catches a
     row disappearing, because its target is on the page by definition, but not
     a row appearing, because the target may have no row here yet. That is the
     more important half: an empty case whose client just received a document
     is precisely the view that must update. So the watched set is
     `related_targets` from the last response.

     STILL A WILDCARD SUBSCRIPTION WITH A JS-SIDE FILTER, not N exact ones: the
     set changes on every fetch, and yc-sync has no unsubscribe — registering
     per-target handlers would leak one per refetch, forever. The filter keeps
     the ORIGINAL concern intact, which was never about message delivery but
     about pointless refetches: a link action against an unrelated case reaches
     this handler and is dropped on a lookup, costing nothing. */
  if (SCOPED) {
    var SELF_ADDR = 'doclink:' + LINK_TYPE + ':' + LINK_ID;

    window.YC.on('doclink:*', '*', function (fields, msg) {
      var addr = String(msg.addr);

      var watched = addr === SELF_ADDR;
      if (!watched && state.related) {
        watched = (state.relatedTargets || []).some(function (t) {
          return 'doclink:' + t.link_type + ':' + t.link_id === addr;
        });
      }
      if (!watched) return;

      // Echo fence — see linksLastRefresh.
      if (Date.now() - linksLastRefresh < 1500) return;
      scheduleRefetch();
    });
  }
}

// ════════════════════════════════════════════════════════════════════════════
// Boot — wait for the shell's transport (the caseWidget idiom).
// ════════════════════════════════════════════════════════════════════════════
(function waitForShell() {
  if (shellRealm()) { fetchDocs(); return; }
  setTimeout(waitForShell, 100);
})();

})();
</script>
</body>
</html>
