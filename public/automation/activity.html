<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* ══════════════════════════════════════════════
       ACTIVITY SUB-PAGE — self-contained styles.
       Shared tokens + base layout duplicated from shell
       (same convention as scheduledJobs.html).
       ══════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #1a1a2e;
      --navy2:   #16213e;
      --blue:    #4f8ef7;
      --blue2:   #3a7de8;
      --green:   #22c55e;
      --red:     #ef4444;
      --amber:   #f59e0b;
      --purple:  #8b5cf6;
      --pink:    #ec4899;
      --teal:    #14b8a6;
      --indigo:  #6366f1;
      --bg:      #f1f5f9;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --muted:   #94a3b8;
      --text:    #1e293b;
      --text2:   #475569;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Button family (duplicated from shell) ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 6px; border: none;
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue2); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .btn-outline { background: var(--bg); border: 1px solid var(--border); color: var(--text2); }
    .btn-outline:hover { background: var(--border); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state (shared) ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--muted);
      gap: 10px; text-align: center;
    }
    .empty-state i { font-size: 36px; opacity: 0.25; }

    /* ══════════════════════════════════════════════
       ACTIVITY-SPECIFIC STYLES
       ══════════════════════════════════════════════ */

    .act-toolbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0; flex-wrap: wrap;
    }

    /* Segmented control (type filter + mode toggle) */
    .act-seg {
      display: inline-flex; border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; background: var(--bg);
    }
    .act-seg button {
      border: none; background: none; padding: 6px 12px;
      font-size: 12px; font-weight: 500; color: var(--text2);
      cursor: pointer; transition: all 0.12s; white-space: nowrap;
    }
    .act-seg button:not(:last-child) { border-right: 1px solid var(--border); }
    .act-seg button:hover { background: rgba(0,0,0,0.04); }
    .act-seg button.active { background: var(--blue); color: #fff; }

    .act-select {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; color: var(--text); background: var(--surface);
      outline: none; cursor: pointer;
    }

    /* Status multi-select (T7 Part C) */
    .act-status-wrap { position: relative; }
    .act-status-btn.act-filtering { border-color: var(--blue); color: var(--blue); font-weight: 600; }
    .act-status-menu {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 8px 24px rgba(15,23,42,0.14);
      padding: 8px; min-width: 240px; max-height: 340px; overflow-y: auto;
    }
    .act-status-menu.hidden { display: none; }
    .act-status-menu label {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 6px; border-radius: 5px; font-size: 12px;
      cursor: pointer; color: var(--text); white-space: nowrap;
    }
    .act-status-menu label:hover { background: var(--bg); }
    .act-status-menu input { accent-color: var(--blue); }
    .act-status-src { margin-left: auto; font-size: 10px; color: var(--muted); }
    .act-status-clear {
      display: block; width: 100%; margin-top: 6px; padding: 5px;
      border: none; border-top: 1px solid var(--border); background: none;
      font-size: 11px; color: var(--blue); cursor: pointer; text-align: center;
    }

    /* Footer paging controls (T7 Part B) */
    #act-foot .act-foot-spacer { flex: 1; }
    #act-foot .act-foot-paused { color: var(--amber); font-weight: 600; white-space: nowrap; }
    #act-foot .act-foot-done   { color: var(--muted); white-space: nowrap; }

    .act-toolbar .act-updated {
      margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap;
    }

    /* Per-source error strip */
    #act-errors { flex-shrink: 0; }
    .act-error-note {
      background: #fef2f2; border-bottom: 1px solid #fecaca; color: #991b1b;
      font-size: 12px; padding: 6px 16px;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Table ── */
    #act-body { flex: 1; overflow-y: auto; }

    .act-table { width: 100%; border-collapse: collapse; background: var(--surface); }
    .act-table th {
      position: sticky; top: 0; z-index: 1;
      background: var(--bg); text-align: left; padding: 8px 12px;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text2); border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .act-table td {
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      vertical-align: top; font-size: 13px;
    }
    .act-table tr.act-row { cursor: pointer; }
    .act-table tr.act-row:hover { background: #f8fafc; }

    .act-type {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .act-type i { width: 14px; text-align: center; }
    .act-type-workflow i { color: var(--blue); }
    .act-type-job      i { color: var(--amber); }
    .act-type-hook     i { color: var(--purple); }
    .act-type-sequence i { color: var(--green); }
    .act-type-trigger  i { color: var(--pink); }
    .act-type-emailIngest i { color: var(--teal); }
    .act-type-phoneIngest i { color: var(--indigo); }

    /* Degraded marker — a green-status row whose rule ACTION failed. The
       status chip stays truthful (the ingest succeeded); this flags the
       hidden Layer-3 failure next to it. */
    .act-degraded {
      display: inline-block; margin-left: 6px; padding: 2px 6px;
      border-radius: 10px; font-size: 10px; font-weight: 600;
      background: #fef2f2; color: #991b1b; white-space: nowrap;
    }

    .act-name {
      font-weight: 600; max-width: 320px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .act-detail {
      color: var(--text2); font-size: 12px; max-width: 420px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Status chips — palette matches hooks.html's hook-status-badge family */
    .act-chip {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      white-space: nowrap;
    }
    .act-chip-good    { background: #dcfce7; color: #166534; }
    .act-chip-bad     { background: #fef2f2; color: #991b1b; }
    .act-chip-warn    { background: #fef9c3; color: #854d0e; }
    .act-chip-active  { background: #dbeafe; color: #1e40af; }
    .act-chip-neutral { background: #f1f5f9; color: #475569; }

    .act-when { white-space: nowrap; color: var(--text2); font-size: 12px; }

    .act-json-btn {
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 6px; padding: 3px 8px; font-size: 11px;
      color: var(--text2); cursor: pointer;
    }
    .act-json-btn:hover { background: var(--bg); }

    /* Row-count / per-type-cap footer. Hidden when there is nothing to say. */
    #act-foot {
      flex-shrink: 0; background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 16px; font-size: 11px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    #act-foot.hidden { display: none; }
    #act-foot .act-foot-cap { color: var(--amber); font-weight: 600; }

    .act-swal-pre {
      text-align: left; background: #0f172a; color: #e2e8f0;
      border-radius: 8px; padding: 12px; font-size: 11px;
      max-height: 55vh; overflow: auto; white-space: pre-wrap;
      word-break: break-word;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── Toolbar ── -->
<div class="act-toolbar">
  <div class="act-seg" id="act-type-seg">
    <button data-type="all" class="active">All</button>
    <button data-type="workflow">Workflows</button>
    <button data-type="job">Jobs</button>
    <button data-type="hook">Hooks</button>
    <button data-type="sequence">Sequences</button>
    <button data-type="trigger">Triggers</button>
    <button data-type="emailIngest">Email</button>
    <button data-type="phoneIngest">Phone</button>
  </div>

  <div class="act-seg" id="act-mode-seg">
    <button data-mode="failures" class="active"><i class="fa-solid fa-triangle-exclamation" style="margin-right:5px"></i>Failures</button>
    <button data-mode="all">All</button>
  </div>

  <select class="act-select" id="act-window">
    <option value="24" selected>Last 24 hours</option>
    <option value="168">Last 7 days</option>
    <option value="720">Last 30 days</option>
    <!-- 90d added with T3. The ingest retention window is longer than 30d and
         the known action-failure case (phone exec #4529, cert expired) sits
         34 days back — without this option the one row that proves the
         has_failure path works is unreachable from the UI. -->
    <option value="2160">Last 90 days</option>
  </select>

  <!-- Status multi-select (T7 Part C). Empty = the mode toggle's status sets
       apply; any selection OVERRIDES them and fetches those statuses
       server-side per source. -->
  <div class="act-status-wrap" id="act-status-wrap">
    <button class="act-select act-status-btn" id="act-status-btn" onclick="toggleStatusMenu(event)">
      Status: any <i class="fa-solid fa-chevron-down" style="font-size:9px"></i>
    </button>
    <div class="act-status-menu hidden" id="act-status-menu"></div>
  </div>

  <button class="btn btn-primary btn-sm" id="act-refresh-btn" onclick="loadActivity()">
    <i class="fa-solid fa-rotate-right" id="act-refresh-icon"></i> Refresh
  </button>

  <button class="btn btn-primary btn-sm" id="act-process-btn" onclick="processJobs()">
    <i class="fa-solid fa-gears" id="act-process-icon"></i> Process Jobs
  </button>
  
  <span class="act-updated" id="act-updated"></span>
</div>

<!-- ── Per-source fetch-error notes ── -->
<div id="act-errors"></div>

<!-- ── Table ── -->
<div id="act-body">
  <div class="empty-state"><i class="fa-solid fa-heart-pulse"></i><div>Loading activity…</div></div>
</div>

<!-- ── Row-count / per-type-cap footer ── -->
<div id="act-foot" class="hidden"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// ACTIVITY SUB-PAGE — cross-automation "what broke overnight" view.
//
// Merges seven read-only sources client-side:
//   - GET /executions                    (workflows; routes/workflows.js)
//   - GET /scheduled-jobs                (routes/scheduled_jobs.js)
//   - GET /api/hooks/executions          (global; routes/api.hooks.js)
//   - GET /sequences/step-log            (global; routes/sequences.js)
//   - GET /api/triggers/executions       (routes/api.triggers.js — T1)
//   - GET /api/email-ingest/executions   (routes/api.emailIngest.js — T3)
//   - GET /api/phone-ingest/executions   (routes/api.phoneIngest.js — T3)
//
// Each of the seven speaks a slightly different dialect and the differences
// are load-bearing, not cosmetic:
//   limit vs page/page_size ... the four originals + triggers take `limit`;
//                               the two ingest endpoints take page_size.
//   comma status vs single .... /api/hooks/executions AND /sequences/step-log
//                               split `status` on commas (both build a
//                               status IN (...) clause — verified in
//                               routes/api.hooks.js + routes/sequences.js;
//                               an older revision of this comment claimed
//                               hooks was the only one). The others take one
//                               enum value, and the ingest services SILENTLY
//                               DROP an unrecognized one — a comma list
//                               there returns every row while looking
//                               correct. Those fan out over parallel calls.
//   time window ............... ALL SEVEN take `since` (T7 added it to
//                               /executions, /scheduled-jobs and
//                               /api/triggers/executions — before that the
//                               window selector was decorative for those
//                               three) and `until` for cursor paging. until
//                               is EXCLUSIVE (<) on the five T7 endpoints
//                               and INCLUSIVE (<=) on the two pre-existing
//                               ingest endpoints — the seenKeys dedupe in
//                               the pager absorbs the difference. Filter
//                               COLUMNS differ per source: see FETCH_SPEC.
//   status truthfulness ....... workflow/job/hook/sequence/trigger statuses
//                               reflect what happened. INGEST STATUSES DO
//                               NOT reflect action failures — see SOURCES.
//   payload weight ............ ingest rows carry raw_input (16.5 KB/row
//                               average on email). Always fetched slim.
//
// ROW CLICK deep-links into the owning sub-page's own detail view via the
// shell's focusSubPageRecord (T4). Each normalizer sets `focusId` — the id
// the TARGET's opener wants, which is not always the row's own id (sequence
// rows send enrollment_id).
//
// PER-SOURCE CAPS (T5). The merge used to be one global .slice(0,100) over
// the union, which let the loudest source crowd the others out: hooks alone
// run ~197 rows/day against workflow's ~88, job's ~34 and sequence's ~5, so
// an "All" view was mostly hooks. Rows are now capped PER SOURCE before the
// final sort, which guarantees every source is represented. Drilling into a
// single type raises the cap (SINGLE_SOURCE_CAP) so you still get depth.
// Fetch limits derive from the same cap — no point pulling 100 rows to show
// 25, and it keeps the request cheap on the 60s auto-refresh loop.
//
// Shell communication:
//   - P.apiSend(...)            — relayed to index.html (the only production shell; a.html is retired)
//   - P.setTopbarButtons({...}) — request button visibility
//   - P.focusSubPageRecord(id, {id}) — tab switch + deep-link to the
//     clicked record via the target's onFocusRecord hook (T4). Falls back
//     to P.switchSubPage(id) (tab switch only) on an older shell.
//
// Lifecycle hooks exposed on window: onShow, onHide, onRefresh.
// (onSave / onDelete / onNew not applicable — read-only view.)
//
// Auto-refresh: 60s interval, gated on BOTH the shell tab being active
// (subPageActive, via onShow/onHide) AND document.visibilityState ===
// 'visible' (browser tab). Interval is cleared whenever either gate
// closes and restarted when both reopen.
// ═══════════════════════════════════════════════════════════════

const P = window.parent;
const api = (...args) => P.apiSend(...args);

// Local toast (same recipe as courtReview.html — Swal is loaded in <head>).
const Toast = Swal.mixin({
  toast: true,
  position: 'top-end',
  showConfirmButton: false,
  timer: 3000,
  timerProgressBar: true,
  didOpen: (t) => { t.onmouseenter = Swal.stopTimer; t.onmouseleave = Swal.resumeTimer; },
});

// Manually kick the /process-jobs poller. Safe to click any time: the endpoint
// claims its batch with FOR UPDATE SKIP LOCKED, so a manual run racing the cron
// just picks up different rows. Spinner + disabled guard against double-fire.
async function processJobs() {
  const btn  = document.getElementById('act-process-btn');
  const icon = document.getElementById('act-process-icon');
  if (btn.disabled) return;
  const prevIcon = icon.className;
  btn.disabled = true;
  icon.className = 'fa-solid fa-spinner fa-spin';
  try {
    const out    = await api('/process-jobs', 'POST');
    const n      = out?.processed ?? 0;
    const failed = (out?.results || []).filter((r) => r.status === 'failed').length;
    if (n === 0) {
      Toast.fire({ icon: 'info', title: 'No jobs were due' });
    } else if (failed) {
      Toast.fire({ icon: 'warning', title: `Processed ${n} job${n === 1 ? '' : 's'} · ${failed} failed` });
    } else {
      Toast.fire({ icon: 'success', title: `Processed ${n} job${n === 1 ? '' : 's'}` });
    }
    loadActivity(); // reflect what just ran
  } catch (e) {
    Toast.fire({ icon: 'error', title: e.message || 'Process failed' });
  } finally {
    btn.disabled = false;
    icon.className = prevIcon;
  }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function relativeTime(ms) {
  const diff = Date.now() - ms;
  if (!Number.isFinite(diff) || diff < 0) return 'just now';
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min} minute${min === 1 ? '' : 's'} ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} hour${hr === 1 ? '' : 's'} ago`;
  const day = Math.floor(hr / 24);
  return `${day} day${day === 1 ? '' : 's'} ago`;
}

// ── State ──────────────────────────────────────────────────────
let subPageActive  = false;
let typeFilter     = 'all';       // all | workflow | job | hook | sequence |
                                  // trigger | emailIngest | phoneIngest
let modeFilter     = 'failures';  // failures | all
let windowHours    = 24;          // 24 | 168 | 720 | 2160
let refreshTimer   = null;
let loadInFlight   = false;
let lastRows       = [];          // normalized rows accumulated this paging session
let lastErrors     = [];          // per-source fetch errors (accumulates across pages)

// ── Paging state (T7 Part B) ───────────────────────────────────
// "Load older" walks each source backward through time INDEPENDENTLY.
// Offset paging does not port here (see the fetch-layer header); instead
// cursors[source] holds the oldest fetched value of that source's
// SERVER-SIDE filter column, in epoch ms — null until the source has been
// fetched once. exhausted collects sources with nothing older left inside
// the window. seenKeys ('source:id') is the display-level dedupe that makes
// the boundary-overlap paging scheme loss-free (see fetch-layer header).
// windowSinceMs freezes the window start at page-1 time so every later
// page queries the exact same lower bound instead of a drifting Date.now().
let cursors       = { workflow: null, job: null, hook: null, sequence: null,
                      trigger: null, emailIngest: null, phoneIngest: null };
let exhausted     = new Set();
let pagesLoaded   = 1;
let seenKeys      = new Set();
let pagingPaused  = false;        // pagesLoaded > 1 → auto-refresh suspended
let windowSinceMs = null;

// ── Status filter state (T7 Part C) ────────────────────────────
// Empty set → the Failures/All mode's status sets apply (pre-T7 behavior).
// Non-empty → OVERRIDES the mode: each source is fetched with
// (selection ∩ its vocabulary); empty intersection skips the source.
let statusFilter  = new Set();

// ── Row caps (T5) ──────────────────────────────────────────────
//
// PER_SOURCE_CAP applies in "All types" mode and is what stops a loud source
// from evicting a quiet one. SINGLE_SOURCE_CAP applies when one type is
// selected — there is nothing to crowd out, so show depth instead.
//
// These drive BOTH the merge trim and the per-fetch `limit`. Fetchers that
// issue several calls (failures mode fans out over a status list) pass the
// cap per call and let the merge trim the union — slight over-fetch, exact
// result.
//
// T7: rowCap() stays the PER-FETCH batch size; the DISPLAY trim in
// applyFiltersAndRender uses rowCap() * pagesLoaded so "Load older" pages
// accumulate instead of being fetched and immediately trimmed away.
const PER_SOURCE_CAP    = 25;
const SINGLE_SOURCE_CAP = 100;

function rowCap() {
  return typeFilter === 'all' ? PER_SOURCE_CAP : SINGLE_SOURCE_CAP;
}

// ── Source metadata ────────────────────────────────────────────
//
// tabId maps a row's source to the automationManager sub-page to switch
// to on row click (shell exposes window.switchSubPage).
//
// Failure-status vocabularies (verified against schema + writer code):
//   workflow_executions: pending|active|processing|delayed|completed|
//                        completed_with_errors|failed|cancelled
//                        → failures = failed, completed_with_errors
//   scheduled_jobs:      pending|running|completed|failed|cancelled
//                        → failures = failed  (cancelled was missing from an
//                        older revision of this list; the ENUM has it)
//   hook_executions:     received|filtered|processing|delivered|partial|
//                        failed|captured → failures = failed, partial
//   sequence_step_log:   sent|skipped|failed → failures = failed
//   trigger_executions:  matched|partial|no_match|no_rules|depth_capped|error
//                        → failures = error, partial, depth_capped
//
// `held` (workflow) is deliberately NOT a failure: it means the execution is
// parked awaiting a human, not that anything went wrong. It chips amber so it
// reads as "needs attention" in All mode, and workflows.html owns the resume
// action (wfResumeExecution).
//
// `depth_capped` (trigger) IS a failure: the loop-guard dropped an event
// before it ran. Silent event loss is exactly what this page exists to catch.
//
//   email_ingest_executions: logged|duplicate|skipped_firm_to_firm|
//                        skipped_suppression|auth_failed|validation_failed|
//                        error → failures = auth_failed, validation_failed,
//                        error  UNION  action-outcome failures (see below)
//   phone_ingest_executions: logged|suppressed|error|duplicate
//                        → failures = error  UNION  action-outcome failures
//
// ⚠ THE INGEST STATUS COLUMN LIES ABOUT ACTION FAILURES. Both ingest
// pipelines record Layer-3 rule results in metadata.action_outcomes and
// never reflect them in `status` — an execution whose action failed still
// stores 'logged'/'suppressed'. Live proof: phone execution #4529 reads
// 'suppressed' while carrying "internal_function delivery failed:
// certificate has expired". A status-only failures filter would ship
// exactly the blindness this page exists to remove, so ingest failures are
// the UNION of failure statuses and has_failure=true (T2's indexed
// action_failure_count). Triggers need no such union — triggerService
// derives its status FROM the action outcomes.
const SOURCES = {
  workflow:     { label: 'Workflow', icon: 'diagram-project',    tabId: 'workflows' },
  job:          { label: 'Job',      icon: 'clock',              tabId: 'scheduledJobs' },
  hook:         { label: 'Hook',     icon: 'satellite-dish',     tabId: 'hooks' },
  sequence:     { label: 'Sequence', icon: 'list-ol',            tabId: 'sequences' },
  trigger:      { label: 'Trigger',  icon: 'bolt',               tabId: 'triggers' },
  emailIngest:  { label: 'Email',    icon: 'envelope-open-text', tabId: 'emailIngest' },
  phoneIngest:  { label: 'Phone',    icon: 'mobile',             tabId: 'phoneIngest' },
};

// Status → chip color class. Anything unlisted renders neutral.
const CHIP_CLASS = {
  completed: 'good', delivered: 'good', sent: 'good', success: 'good',
  matched: 'good',
  failed: 'bad', error: 'bad', depth_capped: 'bad',
  partial: 'warn', completed_with_errors: 'warn', pending: 'warn',
  held: 'warn',
  active: 'active', processing: 'active', running: 'active', delayed: 'active',
  skipped: 'neutral', filtered: 'neutral', cancelled: 'neutral',
  captured: 'neutral', received: 'neutral',
  no_match: 'neutral', no_rules: 'neutral',
  // Ingest. `logged` is the ingest happy path — the message was recorded.
  // auth_failed / validation_failed are inbound-boundary failures (bad key,
  // malformed payload) and are real: nothing was recorded at all.
  logged: 'good',
  auth_failed: 'bad', validation_failed: 'bad',
  duplicate: 'neutral', suppressed: 'neutral',
  skipped_firm_to_firm: 'neutral', skipped_suppression: 'neutral',
};

// ── Timestamp normalization ────────────────────────────────────
// Each source exposes a different "when it happened" field; pick the
// most failure-relevant one available and normalize to epoch ms.
function toMs(v) {
  if (!v) return NaN;
  const t = new Date(v).getTime();
  return Number.isFinite(t) ? t : NaN;
}

function normWorkflow(r) {
  return {
    source: 'workflow',
    id: r.id,
    focusId: r.id,   // viewWorkflowExecution(id) — execution id
    name: r.workflow_name || `Workflow #${r.workflow_id}`,
    status: r.status,
    ts: toMs(r.completed_at) || toMs(r.updated_at) || toMs(r.created_at),
    detail: `exec #${r.id} · step ${r.current_step_number ?? '?'} · ${r.steps_executed_count ?? 0} executed`,
    raw: r,
  };
}

function normJob(r) {
  const bits = [`#${r.id}`, r.type];
  if (r.attempts != null) bits.push(`attempt ${r.attempts}/${r.max_attempts ?? '?'}`);
  return {
    source: 'job',
    id: r.id,
    focusId: r.id,   // jobView(id) — job id
    name: r.name || `Job #${r.id}`,
    status: r.status,
    ts: toMs(r.updated_at) || toMs(r.scheduled_time) || toMs(r.created_at),
    detail: bits.join(' · '),
    raw: r,
  };
}

function normHook(r) {
  const bits = [`exec #${r.id}`];
  if (r.delivery_count != null) bits.push(`${r.delivery_count} deliver${r.delivery_count == 1 ? 'y' : 'ies'}`);
  if (r.error) bits.push(r.error);
  return {
    source: 'hook',
    id: r.id,
    focusId: r.id,   // viewExecution(id) — hook execution id
    name: r.hook_name || r.slug || `Hook #${r.hook_id}`,
    status: r.status,
    ts: toMs(r.created_at),
    detail: bits.join(' · '),
    raw: r,
  };
}

function normSequence(r) {
  const bits = [`enrollment #${r.enrollment_id}`, `step ${r.step_number}`, `contact ${r.contact_id}`];
  if (r.error_message) bits.push(r.error_message);
  else if (r.skip_reason) bits.push(r.skip_reason);
  return {
    source: 'sequence',
    id: r.id,
    // T4 trap T-3: rows come from sequence_step_log, so r.id is a step-log
    // id — but sequences.html's opener is viewSequenceEnrollment(enrollment_id).
    // The step-log projection carries enrollment_id (routes/sequences.js
    // SELECTs l.enrollment_id), so send that.
    focusId: r.enrollment_id,
    name: r.template_name || `Template #${r.template_id}`,
    status: r.status,
    ts: toMs(r.executed_at),
    detail: bits.join(' · '),
    raw: r,
  };
}

// Trigger rows are domain events, so the "name" is the event type — that is
// what an operator scans for. rules_matched is on the list projection (see
// triggerService.listExecutions), but `outcomes` and `envelope` are NOT:
// the list is deliberately lean and the full record lives behind the code
// button / the Triggers tab.
function normTrigger(r) {
  const n    = Number(r.rules_matched) || 0;
  const bits = [`exec #${r.id}`, `${n} rule${n === 1 ? '' : 's'} matched`];
  if (r.depth)           bits.push(`depth ${r.depth}`);
  if (r.case_id)         bits.push(`case ${r.case_id}`);
  else if (r.contact_id) bits.push(`contact ${r.contact_id}`);
  if (r.error)           bits.push(r.error);
  return {
    source: 'trigger',
    id: r.id,
    focusId: r.id,   // tgOpenExecution(id) — trigger execution id
    name: r.event_type || `Trigger #${r.id}`,
    status: r.status,
    ts: toMs(r.created_at),
    detail: bits.join(' · '),
    raw: r,
  };
}

// ── Ingest normalizers ─────────────────────────────────────────
//
// Both ingest tables carry `action_failure_count` (T2's indexed generated
// column). It is the ONLY way to tell a genuinely-clean `logged` row apart
// from one whose Layer-3 action blew up, because the status column stays
// green either way. Rows with a positive count get a `degraded` flag that
// renders as a red marker beside the (still truthful) status chip.
function _ingestDegraded(r) {
  const n = Number(r.action_failure_count) || 0;
  return n > 0 ? n : 0;
}

function normEmailIngest(r) {
  const bits = [`exec #${r.id}`];
  if (r.source_name) bits.push(r.source_name);
  else if (r.source_id != null) bits.push(`src #${r.source_id}`);
  const fails = _ingestDegraded(r);
  if (fails) bits.push(`${fails} action${fails === 1 ? '' : 's'} failed`);
  if (r.error) bits.push(r.error);
  return {
    source: 'emailIngest',
    id: r.id,
    // Subject would be nicer, but it lives inside raw_input — which slim
    // mode deliberately does not fetch. message_id is the cheap identifier.
    name: r.message_id || `Email execution #${r.id}`,
    status: r.status,
    degraded: fails,
    ts: toMs(r.created_at),
    detail: bits.join(' · '),
    focusId: r.id,   // selectExecution(id) — ingest execution id
    raw: r,
  };
}

function normPhoneIngest(r) {
  const bits = [`exec #${r.id}`];
  if (r.event_log_id != null) bits.push(`event log ${r.event_log_id}`);
  const fails = _ingestDegraded(r);
  if (fails) bits.push(`${fails} action${fails === 1 ? '' : 's'} failed`);
  if (r.error) bits.push(r.error);
  return {
    source: 'phoneIngest',
    id: r.id,
    name: `Phone execution #${r.id}`,
    status: r.status,
    degraded: fails,
    ts: toMs(r.created_at),
    detail: bits.join(' · '),
    focusId: r.id,   // selectExecution(id) — ingest execution id
    raw: r,
  };
}

// ── Fetch layer (T7 rewrite) ───────────────────────────────────
//
// Every source now takes a server-side time window:
//   since — window start, inclusive (>=). ALL seven endpoints honor it.
//           T7 added it to /executions, /scheduled-jobs and
//           /api/triggers/executions; before that the window selector was
//           DECORATIVE for those three — they returned newest-N regardless,
//           and at ~88 workflow rows/day a 25-row fetch spans ~7 hours, so
//           "Last 30 days" filtered a 7-hour slice against a 30-day
//           predicate and changed nothing.
//   until — upper bound, sent only while paging (see PAGING below).
//           EXCLUSIVE (<) on the five T7 endpoints; the two ingest
//           endpoints predate T7 with an INCLUSIVE (<=) until — left
//           untouched per T7, the seenKeys dedupe absorbs the difference.
//
// Time values go over the wire as UTC 'YYYY-MM-DD HH:MM:SS' literals — the
// one format every endpoint accepts: the five T7 endpoints re-parse with
// new Date() on a UTC server, and the ingest endpoints pass the raw string
// straight into SQL, where MySQL wants exactly this shape.
//
// SERVER FILTER COLUMN per source. The cursor must track the column the
// SERVER filters on, which is NOT always the ts the row displays:
//   workflow  e.created_at   display ts prefers completed_at — always >=
//                            created_at, so the client window trim never
//                            hides a row the server returned
//   job       updated_at     jobs REUSE their row across runs; a created_at
//                            bound would hide a months-old recurring job
//                            that failed an hour ago (display ts is
//                            updated_at too — normJob)
//   hook      created_at     · sequence executed_at · trigger created_at
//   ingest    created_at
//
// PAGING (T7 Part B). Offset paging (the renderWfExecPager pattern in
// workflows.html) does NOT port here: it pages ONE source with a server
// total; a shared offset over seven sources advancing at different rates
// silently skips rows. Instead each source keeps a TIME CURSOR = the
// oldest value of its filter column fetched so far, and "Load older"
// re-queries [windowStart, cursor + 1s) per source. The +1s is deliberate:
// every filter column is a second-resolution DATETIME and live data has
// multiple rows per second (workflow_executions carries 2-row seconds). An
// exact exclusive bound at the oldest fetched second would permanently
// LOSE a same-second row that missed the previous LIMIT cut; +1s
// re-covers the boundary second and seenKeys drops the repeats. So the
// DISPLAY never duplicates and never loses a row, while raw responses MAY
// repeat boundary rows — the dedupe is load-bearing, not defensive.
//
// FAN-OUT vs ONE CURSOR. In failures mode (and under a status-filter
// override) a source issues several parallel calls that drain at different
// rates. The cursor advances to the SHALLOWEST call's oldest row (max of
// per-call minima): deeper calls re-return already-seen rows next page —
// deduped — which is the price of one cursor per source. Taking the min
// instead would jump the frontier past rows the shallow call never
// fetched, i.e. silent row loss.
//
// STATUS FILTER (T7 Part C). A non-empty selection OVERRIDES the mode's
// status sets. Per source it sends (selection ∩ that source's vocabulary);
// an empty intersection SKIPS the source — no fetch. Fan-out rules are NOT
// uniform and getting them wrong returns everything while looking correct:
//   comma list, one call ... /api/hooks/executions AND /sequences/step-log
//                            (both split status on commas server-side).
//   one value per call ..... everything else. The ingest services SILENTLY
//                            DROP an unrecognized value and return every
//                            row — a comma list there disables the filter
//                            while looking like it worked.
// Ingest under an override sends LITERAL statuses only — the has_failure
// union belongs to failures MODE, which the override replaces.

// Per-source status vocabularies — verified against the live
// information_schema.COLUMNS ENUM definitions (T7). These drive both the
// status-filter menu (union) and the per-source intersection fan-out.
const STATUS_VOCAB = {
  workflow:    ['pending', 'active', 'processing', 'delayed', 'completed',
                'completed_with_errors', 'failed', 'cancelled', 'held'],
  job:         ['pending', 'running', 'completed', 'failed', 'cancelled'],
  hook:        ['received', 'filtered', 'processing', 'delivered', 'partial',
                'failed', 'captured'],
  sequence:    ['sent', 'skipped', 'failed'],
  trigger:     ['matched', 'partial', 'no_match', 'no_rules', 'depth_capped',
                'error'],
  emailIngest: ['logged', 'duplicate', 'skipped_firm_to_firm',
                'skipped_suppression', 'auth_failed', 'validation_failed',
                'error'],
  phoneIngest: ['logged', 'suppressed', 'error', 'duplicate'],
};

// trigger_executions failure vocabulary. `partial` = some actions of a matched
// rule failed; `error` = every action failed (triggerService derives BOTH from
// the actual action outcomes in its Phase-4 block, so a status filter here is
// truthful — unlike the ingest pipelines, which record action failures only in
// metadata and leave `status` green); `depth_capped` = the loop guard dropped
// the event before any rule ran.
const TRIGGER_FAILURE_STATUSES = ['error', 'partial', 'depth_capped'];

// HAND-SYNCED ingest failure vocabulary — site 5 of 5 for BOTH ingest chains,
// and the one where a miss is NOT cosmetic: a failure-class status added to a
// table ENUM but not listed here makes failures mode blind to it — exactly
// the blindness T2/T3 removed. Full checklists live at
// emailIngestExecutionsService.VALID_STATUSES and
// phoneIngestExecutionsService.VALID_STATUSES (T6/F-6). Non-failure
// statuses (logged, suppressed, duplicate, skipped_*) do NOT belong here.
const EMAIL_FAILURE_STATUSES = ['auth_failed', 'validation_failed', 'error'];
const PHONE_FAILURE_STATUSES = ['error'];

// One descriptor per source. cursorCol is the RAW-row field mirroring the
// server's filter column (see the header). multiStatus = the endpoint splits
// `status` on commas; everything else takes one value per call. failures
// drives failures-mode fan-out; ingest additionally unions has_failure=true
// there (the ingest status column lies about action failures — see SOURCES).
const FETCH_SPEC = {
  workflow: {
    path: '/executions', pick: (d) => d.executions, limitKey: 'limit',
    multiStatus: false, cursorCol: 'created_at',
    failureStatuses: ['failed', 'completed_with_errors'], norm: normWorkflow,
  },
  job: {
    path: '/scheduled-jobs', pick: (d) => d.jobs, limitKey: 'limit',
    multiStatus: false, cursorCol: 'updated_at',
    failureStatuses: ['failed'], norm: normJob,
  },
  hook: {
    path: '/api/hooks/executions', pick: (d) => d.executions, limitKey: 'limit',
    multiStatus: true, cursorCol: 'created_at',
    failureStatuses: ['failed', 'partial'], norm: normHook,
  },
  sequence: {
    path: '/sequences/step-log', pick: (d) => d.step_log, limitKey: 'limit',
    multiStatus: true, cursorCol: 'executed_at',
    failureStatuses: ['failed'], norm: normSequence,
  },
  trigger: {
    path: '/api/triggers/executions', pick: (d) => d.executions, limitKey: 'limit',
    multiStatus: false, cursorCol: 'created_at',
    failureStatuses: TRIGGER_FAILURE_STATUSES, norm: normTrigger,
  },
  emailIngest: {
    path: '/api/email-ingest/executions', pick: (d) => d.executions,
    limitKey: 'page_size', multiStatus: false, cursorCol: 'created_at',
    ingest: true, extra: { slim: 'true' },
    failureStatuses: EMAIL_FAILURE_STATUSES, norm: normEmailIngest,
  },
  phoneIngest: {
    path: '/api/phone-ingest/executions', pick: (d) => d.executions,
    limitKey: 'page_size', multiStatus: false, cursorCol: 'created_at',
    ingest: true, extra: { slim: 'true' },
    failureStatuses: PHONE_FAILURE_STATUSES, norm: normPhoneIngest,
  },
};

// UTC 'YYYY-MM-DD HH:MM:SS' — the wire format for since/until (see header).
function toSqlUtc(ms) {
  return new Date(ms).toISOString().slice(0, 19).replace('T', ' ');
}

// Same id can arrive from several parallel calls (a row with status='error'
// AND a failed action matches two of an ingest source's failure calls).
// Dedupe on id before normalizing.
function _dedupeById(rows) {
  const seen = new Map();
  for (const r of rows) if (!seen.has(r.id)) seen.set(r.id, r);
  return [...seen.values()];
}

// The list of per-call status params for one source, or null to skip the
// source entirely (status-filter override with an empty intersection).
function buildStatusCalls(source) {
  const spec = FETCH_SPEC[source];
  if (statusFilter.size) {                                   // Part C override
    const inter = STATUS_VOCAB[source].filter((s) => statusFilter.has(s));
    if (!inter.length) return null;
    if (spec.multiStatus) return [{ status: inter.join(',') }];
    return inter.map((s) => ({ status: s }));
  }
  if (modeFilter === 'failures') {
    const fs = spec.failureStatuses;
    const calls = spec.multiStatus
      ? [{ status: fs.join(',') }]
      : fs.map((s) => ({ status: s }));
    if (spec.ingest) calls.push({ has_failure: 'true' });
    return calls;
  }
  return [{}];                                               // All mode — one unfiltered call
}

// Fetch one source's next batch (page 1 when its cursor is null, the next
// older page otherwise). Returns:
//   rows     — normalized union of all parallel calls, id-deduped
//   drained  — every call returned fewer rows than it asked for → nothing
//              older remains in the window for the statuses it can see
//   oldestMs — new cursor candidate: max of per-call minima of cursorCol
//              (null when no call returned a row)
//   skipped  — status-override intersection was empty; source not queried
async function fetchSource(source) {
  const spec  = FETCH_SPEC[source];
  const calls = buildStatusCalls(source);
  if (!calls) return { rows: [], drained: true, oldestMs: null, skipped: true };

  const lim        = rowCap();
  const timeParams = { since: toSqlUtc(windowSinceMs) };
  const cursor     = cursors[source];
  if (cursor != null) timeParams.until = toSqlUtc(cursor + 1000); // +1s — see PAGING

  const batches = await Promise.all(calls.map((c) =>
    api(spec.path, 'GET',
        { ...(spec.extra || {}), ...timeParams, [spec.limitKey]: lim, ...c })));

  let drained  = true;
  let oldestMs = null;
  const union  = [];
  for (const d of batches) {
    const arr = spec.pick(d) || [];
    if (arr.length >= lim) drained = false;   // full page → may be more below
    let m = Infinity;
    for (const r of arr) {
      const t = toMs(r[spec.cursorCol]);
      if (Number.isFinite(t) && t < m) m = t;
    }
    if (arr.length && Number.isFinite(m)) {
      oldestMs = oldestMs == null ? m : Math.max(oldestMs, m); // frontier = max of minima
    }
    union.push(...arr);
  }
  return { rows: _dedupeById(union).map(spec.norm), drained, oldestMs, skipped: false };
}

// ── Load + merge ───────────────────────────────────────────────

function activeSources() {
  return typeFilter === 'all' ? Object.keys(FETCH_SPEC) : [typeFilter];
}

function resetPaging() {
  cursors = { workflow: null, job: null, hook: null, sequence: null,
              trigger: null, emailIngest: null, phoneIngest: null };
  exhausted    = new Set();
  pagesLoaded  = 1;
  seenKeys     = new Set();
  pagingPaused = false;
  lastErrors   = [];
}

// Page-1 / live load. Resets ALL paging state — every entry point that
// changes what "the window" means (window / mode / type / status change,
// the Refresh button, Back to live, the 60s tick) routes through here.
async function loadActivity() {
  if (loadInFlight) return;
  loadInFlight = true;
  const icon = document.getElementById('act-refresh-icon');
  icon.classList.add('spin');

  resetPaging();
  // Frozen for the whole paging session — later pages must query the exact
  // same lower bound, not a Date.now() that drifted forward while reading.
  windowSinceMs = Date.now() - windowHours * 3600 * 1000;
  const active = activeSources();

  try {
    const results = await Promise.allSettled(active.map((s) => fetchSource(s)));

    const rows = [];
    results.forEach((r, i) => {
      const src = active[i];
      if (r.status === 'fulfilled') {
        rows.push(...r.value.rows);
        if (r.value.drained || r.value.skipped) exhausted.add(src);
        if (r.value.oldestMs != null) cursors[src] = r.value.oldestMs;
        else exhausted.add(src);       // empty page 1 → nothing older either
      } else {
        lastErrors.push({ source: src, message: r.reason?.message || String(r.reason) });
        exhausted.add(src);            // don't page a broken source; Refresh retries it
      }
    });

    lastRows = rows;
    seenKeys = new Set(rows.map((r) => r.source + ':' + r.id));
    renderErrors();
    applyFiltersAndRender();
    document.getElementById('act-updated').textContent =
      `Updated ${new Date().toLocaleTimeString()}`;
  } finally {
    loadInFlight = false;
    icon.classList.remove('spin');
    // Re-arm the 60s loop (it self-gates on visibility and on pagingPaused,
    // which resetPaging just cleared). Covers the "paged, then changed the
    // window" path, where the timer was stopped by loadOlder and nothing
    // else would restart it.
    startAutoRefresh();
  }
}

// "Load older" (T7 Part B): one more page per non-exhausted source, APPENDED
// to lastRows. Suspends auto-refresh — the 60s tick replaces lastRows
// wholesale, which would silently discard every loaded page while the user
// is reading it. Merging a live refresh into a paged view is a bug farm;
// pausing is correct and simple. "Back to live" resumes.
async function loadOlder() {
  if (loadInFlight) return;
  const active = activeSources().filter((s) => !exhausted.has(s));
  if (!active.length) return;

  loadInFlight = true;
  pagingPaused = true;
  stopAutoRefresh();
  const btn  = document.getElementById('act-older-btn');
  const icon = document.getElementById('act-older-icon');
  if (btn)  btn.disabled = true;
  if (icon) icon.className = 'fa-solid fa-spinner fa-spin';

  try {
    const results = await Promise.allSettled(active.map((s) => fetchSource(s)));

    results.forEach((r, i) => {
      const src = active[i];
      if (r.status !== 'fulfilled') {
        lastErrors.push({ source: src, message: r.reason?.message || String(r.reason) });
        exhausted.add(src);
        return;
      }
      const { rows, drained, oldestMs } = r.value;
      let fresh = 0;
      for (const row of rows) {
        const k = row.source + ':' + row.id;
        if (seenKeys.has(k)) continue;   // boundary-second repeats + ingest's inclusive until
        seenKeys.add(k);
        lastRows.push(row);
        fresh++;
      }
      if (drained) exhausted.add(src);
      if (oldestMs == null) { exhausted.add(src); return; }
      if (fresh === 0 && cursors[src] != null && oldestMs >= cursors[src]) {
        // Stall guard: a whole page inside one boundary second would need
        // more than rowCap() rows sharing a timestamp — unobserved in live
        // data (max 2/sec). Exhaust rather than loop forever.
        exhausted.add(src);
        return;
      }
      cursors[src] = oldestMs;
    });

    pagesLoaded++;                       // BEFORE render — grows the display cap
    renderErrors();
    applyFiltersAndRender();
  } finally {
    loadInFlight = false;
    // applyFiltersAndRender rebuilt the footer (and its buttons) already.
  }
}

function backToLive() {
  // loadActivity resets cursors, pagesLoaded, exhausted, seenKeys and
  // pagingPaused, then its finally re-arms the 60s auto-refresh.
  loadActivity();
}

function renderErrors() {
  const box = document.getElementById('act-errors');
  if (!lastErrors.length) { box.innerHTML = ''; return; }
  box.innerHTML = lastErrors.map((e) => `
    <div class="act-error-note">
      <i class="fa-solid fa-circle-exclamation"></i>
      Failed to load ${esc(SOURCES[e.source]?.label || e.source)} activity: ${esc(e.message)}
    </div>
  `).join('');
}

function applyFiltersAndRender() {
  // Client-side time window — a uniform re-trim on top of the server-side
  // `since` every fetch now carries (T7). Uses the frozen session anchor so
  // paged rows near the window edge don't fall out as wall-clock advances.
  // Rows with an unparseable timestamp are kept (NaN fails the < check)
  // so a serialization surprise degrades to "shown" rather than silently
  // hidden.
  const sinceMs  = windowSinceMs ?? (Date.now() - windowHours * 3600 * 1000);
  // Effective per-source cap GROWS with pages loaded (T7) — otherwise every
  // appended older row would be fetched and immediately trimmed away here.
  // SINGLE_SOURCE_CAP scales the same way via rowCap().
  const cap      = rowCap() * pagesLoaded;
  const bySource = new Map();
  let inWindow   = 0;

  for (const r of lastRows) {
    if (r.ts < sinceMs) continue;          // NaN-safe: NaN < n is false → kept
    inWindow++;
    if (!bySource.has(r.source)) bySource.set(r.source, []);
    bySource.get(r.source).push(r);
  }

  // Per-source trim BEFORE the global sort — this is what guarantees a quiet
  // source still appears when a loud one is saturating the window.
  const rows = [];
  for (const list of bySource.values()) {
    list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    rows.push(...list.slice(0, cap));
  }
  rows.sort((a, b) => (b.ts || 0) - (a.ts || 0));

  const body = document.getElementById('act-body');

  if (!rows.length) {
    renderFooter(0, 0, cap);
    body.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid ${modeFilter === 'failures' && !statusFilter.size ? 'fa-circle-check' : 'fa-inbox'}"></i>
        <div>${statusFilter.size
          ? 'No rows match the selected statuses in this window.'
          : modeFilter === 'failures'
            ? 'No failures in the selected window. All quiet.'
            : 'No activity in the selected window.'}</div>
      </div>`;
    return;
  }

  renderFooter(rows.length, inWindow, cap);

  body.innerHTML = `
    <table class="act-table">
      <thead>
        <tr><th>Type</th><th>Name</th><th>Status</th><th>When</th><th>Detail</th><th></th></tr>
      </thead>
      <tbody>
        ${rows.map((r, i) => {
          const meta = SOURCES[r.source];
          const chip = CHIP_CLASS[r.status] || 'neutral';
          const abs  = Number.isFinite(r.ts) ? new Date(r.ts).toLocaleString() : '—';
          const rel  = Number.isFinite(r.ts) ? relativeTime(r.ts) : '—';
          return `
            <tr class="act-row" onclick="rowClick(${i})">
              <td><span class="act-type act-type-${r.source}"><i class="fa-solid fa-${meta.icon}"></i>${esc(meta.label)}</span></td>
              <td><div class="act-name" title="${esc(r.name)}">${esc(r.name)}</div></td>
              <td><span class="act-chip act-chip-${chip}">${esc(r.status)}</span>${
                r.degraded ? `<span class="act-degraded" title="Ingest succeeded, but ${r.degraded} rule action(s) failed — the status column does not reflect this"><i class="fa-solid fa-triangle-exclamation"></i> ${r.degraded}</span>` : ''
              }</td>
              <td><span class="act-when" title="${esc(abs)}">${esc(rel)}</span></td>
              <td><div class="act-detail" title="${esc(r.detail)}">${esc(r.detail)}</div></td>
              <td><button class="act-json-btn" onclick="event.stopPropagation(); rowDetail(${i})" title="View raw record"><i class="fa-solid fa-code"></i></button></td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  // Stash the rendered rows for the click handlers (index-addressed).
  window._actRendered = rows;
}

/**
 * Footer accounting. `shown` is what made it past the per-source cap;
 * `inWindow` is everything the fetchers returned inside the time window.
 * They diverge only when a source hit its cap — say so explicitly, because a
 * silently truncated list on a health dashboard is worse than no list.
 *
 * Note `inWindow` is bounded by what the fetchers ASKED for (limit = cap per
 * call), so it is not a true population count — it is "of what we pulled".
 * Fetchers over-pull relative to the cap only in failures mode, where several
 * status calls fan out and the union is trimmed here.
 */
function renderFooter(shown, inWindow, cap) {
  const foot = document.getElementById('act-foot');
  if (!shown) { foot.className = 'hidden'; foot.innerHTML = ''; return; }
  foot.className = '';
  const trimmed = inWindow > shown;
  // T7 paging controls. "Load older" pages every non-exhausted source one
  // batch deeper (see loadOlder). Once every active source is exhausted the
  // button gives way to a plain "all loaded" note. While pagesLoaded > 1
  // the auto-refresh pause indicator + "Back to live" render as well.
  const allDone = activeSources().every((s) => exhausted.has(s));
  foot.innerHTML = `
    <span>Showing ${shown} of ${inWindow} fetched in window${
      pagesLoaded > 1 ? ` · ${pagesLoaded} pages` : ''}</span>
    ${trimmed ? `<span class="act-foot-cap">
      <i class="fa-solid fa-filter"></i> capped at ${cap} per type${
        typeFilter === 'all' ? ' — pick a single type for more depth' : ''}
    </span>` : ''}
    <span class="act-foot-spacer"></span>
    ${pagingPaused ? `
      <span class="act-foot-paused"><i class="fa-solid fa-pause"></i> Paused — showing older results</span>
      <button class="btn btn-outline btn-sm" onclick="backToLive()">
        <i class="fa-solid fa-tower-broadcast"></i> Back to live
      </button>` : ''}
    ${allDone
      ? `<span class="act-foot-done">All older rows loaded for this window</span>`
      : `<button class="btn btn-outline btn-sm" id="act-older-btn" onclick="loadOlder()">
           <i class="fa-solid fa-angles-down" id="act-older-icon"></i> Load older
         </button>`}`;
}

// ── Row interactions ───────────────────────────────────────────
//
// Row click → deep-link (T4): switch to the source's sub-tab AND ask it to
// open its own execution-detail view on this record, via the shell's
// focusSubPageRecord. The payload id is the row's focusId — the id the
// TARGET page's opener wants (== r.id everywhere except sequence rows,
// which send enrollment_id; see normSequence). Each sub-page keeps sole
// ownership of its detail UI — this is a call path, not a component.
//
// Degrades: shell without focusSubPageRecord → plain tab switch (pre-T4
// behaviour); no tabId at all → raw-JSON modal. The per-row code button
// (rowDetail) stays as the escape hatch when a deep-link target misbehaves.
function rowClick(i) {
  const r = window._actRendered?.[i];
  if (!r) return;
  const tabId   = SOURCES[r.source]?.tabId;
  const focusId = r.focusId ?? r.id;
  if (tabId && focusId != null && typeof P.focusSubPageRecord === 'function') {
    P.focusSubPageRecord(tabId, { id: focusId });
    return;
  }
  if (tabId && typeof P.switchSubPage === 'function') {
    P.switchSubPage(tabId);   // shell predates T4 — degrade to old behaviour
    return;
  }
  rowDetail(i);
}

function rowDetail(i) {
  const r = window._actRendered?.[i];
  if (!r) return;
  let json;
  try { json = JSON.stringify(r.raw, null, 2); }
  catch { json = String(r.raw); }
  Swal.fire({
    title: `${SOURCES[r.source]?.label || r.source} · ${esc(r.name)}`,
    html: `<pre class="act-swal-pre">${esc(json)}</pre>`,
    width: 640,
    confirmButtonText: 'Close',
  });
}

// ── Toolbar wiring ─────────────────────────────────────────────
document.getElementById('act-type-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  typeFilter = btn.dataset.type;
  document.querySelectorAll('#act-type-seg button').forEach((b) => b.classList.toggle('active', b === btn));
  loadActivity();
});

document.getElementById('act-mode-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  modeFilter = btn.dataset.mode;
  document.querySelectorAll('#act-mode-seg button').forEach((b) => b.classList.toggle('active', b === btn));
  loadActivity();
});

document.getElementById('act-window').addEventListener('change', (e) => {
  windowHours = parseInt(e.target.value) || 24;
  loadActivity();
});

// ── Status multi-select (T7 Part C) ────────────────────────────
//
// The menu is the UNION of the seven vocabularies (STATUS_VOCAB), each entry
// annotated with the sources that carry it — so `held` reads as
// workflow-only, `partial` as hook + trigger, etc. Selection is applied
// per-source as an intersection at fetch time (buildStatusCalls).

function buildStatusMenu() {
  const menu = document.getElementById('act-status-menu');
  const bySt = new Map();
  for (const [src, list] of Object.entries(STATUS_VOCAB)) {
    for (const st of list) {
      if (!bySt.has(st)) bySt.set(st, []);
      bySt.get(st).push(SOURCES[src].label);
    }
  }
  const entries = [...bySt.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  menu.innerHTML = entries.map(([st, srcs]) => `
    <label>
      <input type="checkbox" value="${esc(st)}" ${statusFilter.has(st) ? 'checked' : ''}
             onchange="statusToggled(this)">
      <span>${esc(st)}</span>
      <span class="act-status-src">${esc(srcs.join(', '))}</span>
    </label>`).join('') + `
    <button class="act-status-clear" onclick="clearStatusFilter()">Clear — use mode's default statuses</button>`;
}

let statusDebounce = null;
function statusToggled(cb) {
  if (cb.checked) statusFilter.add(cb.value);
  else statusFilter.delete(cb.value);
  updateStatusBtn();
  // Batch rapid toggles into one reload (each reload is up to ~15 requests
  // in All-types failures mode).
  clearTimeout(statusDebounce);
  statusDebounce = setTimeout(loadActivity, 300);
}

function clearStatusFilter() {
  statusFilter.clear();
  buildStatusMenu();
  updateStatusBtn();
  clearTimeout(statusDebounce);
  statusDebounce = setTimeout(loadActivity, 150);
}

function updateStatusBtn() {
  const btn = document.getElementById('act-status-btn');
  const n = statusFilter.size;
  btn.classList.toggle('act-filtering', n > 0);
  btn.innerHTML = n === 0
    ? `Status: any <i class="fa-solid fa-chevron-down" style="font-size:9px"></i>`
    : `Status: ${esc([...statusFilter][0])}${n > 1 ? ` +${n - 1}` : ''} <i class="fa-solid fa-chevron-down" style="font-size:9px"></i>`;
  // A non-empty selection overrides the Failures/All mode's status sets —
  // dim the mode toggle so the UI says so.
  const modeSeg = document.getElementById('act-mode-seg');
  modeSeg.style.opacity = n > 0 ? '0.45' : '';
  modeSeg.title = n > 0 ? 'Status filter overrides the mode while set' : '';
}

function toggleStatusMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('act-status-menu');
  if (menu.classList.contains('hidden')) buildStatusMenu();
  menu.classList.toggle('hidden');
}

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('act-status-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('act-status-menu').classList.add('hidden');
  }
});

// ── Auto-refresh (60s, visibility-gated, paging-gated) ─────────
function startAutoRefresh() {
  stopAutoRefresh();
  // T7: a paged view suspends the loop entirely — the tick calls
  // loadActivity, which resets to page 1 and would discard every loaded
  // page while the user is reading it. Back to live re-arms.
  if (pagingPaused) return;
  if (!subPageActive || document.visibilityState !== 'visible') return;
  refreshTimer = setInterval(() => {
    // Double-check gates at fire time — belt and suspenders against a
    // missed lifecycle event (and against a pause set after arming).
    if (pagingPaused) return;
    if (subPageActive && document.visibilityState === 'visible') loadActivity();
  }, 60 * 1000);
}

function stopAutoRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (!subPageActive) return;
    // T7: don't nuke a paged view just because the browser tab regained
    // focus — the user resumes explicitly via Back to live / Refresh.
    if (pagingPaused) return;
    loadActivity();
    startAutoRefresh();
  } else {
    stopAutoRefresh();
  }
});

// ══════════════════════════════════════════════════════════════════
// LIFECYCLE
// ══════════════════════════════════════════════════════════════════

async function init() {
  subPageActive = true;
  declareTopbar();
  await loadActivity();
  startAutoRefresh();
}

function declareTopbar() {
  if (!subPageActive) return;
  P.setTopbarButtons({ refresh: true, new: false, save: false, delete: false });
}

function onShow() {
  subPageActive = true;
  declareTopbar();
  // T7: a paged view survives sub-tab switches — reloading here would
  // discard the loaded pages. The user resumes via Back to live / Refresh.
  if (pagingPaused) return;
  loadActivity();       // refresh on re-show — activity is time-sensitive
  startAutoRefresh();
}

function onHide() {
  subPageActive = false;
  stopAutoRefresh();
}

function onRefresh() { return loadActivity(); }

// ══════════════════════════════════════════════════════════════════
// WINDOW EXPORTS — for inline onclick handlers + shell hooks
// ══════════════════════════════════════════════════════════════════

window.onShow       = onShow;
window.onHide       = onHide;
window.onRefresh    = onRefresh;
window.loadActivity = loadActivity;
window.rowClick     = rowClick;
window.rowDetail    = rowDetail;
// T7 — paging + status filter inline handlers
window.loadOlder         = loadOlder;
window.backToLive        = backToLive;
window.toggleStatusMenu  = toggleStatusMenu;
window.statusToggled     = statusToggled;
window.clearStatusFilter = clearStatusFilter;

// ── Boot ───────────────────────────────────────────────────────
(function waitForShell() {
  if (P && typeof P.apiSend === 'function' && typeof P.setTopbarButtons === 'function') {
    return init();
  }
  setTimeout(waitForShell, 50);
})();
</script>
</body>
