<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Status — Client Portal</title>
<style>
  /* Client Portal Slice 2 + E1 — case view. Visual language from login.html /
     cases.html (S1/S2 minimal). S5: branded header + favicon ride the shared
     chrome (Portal.initChrome) — NOTHING about the case view's own
     rendering changed. E1: the payment/341 cards render
     from the server's `cards` array (portal_cards config) instead of
     hardcoding — same visual shells. */
  :root {
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --panel: #f9fafb;
    --done: #059669;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 32px 16px 40px; }

  .backlink {
    display: inline-block; margin-bottom: 14px;
    color: var(--muted); text-decoration: none; font-size: 13.5px;
  }
  .backlink:hover { color: var(--accent); }

  .head h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .head .docket { margin: 5px 0 0; color: var(--muted); font-size: 13.5px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-top: 16px;
  }
  .card h2 {
    margin: 0 0 12px; font-size: 14px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  }

  /* timeline */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li {
    position: relative; padding: 0 0 18px 26px;
  }
  .tl li:last-child { padding-bottom: 0; }
  .tl li::before {          /* connector */
    content: ""; position: absolute; left: 7px; top: 18px; bottom: 0;
    width: 2px; background: var(--border);
  }
  .tl li:last-child::before { display: none; }
  .tl .dot {
    position: absolute; left: 0; top: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--bg);
  }
  .tl .lbl { font-size: 15px; }
  .tl .when { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

  .tl li.done .dot { border-color: var(--done); background: var(--done); }
  .tl li.done .lbl { color: var(--text); }

  .tl li.current .dot {
    border-color: var(--accent); background: var(--accent);
    box-shadow: 0 0 0 4px #dbeafe;
  }
  .tl li.current .lbl { font-weight: 700; color: var(--accent); }

  .tl li.upcoming .lbl { color: var(--muted); }

  .pay-btn {
    display: block; text-align: center; text-decoration: none;
    padding: 11px 14px; font-size: 15.5px; font-weight: 600;
    border-radius: 8px;
    background: var(--accent); color: var(--accent-text);
  }
  .pay-note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; text-align: center; }

  /* E1 template-card body: pre-line keeps staff-typed newlines without any
     HTML transform (body text is escText'd at insertion — see renderCard). */
  .card-body { margin: 0; white-space: pre-line; }
  .card-body + .pay-btn { margin-top: 12px; }

  /* R3 — "Your next steps". ns- prefix. The card lives ABOVE the progress
     timeline: the timeline answers "where is my case", this answers "what do
     I have to do", and the second question is the one a client opens the
     portal to ask. Both stay — this is additive. */
  .ns-count { margin: -4px 0 12px; font-size: 13px; color: var(--muted); }
  .ns-list { list-style: none; margin: 0; padding: 0; }
  .ns-list li { display: flex; gap: 10px; padding: 9px 0; align-items: flex-start; }
  .ns-list li + li { border-top: 1px solid var(--border); }
  .ns-mark {
    flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; margin-top: 1px;
    background: var(--bg); border: 1.5px solid var(--border); color: var(--muted);
  }
  .ns-done .ns-mark { background: var(--done); border-color: var(--done); color: #fff; }
  .ns-now  .ns-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .ns-body { min-width: 0; }
  .ns-label { font-size: 15px; }
  .ns-done .ns-label { color: var(--muted); }
  .ns-now  .ns-label { font-weight: 700; }
  .ns-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .ns-chip {
    display: inline-block; margin-left: 8px; vertical-align: 1px;
    padding: 1px 8px; border-radius: 999px;
    background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
  }
  /* The greyed forward projection. ONE rule set, TWO surfaces (R3.1): the
     "Your next steps" card (.ns-proj*, R2.5) and the Case Progress timeline
     (.tl-proj*). They render one above the other on the same page showing the
     SAME server-side labels, so sharing the declarations is not tidiness —
     a second copy would eventually drift and the drift would be visible.
     Deliberately NOT the .tl treatment: no dot, no connector, no date. These
     are possibilities, not history, and must not look like a step the case
     has a position in. */
  .ns-proj, .tl-proj { margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--border); }
  .ns-proj-head, .tl-proj-head {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 0 0 5px;
  }
  .ns-proj-item, .tl-proj-item { font-size: 13.5px; color: var(--muted); padding: 2px 0; }

  .msg { text-align: center; color: var(--muted); padding: 24px 0; }
  .msg a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="cases.html">&larr; Your cases</a>
  <div id="content"><p class="msg">Loading&hellip;</p></div>
</div>

<script src="portal.js"></script>
<script>
(function () {
  'use strict';

  Portal.initChrome({ authed: true });

  function escText(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // 'YYYY-MM-DD' (firm-local, server-computed) → 'Aug 5, 2026'.
  // Component split on purpose — new Date('YYYY-MM-DD') parses as UTC
  // midnight and shifts a day west of Greenwich.
  function fmtDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
    var p = iso.split('-');
    var m = parseInt(p[1], 10);
    if (!(m >= 1 && m <= 12)) return iso;
    return MONTHS[m - 1] + ' ' + parseInt(p[2], 10) + ', ' + p[0];
  }

  function tlItem(cls, label, when) {
    return '<li class="' + cls + '">' +
             '<span class="dot"></span>' +
             '<div class="lbl">' + escText(label) + '</div>' +
             (when ? '<div class="when">' + escText(when) + '</div>' : '') +
           '</li>';
  }

  // (R3.1) The timeline's forward tail — what usually comes next once the
  // chapter is chosen. Present on LEADS only: the server emits
  // timeline.projected exactly when getPipeline shipped a projection, and
  // omits the key entirely otherwise, so a case-phase view (and a pre-R3.1
  // server) falls straight through this and the timeline card ends where it
  // always has.
  //
  // Rendered OUTSIDE the <ul class="tl">, with the same divider + greyed-text
  // treatment the "Your next steps" card already uses for the same labels.
  // NOT tlItem: no dot, no connector, no date. A dot would put these stages
  // in the same visual sequence as the case's real history and upcoming, and
  // they are not in it — they belong to a template the case has not entered.
  function tlProjected(list) {
    if (!list || !list.length) return '';
    return '<div class="tl-proj">' +
             '<p class="tl-proj-head">Typical next steps</p>' +
             list.map(function (p) {
               return '<div class="tl-proj-item">' + escText(p.label) + '</div>';
             }).join('') +
           '</div>';
  }

  // '2026-08-28' + '10:00' (firm-local wall values, server-computed) →
  // 'Aug 28, 2026 at 10:00 AM'. Component split, same reasoning as fmtDate —
  // never Date-parse naive strings.
  function fmtDateTime(isoDate, hhmm) {
    var out = fmtDate(isoDate);
    if (hhmm && /^\d{2}:\d{2}$/.test(hhmm)) {
      var h = parseInt(hhmm.slice(0, 2), 10);
      var ampm = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12 === 0 ? 12 : h % 12;
      out += ' at ' + h12 + ':' + hhmm.slice(3) + ' ' + ampm;
    }
    return out;
  }

  // ── E1 card engine rendering ──────────────────────────────────────────────
  // Cards come CONFIGURED from the server (portal_cards via
  // portalCardEngine.renderCards). The server has already decided WHICH cards
  // exist — failed-condition / refused cards are ABSENT from the array (never
  // hidden client-side). This file only lays them out:
  //   placement 'case_top' → above the progress timeline (the 341 card lives
  //   here), everything else ('case', default) → below it (payment).

  function cardShell(title, inner) {
    return '<div class="card"><h2>' + escText(title) + '</h2>' + inner + '</div>';
  }

  // Card links (R2 amendment, 2026-08-09):
  //   PORTAL-INTERNAL ('/portal/…' exactly): plain same-tab navigation, no
  //     note — these are the portal's own pages (callback.html et al.); the
  //     pre-R2 hardcoded nav cards navigated same-tab and this preserves
  //     that. The test is the /portal/ PREFIX, not "site-relative": /r/…
  //     rows are site-relative REDIRECTS to external pages (the Clio
  //     payment page) and must keep the external treatment below.
  //   EVERYTHING ELSE (http(s) absolute, /r/…, any other path):
  //     top-level/new-tab, target=_blank + rel=noopener REQUIRED — the
  //     Clio page behind /r/payment refuses to load in an iframe, so these
  //     links must never be embedded; the "Opens in a new tab." note
  //     renders under the button. Unknown paths get this safe default.
  // (escText makes the value attribute-safe.) FUTURE SWAP POINT (in-house
  // payments): the payment card's /r/payment link now lives in the
  // portal_cards `payment` row — the in-house payment flow swaps that
  // row's link (or a coded_key), not this file.
  function linkBtn(link) {
    if (!link || !link.url) return '';
    if (link.url.indexOf('/portal/') === 0) {
      return '<a class="pay-btn" href="' + escText(link.url) + '">' +
               escText(link.label || 'Open') + '</a>';
    }
    return '<a class="pay-btn" href="' + escText(link.url) +
             '" target="_blank" rel="noopener">' + escText(link.label || 'Open') + '</a>' +
           '<p class="pay-note">Opens in a new tab.</p>';
  }

  // Coded-card renderers, dispatched by card.coded_key. The card's TITLE is
  // staff-configured (card.title); the BODY is code. Unknown coded_key →
  // card skipped (a config row shipped ahead of its renderer must not break
  // the page).
  var CODED_RENDERERS = {
    // Meeting of Creditors (341) — S2.1 render, E1-dispatched. The server
    // includes c.meeting341 only when the engine passed this card
    // (bankruptcy-only + past-date gates live in the card's CONDITIONS now;
    // no status wording per the 2026-08-06 ruling). Render-ready or absent —
    // nothing to decide here.
    meeting341: function (card, c) {
      if (!c.meeting341) return '';
      var inner = '<p style="margin:0;font-size:15.5px;font-weight:600;">' +
                    escText(fmtDateTime(c.meeting341.date, c.meeting341.time)) +
                  '</p>';
      if (c.meeting341.link) {
        // Same external-link rule as every http(s) card link — never embed.
        inner += '<a class="pay-btn" style="margin-top:12px;" href="' +
                   escText(c.meeting341.link) +
                 '" target="_blank" rel="noopener">Join your meeting</a>';
      }
      return cardShell(card.title, inner);
    },

    // Documents nav (R2, 2026-08-09) — replaces the hardcoded Documents
    // card. CODED because the link is per-case (docs.html?id=<case_id>):
    // a static link_url cannot carry the id and URL templating is
    // deliberately NOT being added. Inner HTML is byte-identical to the
    // pre-R2 hardcoded card (relative href, same-tab, same label).
    docsNav: function (card, c) {
      return cardShell(card.title,
        '<a class="pay-btn" href="docs.html?id=' + encodeURIComponent(c.case_id) +
        '">View &amp; upload documents</a>');
    }
  };

  // ── R3: "Your next steps" ────────────────────────────────────────────────
  // Rendered from c.next_steps, which the SERVER built (portalCaseService
  // .buildNextSteps): the set, the ordering, the hiding of skipped/na, the
  // single Active-now pick and the header count are ALL decided there. This
  // function lays out what it is handed and decides nothing — the same split
  // as the engine cards above, so there is no second place for the rules to
  // drift to.
  //
  // NOT an engine card (yet): coded cards need a portal_cards row, and this
  // slice ships with no SQL. The payload key is shaped so a future coded
  // 'nextSteps' card can dispatch on it with zero server change.
  //
  // Absent / null → nothing renders and the page is byte-identical to pre-R3.
  function nsCountLine(n) {
    if (!n) return 'You&rsquo;re all caught up.';
    return n === 1 ? '1 more step' : escText(n) + ' more steps';
  }

  function nsStep(s) {
    var cls = 'ns-step' + (s.done ? ' ns-done' : '') + (s.active_now ? ' ns-now' : '');

    // Done ✓ · event-kind steps a calendar glyph (they are not something the
    // client DOES, so they carry no number) · everything else its number chip.
    var mark = s.done ? '&#10003;'
             : (s.kind === 'event' ? '&#128197;'
             : (s.number == null ? '' : escText(s.number)));

    var sub = [];
    if (s.date) sub.push(fmtDate(s.date));
    if (s.subtitle) sub.push(escText(s.subtitle));

    return '<li class="' + cls + '">' +
             '<span class="ns-mark">' + mark + '</span>' +
             '<div class="ns-body">' +
               '<div class="ns-label">' + escText(s.label) +
                 (s.active_now ? '<span class="ns-chip">Active now</span>' : '') +
               '</div>' +
               (sub.length ? '<div class="ns-sub">' + sub.join(' &middot; ') + '</div>' : '') +
             '</div>' +
           '</li>';
  }

  function renderNextSteps(ns) {
    if (!ns || !ns.steps || !ns.steps.length) return '';

    var inner = '<p class="ns-count">' + nsCountLine(ns.remaining) + '</p>' +
                '<ul class="ns-list">' + ns.steps.map(nsStep).join('') + '</ul>';

    // (R2.5) The greyed forward projection — what usually comes next once the
    // chapter is chosen. Absent on a pre-R2.5 server and on case-phase
    // payloads; the card just ends earlier.
    if (ns.projected && ns.projected.length) {
      inner += '<div class="ns-proj">' +
                 '<p class="ns-proj-head">Typical next steps</p>' +
                 ns.projected.map(function (p) {
                   return '<div class="ns-proj-item">' + escText(p.label) + '</div>';
                 }).join('') +
               '</div>';
    }

    return cardShell('Your next steps', inner);
  }

  function renderCard(card, c) {
    if (card.coded_key) {
      var fn = CODED_RENDERERS[card.coded_key];
      return fn ? fn(card, c) : '';
    }
    // Template card: title + body + optional link button.
    // card.body is RAW resolved text (ratified model item 4, rider
    // 2026-08-08) — escText it at insertion, exactly like every other
    // payload string on this page.
    var inner = '';
    if (card.body) inner += '<p class="card-body">' + escText(card.body) + '</p>';
    inner += linkBtn(card.link);
    if (!inner) return '';   // nothing to show → skip the empty shell
    return cardShell(card.title, inner);
  }

  function renderCards(cards, c, top) {
    var html = '';
    (cards || []).forEach(function (card) {
      var isTop = card.placement === 'case_top';
      if (isTop !== top) return;
      html += renderCard(card, c);
    });
    return html;
  }

  function render(c) {
    var html = '';

    // Identity block.
    html += '<div class="head">' +
              '<h1>' + escText(c.title) + '</h1>' +
              (c.docket ? '<p class="docket">Case no. ' + escText(c.docket) + '</p>' : '') +
            '</div>';

    // Cards above the timeline (placement 'case_top' — the 341 card).
    html += renderCards(c.cards, c, true);

    // R3 — "Your next steps", between the case_top cards and the timeline.
    // Above the timeline because it is the actionable one; below the 341 card
    // because a dated appearance the client must attend outranks a work list.
    // Empty / absent → '' and the page reads exactly as it did pre-R3.
    html += renderNextSteps(c.next_steps);

    // Progress timeline: done → current (marked) → upcoming. No current →
    // done + upcoming render without a marker.
    var tl = c.timeline || {};
    var items = '';
    (tl.done || []).forEach(function (d) {
      items += tlItem('done', d.label, fmtDate(d.date));
    });
    if (tl.current) {
      items += tlItem('current', tl.current.label,
        tl.current.since ? 'Since ' + fmtDate(tl.current.since) : '');
    }
    (tl.upcoming || []).forEach(function (u) {
      items += tlItem('upcoming', u.label, '');
    });
    // R3.1 — the greyed forward tail closes the card. A lead's timeline used
    // to stop at the last intake stage while the next-steps card directly
    // above it already showed the continuation; both now end the same way.
    html += '<div class="card"><h2>Case Progress</h2>' +
            (items ? '<ul class="tl">' + items + '</ul>'
                   : '<p class="msg" style="padding:6px 0;">No progress to show yet.</p>') +
            tlProjected(tl.projected) +
            '</div>';

    // Cards below the timeline (placement 'case'). R2 (2026-08-09): the
    // previously hardcoded Documents + "Need a call?" cards now ride the
    // engine — the 'docsNav' CODED card (renderer above carries the
    // per-case URL) and the 'callback' TEMPLATE row (static
    // link_url /portal/callback.html), seeded at sort 2 and 4 so they
    // render ahead of payment (sort 10) in the pre-R2 visual order:
    // Documents, Need a call?, Payments.
    html += renderCards(c.cards, c, false);

    document.getElementById('content').innerHTML = html;
  }

  function showNotFound() {
    document.getElementById('content').innerHTML =
      '<p class="msg">We couldn&rsquo;t find that case. ' +
      '<a href="cases.html">Back to your cases</a></p>';
  }

  async function load() {
    var id = new URLSearchParams(window.location.search).get('id');
    if (!id) { window.location.replace('cases.html'); return; }

    try {
      var res = await Portal.fetch('/api/portal/cases/' + encodeURIComponent(id));
      if (res.status === 404) { showNotFound(); return; }
      var data = await res.json();
      if (!data || data.status !== 'success' || !data.case) {
        document.getElementById('content').innerHTML =
          '<p class="msg">Something went wrong &mdash; try refreshing.</p>';
        return;
      }
      render(data.case);
    } catch (_) {
      document.getElementById('content').innerHTML =
        '<p class="msg">Connection problem &mdash; try refreshing.</p>';
    }
  }

  load();
})();
</script>
</body>
</html>
