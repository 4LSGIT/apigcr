<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scratch Browser</title>
<link rel="stylesheet" href="/theme.css">
<script src="/themeSync.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  body { padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 16px; }
  .muted { color: var(--text-muted); font-size: 11px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  button {
    background: var(--accent); color: var(--accent-text); border: none;
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  button:hover { opacity: .85; }
  /* --fill-text explicitly: the base `button` rule sets --accent-text, which is
     near-black and fails contrast on --danger-fill. Inherited, not typed. */
  button.danger { background: var(--danger-fill); color: var(--fill-text); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .45; cursor: default; }

  input, select {
    background: var(--page-bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 8px; border-radius: 4px; font-size: 12px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px; margin-bottom: 12px;
  }

  .split { display: flex; gap: 12px; align-items: flex-start; }
  .split > .left  { flex: 1 1 420px; min-width: 0; }
  .split > .right { flex: 1 1 460px; min-width: 0; }
  @media (max-width: 900px) { .split { flex-direction: column; } .split > * { width: 100%; } }

  .list-wrap { max-height: 62vh; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--page-bg); }
  tbody tr.sel td { background: var(--page-bg); box-shadow: inset 2px 0 0 var(--accent); }
  th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
  th[data-sort]:hover { color: var(--text); }
  .ns-cell { color: var(--text-muted); }
  /* An unbroken key must wrap, not widen the table: Size/Age (and their sort
     headers) would scroll off at phone width. */
  td.mono { word-break: break-all; }
  /* --warn, not --warn-text: --warn-text is the near-black label that sits ON
     --warn-fill, and is the same in both themes — unreadable on dark --surface. */
  .big, td.num.stale { color: var(--warn); }

  .value {
    margin: 0; padding: 10px; border-radius: 4px; overflow: auto;
    max-height: 52vh; background: var(--page-bg); border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .value.meta-box { max-height: 20vh; margin-bottom: 8px; }
  /* Pretty view is built from blocks; whitespace in the markup must not show. */
  .value.pretty { white-space: normal; }
  .j-ent { padding-left: 2ch; }
  .j-key { font-weight: 700; color: var(--text); }
  .j-p, .j-null { color: var(--text-muted); }
  .j-str { color: var(--ok); white-space: pre-wrap; }
  .j-num { color: var(--info); }
  .j-bool { color: var(--cat-purple); }
  /* Multi-line string: real line breaks, set off as a block under its key. */
  .j-ml { display: block; margin: 2px 0 4px; padding-left: 8px; border-left: 2px solid var(--border); }
  .j-tag {
    font-size: 10px; color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 3px; padding: 0 4px; margin-right: 4px;
  }
  .stat { display: inline-block; margin-right: 14px; }
  .stat b { font-variant-numeric: tabular-nums; }
  .err { color: var(--danger); }
</style>
</head>
<body>

<h2>Scratch Browser</h2>
<p class="muted" id="totals">Loading&hellip;</p>

<div class="panel">
  <div class="row">
    <input id="q" type="search" placeholder="Filter namespace or key&hellip;" style="flex:1 1 220px;min-width:0;">
    <select id="nsPick"><option value="">All namespaces</option></select>
    <button class="ghost" id="refresh" type="button">Refresh</button>
  </div>
</div>

<div class="split">
  <div class="left panel">
    <div class="list-wrap">
      <table>
        <thead>
          <tr><th data-sort="key">Key</th><th class="num" data-sort="len">Size</th><th class="num" data-sort="age">Age</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="3" class="muted" style="text-align:center;padding:20px;">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="right panel">
    <div class="row" style="margin-bottom:8px;">
      <strong id="selKey" class="mono" style="flex:1 1 auto;min-width:0;word-break:break-all;">Nothing selected</strong>
      <button class="ghost" id="fmt" type="button" disabled>Show raw</button>
      <button class="ghost" id="copy" type="button" title="Copies the value exactly as stored" disabled>Copy</button>
      <button class="danger" id="del" type="button" disabled>Delete</button>
    </div>
    <p class="muted" id="selMeta"></p>
    <div class="value meta-box" id="metaBox" hidden></div>
    <div class="value" id="value">Pick a key on the left to read its value.</div>
  </div>
</div>

<script>
  const P = window.parent;

  // Iframe boot: the pane can load before the shell's apiSend exists.
  (function waitForParent() {
    if (P && P.apiSend) return init();
    setTimeout(waitForParent, 100);
  })();

  let KEYS = [];
  let sel = null;
  let cur = null;          // the open entry, as the server returned it
  let raw = false;         // value pane: false = pretty, true = exactly as stored
  let sortCol = "key", sortDir = 1;

  const STALE_DAYS = 14;   // not updated in this long = worth a look in the docs-review sweep

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  const kb = n => {
    n = Number(n) || 0;
    return n >= 1024 ? (n / 1024).toFixed(n >= 10240 ? 0 : 1) + " KB" : n + " B";
  };

  function init() {
    document.getElementById("refresh").addEventListener("click", load);
    document.getElementById("q").addEventListener("input", render);
    document.getElementById("nsPick").addEventListener("change", render);
    document.getElementById("copy").addEventListener("click", copyValue);
    document.getElementById("fmt").addEventListener("click", () => { raw = !raw; showValue(); });
    document.querySelectorAll("th[data-sort]").forEach(th =>
      th.addEventListener("click", () => setSort(th.dataset.sort)));
    document.getElementById("del").addEventListener("click", delSelected);
    load();
  }

  async function load() {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = `<tr><td colspan="3" class="muted" style="text-align:center;padding:20px;">Loading…</td></tr>`;
    try {
      const data = await P.apiSend("/api/admin/scratch", "GET");
      KEYS = data.keys || [];
      const t = data.totals || {};
      document.getElementById("totals").innerHTML =
        `<span class="stat"><b>${t.keys ?? KEYS.length}</b> keys</span>` +
        `<span class="stat"><b>${t.namespaces ?? ""}</b> namespaces</span>` +
        `<span class="stat"><b>${kb(t.bytes)}</b> total</span>`;

      const pick = document.getElementById("nsPick");
      const cur = pick.value;
      const namespaces = [...new Set(KEYS.map(r => r.ns))].sort();
      pick.innerHTML = `<option value="">All namespaces</option>` +
        namespaces.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
      pick.value = namespaces.includes(cur) ? cur : "";

      render();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="3" class="err" style="padding:20px;">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  function visible() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ns = document.getElementById("nsPick").value;
    const rows = KEYS.filter(r =>
      (!ns || r.ns === ns) &&
      (!q || (r.ns + "/" + r.k).toLowerCase().includes(q)));
    const name = r => r.ns + "/" + r.k;
    const cmp = {
      key: (a, b) => name(a).localeCompare(name(b)),
      len: (a, b) => (Number(a.len) || 0) - (Number(b.len) || 0),
      // age = time since updated_at; age_days alone ties every key touched the same day
      age: (a, b) => String(b.updated_at).localeCompare(String(a.updated_at)),
    }[sortCol];
    return rows.sort((a, b) => sortDir * cmp(a, b) || name(a).localeCompare(name(b)));
  }

  /** Key sorts A→Z first; Size and Age sort biggest / oldest first. */
  function setSort(col) {
    if (sortCol === col) sortDir = -sortDir;
    else { sortCol = col; sortDir = col === "key" ? 1 : -1; }
    render();
  }

  function paintSortHeaders() {
    document.querySelectorAll("th[data-sort]").forEach(th => {
      const on = th.dataset.sort === sortCol;
      const label = { key: "Key", len: "Size", age: "Age" }[th.dataset.sort];
      th.textContent = label + (on ? (sortDir === 1 ? " ▲" : " ▼") : "");
      th.setAttribute("aria-sort", on ? (sortDir === 1 ? "ascending" : "descending") : "none");
    });
  }

  function render() {
    paintSortHeaders();
    const rows = visible();
    const tbody = document.getElementById("tbody");
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="3" class="muted" style="text-align:center;padding:20px;">No keys match.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const id = r.ns + "/" + r.k;
      const big = Number(r.len) > 20000 ? " big" : "";
      return `<tr data-id="${esc(id)}" class="${sel === id ? "sel" : ""}">
        <td class="mono"><span class="ns-cell">${esc(r.ns)}/</span>${esc(r.k)}</td>
        <td class="num${big}">${kb(r.len)}</td>
        <td class="num${r.age_days >= STALE_DAYS ? " stale" : " muted"}"${r.age_days >= STALE_DAYS ? ` title="Not updated in ${STALE_DAYS}+ days"` : ""}>${r.age_days}d</td>
      </tr>`;
    }).join("");

    tbody.querySelectorAll("tr[data-id]").forEach(tr => {
      tr.addEventListener("click", () => openKey(tr.dataset.id));
    });
  }

  async function openKey(id) {
    sel = id;
    render();
    const [ns, ...rest] = id.split("/");
    const k = rest.join("/");
    document.getElementById("selKey").textContent = id;
    cur = null;
    document.getElementById("metaBox").hidden = true;
    document.getElementById("value").className = "value";
    document.getElementById("value").textContent = "Loading…";
    document.getElementById("copy").disabled = true;
    document.getElementById("fmt").disabled = true;
    document.getElementById("del").disabled = true;
    try {
      const data = await P.apiSend(
        `/api/admin/scratch/${encodeURIComponent(ns)}/${encodeURIComponent(k)}`, "GET");
      const e = data.entry;
      document.getElementById("selMeta").textContent =
        `${kb(e.len)} · updated ${new Date(e.updated_at).toLocaleString()} · created ${new Date(e.created_at).toLocaleString()}`;
      cur = e;
      showValue();
      document.getElementById("copy").disabled = false;
      document.getElementById("fmt").disabled = false;
      document.getElementById("del").disabled = false;
    } catch (err) {
      document.getElementById("selMeta").textContent = "";
      document.getElementById("value").innerHTML = `<span class="err">Error: ${esc(err.message)}</span>`;
    }
  }

  /** Most values are JSON, some are plain prose, some are JSON-in-a-string.
   *  Returns the parsed value, or the (unwrapped) string when it isn't JSON. */
  function decode(v) {
    let s = String(v);
    for (let i = 0; i < 2; i++) {
      try {
        const parsed = JSON.parse(s);
        if (typeof parsed === "string") { s = parsed; continue; }
        return parsed;
      } catch (e) { return s; }
    }
    return s;
  }

  /** A string field that itself holds a JSON object/array (the `v` is
   *  string-only convention nests these). undefined when it doesn't. */
  function asJson(s) {
    if (!/^\s*[\[{]/.test(s)) return undefined;
    try {
      const p = JSON.parse(s);
      return p && typeof p === "object" ? p : undefined;
    } catch (e) { return undefined; }
  }

  /** Reading view, not JSON: bold keys, typed colours, real line breaks in
   *  strings, nested JSON strings decoded (tagged). Raw view / Copy give the
   *  exact stored bytes. Every leaf goes through esc(). */
  function fmt(x) {
    if (x === null) return `<span class="j-null">null</span>`;
    if (Array.isArray(x)) {
      if (!x.length) return `<span class="j-p">[]</span>`;
      return `<span class="j-p">[</span>` +
        x.map(it => `<div class="j-ent">${fmt(it)}</div>`).join("") +
        `<span class="j-p">]</span>`;
    }
    if (typeof x === "object") {
      const ks = Object.keys(x);
      if (!ks.length) return `<span class="j-p">{}</span>`;
      return `<span class="j-p">{</span>` +
        ks.map(k => `<div class="j-ent"><span class="j-key">${esc(k)}</span><span class="j-p">: </span>${fmt(x[k])}</div>`).join("") +
        `<span class="j-p">}</span>`;
    }
    if (typeof x === "string") {
      const inner = asJson(x);
      if (inner !== undefined) {
        return `<span class="j-tag" title="Stored as a JSON string; shown decoded">json</span>${fmt(inner)}`;
      }
      if (x.includes("\n")) return `<span class="j-str j-ml">${esc(x)}</span>`;
      return `<span class="j-str">"${esc(x)}"</span>`;
    }
    if (typeof x === "number") return `<span class="j-num">${esc(x)}</span>`;
    if (typeof x === "boolean") return `<span class="j-bool">${x}</span>`;
    return esc(x);
  }

  function showValue() {
    const box = document.getElementById("value");
    const metaBox = document.getElementById("metaBox");
    document.getElementById("fmt").textContent = raw ? "Show pretty" : "Show raw";
    if (!cur) return;

    // mysql2 hands JSON columns back parsed; tolerate a string too.
    const meta = cur.meta == null ? null : (typeof cur.meta === "string" ? decode(cur.meta) : cur.meta);
    metaBox.hidden = meta == null;
    if (meta != null) {
      metaBox.className = "value meta-box" + (raw ? "" : " pretty");
      if (raw) metaBox.textContent = "meta: " + JSON.stringify(meta);
      else metaBox.innerHTML = `<span class="j-key">meta</span><span class="j-p">: </span>${fmt(meta)}`;
    }

    if (cur.v == null) { box.className = "value"; box.textContent = "(null)"; return; }
    if (raw) { box.className = "value"; box.textContent = String(cur.v); return; }
    const d = decode(cur.v);
    if (typeof d === "string") { box.className = "value"; box.textContent = d; return; }  // prose
    box.className = "value pretty";
    box.innerHTML = fmt(d);
  }

  async function copyValue() {
    const btn = document.getElementById("copy");
    try {
      await navigator.clipboard.writeText(cur?.v == null ? "" : String(cur.v));
      btn.textContent = "Copied";
    } catch (e) {
      btn.textContent = "Select manually";
    }
    setTimeout(() => { btn.textContent = "Copy"; }, 1400);
  }

  async function delSelected() {
    if (!sel) return;
    // Native confirm, not Swal: a second Swal.fire() replaces whatever the
    // shell already has open (single-instance constraint).
    if (!confirm(`Delete scratch key "${sel}"?\n\nThis cannot be undone.`)) return;
    const [ns, ...rest] = sel.split("/");
    const k = rest.join("/");
    const btn = document.getElementById("del");
    btn.disabled = true;
    try {
      await P.apiSend(
        `/api/admin/scratch/${encodeURIComponent(ns)}/${encodeURIComponent(k)}`, "DELETE");
      sel = null;
      cur = null;
      document.getElementById("selKey").textContent = "Nothing selected";
      document.getElementById("selMeta").textContent = "";
      document.getElementById("metaBox").hidden = true;
      document.getElementById("value").className = "value";
      document.getElementById("value").textContent = "Deleted.";
      document.getElementById("copy").disabled = true;
      document.getElementById("fmt").disabled = true;
      await load();
    } catch (err) {
      document.getElementById("value").innerHTML = `<span class="err">Delete failed: ${esc(err.message)}</span>`;
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
