<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Fields</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/themeSync.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; background: var(--page-bg); height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text-muted); gap: 10px; text-align: center;
    }
    .empty-state i { font-size: 36px; opacity: 0.25; }
    .empty-state .sub { font-size: 12px; color: var(--text-2); max-width: 380px; }
  </style>
</head>
<body>

<div class="empty-state">
  <i class="fa-solid fa-table-columns"></i>
  <div>Reserved for the field-registry build</div>
  <div class="sub">Case field configuration will live here in a future slice.</div>
</div>

<script>
// Placeholder panel only — no shell communication beyond the boot
// handshake (declares no topbar buttons so the shell shows none).
const P = window.parent;
function onShow() { P.setTopbarButtons({}); }
window.onShow = onShow;
(function waitForShell() {
  if (P && typeof P.apiSend === 'function' && typeof P.setTopbarButtons === 'function') return;
  setTimeout(waitForShell, 50);
})();
</script>
</body>
</html>
