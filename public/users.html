<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Management</title>
<link rel="stylesheet" href="/theme.css">
<script src="/themeSync.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  body { padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 16px; }
  .muted { color: var(--text-muted); font-size: 11px; }
  button {
    background: var(--accent); color: var(--accent-text); border: none;
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
    font-size: 12px;
  }
  button:hover { opacity: 0.85; }
  /* --fill-text explicitly: the base `button` rule sets --accent-text, which
     is near-black and measures 2.79 on --danger-fill. Inherited, not typed. */
  button.danger { background: var(--danger-fill); color: var(--fill-text); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.small { font-size: 11px; padding: 2px 6px; }
  input, select {
    background: var(--page-bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 8px; border-radius: 4px; font-size: 12px;
    font-family: inherit; width: 100%;
  }
  input[type="checkbox"] { width: auto; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px; margin-bottom: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; }
  tr.disabled td { opacity: 0.45; }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 10px; font-weight: 500; white-space: nowrap;
  }
  .badge.auth     { background: var(--ok-soft);     color: var(--ok-on-soft); }
  .badge.su       { background: var(--accent-soft); color: var(--accent-on-soft); }
  .badge.disabled { background: var(--danger-soft); color: var(--danger-on-soft); }
  .badge.other    { background: var(--warn-soft);   color: var(--warn-on-soft); }
  .badge.nopw     { background: var(--warn-soft);   color: var(--warn-on-soft); }
  .form-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px 12px; margin-bottom: 10px;
  }
  .form-grid label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .form-grid .wide { grid-column: span 2; }
  .check-row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 8px 0 10px; font-size: 12px; }
  .check-row label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .err { color: var(--danger); font-size: 12px; margin-top: 6px; }
  @media (max-width: 800px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="panel">
  <h2>
    Users
    <button id="addUserBtn" style="float:right;" onclick="openForm(null)">+ Add user</button>
    <button class="ghost small" style="float:right;margin-right:8px;margin-top:2px;" onclick="loadUsers()">Refresh</button>
  </h2>
  <div class="muted" id="usersHelp" style="margin-bottom:8px;">
    Users are never deleted — rows are referenced across the system. Use Disable instead.
    Disabling clears passwords immediately; an already-issued login session can persist up to 24h.
  </div>
  <!-- overflow-x: a wide table scrolls inside its panel instead of widening the page (phones). -->
  <div style="overflow-x:auto">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Username</th><th>Init</th><th>Access</th>
        <th>Email</th><th>Phone</th><th>Flags</th><th>PW</th><th></th>
      </tr>
    </thead>
    <tbody id="usersTbody">
      <tr><td colspan="10" class="muted" style="text-align:center;padding:20px;">Loading…</td></tr>
    </tbody>
  </table>
  </div>
</div>

<div class="panel" id="formPanel" style="display:none;">
  <h2 id="formTitle">Add user</h2>
  <div class="form-grid">
    <div><label>Username *</label><input id="f_username" maxlength="50"></div>
    <div><label>First name *</label><input id="f_user_fname" maxlength="20"></div>
    <div><label>Last name *</label><input id="f_user_lname" maxlength="50"></div>
    <div><label>Initials * (≤3)</label><input id="f_user_initials" maxlength="3" style="text-transform:uppercase;"></div>
    <div><label>Display name (≤20)</label><input id="f_user_name" maxlength="20" placeholder="auto: First Last"></div>
    <div><label>Access</label>
      <select id="f_user_auth">
        <option value="authorized">authorized</option>
        <option value="disabled">disabled</option>
      </select>
    </div>
    <div class="wide"><label>Email</label><input id="f_email" maxlength="50"></div>
    <div><label>Phone (10 digits)</label><input id="f_phone" maxlength="14"></div>
    <div><label>User type</label><input id="f_user_type" type="number" min="0" max="9" value="1"></div>
    <div class="wide"><label>Default email (send-as)</label><select id="f_default_email"><option value="">— none —</option></select></div>
    <div><label>Default phone (send-as)</label><select id="f_default_phone"><option value="">— none —</option></select></div>
    <div class="wide"><label>Google Calendar ID</label><input id="f_user_gcal_id" maxlength="255"></div>
    <div class="wide" id="pwWrap"><label>Initial password (optional, min 4)</label><input id="f_password" type="text" autocomplete="off"></div>
  </div>
  <!-- Roles = users.roles SET (routes/admin.users.js ROLE_MEMBERS). The su box
       is disabled for a non-SU viewer and on your own row — cosmetic; the
       server enforces both. Changes reach a JWT at the user's next login. -->
  <div class="check-row" id="rolesRow"><span class="muted">Roles:</span></div>
  <div class="check-row">
    <label><input type="checkbox" id="f_allow_sms"> allow SMS</label>
    <label><input type="checkbox" id="f_does_appts"> does appointments</label>
    <label><input type="checkbox" id="f_ringcentral"> RingCentral</label>
  </div>
  <div class="row" style="display:flex;gap:8px;">
    <button onclick="saveForm()">Save</button>
    <button class="ghost" onclick="closeForm()">Cancel</button>
    <span id="formErr" class="err"></span>
  </div>
</div>

<script>
  const P = window.parent;

  let USERS = [];        // last-loaded list
  let EDIT_ID = null;    // null = add mode

  // users.roles SET members, in column order (mirror of admin.users.js).
  const ROLE_MEMBERS = ["it", "admin", "staff", "attorney", "automation", "form_dev", "su"];
  const rolesOf = csv => String(csv || "").split(",").map(r => r.trim()).filter(Boolean);
  function viewerIsSU() {
    try { return rolesOf(P.firmData?.currentUser?.roles).includes("su"); }
    catch (_) { return false; }
  }
  function viewerId() {
    try { return P.firmData?.currentUser?.user ?? null; } catch (_) { return null; }
  }
  function canViewAs(u) {
    const roles = rolesOf(u.roles);
    return u.user !== 0 && u.user !== viewerId() &&
      String(u.user_auth || "").startsWith("authorized") &&
      !roles.includes("it") && !roles.includes("su") && !roles.includes("automation");
  }

  function init() {
    document.getElementById("rolesRow").insertAdjacentHTML("beforeend", ROLE_MEMBERS.map(r =>
      `<label><input type="checkbox" id="f_role_${r}"> ${r}</label>`).join(""));
    loadUsers();
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fmtPhone(p) {
    if (!p) return "—";
    const d = String(p);
    return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : esc(d);
  }

  // Access cell: login status (SU when the roles SET holds su), then the
  // remaining roles. A disabled row is never SU (rowIsSuperuser).
  function accessCell(u) {
    const a = u.user_auth;
    const roles = rolesOf(u.roles);
    let badge;
    if (a === "disabled")               badge = `<span class="badge disabled">disabled</span>`;
    else if (roles.includes("su"))      badge = `<span class="badge su">SU</span>`;
    else if (a && a.startsWith("authorized")) badge = `<span class="badge auth">authorized</span>`;
    else                                badge = `<span class="badge other">${esc(a)}</span>`;
    const rest = roles.filter(r => r !== "su");
    return badge + (rest.length ? `<div class="muted">${esc(rest.join(" · "))}</div>` : "");
  }

  function flags(u) {
    const f = [];
    if (u.does_appts)  f.push("appts");
    if (u.allow_sms)   f.push("sms");
    if (u.ringcentral) f.push("rc");
    return f.length ? f.join(" · ") : "—";
  }

  function pwBadge(u) {
    if (u.has_hash === undefined) return `<span class="muted">—</span>`;
    if (u.has_hash) return `<span class="badge auth">set</span>` +
      (u.reset_pending ? ` <span class="badge other" title="reset link pending">reset</span>` : "");
    return `<span class="badge nopw">none</span>`;
  }

  async function loadUsers() {
    const tbody = document.getElementById("usersTbody");
    tbody.innerHTML = `<tr><td colspan="10" class="muted" style="text-align:center;padding:20px;">Loading…</td></tr>`;
    try {
      // Default-sender dropdowns: same lists every send picker uses.
      const fd = P.firmData || {};
      F("default_email").innerHTML = '<option value="">— none —</option>' +
        (fd.emailFrom || []).map(em =>
          `<option value="${esc(em.email)}">${esc(em.from_name ? em.from_name + " <" + em.email + ">" : em.email)}</option>`
        ).join("");
      F("default_phone").innerHTML = '<option value="">— none —</option>' +
        (fd.phoneLines || []).map(l =>
          `<option value="${esc(l.phone_number)}">${esc(l.display_name ? l.display_name + " — " + l.phone_number : l.phone_number)}</option>`
        ).join("");

      const canManage = viewerIsSU();
      document.getElementById("addUserBtn").style.display = canManage ? "" : "none";
      document.getElementById("formPanel").style.display = canManage
        ? document.getElementById("formPanel").style.display : "none";
      document.getElementById("usersHelp").textContent = canManage
        ? "Users are never deleted — rows are referenced across the system. Use Disable instead. Disabling clears passwords immediately; an already-issued login session can persist up to 24h. View as opens a read-only diagnostic session in this tab; superusers may switch it to Live (audited)."
        : "View as opens a read-only 30-minute diagnostic session in this tab. Other tabs remain logged in as you.";
      const data = await P.apiSend(canManage ? "/api/admin/users" : "/api/impersonation/users", "GET");
      USERS = data.users || [];
      if (!USERS.length) {
        tbody.innerHTML = `<tr><td colspan="10" class="muted" style="text-align:center;padding:20px;">No users.</td></tr>`;
        return;
      }
      tbody.innerHTML = USERS.map(u => {
        const isAutomations = u.user === 0;
        const isDisabled = u.user_auth === "disabled";
        const viewAs = canViewAs(u)
          ? `<button class="small" onclick="viewAsUser(${u.user})">View as</button>`
          : "";
        const actions = isAutomations
          ? `<span class="muted">system</span>`
          : (canManage ? `
            <button class="ghost small" onclick="openForm(${u.user})">Edit</button>
            <button class="ghost small" onclick="setPassword(${u.user})">Set PW</button>
            ${isDisabled
              ? `<button class="small" onclick="enableUser(${u.user})">Enable</button>`
              : `<button class="danger small" onclick="disableUser(${u.user})">Disable</button>`}
            ${viewAs}
          ` : (viewAs || `<span class="muted">unavailable</span>`));
        return `
          <tr class="${isDisabled ? "disabled" : ""}">
            <td>${u.user}</td>
            <td>${esc(u.user_name)}</td>
            <td>${esc(u.username)}</td>
            <td>${esc(u.user_initials)}</td>
            <td>${accessCell(u)}</td>
            <td>${esc(u.email || "—")}</td>
            <td>${fmtPhone(u.phone)}</td>
            <td class="muted">${flags(u)}</td>
            <td>${pwBadge(u)}</td>
            <td style="white-space:nowrap;">${actions}</td>
          </tr>
        `;
      }).join("");
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="10" style="color:var(--danger);padding:20px;">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  // ── add / edit form ────────────────────────────────────────────────────────

  const F = id => document.getElementById("f_" + id);

  /**
   * Select a stored send-as value in a dropdown built from firmData.
   *
   * A <select> silently ignores .value when no matching <option> exists, so a
   * stored address that has since been removed from firmData would render as
   * "— none —" and be written back as "" by the next save — clearing it
   * without the admin ever touching the field. Surface the orphan as a marked
   * option instead, so discarding it is always a deliberate choice.
   */
  function setSendAs(id, stored) {
    const sel = F(id);
    sel.querySelectorAll("option[data-stale]").forEach(o => o.remove());
    sel.value = stored || "";
    if (stored && sel.value !== stored) {
      const opt = document.createElement("option");
      opt.value = stored;
      opt.textContent = stored + " (no longer available)";
      opt.dataset.stale = "1";
      sel.appendChild(opt);
      sel.value = stored;
    }
  }

  function openForm(userId) {
    EDIT_ID = userId;
    document.getElementById("formErr").textContent = "";
    const u = userId != null ? USERS.find(x => x.user === userId) : null;
    document.getElementById("formTitle").textContent =
      u ? `Edit user #${u.user} — ${u.user_name}` : "Add user";
    // Password field only in add mode; edits use the Set PW action.
    document.getElementById("pwWrap").style.display = u ? "none" : "";

    F("username").value      = u ? u.username : "";
    F("user_fname").value    = u ? u.user_fname : "";
    F("user_lname").value    = u ? u.user_lname : "";
    F("user_initials").value = u ? u.user_initials : "";
    F("user_name").value     = u ? u.user_name : "";
    F("user_auth").value     = u && u.user_auth === "disabled" ? "disabled" : "authorized";
    const held = u ? rolesOf(u.roles) : ["staff"];
    const isSelf = u != null && u.user === viewerId();
    for (const r of ROLE_MEMBERS) {
      const box = F("role_" + r);
      box.checked = held.includes(r);
      box.disabled = false;
      box.title = "";
    }
    if (!viewerIsSU()) {
      F("role_su").disabled = true;
      F("role_su").title = "Only a superuser can grant or revoke su";
    } else if (isSelf && held.includes("su")) {
      F("role_su").disabled = true;
      F("role_su").title = "You cannot remove your own su role";
    }
    F("email").value         = u ? (u.email || "") : "";
    F("phone").value         = u ? (u.phone || "") : "";
    F("user_type").value     = u ? u.user_type : 1;
    setSendAs("default_email", u ? u.default_email : "");
    setSendAs("default_phone", u ? u.default_phone : "");
    F("user_gcal_id").value  = u ? (u.user_gcal_id || "") : "";
    F("password").value      = "";
    F("allow_sms").checked   = u ? !!u.allow_sms : false;
    F("does_appts").checked  = u ? !!u.does_appts : false;
    F("ringcentral").checked = u ? !!u.ringcentral : false;

    document.getElementById("formPanel").style.display = "";
    document.getElementById("formPanel").scrollIntoView({ behavior: "smooth" });
  }

  function closeForm() {
    document.getElementById("formPanel").style.display = "none";
    EDIT_ID = null;
  }

  async function saveForm() {
    const errEl = document.getElementById("formErr");
    errEl.textContent = "";
    const body = {
      username:      F("username").value.trim(),
      user_fname:    F("user_fname").value.trim(),
      user_lname:    F("user_lname").value.trim(),
      user_initials: F("user_initials").value.trim().toUpperCase(),
      user_name:     F("user_name").value.trim(),
      user_auth:     F("user_auth").value,
      email:         F("email").value.trim(),
      phone:         F("phone").value.trim(),
      user_type:     Number(F("user_type").value || 1),
      default_email: F("default_email").value.trim(),
      default_phone: F("default_phone").value.trim(),
      user_gcal_id:  F("user_gcal_id").value.trim(),
      allow_sms:     F("allow_sms").checked ? 1 : 0,
      does_appts:    F("does_appts").checked ? 1 : 0,
      ringcentral:   F("ringcentral").checked ? 1 : 0,
      roles:         ROLE_MEMBERS.filter(r => F("role_" + r).checked),
    };
    try {
      if (EDIT_ID == null) {
        const pw = F("password").value;
        if (pw) body.password = pw;
        const data = await P.apiSend("/api/admin/users", "POST", body);
        alert(`User created (id ${data.user}).` + (pw ? "" : " No password set — use Set PW before they can log in."));
      } else {
        await P.apiSend(`/api/admin/users/${EDIT_ID}`, "PATCH", body);
      }
      closeForm();
      loadUsers();
    } catch (err) {
      errEl.textContent = err.message;
    }
  }

  // ── row actions ────────────────────────────────────────────────────────────

  async function viewAsUser(id) {
    const u = USERS.find(x => x.user === id);
    if (!u || !canViewAs(u)) return;
    if (!confirm(
      `View the app as ${u.user_name || u.username}?\n\n` +
      `This opens a 30-minute read-only session in this tab. Superusers can switch it to Live from the top bar to act as the user (audited). Other tabs remain logged in as you.`
    )) return;
    try {
      await P.startViewAs(id);
    } catch (err) {
      alert("View as failed: " + err.message);
    }
  }

  async function setPassword(id) {
    const u = USERS.find(x => x.user === id);
    const pw = prompt(`New password for ${u ? u.user_name : "#" + id} (min 4 chars):`);
    if (pw == null) return;
    if (pw.length < 4) { alert("Password must be at least 4 characters."); return; }
    try {
      await P.apiSend(`/api/admin/users/${id}/set-password`, "POST", { password: pw });
      alert("Password set.");
      loadUsers();
    } catch (err) {
      alert("Set password failed: " + err.message);
    }
  }

  async function disableUser(id) {
    const u = USERS.find(x => x.user === id);
    if (!confirm(
      `Disable ${u ? u.user_name : "#" + id}?\n\n` +
      `This clears their passwords and blocks new logins immediately. ` +
      `A session they already have open can persist up to 24 hours.`
    )) return;
    try {
      await P.apiSend(`/api/admin/users/${id}/disable`, "POST");
      loadUsers();
    } catch (err) {
      alert("Disable failed: " + err.message);
    }
  }

  async function enableUser(id) {
    const u = USERS.find(x => x.user === id);
    if (!confirm(`Re-enable ${u ? u.user_name : "#" + id}? You'll need to set a new password before they can log in.`)) return;
    try {
      await P.apiSend(`/api/admin/users/${id}/enable`, "POST");
      loadUsers();
    } catch (err) {
      alert("Enable failed: " + err.message);
    }
  }

  // Bootstrap last: init() reaches for consts declared above (F, esc, …), so
  // this must not run until the whole script has evaluated. The lazy iframe
  // in index.html means the parent is usually already warm, so the
  // P.apiSend check passes on the first tick — there's no timer to save us.
  (function waitForParent() {
    if (P && P.apiSend) return init();
    setTimeout(waitForParent, 100);
  })();
</script>
</body>
</html>
